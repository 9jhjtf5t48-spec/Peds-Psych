supports this framing?","options":["Relapse should be treated as a moral failing requiring a consequence-based response","Relapse indicates the Transtheoretical Model does not apply to this patient","Relapse means the patient must restart treatment entirely from Precontemplation with a new therapist","Relapse is expected and should be reframed as a predictable part of the change process, not a catastrophe or reason to end treatment"],"correct":3,"rationale":"Relapse is explicitly framed as an expected, predictable part of the change process — not a catastrophe or reason to end treatment. This principle applies equally to substance use, eating disorder, and other behavior-change work."},{"topic":"Change theory","vignette":"A patient has been abstinent from alcohol for 9 months and is now working with her clinician to identify situations that could trigger a return to drinking.","question":"Which TTM stage is this, and what is the clinician's primary task?","options":["Action — actively modifying behavior for the first time","Maintenance — relapse-prevention planning and reinforcing gains","Contemplation — still ambivalent about whether to change","Preparation — building an initial plan before any behavior change has started"],"correct":1,"rationale":"Sustained change over several months with a focus on preventing relapse describes the Maintenance stage — the clinician's task is relapse-prevention planning and reinforcing the gains already made."},{"topic":"Children and foster care","vignette":"A family court is weighing whether to pursue reunification or terminate parental rights for a child in short-term foster care following a substantiated maltreatment case.","question":"What guiding principle should inform the pace of this decision?","options":["Reunification should never be considered once a child enters foster care","The child's stated preference should be the sole determining factor regardless of age","Decisions should always be delayed at least several years to maximize time for parental rehabilitation","Child welfare agencies and family courts should move quickly to determine whether parents can be rehabilitated and children returned, or whether parental rights should be terminated"],"correct":3,"rationale":"Short-term foster placement may be necessary while a home is stabilized, but child welfare agencies and family courts should move quickly to determine whether parents can be rehabilitated and children returned, or whether parental rights should be terminated — minimizing prolonged uncertainty and placement instability."},{"topic":"Children and foster care","vignette":"A psychiatric NP evaluates a new patient recently placed in foster care, with no prior clinical records available at the initial visit.","question":"What clinical assumption and approach is recommended at intake?","options":["A trauma-informed evaluation that assumes a trauma history until proven otherwise, with attention to attachment history","An assumption that the child has no trauma history unless explicitly documented","Treating the foster placement itself as the primary source of any presenting symptoms","Deferring any evaluation until the caseworker provides a full social history"],"correct":0,"rationale":"The recommended clinical approach for children in foster care includes a trauma-informed evaluation (assuming a trauma history until proven otherwise), coordination with caseworkers/courts, attention to attachment history, and support for foster/adoptive caregivers."},{"topic":"Mandated reporter","vignette":"A clinician suspects abuse based solely on a child's behavioral presentation and clinical judgment, without any direct disclosure from the child or an obvious physical exam finding.","question":"Does the mandated reporting duty apply in this scenario?","options":["Yes — the reporting duty applies regardless of the source of suspicion, including clinical judgment based on presentation/behavior","No — a report requires a physical exam finding or a collateral report","No — a report can only be made following direct disclosure by the child","The duty only applies if a parent confirms the suspicion"],"correct":0,"rationale":"Mandated reporting duty applies regardless of the source of suspicion — disclosure by the child, physical findings, a collateral report, or clinical judgment based on presentation/behavior can each independently trigger the reporting obligation."},{"topic":"Mandated reporter","vignette":"An NP is preparing to file a report for suspected abuse and is deciding how to handle communication with the family.","question":"What is standard practice regarding transparency with the family when abuse is suspected?","options":["Only inform the family if they directly ask whether a report was made","Tell the parents that an investigation will follow and that helpful services may be available through the child protection agency, except where it would endanger the child","Wait until the investigation concludes before telling the family a report was filed","Never inform the family that a report has been made under any circumstances"],"correct":1,"rationale":"Standard practice is to tell parents that an investigation will follow and that helpful services may be available through the child protection agency — transparency with the family, except where it would endanger the child, is part of standard practice."},{"topic":"Grief in children","vignette":"A 4-year-old repeatedly asks when her deceased mother is 'coming back from her trip.'","question":"What does this reflect about her developmental understanding of death?","options":["Children at this age have a fully realistic understanding of death's permanence","At ages 4-5, death is often understood as reversible, like sleep or a trip — a normal developmental stage, not denial","This indicates a pathological grief reaction requiring urgent intervention","This reflects dissociative symptoms consistent with complicated grief"],"correct":1,"rationale":"Children's understanding of death is developmental: under 2-3 years, no true understanding, only separation-related anxiety; ages 4-5, death is seen as reversible; more realistic understanding emerges around ages 10-11. This 4-year-old's belief is a normal developmental stage."},{"topic":"Grief in children","vignette":"A 10-year-old whose father died violently 9 months ago continues to show intense, unrelenting grief symptoms significantly interfering with school and friendships, well beyond what is typical for peers who experienced a natural-cause loss.","question":"What diagnostic consideration is most appropriate given the violent nature of the death and persistence of symptoms?","options":["Escalation to childhood traumatic grief or persistent complex bereavement disorder should be considered","This should be diagnosed as major depressive disorder exclusively, without consideration of a grief-specific process","No psychiatric diagnosis can apply to grief in children under any circumstances","This is entirely normal grief regardless of duration or the traumatic circumstances"],"correct":0,"rationale":"If a death was traumatic, normal grief may escalate to childhood traumatic grief or persistent complex bereavement disorder — clinicians distinguish normal bereavement from a disorder by intensity, quality, and persistence beyond expected norms."},{"topic":"Group therapy techniques","vignette":"By the fifth session of a support group, two members openly clash over how the group should spend its time, and several others take sides, creating visible tension that persists across sessions.","question":"How should this stage be understood within Tuckman's model?","options":["Storming — necessary friction for the group to mature, not a failed or pathological stage","Adjourning — the group is prematurely ending due to conflict","Forming — members are still orienting to the group's norms","A sign that the group therapy model has failed and should be discontinued"],"correct":0,"rationale":"Storming is a necessary, not a failed, stage — conflict as members find their place and surface differing ideas is expected as the group matures toward Norming and eventually Performing."},{"topic":"Group therapy techniques","vignette":"A supervisor reviewing a group therapy trainee's case notes points out that the members' sense of belonging and mutual acceptance is what is allowing them to tolerate disagreement and accept difficult feedback from one another.","question":"Which Yalom therapeutic factor does the supervisor's comment describe?","options":["Existential factors","Group cohesiveness","Corrective recapitulation of the primary family group","Instillation of hope"],"correct":1,"rationale":"Group cohesiveness — the sense of belonging and mutual acceptance — is considered by Yalom the primary therapeutic factor, foundational to enabling members to tolerate conflict, accept feedback, and engage in change."},{"topic":"Angry patient during family therapy","vignette":"During a heated exchange between two siblings in a family session, one teenager stands up, knocks over a chair, and appears ready to physically confront the other.","question":"What should the clinician do?","options":["End all future family sessions for this family permanently","Pause the joint session, briefly separate members, or shift to individual check-ins — safety takes priority over completing the planned agenda","Continue the session as planned to avoid rewarding the escalation with a break","Call the other family members into the room to help de-escalate the dysregulated member"],"correct":1,"rationale":"If a member becomes too dysregulated to continue safely, the clinician may need to pause the session, briefly separate members, or shift to individual check-ins before resuming — safety always takes priority over completing the planned agenda."},{"topic":"Angry patient during family therapy","vignette":"A highly charged, resistant family struggles to engage productively when the therapist asks direct problem-focused questions about the conflict.","question":"What alternative technique can help de-escalate tension while still surfacing the core conflict?","options":["A solution-oriented question, such as 'If you woke up tomorrow and your family was exactly how you wanted it, what would be different?'","Ending the session early whenever resistance is encountered","Asking each member to individually blame the identified patient for the conflict","Repeating the same problem-focused question more forcefully"],"correct":0,"rationale":"A solution-oriented question can de-escalate tension better than a problem-focused question with a resistant or highly charged family, while still surfacing the core conflict — shifting the frame from blame to a shared, future-oriented goal."},{"topic":"Learning domains","vignette":"A family understands the facts about their child's new diagnosis but continues to resist changes to their household routines, expressing ongoing skepticism about whether the diagnosis is even accurate.","question":"Which domain is the primary barrier to effective psychoeducation in this scenario?","options":["Affective domain — attitudes, values, feelings, and willingness to engage have not been addressed","Psychomotor domain — the family cannot physically perform any required tasks","Cognitive domain — the family lacks basic factual knowledge","This scenario does not relate to any of the three learning domains"],"correct":0,"rationale":"The affective domain covers attitudes, values, feelings, and willingness to engage — a family expressing skepticism and resisting change despite having factual knowledge illustrates an affective-domain barrier, not a cognitive knowledge gap."},{"topic":"Learning domains","vignette":"A clinic is redesigning its intake psychoeducation packet for families of children newly diagnosed with generalized anxiety disorder, currently just a two-page handout of facts and definitions.","question":"What should be added for the psychoeducation to be effective, beyond what the handout already provides?","options":["Addressing only the affective domain, since attitude change drives all behavior change","Addressing all three domains — cognitive, affective, and psychomotor — not just information transfer","Focusing exclusively on the psychomotor domain, since hands-on skills are remembered longest","Focusing exclusively on the cognitive domain, since factual knowledge is the foundation of all other learning"],"correct":1,"rationale":"Effective psychoeducation addresses all three domains, not just information transfer (cognitive) — a family can 'know' the facts but still resist behavior change without addressing attitudes (affective) and practiced skill (psychomotor)."},{"topic":"NSSI","vignette":"A school nurse documents that a 15-year-old has come in with fresh superficial scratches on her forearm on 7 separate occasions over the past year, each time reporting she did it to relieve overwhelming distress and with no wish to die.","question":"How many days of self-inflicted injury within the past year are required by DSM-5 proposed research criteria to consider a diagnosis of NSSI?","options":["At least 1 day","At least 10 days","At least 5 days","At least 20 days"],"correct":2,"rationale":"DSM-5 proposed criteria for NSSI require intentional self-inflicted injury on at least 5 days in the last year, likely to cause bleeding, bruising, or pain, with the expectation of only minor/moderate harm and no suicidal intent."},{"topic":"NSSI","vignette":"When a 16-year-old admits to cutting during a session, his counselor reacts with visible alarm, calls it 'a huge red flag,' and tells him he needs to promise right now that he will never do it again.","question":"What is the concern with this response, per recommended clinical approach?","options":["Shame-based responses are specifically effective for adolescent patients","Punitive or shaming responses increase secrecy and worsen the therapeutic alliance; a curious, function-focused approach is preferred","This response has no meaningful impact on the therapeutic relationship either way","This response is appropriate and should be used consistently to discourage the behavior"],"correct":1,"rationale":"Punitive or shaming responses to NSSI disclosure increase secrecy and worsen the therapeutic alliance. The recommended approach is curiosity about function rather than focusing only on stopping the behavior."}]},{"key":"6","label":"Practice Exam 6","questions":[{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 15-year-old with anorexia nervosa has been eating in binges roughly once a week for the past 2 months, immediately followed by self-induced vomiting, in addition to her ongoing severe caloric restriction. Her weight remains significantly below expected for her height.","question":"Which anorexia nervosa subtype applies?","options":["Binge-eating/purging type","This should be reclassified as binge-eating disorder instead of anorexia","This should be reclassified as bulimia nervosa instead of anorexia","Restricting type"],"correct":0,"rationale":"Anorexia nervosa is specified as binge-eating/purging type when the patient engages in recurrent binge eating or purging behavior within the last 3 months, while still meeting full anorexia criteria (significantly low weight, fear of weight gain, body-image disturbance) — as opposed to bulimia nervosa, which by definition does not occur in the setting of a significantly low body weight."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 5-year-old girl with intellectual disability has been observed eating small stones from the playground several times over the past 2 months. Her weight and growth are age-appropriate, and she shows no interest in dieting or her body shape.","question":"Which diagnosis fits, and what makes it distinct from the other eating/feeding disorders in this differential?","options":["ARFID — restriction driven by sensory sensitivity","Anorexia nervosa — restriction driven by fear of weight gain","Pica — the ingested material is nonnutritive and nonfood, unrelated to weight or body image","Binge-eating disorder — recurrent episodes of eating a large amount of food"],"correct":2,"rationale":"Pica is defined by persistent eating of nonnutritive, nonfood substances (here, stones) for at least a month, developmentally inappropriate, and unrelated to weight or shape concerns — distinguishing it from the other four diagnoses in this group, all of which involve actual food intake patterns."},{"topic":"ARFID s/sx","vignette":"A 4-year-old girl has never shown interest in eating, frequently forgets meals unless prompted repeatedly, and eats small portions even of preferred foods. Her growth has plateaued over the last 8 months.","question":"Which ARFID subtype is illustrated, and how common is it relative to the other subtypes?","options":["Fear-based avoidance — the most common of the three ARFID subtypes","Lack of interest in eating — the most common of the three ARFID subtypes","This does not correspond to any recognized ARFID subtype","Sensory-based avoidance — the most common of the three ARFID subtypes"],"correct":1,"rationale":"Low appetite drive and needing repeated prompting to eat reflect the 'lack of interest in eating' subtype, which is the most common of the three ARFID presentations, ahead of sensory-based avoidance and the least common, fear-based/aversive-experience type."},{"topic":"ARFID s/sx","vignette":"A multidisciplinary feeding team is treating a 6-year-old with ARFID, sensory-avoidance subtype, using graded food exposure and positive reinforcement for trying new foods, alongside a speech-language pathologist for oral-motor skills.","question":"What treatment principle does this approach reflect?","options":["First-line fluoxetine with behavioral therapy as an adjunct","Family-Based Treatment identical to the anorexia nervosa protocol","A multidisciplinary, behaviorally-based approach tailored to the specific restrictive driver underlying the ARFID presentation","Inpatient hospitalization is required for all ARFID cases regardless of severity"],"correct":2,"rationale":"ARFID treatment is multidisciplinary and behaviorally based, tailored to the specific restrictive driver (sensory, fear-based, or lack of interest), often involving SLP/OT feeding-team support — distinct from the Maudsley FBT model used specifically for adolescent anorexia."},{"topic":"Therapies for eating disorders","vignette":"A 22-year-old with binge-eating disorder and obesity is being evaluated for pharmacotherapy after limited response to CBT alone.","question":"Which medication is FDA-approved for binge-eating disorder in adults?","options":["Lisdexamfetamine","Naltrexone","Bupropion","Fluoxetine"],"correct":0,"rationale":"Lisdexamfetamine is FDA-approved for binge-eating disorder in adults, though pediatric data remain limited. CBT and interpersonal psychotherapy remain the first-line psychotherapies for BED."},{"topic":"Therapies for eating disorders","vignette":"A family and their 15-year-old daughter with anorexia nervosa are not able to engage consistently in whole-family sessions due to high conflict at home. The treatment team modifies the approach so the therapist meets with the parents alone.","question":"What does the evidence say about this modification, Parent-Focused Treatment, compared with standard conjoint FBT?","options":["Parent-Focused Treatment has been shown to be significantly inferior and is not recommended","Parent-Focused Treatment eliminates the need for any behavioral intervention","One RCT found Parent-Focused Treatment was more efficient at achieving weight restoration","Parent-Focused Treatment is only appropriate for bulimia nervosa, not anorexia"],"correct":2,"rationale":"Parent-Focused Treatment (PFT), where the therapist meets with parents only rather than the whole family, was found in one RCT to be more efficient at achieving weight restoration than standard conjoint FBT — a useful option for families where joint sessions are difficult."},{"topic":"Enuresis vs Encopresis","vignette":"A pediatric clinic is comparing two young patients: a 4-year-old with fecal soiling and a 4-year-old with nighttime bedwetting.","question":"Which statement about the diagnostic age thresholds for these two conditions is accurate?","options":["Neither child meets the minimum diagnostic age for either condition","The 4-year-old with soiling can meet the minimum age for encopresis, but the 4-year-old with wetting cannot yet meet the minimum age for enuresis","The minimum age for enuresis is younger than for encopresis","Both children meet the minimum diagnostic age for their respective conditions"],"correct":1,"rationale":"Encopresis requires a minimum age of 4 years, while enuresis requires a minimum age of 5 years — a frequently tested age discrepancy. The 4-year-old with soiling meets the encopresis age threshold, but a 4-year-old with wetting does not yet meet the enuresis age threshold."},{"topic":"Enuresis vs Encopresis","vignette":"A 7-year-old girl has both nighttime and daytime wetting episodes occurring 3-4 times weekly for the past 6 months, causing significant embarrassment and school avoidance.","question":"Which enuresis specifier applies to her presentation?","options":["Nocturnal only","Diurnal only","Nocturnal and diurnal","This does not meet criteria because both day and night symptoms are present"],"correct":2,"rationale":"Enuresis specifiers include nocturnal only (most common), diurnal only, or nocturnal and diurnal. With wetting occurring both at night and during the day, meeting the frequency (≥2x/week for ≥3 months) and distress criteria, the combined 'nocturnal and diurnal' specifier applies."},{"topic":"Nocturnal enuresis treatment","vignette":"A behavioral sleep clinic pairs the urine alarm with cleanliness training, retention control exercises, and an overlearning protocol for an 8-year-old with treatment-resistant bedwetting.","question":"What outcome would be expected from this combined behavioral approach?","options":["It stops bedwetting in about two-thirds of children","It is effective only in children younger than 5","It requires concurrent DDAVP to achieve any benefit","It provides no additional benefit compared with the alarm used alone"],"correct":0,"rationale":"Combining the urine alarm with cleanliness training, retention control, and overlearning stops bedwetting in about two-thirds of children — a notably stronger outcome than using the alarm in isolation."},{"topic":"Nocturnal enuresis treatment","vignette":"A 14-year-old's nocturnal enuresis began shortly after a traumatic car accident. Her family asks whether psychotherapy would help resolve the wetting directly.","question":"What is the appropriate role of psychotherapy in this case?","options":["Psychotherapy has no role in enuresis under any circumstances","Psychotherapy is the first-line treatment for all cases of enuresis","Psychotherapy is rarely useful for enuresis itself, but may help since this presentation appears trauma/stress-related","Psychotherapy should replace the urine alarm as the primary intervention in all cases"],"correct":2,"rationale":"Psychotherapy is rarely useful for enuresis itself but may help address psychosocial sequelae or cases that are trauma/stress-related — this patient's clear temporal link to a traumatic event makes psychotherapy a reasonable adjunct alongside standard behavioral measures."},{"topic":"Encopresis treatment","vignette":"Most children with encopresis are successfully managed by their pediatrician in primary care.","question":"Which cases warrant referral for additional psychological intervention?","options":["Only cases occurring in children younger than 4 years","Complex or treatment-resistant cases, particularly those with associated psychiatric conditions such as ODD or anxiety","Only cases without any evidence of constipation","All cases of encopresis, regardless of severity or response to initial treatment"],"correct":1,"rationale":"Most encopresis cases are managed by a pediatrician; complex or treatment-resistant cases, especially those with associated psychiatric disorders like ODD or anxiety, warrant referral for individual/family psychological intervention."},{"topic":"Encopresis treatment","vignette":"A pediatrician completes a 3-day oral polyethylene glycol cleanout for an impacted 8-year-old with chronic encopresis and is now planning the next phase of care.","question":"What should the subsequent maintenance ('bowel retraining') phase include?","options":["Discontinuation of all interventions now that the cleanout is complete","A low-fiber diet to minimize stool bulk","A stool softener or mineral oil, a high-fiber diet, a regular toileting routine, and a mild suppository if needed","Weekly enemas administered by the parent indefinitely"],"correct":2,"rationale":"Bowel retraining after initial cleanout includes a stool softener or mineral oil, a high-fiber diet, a regular toileting routine, and a mild suppository if needed — all combined with the behavioral program, not a cessation of care."},{"topic":"ODD vs CD vs IED","vignette":"A clinician is comparing three disruptive behavior presentations: one involving persistent oppositional arguing without rights violations, one involving serious rights-violating behavior like theft and cruelty, and one involving impulsive anger-based outbursts grossly out of proportion to the trigger.","question":"Which disorder corresponds to each description, in order?","options":["ODD, IED, Conduct Disorder","IED, ODD, Conduct Disorder","Conduct Disorder, ODD, IED","ODD, Conduct Disorder, IED"],"correct":3,"rationale":"ODD involves oppositional, argumentative behavior without rights violations; Conduct Disorder involves serious violations of others' rights or major societal norms (theft, cruelty, weapons); IED involves impulsive, anger-based aggression grossly out of proportion to the trigger, never premeditated or goal-directed."},{"topic":"ODD vs CD vs IED","vignette":"A 9-year-old with ADHD and ODD is found to also have impulsive aggressive outbursts that occur far more frequently and severely than what is typically seen in either of his existing diagnoses, causing significant distress.","question":"Can intermittent explosive disorder be diagnosed in addition to his existing diagnoses?","options":["Yes, but only if the child is older than 12","No — a diagnosis of ADHD automatically excludes any additional impulse-control diagnosis","Yes — IED can be diagnosed alongside ADHD, CD, ODD, or ASD when the aggressive outbursts exceed what is typical for those conditions and warrant independent attention","No — IED can only be diagnosed in the absence of any other psychiatric condition"],"correct":2,"rationale":"IED can be diagnosed in addition to ADHD, CD, ODD, or ASD when the impulsive aggressive outbursts exceed what's typically seen in those disorders and warrant independent clinical attention — it is not automatically subsumed under a comorbid diagnosis."},{"topic":"Meds for physically aggressive children","vignette":"A 15-year-old with longstanding conduct disorder and no psychotic symptoms continues to show frequent aggressive behavior despite six months of multisystemic family therapy. His mother asks whether a medication could simply 'fix the aggression.'","question":"What is the appropriate approach to medication in this scenario?","options":["Medication is entirely contraindicated in conduct disorder","Stimulant medication should be started regardless of whether ADHD is present","A second-generation antipsychotic should be initiated immediately as first-line monotherapy","Evidence for medication in chronic CD-related aggression without psychosis is weak; behavioral, family, and multisystemic interventions remain the mainstay, with medication reserved for comorbid conditions"],"correct":3,"rationale":"For chronic conduct-disorder-related aggression without psychosis, medication evidence is weak; behavioral, family, and multisystemic interventions remain the mainstay, with medication reserved for treating comorbid conditions (ADHD, mood, anxiety) rather than the aggression itself."},{"topic":"Meds for physically aggressive children","vignette":"A previously calm 10-year-old suddenly becomes aggressive, disoriented, and combative in the emergency department. The team orders basic labs and a toxicology screen before proceeding further.","question":"What principle is guiding this initial work-up?","options":["Sudden-onset aggression in children is always primarily psychiatric","Medical causes only need consideration if there is a prior psychiatric history","Always rule out a medical/organic or substance-related cause of sudden aggression before treating it as purely psychiatric","Toxicology screening is not indicated in pediatric aggression work-ups"],"correct":2,"rationale":"Before treating sudden pediatric aggression as purely psychiatric, medical/organic causes and substance intoxication/withdrawal must be ruled out — a foundational safety step given the broad differential for out-of-control behavior."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"Four adolescents present at a clinic: one 2 weeks after a life-threatening trauma, one 5 weeks after a life-threatening trauma, one with recurrent unreality episodes and no trauma history, and one 8 weeks after a stressful but non-life-threatening family move.","question":"Which diagnostic assignment correctly matches each timeframe and trigger?","options":["Adjustment disorder always requires more than 6 months to become diagnosable","All four presentations require an identical Criterion-A trauma exposure","PTSD (2 weeks), acute stress disorder (5 weeks), both requiring the same life-threatening trauma type","Acute stress disorder (2 weeks), PTSD (5 weeks), a dissociative disorder (no trauma required), adjustment disorder (any stressor, within 3 months)"],"correct":3,"rationale":"Acute stress disorder spans 3 days to 1 month post-trauma; PTSD requires >1 month; both require Criterion-A trauma exposure. Dissociative disorders require no specific trauma type. Adjustment disorder requires only an identifiable stressor of any severity, with onset within 3 months of the stressor."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 16-year-old reports persistent episodes where his surroundings feel 'foggy and unreal,' as though he is viewing the world through glass, occurring several times weekly for the past 4 months. He denies any identifiable trauma and remains fully aware the sensation isn't literally true.","question":"What best describes the stressor requirement for his likely diagnosis compared with PTSD or acute stress disorder?","options":["This diagnosis cannot be made without an identifiable precipitating event of some kind","This diagnosis requires the same Criterion-A trauma exposure as PTSD and ASD","Dissociative disorders like this one do not require a specific stressor type, unlike PTSD/ASD, which require Criterion-A-level trauma","This diagnosis requires a stressor of any severity, exactly like adjustment disorder"],"correct":2,"rationale":"Depersonalization/derealization disorder does not require a specific stressor type at all, unlike PTSD/ASD (which require Criterion-A-level trauma) or adjustment disorder (which requires an identifiable stressor of any severity) — it can occur with or without an identifiable trigger."},{"topic":"Trauma therapy","vignette":"A refugee adolescent with a history of war-zone violence exposure is referred for trauma-focused treatment.","question":"Which model was specifically developed for populations with this type of trauma history?","options":["EMDR only","Seeking Safety","CBITS","Narrative Exposure Therapy / KidNET"],"correct":3,"rationale":"Narrative Exposure Therapy (and its child-adapted version, KidNET) was specifically developed for war/refugee trauma populations, using a structured lifeline narrative approach — CBITS is school-based, and Seeking Safety targets co-occurring substance use."},{"topic":"Trauma therapy","vignette":"A 16-year-old with PTSD and a co-occurring substance use disorder is being referred for trauma-focused treatment.","question":"Which model was specifically designed to address PTSD alongside substance use?","options":["Child-Parent Psychotherapy","Trauma Systems Therapy","Seeking Safety","CBITS"],"correct":2,"rationale":"Seeking Safety is the trauma therapy model specifically designed for PTSD co-occurring with substance use, addressing both simultaneously rather than sequentially."},{"topic":"TF-CBT / PRACTICE","vignette":"A TF-CBT program is nearing the end of treatment, working with a family to develop a written plan for handling future triggers and reinforcing the skills learned throughout treatment.","question":"Which final PRACTICE component does this represent?","options":["Psychoeducation and parenting skills","Relaxation","Trauma narrative and processing","Enhancing safety"],"correct":3,"rationale":"Enhancing safety — safety planning and future skills for the child and family — is the final PRACTICE component, typically addressed as treatment nears completion, building on the preceding stabilization and processing work."},{"topic":"TF-CBT / PRACTICE","vignette":"A clinician describes a key feature of TF-CBT that sets it apart from many purely individual child trauma therapies: it includes structured components specifically involving the parent, not just the child.","question":"Which two PRACTICE components most directly reflect this caregiver-inclusive design?","options":["Trauma narrative and Enhancing safety","Relaxation and Affective modulation","Psychoeducation/Parenting and Conjoint child-parent sessions","Cognitive processing and In-vivo mastery"],"correct":2,"rationale":"TF-CBT is explicitly designed to include the caregiver — the Psychoeducation/Parenting component (parenting strategies to support the child) and the Conjoint child-parent sessions component (sharing progress/narrative with the caregiver) are the two elements most directly reflecting this distinguishing, caregiver-inclusive design."},{"topic":"Insomnia treatment","vignette":"A 16-year-old with PTSD reports that trauma-related nightmares are the primary driver of her ongoing difficulty sleeping.","question":"What should be prioritized in her treatment plan?","options":["Treating insomnia and PTSD as entirely separate, unrelated conditions","Melatonin alone, without addressing the PTSD","Starting a benzodiazepine immediately for symptomatic relief before addressing PTSD","Treating the underlying PTSD, with consideration of prazosin if nightmares specifically are driving the insomnia"],"correct":3,"rationale":"When insomnia is trauma-related, treating the underlying PTSD is the priority; if nightmares specifically drive the insomnia, prazosin should be considered as a targeted adjunct rather than treating the sleep symptom in isolation."},{"topic":"Insomnia treatment","vignette":"A prescriber is asked why a prescription hypnotic would be an unusual first-choice medication for a child's chronic sleep-onset difficulty.","question":"What is the correct clinical reasoning for this caution?","options":["Prescription hypnotics are the preferred first-line treatment for children under age 10","Behavioral measures should only be attempted after medication has failed","Behavioral measures plus melatonin are the preferred approach; prescription hypnotics/benzodiazepines are rarely appropriate as first-line in pediatric insomnia given lack of FDA approval and paradoxical activation risk","Sedative-hypnotics carry no risk of paradoxical reaction in children"],"correct":2,"rationale":"Behavioral measures plus melatonin represent the preferred pediatric insomnia approach, while a prescription hypnotic or benzodiazepine as first-line is generally avoided given the lack of FDA approval for pediatric insomnia and the risk of paradoxical activation."},{"topic":"Nightmare treatment","vignette":"A clinician documents that an 8-year-old's nightmares occur 2 to 3 times weekly but not nightly.","question":"How would this frequency be classified under DSM-5 severity specifiers for nightmare disorder?","options":["This frequency does not correspond to any severity specifier","Severe — occurring nightly","Mild — less than 1 episode per week","Moderate — at least 1 episode per week but less than nightly"],"correct":3,"rationale":"Nightmare disorder severity is rated by frequency: mild = <1 episode/week; moderate = ≥1/week but <nightly; severe = nightly. At 2-3 times weekly, this falls into the moderate category."},{"topic":"Nightmare treatment","vignette":"A prescriber is considering off-label adjunctive options for a teenager with hyperarousal-related nightmares, in addition to low-dose trazodone for sleep.","question":"Which additional agents are recognized off-label/adjunctive options for hyperarousal and nightmares?","options":["Clonidine and guanfacine","Fluoxetine and sertraline","Lithium and valproate","Risperidone and aripiprazole"],"correct":0,"rationale":"Clonidine and guanfacine are recognized off-label/adjunctive agents for hyperarousal/nightmares, alongside low-dose trazodone for sleep — prazosin remains the agent with the best-known targeted nightmare-specific evidence."},{"topic":"AUD s/sx and treatment","vignette":"An adolescent treatment team is comparing the typical course of alcohol use in teenagers versus adults.","question":"Which statement accurately reflects adolescent-specific features of AUD?","options":["Adolescents require the same 12-month symptom threshold but progress more slowly to a use disorder than adults","Underage alcohol use is never clinically significant unless physical dependence develops","Physical dependence is more common in adolescents than in adults with AUD","Adolescents cross from use to abuse more easily than adults, and physical dependence is comparatively rare in this age group"],"correct":3,"rationale":"Adolescents cross from use to abuse more easily than adults, and some experts consider any underage alcohol use 'abuse' — though physical dependence itself is comparatively rare in adolescents compared with adults with chronic AUD."},{"topic":"AUD s/sx and treatment","vignette":"A treatment team is designing an outpatient plan for a 16-year-old with moderate AUD (4 Criterion A symptoms present) and no significant withdrawal risk.","question":"Which combination of interventions reflects the recommended treatment approach?","options":["Pharmacotherapy for AUD as the primary intervention, given the moderate severity rating","Developmentally appropriate group therapy, self-help 12-step programs, motivational interviewing, family therapy, and relapse prevention","Individual insight-oriented psychodynamic therapy alone","Routine inpatient medical detoxification"],"correct":1,"rationale":"Treatment for adolescent AUD emphasizes group therapy, self-help 12-step programs, motivational interviewing, family therapy, and relapse prevention. Pharmacological treatment is rarely used given limited evidence in this age group, and relapse is treated as an expected part of recovery."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A treatment team is educating a family that cannabis withdrawal carries real clinical significance and should not be dismissed as purely psychological.","question":"Which symptoms are described as the most common presenting features of cannabis withdrawal?","options":["Psychotic symptoms and severe agitation","Fever and diaphoresis exclusively","Seizures and autonomic instability","Irritability and sleep disturbance"],"correct":3,"rationale":"Irritability and sleep disturbance are described as the most common presenting symptoms of cannabis withdrawal — a distinguishing feature from the more severe autonomic/seizure profile associated with alcohol withdrawal."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"One week after stopping daily cannabis use, a patient describes ongoing fatigue and trouble concentrating at work, and notes that his initial loss of appetite and insomnia have now flipped into increased appetite and excessive sleepiness.","question":"How are these additional features classified relative to the DSM-5 Criterion B symptom list for cannabis withdrawal?","options":["They are additional features often seen beyond the core Criterion B list, not required for diagnosis","They are required Criterion B symptoms that must be present for diagnosis","They rule out a diagnosis of cannabis withdrawal","They indicate a different diagnosis entirely, such as alcohol withdrawal"],"correct":0,"rationale":"Fatigue, yawning, difficulty concentrating, and a rebound period of increased appetite/hypersomnia are described as additional features often seen beyond the core Criterion B symptom list — supportive but not required for the diagnosis."},{"topic":"Motivational Interviewing","vignette":"A clinician describes MI's foundational belief that the motivation to change already exists within the patient, and that the practitioner's role is to draw it out rather than impose it.","question":"Which element of the 'Spirit' of MI is being described?","options":["Compassion","Acceptance","Partnership","Evocation"],"correct":3,"rationale":"Evocation describes the belief that motivation to change already exists within the patient — the practitioner's job is to draw it out, not impose it. The other Spirit elements are Partnership, Acceptance, and Compassion."},{"topic":"Motivational Interviewing","vignette":"An adapted substance-use treatment protocol incorporates personalized feedback, places responsibility for change with the patient, offers advice only with permission, and presents a menu of change options.","question":"Which MI-based protocol is being described?","options":["OARS","FRAMES","SBIRT","PRACTICE"],"correct":1,"rationale":"FRAMES (Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy) is a well-known adapted substance-use protocol built on MI principles, distinct from OARS (the core communication skills) and PRACTICE (the unrelated TF-CBT mnemonic)."},{"topic":"Motivational Interviewing","vignette":"A patient in the Focusing phase of MI repeatedly raises reasons why change would be too difficult. The clinician avoids confronting this directly and continues asking open-ended questions to help the patient find their own direction.","question":"What MI technique is the clinician using?","options":["Direct persuasion","The Planning phase's action-step technique","Confrontational interviewing","Rolling with resistance"],"correct":3,"rationale":"In the Focusing phase, MI uses open-ended questions rather than unsolicited advice and 'rolls with resistance' rather than confronting it — this non-confrontational stance is a hallmark MI technique used across all four phases."},{"topic":"Change theory","vignette":"A clinician is reviewing the five main stages of the Transtheoretical Model of Change with a colleague new to the model.","question":"Which sequence is correct?","options":["Precontemplation, Contemplation, Preparation, Action, Maintenance","Contemplation, Precontemplation, Action, Preparation, Maintenance","Action, Maintenance, Precontemplation, Contemplation, Preparation","Preparation, Precontemplation, Contemplation, Maintenance, Action"],"correct":0,"rationale":"Precontemplation → Contemplation → Preparation → Action → Maintenance is the correct TTM sequence, with (Relapse) as a common but non-required detour back to an earlier stage."},{"topic":"Change theory","vignette":"A clinician uses action-oriented language ('let's pick a quit date') with a patient who is still in Precontemplation and has expressed no interest in changing.","question":"What is the core clinical error in this approach?","options":["Failing to complete a formal substance use screening tool first","Violating patient confidentiality","Using OARS skills incorrectly during the conversation","Failing to match the intervention to the patient's actual stage of change, rather than pushing action language on a precontemplative patient"],"correct":3,"rationale":"Matching the intervention to the patient's actual stage of change — not pushing 'action' language on a precontemplative patient — is the core clinical application of both MI and the Transtheoretical Model."},{"topic":"Children and foster care","vignette":"A 13-year-old with severe out-of-control behavior is being considered for a foster placement as part of his treatment plan, separate from any active child protection concern.","question":"What is a recognized additional use of foster care described in this context?","options":["Foster care is used exclusively in confirmed child maltreatment cases and never for behavioral containment","Foster care can be used as a containment/adjunctive option in severe out-of-control behavior or when the home environment cannot safely support the child during treatment","Foster care can only be initiated by court order, never as part of a treatment plan","Foster placement is contraindicated whenever a child has a behavioral disorder"],"correct":1,"rationale":"Beyond its primary child-protection role, foster care is also used as a containment/adjunctive option in severe out-of-control behavior or when the home environment cannot safely support the child during treatment."},{"topic":"Children and foster care","vignette":"A foster parent expresses frustration that her newly placed foster child does not show affection the way she expected, and worries she is failing as a caregiver.","question":"Which component of the recommended clinical approach directly addresses this situation?","options":["Referral of the foster parent for individual psychotherapy unrelated to the placement","No intervention is needed since this is an expected caregiver reaction requiring no support","Immediate removal of the child from this placement","Support for the foster/adoptive caregivers themselves, including psychoeducation and realistic expectations"],"correct":3,"rationale":"The recommended clinical approach explicitly includes support for foster/adoptive caregivers — psychoeducation and realistic expectations about attachment difficulties — since many fostered/adopted children show attachment difficulties stemming from their pre-placement history."},{"topic":"Mandated reporter","vignette":"A newer NP asks a colleague whether mandated reporting requires the clinician to have definitively confirmed that abuse occurred before filing a report.","question":"What is the correct response?","options":["No — mandated reporting is not confined to confirmed abuse; if the evidence is sufficient to raise a serious question or reasonable suspicion, it must be reported","Yes — a report can only be filed once abuse has been confirmed by an official investigation","Only physicians, not nurse practitioners, carry a mandated reporting obligation","Reporting requirements vary so much that no general answer applies to this question"],"correct":0,"rationale":"Mandated reporting is not confined to confirmed abuse — if evidence is sufficient to raise a serious question or reasonable suspicion, it must be reported to prompt an official investigation. All states require professionals who suspect child abuse to report it, regardless of discipline."},{"topic":"Mandated reporter","vignette":"A clinician who suspects abuse decides not to report because she is not '100% certain' and worries about damaging her relationship with the family if she is wrong.","question":"What is the risk of this decision?","options":["Legal penalties can be assessed for failing to report, regardless of the clinician's motivation for withholding the report","This decision is appropriate because certainty is required before reporting","There is no legal consequence as long as the clinician documents her reasoning for not reporting","This decision only carries risk if the abuse is later confirmed by another source"],"correct":0,"rationale":"Failing to report suspected abuse carries legal risk for the clinician — the flip side of the good-faith immunity protection for reporting. The reasonable-suspicion standard means uncertainty is not a valid reason to withhold a report."},{"topic":"Grief in children","vignette":"A father is debating whether to let his 9-year-old daughter attend her mother's funeral, worried that seeing the casket will traumatize her.","question":"What does the evidence suggest, and what is the recommended clinical guidance for this father?","options":["The decision should be made entirely by the surviving parent without input from the child","Funeral attendance has not been shown to increase later psychiatric symptoms; the child should be allowed some choice in attending","Funeral attendance is mandatory for healthy grief processing at any age","Children should never be allowed to attend funerals under age 10"],"correct":1,"rationale":"Clinical guidance is to allow the child some choice in attending the funeral — attendance has not been shown to increase later psychiatric symptoms. Clinicians should also provide extra adult support and explain death matter-of-factly, consistent with family beliefs."},{"topic":"Grief in children","vignette":"A clinician compares the diagnostic duration threshold for persistent complex bereavement disorder between a bereaved child and a bereaved adult.","question":"What is the correct duration comparison?","options":["Children require a longer duration (18 months or more) than adults because grief is considered more resilient in childhood","Children require only 6 months or more of severe grief reactions, compared with 12 months or more in adults","Children and adults require the identical 12-month duration threshold","There is no duration threshold specified for either children or adults"],"correct":1,"rationale":"Persistent complex bereavement disorder is distinguished from normal grief by severe reactions persisting ≥12 months in adults but only ≥6 months in children — a lower threshold reflecting how much grief can already impair a child's functioning."},{"topic":"Group therapy techniques","vignette":"A quiet, socially withdrawn member of a teen support group spends an entire session helping a newer, more distressed member calm down, and afterward tells the facilitator he 'actually felt useful for once.'","question":"Which Yalom therapeutic factor best captures this experience?","options":["Altruism","Interpersonal learning","Development of socializing techniques","Universality"],"correct":0,"rationale":"Altruism describes how helping others in the group boosts a member's own self-worth, distinct from universality (realizing one is not alone) or interpersonal learning (gaining insight into one's own relational patterns)."},{"topic":"Group therapy techniques","vignette":"In the final two sessions of a 20-week adolescent process group, several members become unusually quiet, one snaps irritably at the facilitator, and another jokes about 'not caring anyway' that the group is ending.","question":"Which Tuckman stage is the group currently in, and what should the leader do?","options":["Adjourning — the leader should directly address termination, since members may have strong emotional reactions to the group ending","Performing — the leader should focus solely on deepening ongoing therapeutic work","Storming — the leader should introduce new conflict-resolution rules","Forming — the leader should reintroduce basic ground rules"],"correct":0,"rationale":"Adjourning is the termination stage, where members may have strong emotional reactions to the group ending — the leader's role is to directly address termination and these reactions rather than avoiding the topic."},{"topic":"Angry patient during family therapy","vignette":"Throughout a session, both parents describe their 13-year-old son's defiance as the sole cause of the family's chaos. The therapist responds, 'I'm curious what each of you notices about your own part in how these moments unfold.'","question":"What clinical purpose does this reframing technique serve?","options":["It has no established clinical purpose and is discouraged in family therapy","It reframes the presenting problem as a family system issue rather than one member's fault, reducing defensiveness and scapegoating","It is primarily used to identify which family member should be excluded from future sessions","It assigns blame more evenly but does not change the underlying family dynamic"],"correct":1,"rationale":"Reframing the presenting problem as a family system issue, not one member's fault, reduces defensiveness and scapegoating of the identified patient — which is often a driver of anger in session."},{"topic":"Angry patient during family therapy","vignette":"A therapist summarizes the correct order of priorities for a colleague when a family member becomes angry and dysregulated mid-session.","question":"What is the correct priority sequence?","options":["Both should occur simultaneously regardless of the family member's regulation state","De-escalate first, problem-solve second — do not try to process content while a family member is dysregulated","Problem-solve first to resolve the underlying issue, then de-escalate","Neither de-escalation nor problem-solving should occur; the session should simply end"],"correct":1,"rationale":"The clinician's task when anger escalates is to de-escalate first, problem-solve second — attempting to process content or resolve conflict while a family member remains dysregulated is unlikely to be productive and can worsen safety."},{"topic":"Learning domains","vignette":"A clinic's new-medication teaching process is a printed page of dosing instructions and possible side effects handed to parents at checkout, with no time set aside to discuss worries or practice giving the dose.","question":"Which domains of learning are missing from this teaching process?","options":["Affective and psychomotor domains","Only the psychomotor domain is missing; the affective domain is not relevant to medication teaching","No domains are missing; a handout addresses all three domains","Only the cognitive domain is missing"],"correct":0,"rationale":"This plan addresses only the cognitive domain. It is missing the affective domain (discussing the family's attitudes and concerns) and the psychomotor domain (demonstrating and practicing actual administration technique)."},{"topic":"Learning domains","vignette":"A clinician matches each of the three learning domains with its correct one-word description while precepting a student.","question":"Which matching is correct?","options":["Cognitive = knowing; Affective = feeling/valuing; Psychomotor = doing","Cognitive = feeling/valuing; Affective = doing; Psychomotor = knowing","Cognitive = doing; Affective = knowing; Psychomotor = feeling/valuing","All three domains describe the same underlying construct"],"correct":0,"rationale":"Cognitive = knowing (facts, intellectual understanding); Affective = feeling/valuing (attitudes, willingness to engage); Psychomotor = doing (physical skills, demonstrated competence). A teaching plan that only transmits facts is incomplete without addressing attitudes and skill practice."},{"topic":"NSSI","vignette":"A 16-year-old who cuts several times a month describes overwhelming waves of emotion she 'can't sit with' and says the urge to self-harm builds until she acts on it.","question":"Which treatment has the strongest evidence base for her presentation, and why?","options":["Trauma-Focused CBT as the only evidence-based option","Dialectical behavior therapy, largely because of its emotion-regulation and distress-tolerance skills modules","Motivational interviewing as a standalone treatment","Family-Based Treatment (Maudsley model)"],"correct":1,"rationale":"Dialectical Behavior Therapy has the strongest evidence base for NSSI, particularly its emotion-regulation and distress-tolerance skills modules, alongside safety planning and treating underlying mood/anxiety/trauma."},{"topic":"NSSI","vignette":"A 15-year-old admits she scratches her arms mainly after fights with her best friend, explaining, 'She always comes back and apologizes and pays attention to me again once she sees it.'","question":"Which DSM-5 proposed NSSI expectation does this reflect?","options":["Obtaining relief from a negative feeling/cognitive state only","Inducing a positive feeling state only","Resolving an interpersonal difficulty","This does not correspond to any recognized NSSI expectation"],"correct":2,"rationale":"Proposed Criterion B requires at least one expectation: relief from a negative feeling/cognitive state, resolving an interpersonal difficulty, or inducing a positive feeling state. Using self-injury to influence a partner's attention reflects the interpersonal-difficulty-resolution expectation."},{"topic":"NSSI","vignette":"A 13-year-old with intellectual disability engages in repetitive head-banging as part of a broader pattern of stereotyped, repetitive movements observed since early childhood.","question":"How does this presentation relate to the DSM-5 proposed NSSI criteria?","options":["NSSI criteria exclude all patients with intellectual disability from consideration entirely","In neurodevelopmental disorders, self-injury that is part of a stereotypy pattern does not meet the proposed NSSI criteria","Stereotyped self-injury in neurodevelopmental disorders should instead be coded as a suicide attempt","This automatically meets full NSSI criteria regardless of the stereotypy pattern"],"correct":1,"rationale":"Per proposed NSSI Criterion F, the behavior does not occur exclusively during psychosis, delirium, or substance intoxication/withdrawal; in neurodevelopmental disorders, self-injury is not counted toward NSSI if it is part of a stereotypy pattern, and it is not better explained by another disorder."}]},{"key":"all","label":"All 3 Combined (150 Questions)","questions":[{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 13-year-old girl has lost 18% of her body weight over 5 months through severe caloric restriction and compulsive exercise. She weighs herself 10 times a day and states she 'can still see fat' on her thighs despite a BMI of 15.2.","question":"Which DSM-5 criterion is illustrated by her belief that she 'can still see fat' despite being underweight?","options":["Disturbance in the way body weight/shape is experienced (Criterion C)","Persistent eating of nonnutritive substances (a Pica criterion)","Recurrent binge eating with loss of control (a bulimia criterion)","Restriction of energy intake leading to low body weight (Criterion A)"],"correct":0,"rationale":"Anorexia Criterion C covers disturbance in how body weight/shape is experienced, undue influence of weight/shape on self-evaluation, or persistent lack of recognition of the seriousness of low body weight — her perceptual distortion despite objective underweight status is a textbook example."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 19-year-old male eats a large pizza and a box of cookies within 45 minutes, feeling completely unable to stop, then immediately runs 6 miles and skips his next two meals. This pattern occurs about twice a week.","question":"Which combination of behaviors places this presentation in the bulimia nervosa category rather than binge-eating disorder?","options":["The binge occurs within a discrete 2-hour period","He reports a sense of loss of control during the binge","The binge is followed by compensatory behavior (excessive exercise, fasting) aimed at preventing weight gain","The episodes occur at least twice weekly"],"correct":2,"rationale":"Both BN and BED share loss-of-control binge eating within a discrete period, occurring at least weekly. What makes this bulimia rather than BED is the compensatory behavior — excessive exercise and fasting after the binge, specifically aimed at preventing weight gain."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A toddler with autism spectrum disorder has been eating small amounts of carpet fiber and drywall dust for the past 6 weeks. A blood lead level returns at 6 mcg/dL.","question":"Given this lead level, what is the recommended next step?","options":["Immediate inpatient psychiatric admission","Pediatric consultation, since the level exceeds the 4 mcg/dL threshold for referral","A trial of an SSRI to reduce the ingestion behavior","No further action is needed since this level is within normal limits"],"correct":1,"rationale":"For Pica, periodic blood lead testing is recommended given the toxicity risk from nonfood substances like paint, dust, or soil, with pediatric consultation recommended if levels exceed 4 mcg/dL — this child's level of 6 mcg/dL crosses that threshold."},{"topic":"ARFID s/sx","vignette":"A 6-year-old has eaten fewer than 10 total foods since birth, all of similar beige color and crunchy texture. He gags and cries when offered anything with a different texture, though his growth curve has stayed stable.","question":"Which of the three common ARFID presentations does this best represent?","options":["Fear-based avoidance following an aversive eating experience","Apparent lack of interest in eating/food","Sensory-based avoidance of food characteristics","Body-image-driven restriction"],"correct":2,"rationale":"Texture-driven food refusal without any history of a specific aversive event, and without a low appetite drive, points to the sensory-based avoidance subtype of ARFID — the second most common of the three subtypes."},{"topic":"ARFID s/sx","vignette":"A 7-year-old girl with newly diagnosed ARFID is found on labs to have iron-deficiency anemia and low vitamin D. Her growth chart shows a drop from the 50th to the 15th percentile for weight over the past year.","question":"Which DSM-5 ARFID Criterion A consequence is demonstrated by these lab findings?","options":["Significant nutritional deficiency","Marked interference with psychosocial functioning","Significant weight loss alone, without any nutritional deficiency","Dependence on enteral feeding or oral supplements"],"correct":0,"rationale":"ARFID Criterion A requires at least one of four functional consequences: significant weight loss/failure to grow, significant nutritional deficiency, dependence on enteral feeding/supplements, or marked psychosocial interference. Iron-deficiency anemia and low vitamin D directly demonstrate a significant nutritional deficiency."},{"topic":"Therapies for eating disorders","vignette":"A 14-year-old with a 6-month history of anorexia nervosa has a stable, engaged family willing to participate actively in her care.","question":"What treatment approach should be recommended first, and what is the parents' role in it?","options":["Individual CBT alone, with parents excluded from sessions","Immediate long-term inpatient admission regardless of medical stability","Family-Based Treatment (Maudsley model), with parents empowered to take charge of refeeding at home","Fluoxetine as first-line monotherapy before any psychotherapy is attempted"],"correct":2,"rationale":"Family-Based Treatment (the Maudsley model) has the strongest empirical support for adolescent anorexia nervosa, with parents empowered as part of the solution and placed in charge of refeeding at home — not blamed for causing the illness."},{"topic":"Therapies for eating disorders","vignette":"A hospitalized 15-year-old with severe anorexia nervosa is started on a refeeding protocol. The team deliberately limits initial caloric advancement and monitors phosphate closely.","question":"What complication is this cautious approach designed to prevent?","options":["Neuroleptic malignant syndrome","Refeeding syndrome","Alcohol withdrawal seizures","Serotonin syndrome"],"correct":1,"rationale":"Too-rapid refeeding in a severely malnourished patient risks refeeding syndrome, marked by dangerous electrolyte shifts (especially phosphate) — a key patient-safety consideration guiding gradual caloric advancement (roughly 1 lb/week outpatient, 2-3 lb/week inpatient)."},{"topic":"Enuresis vs Encopresis","vignette":"A 6-year-old boy has nighttime wetting episodes 4 times per week for the past 5 months, with no daytime accidents.","question":"Does this presentation meet DSM-5 criteria for enuresis, and which subtype applies?","options":["No — the frequency threshold of twice weekly has not been met","No — age 6 is below the minimum diagnostic age of 7","Yes — nocturnal-only enuresis, meeting both the age and frequency thresholds","Yes, but this should be classified as diurnal enuresis"],"correct":2,"rationale":"Enuresis requires age ≥5 years and frequency ≥2x/week for ≥3 consecutive months (or clinically significant distress). At age 6 with 4 nighttime episodes weekly for 5 months and no daytime accidents, this meets criteria for the nocturnal-only (monosymptomatic) subtype, the most common presentation."},{"topic":"Enuresis vs Encopresis","vignette":"A 5-year-old girl has soiled her underwear with normal-formed stool on 3 separate occasions over the past 4 months, always during arguments with her older brother. Physical exam and abdominal imaging show no evidence of constipation.","question":"Which encopresis specifier applies, and what association is commonly seen with this presentation?","options":["Without constipation and overflow incontinence — often associated with oppositional or deliberate soiling behavior","This does not meet diagnostic criteria because the stool is normal-formed","This requires an additional diagnosis of major depressive disorder before encopresis can be coded","With constipation and overflow incontinence — the most common subtype overall"],"correct":0,"rationale":"Encopresis without constipation and overflow incontinence ('functional nonretentive fecal incontinence') presents with normal-form stool and intermittent, often situational soiling, and is frequently associated with ODD/conduct disorder or deliberate soiling tied to family conflict."},{"topic":"Nocturnal enuresis treatment","vignette":"A 9-year-old with persistent nocturnal enuresis has already tried fluid restriction and voiding before bed without success. His parents want the treatment option with the best durable, long-term success rate.","question":"Which treatment should be recommended?","options":["Intranasal DDAVP as monotherapy","Oral DDAVP as monotherapy","The urine alarm ('bell and pad')","An anticholinergic medication"],"correct":2,"rationale":"The urine alarm is first-line for persistent nocturnal enuresis, with the highest success rate of behavioral options (~75% at 6 months, ~56% sustained at 12 months) — substantially better long-term durability than medication, which carries a high relapse rate on discontinuation."},{"topic":"Nocturnal enuresis treatment","vignette":"A family needs a short-term solution for their 11-year-old's bedwetting before a week-long summer camp, with no time to establish a urine alarm program beforehand.","question":"What is an appropriate short-term option, and what counseling point should accompany it?","options":["Oral DDAVP, with reassurance that relapse after discontinuation is rare","Oral DDAVP, with counseling that most children relapse once it is discontinued","Intranasal DDAVP, preferred for its lower hyponatremia risk compared with oral form","The urine alarm, since it works within 2-3 nights"],"correct":1,"rationale":"DDAVP can provide short-term help for situational needs like camp, but most children relapse when it is stopped. Oral form is preferred over intranasal spray due to a hyponatremia risk specific to the nasal spray formulation."},{"topic":"Encopresis treatment","vignette":"An 8-year-old with chronic constipation and fecal soiling is found to have a large palpable stool mass on exam, confirming the constipation/overflow subtype of encopresis.","question":"What is the correct treatment sequence?","options":["A behavioral toileting program alone, without addressing the impaction first","Weekly parent-administered enemas as an ongoing maintenance strategy","Initial bowel cleanout (PEG or enemas), then bowel retraining (stool softener, high-fiber diet, toileting routine) combined with a behavioral program","Immediate psychiatric referral before any medical management"],"correct":2,"rationale":"For constipation-type encopresis, treatment always begins with bowel cleanout (oral PEG or enemas), followed by bowel retraining (stool softener/mineral oil, high-fiber diet, regular toileting routine) combined with the behavioral program — behavioral measures alone will fail if impaction persists."},{"topic":"Encopresis treatment","vignette":"A 9-year-old without any constipation has been intentionally smearing stool during conflicts with his stepfather. Bowel exam and imaging are normal.","question":"What treatment approach is indicated?","options":["A daily suppository regimen","A high-fiber diet as the sole intervention","Bowel cleanout with PEG followed by mineral oil","Family behavioral treatment addressing the exacerbating family dynamics"],"correct":3,"rationale":"Encopresis without constipation, particularly when manipulative or deliberate, calls for family behavioral treatment addressing the underlying family dynamics driving the behavior — not the bowel-cleanout protocol reserved for the constipation/overflow subtype."},{"topic":"ODD vs CD vs IED","vignette":"An 11-year-old has an 8-month history of frequently losing his temper, arguing with his teachers, and deliberately annoying his younger sibling. He has never damaged property, stolen anything, or hurt another person or animal.","question":"Which diagnosis fits this pattern?","options":["Disruptive mood dysregulation disorder","Conduct disorder","Oppositional defiant disorder","Intermittent explosive disorder"],"correct":2,"rationale":"Angry/irritable mood, argumentative/defiant behavior, and vindictiveness lasting ≥6 months, without any violation of others' rights or major societal norms, is classic ODD. Conduct disorder requires more serious rights-violating behavior, which is absent here."},{"topic":"ODD vs CD vs IED","vignette":"A 13-year-old has, over the past year, broken into a neighbor's shed, deliberately set fire to a trash can, and been physically cruel to a stray cat. His first symptom (fire-setting at a friend's house) occurred at age 9.","question":"Which conduct disorder specifier applies, and what is its prognostic implication?","options":["Unspecified onset — no prognostic information can be inferred","Childhood-onset type — associated with a better long-term prognosis than adolescent-onset","Adolescent-onset type — associated with a better prognosis for remission","Childhood-onset type — associated with more physical aggression and higher risk of progressing to adult antisocial personality disorder"],"correct":3,"rationale":"Childhood-onset conduct disorder (≥1 symptom before age 10) carries a worse prognosis — more physical aggression and higher risk of progression to adult antisocial personality disorder — compared with adolescent-onset CD, which has a better prognosis for remission."},{"topic":"ODD vs CD vs IED","vignette":"A 10-year-old has had twice-weekly verbal outbursts and object-throwing (not directed at people) for the past 4 months, clearly disproportionate to minor frustrations, causing significant family distress.","question":"Does this presentation meet the minimum age requirement for intermittent explosive disorder?","options":["No — IED requires a minimum age of 10 years, which is not yet met","IED has no minimum age requirement","Yes — IED requires a minimum age of 6 years, which is met here","No — IED requires a minimum age of 12 years"],"correct":2,"rationale":"IED Criterion E requires chronological age ≥6 years (or equivalent developmental level). At age 10, this child meets the age threshold, and the twice-weekly verbal/non-destructive outbursts for 3+ months satisfy the frequency arm of Criterion A."},{"topic":"Meds for physically aggressive children","vignette":"A 14-year-old is acutely agitated and physically aggressive on an inpatient unit, with a suspected underlying psychotic process. The team needs a rapid-acting agent.","question":"Which class of medication is preferred for this scenario?","options":["A selective serotonin reuptake inhibitor for immediate sedation","Benzodiazepines as the default first-line choice","Haloperidol as the preferred first-line agent","Second-generation antipsychotics, particularly risperidone or olanzapine"],"correct":3,"rationale":"Second-generation antipsychotics — particularly risperidone and olanzapine — are preferred over haloperidol for acutely agitated youth, given comparable efficacy, rapid onset, sedative effect, rapidly-dissolving oral forms, and lower extrapyramidal side effects. Benzodiazepines are avoided by default due to paradoxical disinhibition risk."},{"topic":"Meds for physically aggressive children","vignette":"An 8-year-old with autism spectrum disorder has chronic, severe irritability and aggression unresponsive to behavioral interventions alone.","question":"Which medications carry FDA approval specifically for irritability/aggression associated with ASD?","options":["Lorazepam and clonazepam","Haloperidol and chlorpromazine","Risperidone and aripiprazole","Sertraline and fluoxetine"],"correct":2,"rationale":"For chronic/severe aggression associated with ASD or intellectual disability, risperidone and aripiprazole are the FDA-approved options for irritability/aggression, distinct from the acute-agitation preference for risperidone/olanzapine in general pediatric aggression."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 15-year-old was assaulted 3 weeks ago. She now has intrusive memories, avoidance of places resembling the assault site, dissociative episodes, and marked hyperarousal.","question":"Given this timeframe, which diagnosis is most appropriate right now?","options":["Adjustment disorder","Depersonalization/derealization disorder","Acute stress disorder","PTSD"],"correct":3,"rationale":"PTSD requires symptoms persisting beyond 1 month post-trauma; acute stress disorder covers 3 days to 1 month. At 3 weeks out, with qualifying Criterion-A trauma exposure and symptoms, this has now crossed into the PTSD timeframe."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 13-year-old describes recurring episodes of feeling detached from her own body, as if 'floating above and watching myself.' She recognizes these feelings are not literally real and has no identifiable trauma history.","question":"What feature of her presentation distinguishes it from a psychotic process?","options":["The presence of an identifiable trauma trigger","The presence of auditory hallucinations accompanying the episodes","Reality testing remains intact — she recognizes the experience is not literally real","Symptom persistence beyond 6 months"],"correct":2,"rationale":"Depersonalization/derealization disorder is defined by intact reality testing — the person knows the unreality feeling isn't literally true — distinguishing it from psychosis. Unlike PTSD/ASD, no specific Criterion-A trauma is required for this diagnosis."},{"topic":"Trauma therapy","vignette":"A 12-year-old with new-onset PTSD is referred for psychotherapy, without a specific treatment model requested by the referring provider.","question":"Which model is the safest, most defensible first-line choice absent further detail?","options":["Medication management as the primary intervention","Psychodynamic psychotherapy","Play therapy alone","Trauma-Focused CBT (TF-CBT)"],"correct":3,"rationale":"TF-CBT is the gold-standard trauma therapy with the strongest empirical support in youth. Psychotherapy is first-line for trauma-related presentations; medication remains adjunctive only."},{"topic":"Trauma therapy","vignette":"A therapist begins working with a traumatized 9-year-old by teaching diaphragmatic breathing and developing a family safety plan before any discussion of the traumatic event itself.","question":"What principle does this treatment sequencing reflect?","options":["Medication should be initiated before any psychotherapy begins","Trauma narrative work should always begin in the first session","Grounding/stabilization skills are taught before any trauma memory processing — safety and self-regulation come first","Family involvement should be delayed until stabilization is fully complete"],"correct":2,"rationale":"Across effective trauma therapy models, grounding/stabilization skills are taught before any trauma memory processing (narrative work, exposure) — safety and self-regulation always come first, regardless of the specific model used."},{"topic":"TF-CBT / PRACTICE","vignette":"A trainee is learning the 8 components of TF-CBT using the mnemonic taught in her program.","question":"Which mnemonic and component order is correct?","options":["TRAUMA: Triage, Rapport, Assessment, Understanding, Mastery, Aftercare","PRACTICE: Psychoeducation, Relaxation, Assessment, Cognitive processing, Trauma narrative, Imagery, Conjoint sessions, Evaluation","PROCESS: Psychoeducation, Relaxation, Ordering, Cognitive work, Exposure, Safety, Stabilization","PRACTICE: Psychoeducation/Parenting, Relaxation, Affective modulation, Cognitive processing, Trauma narrative, In-vivo mastery, Conjoint sessions, Enhancing safety"],"correct":3,"rationale":"PRACTICE is the core TF-CBT mnemonic: Psychoeducation and Parenting skills, Relaxation, Affective modulation, Cognitive processing/coping, Trauma narrative and processing, In-vivo mastery of trauma reminders, Conjoint child-parent sessions, Enhancing safety."},{"topic":"TF-CBT / PRACTICE","vignette":"A TF-CBT therapist has just finished teaching diaphragmatic breathing and progressive muscle relaxation to an 8-year-old survivor of a house fire, and has begun helping him name and rate the intensity of his fear and guilt.","question":"Which PRACTICE component is currently being addressed, and what comes immediately after it?","options":["Trauma narrative — beginning detailed exposure to the traumatic memory immediately","Enhancing safety — the final planning component","Cognitive processing/coping — identifying and correcting distorted trauma-related thoughts such as self-blame","Conjoint child-parent sessions — before any individual work is completed"],"correct":2,"rationale":"After Psychoeducation/Parenting, Relaxation, and Affective modulation, the next component is Cognitive processing/coping — identifying and correcting distorted trauma-related thoughts (e.g., self-blame) — which precedes the trauma narrative component."},{"topic":"Insomnia treatment","vignette":"An 8-year-old has nightly difficulty falling asleep without a parent present, resulting in daytime irritability and academic difficulty over the past 4 months.","question":"Before treating this as a standalone sleep disorder, what should be evaluated first?","options":["A benzodiazepine trial should be started immediately","This should be treated as a normal developmental variant requiring no evaluation","A sleep study should be ordered before any other evaluation","An underlying psychiatric cause (anxiety, ADHD, mood disorder, PTSD) or a substance such as caffeine or stimulant medication"],"correct":3,"rationale":"Before treating insomnia as standalone, an underlying psychiatric cause or substance should be screened for and addressed as the primary driver, rather than jumping directly to symptomatic insomnia treatment."},{"topic":"Insomnia treatment","vignette":"A 10-year
