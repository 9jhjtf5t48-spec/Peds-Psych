om BED — both disorders share recurrent binge eating and self-evaluation tied to shape/weight, but only bulimia includes purging, laxative misuse, fasting, or excessive exercise to prevent weight gain."},{"topic":"ARFID s/sx","vignette":"A pediatric NP is evaluating a 10-year-old with restrictive eating to rule out ARFID. Growth chart review shows falling percentiles, and labs reveal iron-deficiency anemia.","question":"Which of the following would argue AGAINST an ARFID diagnosis and toward a purely medical cause instead?","options":["Onset in early childhood","Comorbid anxiety disorder","Dependence on nutritional supplements","A history and exam finding consistent with malabsorption or GI reflux fully explaining the poor intake"],"correct":3,"rationale":"ARFID must be differentiated from medical causes of poor intake such as malabsorption, GI reflux, or neoplasm — if a medical condition fully accounts for the restrictive eating, ARFID is not the appropriate diagnosis (per DSM-5 Criterion D and the evaluation guidance to rule out organic causes first)."},{"topic":"ARFID s/sx","vignette":"A 13-year-old girl with ARFID (sensory-based avoidance type) is being evaluated in an eating disorders clinic. Her clinician notes she is younger, more often male-typical in epidemiologic comparison, and has a higher rate of comorbid anxiety than the anorexia/bulimia patients in the same clinic.","question":"This epidemiologic comparison is most consistent with which finding from clinical-sample studies of ARFID?","options":["ARFID has no known comorbidity pattern distinct from AN/BN","ARFID patients are typically older and predominantly female, similar to AN/BN","Compared with AN/BN, ARFID patients tend to be younger, more often male, and more likely to have comorbid anxiety or medical disorders","ARFID patients have a lower median weight percentile than AN patients"],"correct":2,"rationale":"Clinical-sample data (e.g., ~14% of an eating disorders clinic's 8-18 year-old presentations) show ARFID patients skew younger and more often male compared with AN/BN, with higher rates of comorbid medical and anxiety disorders, and a median weight percentile between that of AN and BN patients — not lower than AN."},{"topic":"Therapies for eating disorders","vignette":"A 17-year-old with bulimia nervosa and no significant family conflict is starting outpatient treatment.","question":"Which treatment has the strongest evidence base for bulimia nervosa in this scenario?","options":["Psychodynamic psychotherapy","Antipsychotic medication","Cognitive-behavioral therapy","Family-Based Treatment identical to the anorexia protocol"],"correct":2,"rationale":"CBT is the most effective treatment for bulimia nervosa in adults and is generally preferred; a manualized family-based treatment also has empirical support for adolescents, particularly useful for those from high-conflict families where individual CBT may be less feasible."},{"topic":"Therapies for eating disorders","vignette":"A 16-year-old with bulimia nervosa has not responded adequately to CBT alone. The prescriber is considering adjunctive medication.","question":"Which medication has the best pediatric evidence base for bulimia nervosa?","options":["Topiramate","Lisdexamfetamine","Risperidone","Fluoxetine, studied at doses up to 60 mg/day"],"correct":3,"rationale":"Fluoxetine (up to 60 mg/day studied) has the best pharmacologic evidence among adolescents with bulimia nervosa — it is the only eating disorder with meaningful medication support. Lisdexamfetamine is FDA-approved for BED in adults; topiramate/risperidone are not first-line BN agents."},{"topic":"Enuresis vs Encopresis","vignette":"A nursing student is confused about why a 4-year-old with occasional fecal soiling can be diagnosed with encopresis, while a 4-year-old who wets the bed cannot yet be diagnosed with enuresis.","question":"What explains this age discrepancy?","options":["Encopresis has no minimum age requirement at all","Both disorders share the same minimum age of 4 years — the student is mistaken","The DSM-5 minimum age is 4 years for encopresis but 5 years for enuresis","Both disorders share the same minimum age of 5 years — the student is mistaken"],"correct":2,"rationale":"This age threshold difference is a classic exam trap: encopresis requires age ≥ 4 years, while enuresis requires age ≥ 5 years (or equivalent developmental level for either). Bowel continence is developmentally expected slightly earlier than bladder continence."},{"topic":"Enuresis vs Encopresis","vignette":"A 7-year-old boy has normal-form stool found intermittently in his underwear, occurring only when he is angry with his parents. He has no history of constipation and a normal bowel exam.","question":"Which encopresis specifier and typical association fits this presentation?","options":["With constipation and overflow incontinence — the most common subtype","This does not meet criteria for encopresis because the stool is normal-form","This requires a diagnosis of conduct disorder before encopresis can be diagnosed","Without constipation and overflow incontinence — often associated with oppositional defiant disorder or deliberate soiling"],"correct":3,"rationale":"'Without constipation and overflow incontinence' (functional nonretentive fecal incontinence) presents with normal-form stool, intermittent soiling, and is often associated with ODD/conduct disorder or deliberate soiling — distinct from the more common constipation-related subtype (~80% of cases)."},{"topic":"Nocturnal enuresis treatment","vignette":"The parents of a 5-year-old with occasional nighttime wetting ask what the very first step in management should be, before any device or medication is considered.","question":"What is the recommended first step for young children with nocturnal enuresis?","options":["Start the urine alarm immediately regardless of age","Begin DDAVP at the lowest available dose","Minimize shame/punishment while awaiting spontaneous maturation; restrict evening fluids, eliminate caffeine, void at bedtime","Refer directly to urology for cystoscopy"],"correct":2,"rationale":"For young children, the first step is behavioral and supportive: minimizing shame/punishment while awaiting spontaneous maturation, restricting fluids before bedtime, eliminating caffeinated beverages, voiding at bedtime, and having the child help change their own bed to reduce negative parental reactions."},{"topic":"Nocturnal enuresis treatment","vignette":"A 12-year-old is motivated to work on his bedwetting and wants an active role. His NP recommends a reward-based system alongside bladder-capacity exercises.","question":"Which combination of interventions is being described?","options":["Overnight catheterization","Immediate initiation of DDAVP without behavioral measures","A star chart/reward system plus daytime bladder training (delayed voiding, stream interruption)","Psychotherapy alone, since enuresis is primarily psychological in origin"],"correct":2,"rationale":"For motivated older children, a star chart/reward monitoring system combined with daytime continence work — bladder training exercises, practicing delayed voiding to increase bladder capacity, and stream interruption to strengthen sphincter awareness — is an appropriate next step before or alongside the urine alarm."},{"topic":"Encopresis treatment","vignette":"A family has been giving their child daily enemas at home for the past 2 months to manage encopresis, with limited success and increasing conflict.","question":"What is the most appropriate guidance regarding this approach?","options":["Daily home enemas are the recommended long-term maintenance strategy","Enemas should be increased in frequency until soiling resolves completely","Enemas are only appropriate for children under 4 years old","Repeated parent-administered enemas are discouraged — they are harmful to the parent-child relationship"],"correct":3,"rationale":"Repeated parent-administered enemas are specifically discouraged in encopresis management because they are harmful to the parent-child relationship — cleanout is typically a brief initial step, not an ongoing home regimen."},{"topic":"Encopresis treatment","vignette":"Most cases of encopresis are initially managed in a primary care setting, but a subset requires referral.","question":"Which cases of encopresis warrant referral for psychological intervention?","options":["All cases of encopresis, regardless of severity","Only cases in children younger than 4 years","Complex or treatment-resistant cases, especially those with associated psychiatric disorders such as ODD or anxiety","Only cases without any constipation"],"correct":2,"rationale":"Most encopresis cases can be managed by a pediatrician; more complex/resistant cases need psychological intervention, particularly individual/family psychiatric care focused on associated psychiatric disorders (e.g., ODD, anxiety) driving resistant soiling."},{"topic":"ODD vs CD vs IED","vignette":"A 12-year-old boy has had 3 outbursts in the past year involving punching holes in walls and shoving a classmate hard enough to cause a bruise. Each outburst was sudden, unplanned, and grossly out of proportion to the trigger (being told to stop playing a video game).","question":"Which diagnosis and criterion count best fits?","options":["IED cannot be diagnosed because the outbursts occurred less than twice weekly","Oppositional defiant disorder — vindictiveness criterion","Intermittent explosive disorder — 3 outbursts involving property damage/injurious assault within 12 months","Conduct disorder — this meets the aggression-to-people/animals category"],"correct":2,"rationale":"IED Criterion A can be met either by twice-weekly non-destructive outbursts for 3 months OR by 3 outbursts involving damage/destruction of property and/or physical assault causing injury within 12 months. The impulsive, non-premeditated, disproportionate nature (Criteria B-C) further supports IED over conduct disorder, which requires a broader pattern of rights-violating behavior, not isolated impulsive outbursts."},{"topic":"ODD vs CD vs IED","vignette":"A clinician is asked whether intermittent explosive disorder can be diagnosed in a child who already carries a diagnosis of ADHD and oppositional defiant disorder.","question":"What is the correct answer?","options":["No — IED is always subsumed under an existing ODD diagnosis and cannot be diagnosed separately","Yes — IED can be diagnosed in addition to ADHD, CD, ODD, or ASD when the impulsive aggressive outbursts exceed what's typically seen in those disorders and warrant independent attention","No — a diagnosis of ADHD automatically excludes IED","Yes, but only if the child is under age 6"],"correct":1,"rationale":"IED can be diagnosed alongside ADHD, CD, ODD, or ASD when the impulsive aggressive outbursts exceed what is typically seen in those other conditions and warrant independent clinical attention — it is not automatically subsumed under a comorbid diagnosis."},{"topic":"ODD vs CD vs IED","vignette":"A 16-year-old has a 2-year history of bullying peers, forcing a peer into unwanted sexual contact, and repeatedly staying out all night despite being forbidden, beginning after age 13.","question":"Which diagnosis fits, and which DSM-5 criterion category does the forced sexual contact fall under?","options":["Oppositional defiant disorder — 'Vindictiveness' category","Conduct disorder — 'Aggression to People/Animals' category","Intermittent explosive disorder — Criterion A(1)","Conduct disorder — 'Serious Rule Violations' category"],"correct":1,"rationale":"Conduct disorder requires ≥3 of 15 behaviors across 4 categories in the past 12 months. Forcing someone into sexual activity falls under 'Aggression to People/Animals,' alongside bullying/threatening, physical fights, weapon use, and physical cruelty. Staying out overnight despite prohibition (onset before age 13) falls under 'Serious Rule Violations.' With onset after age 10, this would be specified as adolescent-onset."},{"topic":"Meds for physically aggressive children","vignette":"A resident wants to prescribe a benzodiazepine as the first-line agent for a physically aggressive but non-psychotic 8-year-old in the emergency department.","question":"Why is this generally not recommended?","options":["Benzodiazepines have no sedative effect in children","Benzodiazepines require IV access only, limiting emergency use","Benzodiazepines are contraindicated in all pediatric patients regardless of indication","Benzodiazepines can cause paradoxical disinhibition and worsen agitation in children"],"correct":3,"rationale":"Benzodiazepines should be avoided as a default choice for pediatric aggression because they can cause paradoxical disinhibition and worsen agitation in children — second-generation antipsychotics are generally preferred for acute agitation."},{"topic":"Meds for physically aggressive children","vignette":"A child with newly diagnosed ADHD has been increasingly aggressive at school. Before starting an antiaggression medication, the NP first addresses the underlying ADHD with stimulant treatment, and the aggression substantially improves.","question":"What principle does this case best illustrate?","options":["Stimulants are the first-line antiaggression medication for all pediatric aggression","If aggression is secondary to a treatable comorbidity, treating that condition often reduces aggression more effectively than an antiaggression medication alone","ADHD and aggression are unrelated and this improvement is coincidental","Aggression should always be treated with an antipsychotic regardless of etiology"],"correct":1,"rationale":"Medication is not first-line for aggression in general — the first step is identifying and addressing the underlying cause (ADHD, ODD/CD, intellectual disability/ASD, anxiety, organic/medical causes, substance use, psychosis, abuse/PTSD). When aggression is secondary to a treatable comorbidity like ADHD, treating that condition is often more effective than an antiaggression medication alone."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 12-year-old's parents divorced 6 weeks ago. He has since shown declining grades, irritability, and tearfulness that is clearly out of proportion to what would typically be expected, but he does not meet full criteria for any other DSM-5 disorder.","question":"Which diagnosis fits, and what stressor characteristic is required?","options":["Adjustment disorder cannot be diagnosed unless the stressor is life-threatening","Adjustment disorder — can follow any identifiable stressor, not necessarily life-threatening","Acute stress disorder — divorce meets Criterion A trauma exposure","PTSD — divorce meets Criterion A trauma exposure"],"correct":1,"rationale":"Adjustment disorder requires only an identifiable stressor (of any severity — divorce, a move, a bad grade), unlike PTSD/ASD which require a Criterion-A trauma (actual/threatened death, serious injury, or sexual violence). Onset is within 3 months of the stressor and symptoms resolve within 6 months of the stressor ending."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A clinician is deciding between an adjustment disorder diagnosis and PTSD for a 15-year-old who witnessed a violent assault 2 months ago and now meets full PTSD criteria.","question":"Which diagnosis should take precedence?","options":["PTSD — if full criteria for PTSD (or another specific disorder) are met, that diagnosis takes precedence over adjustment disorder","Adjustment disorder — it should always be diagnosed first as the less severe option","Both diagnoses should be given simultaneously","Neither diagnosis applies because 2 months exceeds the adjustment disorder window"],"correct":0,"rationale":"Per Adjustment Disorder Criterion C, if full criteria for PTSD or another specific disorder are met, that diagnosis takes precedence over adjustment disorder — adjustment disorder is essentially a diagnosis of exclusion for a stress reaction that doesn't meet criteria for a more specific disorder."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"Four patients present to clinic: one 5 weeks after a serious trauma, one 2 weeks after a serious trauma, one with unexplained dissociative episodes and no trauma history, and one 6 weeks after a stressful but non-life-threatening move.","question":"Which pairing of duration/trigger and diagnosis is correct?","options":["PTSD requires >1 month post-trauma; ASD requires 3 days-1 month; dissociative disorders require no specific trauma; adjustment disorder requires any stressor with onset within 3 months","Adjustment disorder always requires more than 6 months to resolve","All four diagnoses require the same Criterion-A trauma exposure","PTSD requires 3 days-1 month; ASD requires >1 month; both require a life-threatening trauma"],"correct":0,"rationale":"This is the core comparison for this topic: PTSD (>1 month post-trauma), ASD (3 days to 1 month post-trauma) both require Criterion-A trauma exposure; dissociative disorders (e.g., depersonalization/derealization) require no specific trauma type; adjustment disorder requires only an identifiable stressor of any severity, with onset within 3 months and resolution within 6 months of the stressor ending."},{"topic":"Trauma therapy","vignette":"A school counselor wants a group-based, school-delivered trauma treatment option for several students exposed to community violence.","question":"Which trauma therapy model is specifically designed for this school-based group format?","options":["Narrative Exposure Therapy/KidNET","Child-Parent Psychotherapy","Seeking Safety","CBITS (Cognitive Behavioral Intervention for Trauma in Schools)"],"correct":3,"rationale":"CBITS is school-based group TF-CBT, designed for exactly this scenario. Child-Parent Psychotherapy targets young children and their caregiver dyad; Seeking Safety addresses co-occurring PTSD and substance use; NET/KidNET is designed for war/refugee trauma."},{"topic":"Trauma therapy","vignette":"A 17-year-old with PTSD and a co-occurring substance use disorder is referred for trauma-focused treatment.","question":"Which model was specifically designed to address PTSD alongside substance use?","options":["Seeking Safety","Child-Parent Psychotherapy","Trauma Systems Therapy","CBITS"],"correct":0,"rationale":"Seeking Safety is the trauma therapy model specifically designed for PTSD co-occurring with substance use. Trauma Systems Therapy addresses the interaction between a child's trauma symptoms and their surrounding social environment/system more broadly."},{"topic":"TF-CBT / PRACTICE","vignette":"A therapist is explaining to a family why TF-CBT does not begin with detailed discussion of the traumatic event, even though that is the family's main concern.","question":"What is the correct explanation for this sequencing?","options":["Stabilization/coping-skills components (Psychoeducation/Parenting, Relaxation, Affective modulation, Cognitive processing) always come before trauma narrative work — trauma processing is never the starting point","Conjoint sessions must occur before any individual skill-building","The trauma narrative is optional and rarely used in TF-CBT","TF-CBT does not include any trauma narrative component at all"],"correct":0,"rationale":"In TF-CBT, the stabilization/coping-skills components (the P-R-A-C portion of PRACTICE) always come before trauma narrative work — trauma processing is never the starting point, ensuring the child has sufficient coping skills before engaging with the traumatic memory."},{"topic":"TF-CBT / PRACTICE","vignette":"A researcher is asked what distinguishes TF-CBT from many other individual child trauma therapies.","question":"What is a key distinguishing design feature of TF-CBT?","options":["It is explicitly designed to include the caregiver, not just the child, through parenting-skills components and conjoint sessions","It excludes any caregiver involvement to protect confidentiality","It focuses exclusively on medication augmentation","It has no structured component sequence"],"correct":0,"rationale":"TF-CBT is explicitly designed to include the caregiver, not just the child — the conjoint sessions and parenting-skills component (the 'P' in PRACTICE) are distinguishing features that set it apart from purely individual trauma therapy approaches."},{"topic":"Insomnia treatment","vignette":"A 7-year-old has trouble falling asleep 4 nights per week for the past 2 months, with mild daytime tiredness but no significant functional impairment.","question":"Does this meet full DSM-5 criteria for insomnia disorder?","options":["No — the duration threshold of ≥3 months has not yet been met","Yes, because any sleep difficulty in children automatically qualifies","No — the frequency threshold of ≥3 nights/week has not been met","Yes — all criteria are clearly met"],"correct":0,"rationale":"Insomnia Disorder requires occurrence ≥3 nights/week (Criterion C, met here) AND presence for ≥3 months (Criterion D, NOT yet met at 2 months) — the duration threshold is what separates a diagnosable disorder from a few rough weeks, and this case falls short of it."},{"topic":"Insomnia treatment","vignette":"A prescriber is asked to recommend the first-line, non-pharmacologic approach for a school-age child with new-onset difficulty falling asleep, prior to any medication trial.","question":"What is first-line management across all pediatric ages for insomnia?","options":["Melatonin as the very first step, before any behavioral changes","A trial of a sedative-hypnotic medication","Referral for polysomnography prior to any behavioral intervention","Behavioral/sleep hygiene measures — consistent bedtime routine, bed used only for sleep, regular schedule, removing electronics, avoiding naps/caffeine"],"correct":3,"rationale":"First-line (all ages) for pediatric insomnia is behavioral/sleep hygiene: consistent bedtime routine, bed used only for sleep, regular sleep-wake schedule, removing electronics from the bedroom, avoiding naps/caffeine, and a transitional object or night-light for younger children — medication is considered afterward if needed."},{"topic":"Nightmare treatment","vignette":"A family asks what the very first step in managing their 8-year-old's frequent nightmares should be, before any medication is considered.","question":"What is the first-line behavioral/psychotherapeutic approach?","options":["Reassurance, normalizing the sleep schedule, relaxation/imagery, imagery rehearsal therapy, and systematic desensitization/dream reorganization","Prazosin as the initial step regardless of severity","No intervention is recommended for pediatric nightmares","A sedative-hypnotic to suppress dreaming"],"correct":0,"rationale":"The first step in nightmare treatment is behavioral/psychotherapeutic: reassurance, normalizing sleep schedule, relaxation/imagery, imagery rehearsal therapy, and systematic desensitization/dream reorganization — medication is reserved for significant, persistent, function-impairing cases."},{"topic":"Nightmare treatment","vignette":"A 14-year-old's nightmares are identified as a core symptom of her underlying PTSD, occurring nearly every night.","question":"What is the primary intervention that should be prioritized?","options":["Treating the underlying PTSD, usually with TF-CBT, as the primary intervention","No treatment is needed since nightmares in PTSD are expected to resolve without intervention","A benzodiazepine nightly for sleep suppression","Prazosin as monotherapy without addressing the PTSD"],"correct":0,"rationale":"If nightmares are a PTSD symptom, treating the underlying PTSD (usually with TF-CBT) is the primary intervention — nightmare-specific treatments (prazosin, imagery rehearsal) are adjuncts to, not replacements for, treating the root trauma-related disorder."},{"topic":"AUD s/sx and treatment","vignette":"A 15-year-old with a strong family history of alcoholism is being counseled about her elevated risk.","question":"What is noted about the genetic contribution to alcoholism risk?","options":["The genetic contribution to family history of alcoholism is strongest in males","Genetics play no meaningful role in adolescent alcohol use disorder risk","The genetic contribution is equally strong regardless of sex","Family history only matters if both parents have AUD"],"correct":0,"rationale":"A family history of alcoholism is a recognized risk factor for adolescent alcohol use, and the genetic contribution to that risk is described as strongest in males, alongside other risk markers such as comorbid ADHD/ODD/CD and earlier-onset substance use."},{"topic":"AUD s/sx and treatment","vignette":"A 16-year-old abruptly stops heavy, prolonged alcohol use and within a day develops tremor, sweating, a heart rate of 112, and reports transient visual illusions.","question":"Which condition is this, and how many of the associated symptoms are required for diagnosis?","options":["This does not meet criteria for any DSM-5 alcohol-related diagnosis","Alcohol withdrawal — ≥2 of the listed symptoms (autonomic hyperactivity, tremor, insomnia, nausea/vomiting, transient hallucinations/illusions, psychomotor agitation, anxiety, seizures)","Delirium tremens is the only possible diagnosis at this stage","Alcohol use disorder — this is simply Criterion A symptom #10"],"correct":1,"rationale":"Alcohol withdrawal is a separate diagnosis requiring ≥2 of: autonomic hyperactivity (sweating, HR>100), hand tremor, insomnia, nausea/vomiting, transient hallucinations/illusions, psychomotor agitation, anxiety, or generalized tonic-clonic seizures, developing within hours to days of cessation/reduction after heavy, prolonged use."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A cannabis withdrawal diagnosis is being considered for a patient who uses cannabis occasionally, about once monthly, with no other substance use disorder diagnosis.","question":"Can cannabis withdrawal be diagnosed in this patient?","options":["Yes, but only if the patient also has a mild cannabis use disorder","No — cannabis withdrawal does not exist as a DSM-5 diagnosis","Yes — withdrawal can be diagnosed regardless of use pattern or disorder severity","No — cannabis withdrawal can only be diagnosed in the presence of a moderate or severe cannabis use disorder"],"correct":3,"rationale":"Cannabis withdrawal can only be diagnosed in the presence of a moderate or severe cannabis use disorder — occasional, non-disordered use would not meet the heavy, prolonged use pattern (Criterion A) required for the withdrawal diagnosis."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A 16-year-old in treatment for cannabis use disorder admits that he often uses cannabis again specifically because it makes his irritability and insomnia go away.","question":"What treatment-planning point does this illustrate?","options":["This should be treated with a benzodiazepine to eliminate the withdrawal trigger","Many adolescents use cannabis (or another substance) specifically to relieve withdrawal symptoms — an important relapse driver to address in treatment planning","This pattern indicates the patient does not actually have a cannabis use disorder","Withdrawal-driven relapse is unique to cannabis and does not occur with other substances"],"correct":1,"rationale":"Many adolescents report using cannabis or another substance specifically to relieve withdrawal symptoms — recognizing this as an important relapse driver is a key part of treatment planning for cannabis use disorder and its withdrawal syndrome."},{"topic":"Motivational Interviewing","vignette":"A clinician is in the early stage of an MI conversation, focused primarily on building rapport and a collaborative working relationship before addressing any specific behavior change.","question":"Which of the 4 phases of MI is being described, and what comes next in order?","options":["Planning — the final phase, occurring first in this case","Engaging — followed by Focusing, Evoking, and Planning","Focusing — followed by Engaging, then Evoking and Planning","Evoking — followed by Engaging, Focusing, and Planning"],"correct":1,"rationale":"The 4 phases of MI occur in order: Engaging (building rapport) → Focusing (guiding toward a clear target for change) → Evoking (eliciting the patient's own change talk) → Planning (building a concrete plan once change talk predominates)."},{"topic":"Motivational Interviewing","vignette":"During an MI session, a patient shifts from saying 'I guess I should probably cut back' to 'I'm going to cut back starting Monday and I have a plan for it.'","question":"What does this language shift signal, and which MI phase does it indicate readiness for?","options":["Readiness for the Engaging phase to begin","Readiness for the Planning phase — signaled by language shifting from 'need/should' to 'will/plan/going to'","A relapse into the Precontemplation stage","No clinical significance — MI does not track language shifts"],"correct":1,"rationale":"Readiness to progress toward planning/action is signaled by a shift in language — from 'need to'/'should' toward 'will'/'going to'/'plan to.' This language shift is the practical cue that a patient is ready to move into the Planning phase of MI."},{"topic":"Change theory","vignette":"A patient relapses to substance use after 3 months of sobriety. The treatment team frames this as an expected, normal part of the recovery process rather than a treatment failure.","question":"What principle from change theory supports this framing?","options":["Relapse means the Transtheoretical Model does not apply to this patient","Relapse is expected and should be reframed as a predictable part of the change process, not a catastrophe or reason to end treatment","Relapse should be treated as a moral failing requiring a consequence-based response","Relapse indicates the patient must restart treatment from Precontemplation with a new therapist"],"correct":1,"rationale":"Relapse is explicitly framed in change theory as an expected, predictable part of the change process — not a catastrophe or reason to end treatment. This principle applies equally to substance use, eating disorder, and other behavior-change work."},{"topic":"Change theory","vignette":"A patient has been successfully abstinent from alcohol for 8 months and is now working with her clinician on identifying situations that could trigger a return to drinking.","question":"Which TTM stage is this, and what is the clinician's primary task?","options":["Preparation — building an initial plan before any behavior change has started","Contemplation — still ambivalent about whether to change","Action — actively modifying behavior for the first time","Maintenance — relapse-prevention planning and reinforcing gains"],"correct":3,"rationale":"Sustained change over several months with a focus on preventing relapse describes the Maintenance stage — the clinician's task is relapse-prevention planning and reinforcing the gains already made, distinct from the Action stage's initial behavior modification."},{"topic":"Children and foster care","vignette":"A family court is deciding whether to pursue reunification or terminate parental rights for a child in short-term foster care following a substantiated maltreatment case.","question":"What guiding principle should inform the pace of this decision?","options":["The child's own stated preference should be the sole determining factor regardless of age","Child welfare agencies and family courts should move quickly to determine whether parents can be rehabilitated and children returned, or whether parental rights should be terminated","Decisions should always be delayed at least 5 years to allow maximal time for parental rehabilitation","Reunification should never be considered once a child enters foster care"],"correct":1,"rationale":"Short-term foster placement may be necessary while a home is stabilized and parents obtain treatment following maltreatment, but child welfare agencies and family courts should move quickly to determine whether parents can be rehabilitated and children returned, or whether parental rights should be terminated — minimizing prolonged uncertainty and placement instability."},{"topic":"Children and foster care","vignette":"A psychiatric NP evaluates a new patient who was recently placed in foster care, with no prior clinical information available.","question":"What clinical assumption and approach is recommended at intake?","options":["Deferring any evaluation until the caseworker provides a full social history","A trauma-informed evaluation that assumes a trauma history until proven otherwise, with attention to attachment history","Treating the foster placement itself as the primary source of any presenting symptoms","An assumption that the child has no trauma history unless explicitly documented"],"correct":1,"rationale":"Clinical approach for children in foster care includes a trauma-informed evaluation (assuming a trauma history until proven otherwise), coordination with caseworkers/courts, attention to attachment history, and support for the foster/adoptive caregivers themselves (psychoeducation, realistic expectations)."},{"topic":"Mandated reporter","vignette":"A clinician suspects abuse based solely on the child's behavioral presentation and clinical judgment, without any direct disclosure from the child or an obvious physical finding.","question":"Does the mandated reporting duty apply in this scenario?","options":["No — a report requires a physical exam finding or collateral report","Yes — the reporting duty applies regardless of the source of suspicion, including clinical judgment based on presentation/behavior","No — a report can only be made following direct disclosure by the child","The duty only applies if a parent confirms the suspicion"],"correct":1,"rationale":"Mandated reporting duty applies regardless of the source of suspicion — disclosure by the child, physical findings, a collateral report, or clinical judgment based on presentation/behavior can all independently trigger the reporting obligation."},{"topic":"Mandated reporter","vignette":"An NP is about to file a report for suspected abuse and is deciding how to communicate this with the family.","question":"What is standard practice regarding transparency with the family when abuse is suspected?","options":["Only inform the family if they directly ask whether a report was made","Tell the parents that an investigation will follow and that helpful services may be available through the child protection agency, except where it would endanger the child","Never inform the family that a report has been made under any circumstances","Wait for the investigation to conclude before telling the family a report was filed"],"correct":1,"rationale":"When abuse is suspected, standard practice is to tell the parents that an investigation will follow and that helpful services may be available through the child protection agency — transparency with the family, except where it would endanger the child, is part of standard practice."},{"topic":"Grief in children","vignette":"A 4-year-old asks repeatedly when her deceased mother is 'coming back from her trip.'","question":"What does this reflect about her developmental understanding of death?","options":["This reflects dissociative symptoms related to complicated grief","Children at this age have a fully realistic understanding of death's permanence","This indicates a pathological grief reaction requiring urgent intervention","At ages 4-5, death is often seen as reversible, like sleep or a trip — a normal developmental stage, not denial"],"correct":3,"rationale":"Children's understanding of death is developmental: under 2-3 years, no true understanding, only separation-related anxiety; ages 4-5, death is seen as reversible (like sleep or a trip); more realistic understanding emerges around ages 10-11. This 4-year-old's belief is a normal developmental stage, not a pathological sign."},{"topic":"Grief in children","vignette":"A 9-year-old whose father died violently 8 months ago continues to show intense, unrelenting grief symptoms significantly interfering with school and friendships, well beyond what is typical for her peers who lost a grandparent normally.","question":"What diagnostic consideration is most appropriate given the violent nature of the death and the persistence of symptoms?","options":["Escalation to childhood traumatic grief or persistent complex bereavement disorder should be considered","This should be diagnosed as major depressive disorder exclusively, with no consideration of a grief-specific process","This is entirely normal grief regardless of duration or the traumatic circumstances","No psychiatric diagnosis can apply to grief in children under any circumstances"],"correct":0,"rationale":"If a death was traumatic, normal grief may escalate to childhood traumatic grief or persistent complex bereavement disorder — clinicians distinguish normal bereavement from a disorder by intensity, quality, and persistence beyond expected norms, which is especially relevant given the violent death and 8-month duration here."},{"topic":"Group therapy techniques","vignette":"Several sessions into a therapy group, conflict emerges as members disagree openly and begin asserting differing viewpoints, creating noticeable tension.","question":"How should this stage be understood within Tuckman's model?","options":["Storming — necessary friction for the group to mature, not a failed or pathological stage","Adjourning — the group is prematurely ending due to conflict","A sign that the group therapy model has failed and should be discontinued","Forming — members are still orienting to the group's norms"],"correct":0,"rationale":"Storming is a necessary, not a failed, stage — conflict as members find their place and surface differing ideas is expected as the group matures toward Norming (aligning around common goals) and eventually Performing (autonomous, deeper work)."},{"topic":"Group therapy techniques","vignette":"A group therapist is asked which single therapeutic factor Yalom considered the most foundational, enabling members to tolerate conflict and accept feedback.","question":"Which factor is this?","options":["Group cohesiveness","Corrective recapitulation of the primary family group","Instillation of hope","Existential factors"],"correct":0,"rationale":"Group cohesiveness — the sense of belonging and mutual acceptance — is considered by Yalom the primary therapeutic factor, and it is the group leader's responsibility to actively build it. It is the foundational element enabling members to tolerate conflict, accept feedback, and engage in change."},{"topic":"Angry patient during family therapy","vignette":"A family member becomes too dysregulated to continue safely in a joint session, escalating toward physical aggression.","question":"What should the clinician do?","options":["Pause the joint session, briefly separate members, or shift to individual check-ins — safety takes priority over completing the planned agenda","Call the other family members into the room to help de-escalate the dysregulated member","Continue the session as planned to avoid rewarding the escalation with a break","End all future family sessions for this family permanently"],"correct":0,"rationale":"If a member is too dysregulated to continue safely, the clinician may need to pause the joint session, briefly separate members, or shift to individual check-ins before resuming — safety always takes priority over completing the planned agenda."},{"topic":"Angry patient during family therapy","vignette":"A highly charged, resistant family is struggling to engage productively when the therapist asks direct problem-focused questions about the conflict.","question":"What alternative technique can help de-escalate tension while still surfacing the core conflict?","options":["Ending the session early whenever resistance is encountered","Asking each member to individually blame the identified patient for the conflict","Repeating the same problem-focused question more forcefully","A solution-oriented question, such as 'If you woke up tomorrow and your family was exactly how you wanted it, what would be different?'"],"correct":3,"rationale":"A solution-oriented question can de-escalate tension better than a problem-focused question with a resistant or highly charged family, while still surfacing the core conflict — this technique shifts the frame from blame to a shared, future-oriented goal."},{"topic":"Learning domains","vignette":"A family 'knows' the facts about their child's new diagnosis but continues to resist any changes to their household routines, expressing skepticism about whether the diagnosis is even real.","question":"Which domain is the primary barrier to effective psychoeducation in this scenario?","options":["This scenario does not relate to any of Bloom's three learning domains","Cognitive domain — the family lacks basic factual knowledge","Affective domain — attitudes, values, feelings, and willingness to engage ('buy-in') have not been addressed","Psychomotor domain — the family cannot physically perform any required tasks"],"correct":2,"rationale":"The affective domain covers attitudes, values, feelings, and willingness to engage ('buy-in') — a family expressing skepticism and resisting change despite having factual knowledge illustrates an affective-domain barrier, not a cognitive knowledge gap."},{"topic":"Learning domains","vignette":"An NP is designing a comprehensive psychoeducation plan for a family newly navigating their child's bipolar disorder diagnosis.","question":"What does effective psychoeducation require, according to Bloom's Taxonomy as applied to patient teaching?","options":["Focusing exclusively on the psychomotor domain, since hands-on skills are what families remember longest","Addressing only the affective domain, since attitude change drives all behavior change","Addressing all three domains — cognitive, affective, and psychomotor — not just information transfer","Focusing exclusively on the cognitive domain, since factual knowledge is the foundation of all other learning"],"correct":2,"rationale":"Effective psychoeducation addresses all three domains, not just information transfer (cognitive) — a family can 'know' the facts but still resist behavior change without addressing attitudes (affective) and practiced skill (psychomotor)."},{"topic":"NSSI","vignette":"A 14-year-old reports 6 episodes of self-inflicted cutting over the past year, each done to relieve overwhelming emotional distress, with the expectation of only minor physical harm.","question":"How many days of self-inflicted injury within the past year are required by DSM-5 proposed research criteria to consider a diagnosis of NSSI?","options":["≥ 10 days","≥ 1 day","≥ 5 days","≥ 20 days"],"correct":2,"rationale":"DSM-5 proposed criteria (Conditions for Further Study) for NSSI require intentional self-inflicted injury on ≥5 days in the last year, likely to cause bleeding, bruising, or pain, with the expectation of only minor/moderate harm and no suicidal intent."},{"topic":"NSSI","vignette":"A therapist responds to a teenager's disclosure of self-harm by expressing shock and telling her she needs to 'just stop doing this immediately.'","question":"What is the concern with this response, per recommended clinical approach?","options":["Shame-based responses are effective specifically for adolescent patients","This response is appropriate and should be used consistently to discourage the behavior","Punitive or shaming responses increase secrecy and worsen the therapeutic alliance; a curious, function-focused approach is preferred","This response has no impact on the therapeutic relationship either way"],"correct":2,"rationale":"Punitive or shaming responses to NSSI disclosure increase secrecy and worsen the therapeutic alliance. The recommended approach is curiosity about function ('what does this help you with?') rather than focusing only on stopping the behavior."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 14-year-old with autism spectrum disorder has eaten only 4 specific foods since early childhood. He depends on an oral nutritional supplement to meet caloric needs and has marked social impairment because he cannot eat at friends' houses or school events.","question":"Which DSM-5 criterion for ARFID is most clearly demonstrated by his dependence on oral nutritional supplements?","options":["Criterion C — the disturbance occurs exclusively during anorexia nervosa","Criterion B — the restriction is due to lack of available food","Criterion D — the restriction is better explained by a concurrent medical condition","A functional/nutritional consequence required under Criterion A (dependence on enteral feeding or oral nutritional supplements)"],"correct":3,"rationale":"ARFID Criterion A requires at least one of four functional consequences: significant weight loss/failure to grow, significant nutritional deficiency, dependence on enteral feeding or oral supplements, or marked psychosocial interference. Dependence on oral supplements satisfies this directly, and comorbid ASD is a recognized common association, not an exclusion."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A clinic is teaching a group of nursing students the fastest way to differentiate bulimia nervosa from binge-eating disorder on a vignette-based exam.","question":"What single feature should the students be taught to check first?","options":["Whether the patient reports guilt after eating","Whether binge episodes occur at least twice weekly","Whether a compensatory behavior (purging, laxatives, fasting, excessive exercise) is present","Whether the patient is underweight"],"correct":2,"rationale":"The fastest differentiator taught for this exam: compensatory behavior present = bulimia nervosa; compensatory behavior absent = binge-eating disorder. Both may show guilt, weekly-or-more frequency, and normal-to-elevated weight, so those features don't reliably distinguish the two."},{"topic":"ARFID s/sx","vignette":"A father reports his 4-year-old has 'always been picky' but now eats fewer than 6 total foods, refuses all fruits/vegetables, and school staff report she seems anxious around unfamiliar snacks at parties.","question":"Which piece of history would most strongly distinguish this from developmentally normal picky eating?","options":["A parent describing the child as a 'picky eater'","Any reported dislike of vegetables","The presence of any food refusal at school events","Failure to meet nutritional requirements, significant psychosocial interference, or lack of expected weight gain"],"correct":3,"rationale":"ARFID requires more than a narrow food preference — it requires demonstrable functional consequence: failure to meet nutritional/energy needs, weight/growth faltering, nutritional deficiency, supplement dependence, or marked psychosocial interference. Ordinary picky eating without these consequences does not meet criteria."},{"topic":"ARFID s/sx","vignette":"A multidisciplinary team is planning outpatient treatment for a 7-year-old recently diagnosed with ARFID, sensory-avoidance subtype.","question":"Which treatment approach is most appropriate?","options":["Fluoxetine as first-line pharmacotherapy","Family-Based Treatment (Maudsley model) identical to anorexia nervosa protocols","A multidisciplinary, family-based behavioral/CBT approach tailored to the specific restrictive driver, with SLP/OT involvement as needed","Lisdexamfetamine as first-line pharmacotherapy"],"correct":2,"rationale":"ARFID treatment is a multidisciplinary, family-involved behavioral approach (graded exposure, positive reinforcement, feeding-team involvement) tailored to the underlying driver — it is not simply the Maudsley FBT model used for AN, and no medication is first-line for ARFID (fluoxetine is the BN-specific evidence-based medication; lisdexamfetamine is FDA-approved for BED, not ARFID)."},{"topic":"Therapies for eating disorders","vignette":"A research team compares Family-Based Treatment to Parent-Focused Treatment (PFT), a modification in which the therapist meets only with the parents rather than the whole family, for adolescent anorexia nervosa.","question":"What did one randomized controlled trial find regarding PFT compared with standard FBT?","options":["PFT and FBT showed identical outcomes in every domain measured","PFT eliminated the need for any parental involvement","PFT was more efficient at achieving weight restoration","PFT was significantly less effective and is not recommended"],"correct":2,"rationale":"In one RCT, Parent-Focused Treatment (meeting with parents only, not the whole family) was found to be more efficient at weight restoration than standard conjoint FBT — a useful modification to know, though FBT remains the most broadly cited gold-standard reference."},{"topic":"Therapies for eating disorders","vignette":"A 19-year-old presents with recurrent binge eating, marked distress, no compensatory behaviors, and a normal-range weight.","question":"Which first-line psychotherapies are indicated for this presentation?","options":["Exposure and response prevention","Family-Based Treatment (Maudsley model)","Dialectical behavior therapy exclusively","CBT and interpersonal psychotherapy"],"correct":3,"rationale":"For binge-eating disorder, CBT and interpersonal psychotherapy are first-line psychotherapies; lisdexamfetamine is FDA-approved pharmacotherapy for BED in adults (limited pediatric data). FBT is specific to adolescent anorexia, not BED."},{"topic":"Enuresis vs Encopresis","vignette":"A clinician is distinguishing the substance involved and minimum diagnostic age for enuresis versus encopresis while teaching a psychoeducation session to nursing students.","question":"Which pairing is correct?","options":["Both disorders involve urine but differ only in age threshold","Enuresis = urine, age ≥ 4; Encopresis = feces, age ≥ 5","Enuresis = urine, age ≥ 5; Encopresis = feces, age ≥ 4","Enuresis = feces, age ≥ 5; Encopresis = urine, age ≥ 4"],"correct":2,"rationale":"Enuresis involves urine (age ≥ 5 years); encopresis involves feces (age ≥ 4 years). This age/substance pairing is one of the most frequently tested exam points for elimination disorders."},{"topic":"Enuresis vs Encopresis","vignette":"A child is diagnosed with enuresis. Her parents ask whether medication caused it, since she takes an anticholinergic for a different condition.","question":"Per DSM-5 Criterion D, what must be ruled out before diagnosing enuresis or encopresis?","options":["That the child has never previously been toilet trained","That there is no family history of elimination disorders","That the child has a comorbid anxiety disorder","That the symptom is not attributable to a substance (e.g., a diuretic or laxative) or another medical condition"],"correct":3,"rationale":"Criterion D for both enuresis and encopresis requires that the symptom is not attributable to a substance's physiological effect (e.g., a diuretic or antipsychotic for enuresis; a laxative for encopresis) or another medical condition (e.g., diabetes, spina bifida, seizure disorder) — except, for encopresis, through a mechanism involving constipation."},{"topic":"Nocturnal enuresis treatment","vignette":"A clinician is counseling a family that psychotherapy might not directly resolve their child's bedwetting.","question":"What is the correct role of psychotherapy in nocturnal enuresis management?","options":["First-line treatment that should be tried before any behavioral intervention","Contraindicated in all cases of enuresis","Rarely useful for enuresis itself, but may help address psychosocial sequelae (shame, social avoidance) or trauma/stress-related enuresis","Equally effective as the urine alarm for achieving dryness"],"correct":2,"rationale":"Psychotherapy is rarely useful for enuresis itself but may help address the psychosocial sequelae (shame, social avoidance) or address enuresis when it is trauma/stress-related — it is not a primary treatment for the wetting itself."},{"topic":"Nocturnal enuresis treatment","vignette":"A family combines the urine alarm with cleanliness training, retention control training, and overlearning for their child's persistent nocturnal enuresis.","question":"What outcome would be expected from this combined behavioral approach, per the evidence discussed in your course materials?","options":["It requires concurrent DDAVP to be effective","It is only appropriate for children under age 5","It stops bedwetting in about two-thirds of children","It has no additive benefit over the alarm alone"],"correct":2,"rationale":"Combining the urine alarm with cleanliness training, retention control, and overlearning stops bedwetting in about two-thirds of children — a stronger combined outcome than the alarm used in isolation."},{"topic":"Encopresis treatment","vignette":"A behavior-shaping program is being designed for a child with encopresis without constipation.","question":"What is the recommended structure of this behavioral program?","options":["Rewards only for a fully clean week with no partial credit","Punishment for soiling episodes paired with rewards for compliance","No behavioral component — medication is the mainstay for this subtype","Rewards first for sitting on the toilet, then for successful bowel movements"],"correct":3,"rationale":"For encopresis without constipation, the behavior-shaping program provides rewards first for sitting on the toilet, then for successful bowel movements — a stepwise shaping approach rather than an all-or-nothing reward structure or a punitive approach."},{"topic":"Encopresis treatment","vignette":"A 7-year-old with constipation-type encopresis has completed an initial bowel cleanout with PEG.","question":"What should the maintenance phase ('bowel retraining') include?","options":["Discontinuation of all interventions since the cleanout is complete","A low-fiber diet to reduce stool bulk","Stool softener or mineral oil, a high-fiber diet, a regular toileting routine, and a mild suppository if needed","Repeated enemas administered weekly by the parent indefinitely"],"correct":2,"rationale":"After initial cleanout, bowel retraining includes a stool softener or mineral oil, a high-fiber diet, a regular toileting routine, and a mild suppository if needed — all combined with the behavioral program, not discontinuation of care."},{"topic":"ODD vs CD vs IED","vignette":"A resident is trying to remember the fastest way to sort ODD, conduct disorder, and IED on a timed exam.","question":"Which summary correctly captures the core distinction taught for this exam?","options":["IED is simply a milder form of conduct disorder","All three disorders require the same minimum duration of symptoms","ODD = oppositional, not rights-violating; Conduct Disorder = violates others' rights/major norms; IED = impulsive, anger-based outbursts grossly out of proportion, never premeditated","ODD = violates others' rights; Conduct Disorder = argumentative only; IED = always premeditated"],"correct":2,"rationale":"The high-yield distinction: ODD is oppositional/argumentative without rights violations; conduct disorder involves serious violations of others' rights or major societal norms (theft, cruelty, weapons); IED is impulsive, anger-based aggression grossly out of proportion to the trigger and never premeditated or goal-directed."},{"topic":"ODD vs CD vs IED","vignette":"A 7-year-old has had twice-weekly verbal outbursts and non-injurious physical aggression (throwing objects, not at people) for the past 4 months, clearly out of proportion to minor frustrations, causing significant distress to the family.","question":"What is the minimum age requirement for diagnosing intermittent explosive disorder, and is it met here?","options":["Age ≥ 10 years — not met in this case","Age ≥ 6 years (or equivalent developmental level) — met in this case","Age ≥ 4 years — met in this case","There is no minimum age for IED"],"correct":1,"rationale":"IED Criterion E requires chronological age ≥ 6 years (or equivalent developmental level). At age 7, this child meets the age threshold, and the twice-weekly verbal/non-destructive physical aggression for 3+ months satisfies the frequency arm of Criterion A."},{"topic":"Meds for physically aggressive children","vignette":"A teenager with chronic conduct-disorder-related aggression, without psychosis, is being considered for medication after behavioral interventions have had limited effect.","question":"What is the appropriate framing for medication in this scenario?","options":["Stimulant medication is first-line regardless of comorbid ADHD status","Evidence for medication in chronic CD-related aggression without psychosis is weak; behavioral/family/multisystemic interventions remain the mainstay, with medication reserved for comorbid conditions","Medication is contraindicated entirely in conduct disorder","A second-generation antipsychotic should be started immediately as first-line monotherapy"],"correct":1,"rationale":"For chronic conduct-disorder-related aggression without psychosis, evidence for medication is weak; behavioral, family, and multisystemic interventions are the mainstay, with medication reserved for treating comorbid conditions (ADHD, mood, anxiety) rather than the aggression itself."},{"topic":"Meds for physically aggressive children","vignette":"A previously calm 11-year-old suddenly becomes aggressive and disoriented in the ED. Before attributing this to a psychiatric cause, the team orders basic labs and a toxicology screen.","question":"What principle guides this initial work-up?","options":["Sudden-onset aggression in children is always psychiatric in origin","Medical causes only need to be considered if the child has a prior psychiatric history","Toxicology screening is unnecessary in pediatric aggression evaluations","Always rule out a medical/organic or substance-related cause of sudden aggression before treating it as purely psychiatric"],"correct":3,"rationale":"Before treating sudden pediatric aggression as purely psychiatric, organic/medical causes and substance intoxication/withdrawal must be ruled out — this is a foundational safety step given the broad differential for out-of-control behavior (temper outbursts, ADHD, ODD/CD, intellectual disability/ASD, anxiety, organic causes, substance use, psychosis, abuse/PTSD)."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 17-year-old describes recurrent gaps in memory for important autobiographical information, well beyond ordinary forgetfulness, following a period of severe chronic abuse. There is no evidence of multiple distinct personality states.","question":"Which dissociative disorder best fits this presentation?","options":["Dissociative identity disorder","Dissociative amnesia","Acute stress disorder","Depersonalization/derealization disorder"],"correct":1,"rationale":"Dissociative amnesia involves inability to recall important autobiographical information, usually traumatic/stressful, that is too extensive to be ordinary forgetfulness — distinct from dissociative identity disorder (requires ≥2 distinct personality states) and depersonalization/derealization disorder (unreality/detachment with intact reality testing, not memory loss)."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A student is trying to quickly sort a vignette involving trauma exposure and dissociative symptoms during an exam.","question":"Which factor is the fastest sorting tool between PTSD/ASD and adjustment disorder or dissociative disorders?","options":["Whether symptoms occur during the day or at night","The stressor severity threshold: PTSD/ASD require Criterion-A-level trauma (death, serious injury, sexual violence); adjustment disorder can follow any stressor; dissociative disorders don't require a specific stressor type","Whether the patient is male or female","The patient's age at presentation"],"correct":1,"rationale":"The fastest sort taught for this exam is stressor severity: PTSD/ASD require a Criterion-A-level trauma; adjustment disorder can follow any identifiable stressor regardless of severity; dissociative disorders don't require a specific stressor type at all."},{"topic":"Trauma therapy","vignette":"A refugee child with a history of war-zone trauma is being evaluated for trauma-focused treatment options available in the literature.","question":"Which model was specifically developed for war/refugee trauma populations?","options":["Narrative Exposure Therapy / KidNET","CBITS","EMDR only","Seeking Safety"],"correct":0,"rationale":"Narrative Exposure Therapy (and its child-adapted version, KidNET) was specifically developed for war/refugee trauma populations, using a structured lifeline narrative approach. CBITS is school-based; Seeking Safety targets co-occurring substance use."},{"topic":"Trauma therapy","vignette":"A trauma treatment program screens not only the child but also the accompanying parent for trauma symptoms before beginning treatment.","question":"What principle does this practice reflect?","options":["Family/caregiver involvement and screening/treating the caregiver's own trauma symptoms are consistent features across effective trauma therapy models","Caregiver screening is unique to TF-CBT and not used in other models","Only the child's symptoms should ever be assessed in pediatric trauma care","Caregiver trauma symptoms are irrelevant to the child's treatment outcome"],"correct":0,"rationale":"Family/caregiver involvement, and screening/treating the caregiver's own trauma symptoms, is a consistent feature across effective pediatric trauma therapy models generally — not unique to any single approach — because caregiver functioning significantly affects the child's recovery."},{"topic":"TF-CBT / PRACTICE","vignette":"A child in TF-CBT has completed the trauma narrative and is now practicing calmly approaching a safe reminder of the trauma (e.g., a similar vehicle after a car accident) that she has been avoiding.","question":"Which PRACTICE component does this represent?","options":["Enhancing safety","Cognitive processing/coping","Affective modulation","In-vivo mastery of trauma reminders"],"correct":3,"rationale":"In-vivo mastery of trauma reminders involves real-world graded exposure to safe trauma reminders that are being avoided — distinct from the trauma narrative itself, which is the therapist-supported development of a detailed account of the traumatic event."},{"topic":"TF-CBT / PRACTICE","vignette":"A TF-CBT program is concluding treatment with a family by developing a written plan for handling future triggers and building on the skills the family has learned.","question":"Which final PRACTICE component does this represent?","options":["Enhancing safety","Trauma narrative and processing","Psychoeducation and parenting skills","Relaxation"],"correct":0,"rationale":"Enhancing safety — safety planning and future skills for the child and family — is the final PRACTICE component, typically addressed as treatment nears completion, building on all the preceding stabilization and processing work."},{"topic":"Insomnia treatment","vignette":"A prescriber is asked why a benzodiazepine would be an unusual first-line choice for a child's chronic insomnia on a vignette exam.","question":"What is the exam logic for this scenario?","options":["Behavioral measures + melatonin = the correct pediatric insomnia answer; a prescription hypnotic/benzodiazepine as first-line is almost always wrong in a pediatric vignette","Behavioral measures are only used as a last resort after medication fails","Sedative-hypnotics have no risk of paradoxical reaction in children","Benzodiazepines are the preferred first-line treatment in children under 10"],"correct":0,"rationale":"The exam logic taught for this topic: behavioral measures plus melatonin is the correct pediatric insomnia answer, while a prescription hypnotic or benzodiazepine as first-line is almost always the wrong choice in a pediatric vignette, given lack of FDA approval and paradoxical activation risk."},{"topic":"Insomnia treatment","vignette":"A 15-year-old with PTSD reports that trauma-related nightmares are the main driver of her ongoing insomnia.","question":"What is the most appropriate treatment priority?","options":["Treat the underlying PTSD, and consider prazosin if nightmares specifically are driving the insomnia","Start a benzodiazepine for immediate symptomatic relief before addressing PTSD","Insomnia and PTSD should be treated as entirely unrelated conditions","Melatonin alone is sufficient without addressing the PTSD"],"correct":0,"rationale":"When insomnia is trauma-related, the priority is treating the underlying PTSD; if nightmares specifically drive the insomnia, prazosin should be considered as a targeted adjunct — addressing the root cause rather than treating insomnia as an isolated symptom."},{"topic":"Nightmare treatment","vignette":"A clinician documents that a 9-year-old's nightmares occur 2-3 times per week but less than nightly.","question":"How would this frequency be classified under DSM-5 severity specifiers for nightmare disorder?","options":["Moderate — ≥1 episode/week but less than nightly","This frequency does not meet any severity specifier","Severe — occurring nightly","Mild — less than 1 episode/week"],"correct":0,"rationale":"Nightmare disorder severity is rated by frequency: mild = <1 episode/week; moderate = ≥1/week but <nightly; severe = nightly. At 2-3 times weekly, this falls into the moderate category."},{"topic":"Nightmare treatment","vignette":"Two off-label medications are being considered as adjuncts for a teen with hyperarousal-related nightmares, alongside low-dose trazodone for sleep.","question":"Which additional agents are mentioned as off-label/adjunctive options for hyperarousal and nightmares?","options":["Lithium and valproate","Fluoxetine and sertraline","Risperidone and aripiprazole","Clonidine and guanfacine"],"correct":3,"rationale":"Other off-label/adjunctive agents for hyperarousal/nightmares include clonidine and guanfacine, alongside low-dose trazodone for sleep — prazosin remains the agent with the best-known targeted nightmare evidence, but no medication carries FDA approval for pediatric nightmares."},{"topic":"AUD s/sx and treatment","vignette":"A clinician explains why adolescents are considered to progress from alcohol use to a use disorder more readily than adults.","question":"Which statement reflects the course of AUD specific to adolescents, per your course materials?","options":["Adolescents cross from use to abuse more easily than adults; some experts consider any underage alcohol use 'abuse,' though physical dependence is comparatively rare in adolescents","Physical dependence is more common in adolescents than in adults","Underage alcohol use is never considered clinically significant unless physical dependence is present","Adolescents require the same 12-month symptom count as adults but progress more slowly to a use disorder"],"correct":0,"rationale":"Adolescents cross from use to abuse more easily than adults, and some experts consider any underage alcohol use 'abuse' — though physical dependence itself is comparatively rare in adolescents compared with adults with chronic AUD."},{"topic":"AUD s/sx and treatment","vignette":"A treatment team is designing a comprehensive outpatient plan for a 17-year-old with moderate AUD (4 Criterion A symptoms) and no significant withdrawal risk.","question":"Which combination of interventions reflects the recommended treatment approach?","options":["Developmentally appropriate group therapy, self-help 12-step programs, motivational interviewing, family therapy, and relapse prevention","Individual insight-oriented psychodynamic therapy alone","Inpatient medical detoxification as a routine requirement","Pharmacotherapy for AUD as the primary intervention, given the moderate severity rating"],"correct":0,"rationale":"Treatment for adolescent AUD emphasizes developmentally appropriate group therapy with peers, self-help 12-step programs (AA), motivational interviewing, family therapy (structural/behavioral approaches), and relapse prevention. Pharmacological treatments are rarely used given the limited evidence base in this age group, and relapse should be treated as an expected part of recovery, not a treatment failure."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A clinician is teaching that cannabis withdrawal should not be dismissed as 'just psychological' since it carries real clinical significance.","question":"Which symptoms are described as the most common presenting features of cannabis withdrawal?","options":["Irritability and sleep disturbance","Seizures and autonomic instability","Psychotic symptoms and severe agitation","Fever and diaphoresis exclusively"],"correct":0,"rationale":"Cannabis withdrawal is real and clinically significant; irritability and sleep disturbance are the most common presenting symptoms — a key exam pearl distinguishing this from the more severe autonomic/seizure profile of alcohol withdrawal."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A patient reports fatigue, yawning, and difficulty concentrating 5 days after stopping heavy cannabis use, alongside a rebound period of increased appetite and hypersomnia following the initial appetite loss.","question":"How are these additional features classified relative to DSM-5 Criterion B?","options":["They rule out a cannabis withdrawal diagnosis","They are additional features often seen beyond the core Criterion B symptom list, not required for diagnosis","They indicate a different diagnosis entirely (alcohol withdrawal)","They are required Criterion B symptoms and must be present for diagnosis"],"correct":1,"rationale":"Fatigue, yawning, difficulty concentrating, and a rebound period of increased appetite/hypersomnia following initial appetite loss/insomnia are described as additional features often seen beyond the core Criterion B symptom list — supportive of the diagnosis but not required criteria themselves."},{"topic":"Motivational Interviewing","vignette":"A prescriber describes MI's foundational belief that the motivation to change already exists within the patient, and that the practitioner's role is to draw it out rather than impose it.","question":"Which element of the 'Spirit' of MI is being described?","options":["Acceptance","Compassion","Partnership","Evocation"],"correct":3,"rationale":"Evocation is the MI Spirit element describing the belief that motivation to change already exists within the patient — the practitioner's job is to draw it out, not impose it. The other Spirit elements are Partnership (working with, not on, the patient), Acceptance (respecting autonomy, affirming strengths), and Compassion (prioritizing patient well-being)."},{"topic":"Motivational Interviewing","vignette":"A substance-use treatment protocol incorporates personalized feedback, places responsibility for change with the patient, gives advice only with permission, and offers a menu of change options.","question":"Which adapted MI-based protocol is being described, and what does its mnemonic stand for?","options":["SBIRT: Screening, Brief Intervention, Referral to Treatment — unrelated to MI","FRAMES: Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy","OARS: Open questions, Affirmations, Reflections, Summarizing","PRACTICE: the TF-CBT treatment component mnemonic"],"correct":1,"rationale":"FRAMES (Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy) is a well-known adapted substance-use protocol built on MI principles — distinct from OARS (the core communication skills) and PRACTICE (the unrelated TF-CBT mnemonic)."},{"topic":"Motivational Interviewing","vignette":"A patient in the Focusing phase of MI keeps bringing up reasons why change would be too hard. The clinician avoids confronting this directly and instead continues asking open questions to help the patient find their own direction.","question":"What MI technique is the clinician using?","options":["Direct persuasion","Rolling with resistance","The Planning phase's action-step technique","Confrontational interviewing"],"correct":1,"rationale":"In the Focusing phase, MI uses open questions rather than unsolicited advice, and 'rolls with resistance' rather than confronting it directly — this non-confrontational stance is a hallmark MI technique across all four phases."},{"topic":"Change theory","vignette":"A trainee is asked to list the five main stages of the Transtheoretical Model of Change in the correct order.","question":"Which sequence is correct?","options":["Preparation → Precontemplation → Contemplation → Maintenance → Action","Precontemplation → Contemplation → Preparation → Action → Maintenance","Contemplation → Precontemplation → Action → Preparation → Maintenance","Action → Maintenance → Precontemplation → Contemplation → Preparation"],"correct":1,"rationale":"Precontemplation → Contemplation → Preparation → Action → Maintenance is the correct TTM sequence — a high-yield fact taught as the backbone of both MI and general behavior-change counseling, with (Relapse) as a common but non-required detour back to an earlier stage."},{"topic":"Change theory","vignette":"A clinician incorrectly uses action-oriented language ('let's set a quit date') with a patient who is still in the Precontemplation stage and has expressed no interest in changing.","question":"What is the core clinical error being made here?","options":["Violating patient confidentiality","Failing to match the intervention to the patient's actual stage of change, rather than pushing action language on a precontemplative patient","Failing to complete a formal substance use screening tool first","Using OARS skills incorrectly"],"correct":1,"rationale":"Matching your intervention to the patient's actual stage of change — not pushing 'action' language on a precontemplative patient — is the core clinical application tested on exams for both MI and the Transtheoretical Model."},{"topic":"Children and foster care","vignette":"A 12-year-old with severe out-of-control behavior is being considered for a foster placement as part of his treatment plan, separate from any child protection concern.","question":"What is an additional recognized use of foster care described in this context?","options":["Foster placement is contraindicated whenever a child has a behavioral disorder","Foster care can only be initiated by a court order, never as part of a treatment plan","Foster care is used exclusively in confirmed child maltreatment cases and never for behavioral containment","Foster care can be used as a containment/adjunctive option in severe out-of-control behavior or when the home environment cannot safely support the child during treatment"],"correct":3,"rationale":"Beyond its primary child-protection role, foster care is also used as a containment/adjunctive option in severe out-of-control behavior or when the home environment cannot safely support the child during treatment — a distinct clinical use worth recognizing."},{"topic":"Children and foster care","vignette":"A foster parent expresses frustration that her foster child does not show affection the way she expected, and feels she is 'failing' as a caregiver.","question":"Which component of the recommended clinical approach directly addresses this situation?","options":["No intervention is needed since this is a normal and expected caregiver reaction","Support for the foster/adoptive caregivers themselves, including psychoeducation and realistic expectations","Immediate removal of the child from this placement","Referral of the foster parent for individual psychotherapy unrelated to the placement"],"correct":1,"rationale":"The recommended clinical approach explicitly includes support for foster/adoptive caregivers themselves — psychoeducation and realistic expectations about attachment difficulties — since many fostered/adopted children show attachment difficulties stemming from their pre-placement history, not caregiver failure."},{"topic":"Mandated reporter","vignette":"A nursing student asks whether mandated reporting requires the clinician to have definitively confirmed that abuse occurred.","question":"What is the correct response?","options":["Reporting requirements vary so much by state that no general answer applies","No — mandated reporting is not confined to confirmed abuse; if evidence is sufficient to raise a serious question/reasonable suspicion, it must be reported","Only physicians, not nurse practitioners, carry a mandated reporting obligation","Yes — a report can only be filed once abuse has been confirmed by an official investigation"],"correct":1,"rationale":"Mandated reporting is not confined to confirmed abuse — if the evidence is sufficient to raise a serious question or reasonable suspicion, it must be reported to prompt an official investigation. All states require professionals who suspect child abuse to report it; this is a universal legal obligation across the profession, not confirmation-dependent."},{"topic":"Mandated reporter","vignette":"A clinician who suspected abuse chooses not to report because she is not '100% certain' and worries about damaging the family relationship if she is wrong.","question":"What is the risk of this decision?","options":["The decision is appropriate because certainty is required before reporting","Legal penalties can be assessed for failing to report, regardless of the clinician's motivation for not reporting","There is no legal consequence as long as the clinician documents her reasoning","This decision only carries risk if the abuse is later confirmed by another source"],"correct":1,"rationale":"Failing to report suspected abuse carries legal risk for the clinician — this is the flip side of the good-faith immunity protection for reporting. The 'reasonable suspicion' standard means uncertainty is not a valid reason to withhold a report."},{"topic":"Grief in children","vignette":"A hospice social worker asks whether attending the funeral could psychologically harm a grieving 8-year-old.","question":"What does the evidence suggest, and what is the recommended clinical guidance?","options":["The decision should be made entirely by the surviving parent without input from the child","Funeral attendance has not been shown to increase later psychiatric symptoms; allow the child some choice in attending","Children should never be allowed to attend funerals under age 10","Funeral attendance is mandatory for healthy grief processing at any age"],"correct":1,"rationale":"Clinical guidance is to allow the child some choice in attending the funeral — attendance has not been shown to increase later psychiatric symptoms. Clinicians should also provide extra adult support, since the surviving parent may be too grief-absorbed to be fully available, and explain death in a matter-of-fact, concrete way consistent with family beliefs."},{"topic":"Grief in children","vignette":"A comparison is drawn between the diagnostic duration threshold for persistent complex bereavement disorder in children versus adults.","question":"What is the correct duration comparison?","options":["There is no duration threshold specified for either children or adults","Children require a longer duration (≥18 months) than
