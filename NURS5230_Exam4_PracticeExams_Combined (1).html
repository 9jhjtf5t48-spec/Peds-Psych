adults because grief is considered more resilient in childhood","Children and adults require the identical ≥12-month duration threshold","Children require only ≥6 months of severe grief reactions, compared with ≥12 months in adults"],"correct":3,"rationale":"Persistent complex bereavement disorder is distinguished from normal grief by severe grief reactions persisting ≥12 months in adults, but only ≥6 months in children — a lower threshold reflecting how much grief can already impair a child's functioning."},{"topic":"Group therapy techniques","vignette":"A group member who has struggled with social isolation reports that being able to comfort and support another member in the group has boosted his own sense of self-worth.","question":"Which Yalom factor best captures this experience?","options":["Altruism","Interpersonal learning","Universality","Development of socializing techniques"],"correct":0,"rationale":"Altruism is the therapeutic factor describing how helping others in the group boosts a member's own self-worth — distinct from universality (realizing one is not alone) or interpersonal learning (gaining insight into one's own relational patterns)."},{"topic":"Group therapy techniques","vignette":"A well-established therapy group is ending after 6 months. Several members express sadness and some express anger about the group ending, wanting to avoid discussing it directly.","question":"Which Tuckman stage is the group currently in, and what should the leader do?","options":["Adjourning — the leader should directly address termination, since members may have strong emotional reactions to the group ending","Performing — the leader should focus solely on deepening ongoing therapeutic work","Forming — the leader should reintroduce basic ground rules","Storming — the leader should introduce new conflict-resolution rules"],"correct":0,"rationale":"Adjourning is the termination stage, where members may have strong emotional reactions to the group ending — the leader's role is to directly address termination and these reactions rather than avoiding the topic, consistent with Tuckman's 5-stage model (Forming → Storming → Norming → Performing → Adjourning)."},{"topic":"Angry patient during family therapy","vignette":"A family repeatedly blames their 'identified patient' (the child with the diagnosis) for all family conflict. The therapist instead asks, 'What part of the problem does each of you think you play?'","question":"What clinical purpose does this reframing technique serve?","options":["It reframes the presenting problem as a family system issue rather than one member's fault, reducing defensiveness and scapegoating","It is primarily used to identify which family member should be excluded from future sessions","It assigns blame more evenly but does not change the underlying family dynamic","It has no established clinical purpose and is discouraged in family therapy"],"correct":0,"rationale":"Reframing the presenting problem as a family system issue, not one member's fault, reduces defensiveness and scapegoating of the identified patient — which is often a driver of anger in session. This systemic reframe is a core family therapy technique."},{"topic":"Angry patient during family therapy","vignette":"A therapist is asked to summarize the correct order of priorities when a family member becomes angry and dysregulated mid-session.","question":"What is the correct priority sequence?","options":["De-escalate first, problem-solve second — do not try to process content while a family member is dysregulated","Neither de-escalation nor problem-solving should occur; the session should simply end","Problem-solve first to resolve the underlying issue, then de-escalate","Both should occur simultaneously regardless of the family member's regulation state"],"correct":0,"rationale":"The clinician's job when anger escalates is to de-escalate first, problem-solve second — attempting to process content or resolve the underlying conflict while a family member is still dysregulated is unlikely to be productive and can worsen safety."},{"topic":"Learning domains","vignette":"A nursing instructor asks students to match each of Bloom's three learning domains with its correct one-word description.","question":"Which matching is correct?","options":["All three domains describe the same underlying construct","Cognitive = feeling/valuing; Affective = doing; Psychomotor = knowing","Cognitive = doing; Affective = knowing; Psychomotor = feeling/valuing","Cognitive = knowing; Affective = feeling/valuing; Psychomotor = doing"],"correct":3,"rationale":"Cognitive = knowing (facts, concepts, intellectual understanding); Affective = feeling/valuing (attitudes, willingness to engage); Psychomotor = doing (physical skills, demonstrated competence). A teaching plan that only transmits facts without addressing attitudes or skill practice is incomplete — a classic patient-education exam point."},{"topic":"Learning domains","vignette":"A teaching plan for a new medication consists entirely of a handout listing side effects and dosing information, with no discussion of the family's concerns or any demonstration of administration technique.","question":"Which domains of Bloom's Taxonomy are missing from this plan?","options":["Only the psychomotor domain is missing; affective domain is not relevant to medication teaching","Only the cognitive domain is missing","Affective and psychomotor domains","No domains are missing; a handout addresses all three domains"],"correct":2,"rationale":"This plan addresses only the cognitive domain (facts about side effects/dosing). It is missing the affective domain (discussing the family's attitudes, concerns, willingness to give the medication) and the psychomotor domain (demonstrating and having the caregiver practice actual administration technique)."},{"topic":"NSSI","vignette":"A clinician is selecting a treatment approach for a 17-year-old with frequent NSSI driven by difficulty tolerating intense emotions.","question":"Which treatment has the strongest evidence base for NSSI, and why?","options":["Motivational interviewing as a standalone treatment","Trauma-Focused CBT as the only evidence-based option","Dialectical behavior therapy, largely because of its emotion-regulation and distress-tolerance skills modules","Family-Based Treatment (Maudsley model)"],"correct":2,"rationale":"Dialectical Behavior Therapy (DBT) has the strongest evidence base for NSSI, particularly its emotion-regulation and distress-tolerance skills modules. Safety planning, means restriction, and treating underlying mood/anxiety/trauma are also essential components of care."},{"topic":"NSSI","vignette":"A 13-year-old with an intellectual disability engages in repetitive head-banging as part of a broader pattern of stereotyped movements.","question":"How does this presentation relate to the DSM-5 proposed NSSI criteria?","options":["Stereotyped self-injury in neurodevelopmental disorders is diagnosed as a suicide attempt by default","This automatically meets full NSSI criteria regardless of the stereotypy pattern","In neurodevelopmental disorders, self-injury that is part of a stereotypy pattern does not meet proposed NSSI criteria","NSSI criteria exclude all patients with intellectual disability from consideration"],"correct":2,"rationale":"Per proposed NSSI Criterion F, the behavior does not occur exclusively during psychosis, delirium, or substance intoxication/withdrawal; in neurodevelopmental disorders, it is not counted if part of a stereotypy pattern, and is not better explained by another disorder (e.g., trichotillomania, excoriation disorder, stereotypic movement disorder)."},{"topic":"NSSI","vignette":"A patient engages in self-injury specifically after arguments with her boyfriend, stating it 'gets him to pay attention to me and take me seriously.'","question":"Which DSM-5 proposed NSSI expectation (Criterion B) does this reflect?","options":["This does not correspond to any Criterion B expectation","To obtain relief from a negative feeling/cognitive state only","To resolve an interpersonal difficulty","To induce a positive feeling state only"],"correct":2,"rationale":"Criterion B requires the behavior be done with at least one expectation: relief from a negative feeling/cognitive state, resolving an interpersonal difficulty, or inducing a positive feeling state. Using self-injury to influence a partner's attention/response reflects the interpersonal-difficulty-resolution expectation — less common than emotion regulation, but a recognized function."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 13-year-old girl has lost 18% of her body weight over 5 months through severe caloric restriction and compulsive exercise. She weighs herself 10 times a day and states she 'can still see fat' on her thighs despite a BMI of 15.2.","question":"Which DSM-5 criterion is illustrated by her belief that she 'can still see fat' despite being underweight?","options":["Disturbance in the way body weight/shape is experienced (Criterion C)","Persistent eating of nonnutritive substances (a Pica criterion)","Recurrent binge eating with loss of control (a bulimia criterion)","Restriction of energy intake leading to low body weight (Criterion A)"],"correct":0,"rationale":"Anorexia Criterion C covers disturbance in how body weight/shape is experienced, undue influence of weight/shape on self-evaluation, or persistent lack of recognition of the seriousness of low body weight — her perceptual distortion despite objective underweight status is a textbook example."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 19-year-old male eats a large pizza and a box of cookies within 45 minutes, feeling completely unable to stop, then immediately runs 6 miles and skips his next two meals. This pattern occurs about twice a week.","question":"Which combination of behaviors places this presentation in the bulimia nervosa category rather than binge-eating disorder?","options":["The binge occurs within a discrete 2-hour period","He reports a sense of loss of control during the binge","The binge is followed by compensatory behavior (excessive exercise, fasting) aimed at preventing weight gain","The episodes occur at least twice weekly"],"correct":2,"rationale":"Both BN and BED share loss-of-control binge eating within a discrete period, occurring at least weekly. What makes this bulimia rather than BED is the compensatory behavior — excessive exercise and fasting after the binge, specifically aimed at preventing weight gain."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A toddler with autism spectrum disorder has been eating small amounts of carpet fiber and drywall dust for the past 6 weeks. A blood lead level returns at 6 mcg/dL.","question":"Given this lead level, what is the recommended next step?","options":["Immediate inpatient psychiatric admission","Pediatric consultation, since the level exceeds the 4 mcg/dL threshold for referral","A trial of an SSRI to reduce the ingestion behavior","No further action is needed since this level is within normal limits"],"correct":1,"rationale":"For Pica, periodic blood lead testing is recommended given the toxicity risk from nonfood substances like paint, dust, or soil, with pediatric consultation recommended if levels exceed 4 mcg/dL — this child's level of 6 mcg/dL crosses that threshold."},{"topic":"ARFID s/sx","vignette":"A 6-year-old has eaten fewer than 10 total foods since birth, all of similar beige color and crunchy texture. He gags and cries when offered anything with a different texture, though his growth curve has stayed stable.","question":"Which of the three common ARFID presentations does this best represent?","options":["Fear-based avoidance following an aversive eating experience","Apparent lack of interest in eating/food","Sensory-based avoidance of food characteristics","Body-image-driven restriction"],"correct":2,"rationale":"Texture-driven food refusal without any history of a specific aversive event, and without a low appetite drive, points to the sensory-based avoidance subtype of ARFID — the second most common of the three subtypes."},{"topic":"ARFID s/sx","vignette":"A 7-year-old girl with newly diagnosed ARFID is found on labs to have iron-deficiency anemia and low vitamin D. Her growth chart shows a drop from the 50th to the 15th percentile for weight over the past year.","question":"Which DSM-5 ARFID Criterion A consequence is demonstrated by these lab findings?","options":["Significant nutritional deficiency","Marked interference with psychosocial functioning","Significant weight loss alone, without any nutritional deficiency","Dependence on enteral feeding or oral supplements"],"correct":0,"rationale":"ARFID Criterion A requires at least one of four functional consequences: significant weight loss/failure to grow, significant nutritional deficiency, dependence on enteral feeding/supplements, or marked psychosocial interference. Iron-deficiency anemia and low vitamin D directly demonstrate a significant nutritional deficiency."},{"topic":"Therapies for eating disorders","vignette":"A 14-year-old with a 6-month history of anorexia nervosa has a stable, engaged family willing to participate actively in her care.","question":"What treatment approach should be recommended first, and what is the parents' role in it?","options":["Individual CBT alone, with parents excluded from sessions","Immediate long-term inpatient admission regardless of medical stability","Family-Based Treatment (Maudsley model), with parents empowered to take charge of refeeding at home","Fluoxetine as first-line monotherapy before any psychotherapy is attempted"],"correct":2,"rationale":"Family-Based Treatment (the Maudsley model) has the strongest empirical support for adolescent anorexia nervosa, with parents empowered as part of the solution and placed in charge of refeeding at home — not blamed for causing the illness."},{"topic":"Therapies for eating disorders","vignette":"A hospitalized 15-year-old with severe anorexia nervosa is started on a refeeding protocol. The team deliberately limits initial caloric advancement and monitors phosphate closely.","question":"What complication is this cautious approach designed to prevent?","options":["Neuroleptic malignant syndrome","Refeeding syndrome","Alcohol withdrawal seizures","Serotonin syndrome"],"correct":1,"rationale":"Too-rapid refeeding in a severely malnourished patient risks refeeding syndrome, marked by dangerous electrolyte shifts (especially phosphate) — a key patient-safety consideration guiding gradual caloric advancement (roughly 1 lb/week outpatient, 2-3 lb/week inpatient)."},{"topic":"Enuresis vs Encopresis","vignette":"A 6-year-old boy has nighttime wetting episodes 4 times per week for the past 5 months, with no daytime accidents.","question":"Does this presentation meet DSM-5 criteria for enuresis, and which subtype applies?","options":["No — the frequency threshold of twice weekly has not been met","No — age 6 is below the minimum diagnostic age of 7","Yes — nocturnal-only enuresis, meeting both the age and frequency thresholds","Yes, but this should be classified as diurnal enuresis"],"correct":2,"rationale":"Enuresis requires age ≥5 years and frequency ≥2x/week for ≥3 consecutive months (or clinically significant distress). At age 6 with 4 nighttime episodes weekly for 5 months and no daytime accidents, this meets criteria for the nocturnal-only (monosymptomatic) subtype, the most common presentation."},{"topic":"Enuresis vs Encopresis","vignette":"A 5-year-old girl has soiled her underwear with normal-formed stool on 3 separate occasions over the past 4 months, always during arguments with her older brother. Physical exam and abdominal imaging show no evidence of constipation.","question":"Which encopresis specifier applies, and what association is commonly seen with this presentation?","options":["Without constipation and overflow incontinence — often associated with oppositional or deliberate soiling behavior","This does not meet diagnostic criteria because the stool is normal-formed","This requires an additional diagnosis of major depressive disorder before encopresis can be coded","With constipation and overflow incontinence — the most common subtype overall"],"correct":0,"rationale":"Encopresis without constipation and overflow incontinence ('functional nonretentive fecal incontinence') presents with normal-form stool and intermittent, often situational soiling, and is frequently associated with ODD/conduct disorder or deliberate soiling tied to family conflict."},{"topic":"Nocturnal enuresis treatment","vignette":"A 9-year-old with persistent nocturnal enuresis has already tried fluid restriction and voiding before bed without success. His parents want the treatment option with the best durable, long-term success rate.","question":"Which treatment should be recommended?","options":["Intranasal DDAVP as monotherapy","Oral DDAVP as monotherapy","The urine alarm ('bell and pad')","An anticholinergic medication"],"correct":2,"rationale":"The urine alarm is first-line for persistent nocturnal enuresis, with the highest success rate of behavioral options (~75% at 6 months, ~56% sustained at 12 months) — substantially better long-term durability than medication, which carries a high relapse rate on discontinuation."},{"topic":"Nocturnal enuresis treatment","vignette":"A family needs a short-term solution for their 11-year-old's bedwetting before a week-long summer camp, with no time to establish a urine alarm program beforehand.","question":"What is an appropriate short-term option, and what counseling point should accompany it?","options":["Oral DDAVP, with reassurance that relapse after discontinuation is rare","Oral DDAVP, with counseling that most children relapse once it is discontinued","Intranasal DDAVP, preferred for its lower hyponatremia risk compared with oral form","The urine alarm, since it works within 2-3 nights"],"correct":1,"rationale":"DDAVP can provide short-term help for situational needs like camp, but most children relapse when it is stopped. Oral form is preferred over intranasal spray due to a hyponatremia risk specific to the nasal spray formulation."},{"topic":"Encopresis treatment","vignette":"An 8-year-old with chronic constipation and fecal soiling is found to have a large palpable stool mass on exam, confirming the constipation/overflow subtype of encopresis.","question":"What is the correct treatment sequence?","options":["A behavioral toileting program alone, without addressing the impaction first","Weekly parent-administered enemas as an ongoing maintenance strategy","Initial bowel cleanout (PEG or enemas), then bowel retraining (stool softener, high-fiber diet, toileting routine) combined with a behavioral program","Immediate psychiatric referral before any medical management"],"correct":2,"rationale":"For constipation-type encopresis, treatment always begins with bowel cleanout (oral PEG or enemas), followed by bowel retraining (stool softener/mineral oil, high-fiber diet, regular toileting routine) combined with the behavioral program — behavioral measures alone will fail if impaction persists."},{"topic":"Encopresis treatment","vignette":"A 9-year-old without any constipation has been intentionally smearing stool during conflicts with his stepfather. Bowel exam and imaging are normal.","question":"What treatment approach is indicated?","options":["A daily suppository regimen","A high-fiber diet as the sole intervention","Bowel cleanout with PEG followed by mineral oil","Family behavioral treatment addressing the exacerbating family dynamics"],"correct":3,"rationale":"Encopresis without constipation, particularly when manipulative or deliberate, calls for family behavioral treatment addressing the underlying family dynamics driving the behavior — not the bowel-cleanout protocol reserved for the constipation/overflow subtype."},{"topic":"ODD vs CD vs IED","vignette":"An 11-year-old has an 8-month history of frequently losing his temper, arguing with his teachers, and deliberately annoying his younger sibling. He has never damaged property, stolen anything, or hurt another person or animal.","question":"Which diagnosis fits this pattern?","options":["Disruptive mood dysregulation disorder","Conduct disorder","Oppositional defiant disorder","Intermittent explosive disorder"],"correct":2,"rationale":"Angry/irritable mood, argumentative/defiant behavior, and vindictiveness lasting ≥6 months, without any violation of others' rights or major societal norms, is classic ODD. Conduct disorder requires more serious rights-violating behavior, which is absent here."},{"topic":"ODD vs CD vs IED","vignette":"A 13-year-old has, over the past year, broken into a neighbor's shed, deliberately set fire to a trash can, and been physically cruel to a stray cat. His first symptom (fire-setting at a friend's house) occurred at age 9.","question":"Which conduct disorder specifier applies, and what is its prognostic implication?","options":["Unspecified onset — no prognostic information can be inferred","Childhood-onset type — associated with a better long-term prognosis than adolescent-onset","Adolescent-onset type — associated with a better prognosis for remission","Childhood-onset type — associated with more physical aggression and higher risk of progressing to adult antisocial personality disorder"],"correct":3,"rationale":"Childhood-onset conduct disorder (≥1 symptom before age 10) carries a worse prognosis — more physical aggression and higher risk of progression to adult antisocial personality disorder — compared with adolescent-onset CD, which has a better prognosis for remission."},{"topic":"ODD vs CD vs IED","vignette":"A 10-year-old has had twice-weekly verbal outbursts and object-throwing (not directed at people) for the past 4 months, clearly disproportionate to minor frustrations, causing significant family distress.","question":"Does this presentation meet the minimum age requirement for intermittent explosive disorder?","options":["No — IED requires a minimum age of 10 years, which is not yet met","IED has no minimum age requirement","Yes — IED requires a minimum age of 6 years, which is met here","No — IED requires a minimum age of 12 years"],"correct":2,"rationale":"IED Criterion E requires chronological age ≥6 years (or equivalent developmental level). At age 10, this child meets the age threshold, and the twice-weekly verbal/non-destructive outbursts for 3+ months satisfy the frequency arm of Criterion A."},{"topic":"Meds for physically aggressive children","vignette":"A 14-year-old is acutely agitated and physically aggressive on an inpatient unit, with a suspected underlying psychotic process. The team needs a rapid-acting agent.","question":"Which class of medication is preferred for this scenario?","options":["A selective serotonin reuptake inhibitor for immediate sedation","Benzodiazepines as the default first-line choice","Haloperidol as the preferred first-line agent","Second-generation antipsychotics, particularly risperidone or olanzapine"],"correct":3,"rationale":"Second-generation antipsychotics — particularly risperidone and olanzapine — are preferred over haloperidol for acutely agitated youth, given comparable efficacy, rapid onset, sedative effect, rapidly-dissolving oral forms, and lower extrapyramidal side effects. Benzodiazepines are avoided by default due to paradoxical disinhibition risk."},{"topic":"Meds for physically aggressive children","vignette":"An 8-year-old with autism spectrum disorder has chronic, severe irritability and aggression unresponsive to behavioral interventions alone.","question":"Which medications carry FDA approval specifically for irritability/aggression associated with ASD?","options":["Lorazepam and clonazepam","Haloperidol and chlorpromazine","Risperidone and aripiprazole","Sertraline and fluoxetine"],"correct":2,"rationale":"For chronic/severe aggression associated with ASD or intellectual disability, risperidone and aripiprazole are the FDA-approved options for irritability/aggression, distinct from the acute-agitation preference for risperidone/olanzapine in general pediatric aggression."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 15-year-old was assaulted 3 weeks ago. She now has intrusive memories, avoidance of places resembling the assault site, dissociative episodes, and marked hyperarousal.","question":"Given this timeframe, which diagnosis is most appropriate right now?","options":["Adjustment disorder","Depersonalization/derealization disorder","Acute stress disorder","PTSD"],"correct":3,"rationale":"PTSD requires symptoms persisting beyond 1 month post-trauma; acute stress disorder covers 3 days to 1 month. At 3 weeks out, with qualifying Criterion-A trauma exposure and symptoms, this has now crossed into the PTSD timeframe."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 13-year-old describes recurring episodes of feeling detached from her own body, as if 'floating above and watching myself.' She recognizes these feelings are not literally real and has no identifiable trauma history.","question":"What feature of her presentation distinguishes it from a psychotic process?","options":["The presence of an identifiable trauma trigger","The presence of auditory hallucinations accompanying the episodes","Reality testing remains intact — she recognizes the experience is not literally real","Symptom persistence beyond 6 months"],"correct":2,"rationale":"Depersonalization/derealization disorder is defined by intact reality testing — the person knows the unreality feeling isn't literally true — distinguishing it from psychosis. Unlike PTSD/ASD, no specific Criterion-A trauma is required for this diagnosis."},{"topic":"Trauma therapy","vignette":"A 12-year-old with new-onset PTSD is referred for psychotherapy, without a specific treatment model requested by the referring provider.","question":"Which model is the safest, most defensible first-line choice absent further detail?","options":["Medication management as the primary intervention","Psychodynamic psychotherapy","Play therapy alone","Trauma-Focused CBT (TF-CBT)"],"correct":3,"rationale":"TF-CBT is the gold-standard trauma therapy with the strongest empirical support in youth. Psychotherapy is first-line for trauma-related presentations; medication remains adjunctive only."},{"topic":"Trauma therapy","vignette":"A therapist begins working with a traumatized 9-year-old by teaching diaphragmatic breathing and developing a family safety plan before any discussion of the traumatic event itself.","question":"What principle does this treatment sequencing reflect?","options":["Medication should be initiated before any psychotherapy begins","Trauma narrative work should always begin in the first session","Grounding/stabilization skills are taught before any trauma memory processing — safety and self-regulation come first","Family involvement should be delayed until stabilization is fully complete"],"correct":2,"rationale":"Across effective trauma therapy models, grounding/stabilization skills are taught before any trauma memory processing (narrative work, exposure) — safety and self-regulation always come first, regardless of the specific model used."},{"topic":"TF-CBT / PRACTICE","vignette":"A trainee is learning the 8 components of TF-CBT using the mnemonic taught in her program.","question":"Which mnemonic and component order is correct?","options":["TRAUMA: Triage, Rapport, Assessment, Understanding, Mastery, Aftercare","PRACTICE: Psychoeducation, Relaxation, Assessment, Cognitive processing, Trauma narrative, Imagery, Conjoint sessions, Evaluation","PROCESS: Psychoeducation, Relaxation, Ordering, Cognitive work, Exposure, Safety, Stabilization","PRACTICE: Psychoeducation/Parenting, Relaxation, Affective modulation, Cognitive processing, Trauma narrative, In-vivo mastery, Conjoint sessions, Enhancing safety"],"correct":3,"rationale":"PRACTICE is the core TF-CBT mnemonic: Psychoeducation and Parenting skills, Relaxation, Affective modulation, Cognitive processing/coping, Trauma narrative and processing, In-vivo mastery of trauma reminders, Conjoint child-parent sessions, Enhancing safety."},{"topic":"TF-CBT / PRACTICE","vignette":"A TF-CBT therapist has just finished teaching diaphragmatic breathing and progressive muscle relaxation to an 8-year-old survivor of a house fire, and has begun helping him name and rate the intensity of his fear and guilt.","question":"Which PRACTICE component is currently being addressed, and what comes immediately after it?","options":["Trauma narrative — beginning detailed exposure to the traumatic memory immediately","Enhancing safety — the final planning component","Cognitive processing/coping — identifying and correcting distorted trauma-related thoughts such as self-blame","Conjoint child-parent sessions — before any individual work is completed"],"correct":2,"rationale":"After Psychoeducation/Parenting, Relaxation, and Affective modulation, the next component is Cognitive processing/coping — identifying and correcting distorted trauma-related thoughts (e.g., self-blame) — which precedes the trauma narrative component."},{"topic":"Insomnia treatment","vignette":"An 8-year-old has nightly difficulty falling asleep without a parent present, resulting in daytime irritability and academic difficulty over the past 4 months.","question":"Before treating this as a standalone sleep disorder, what should be evaluated first?","options":["A benzodiazepine trial should be started immediately","This should be treated as a normal developmental variant requiring no evaluation","A sleep study should be ordered before any other evaluation","An underlying psychiatric cause (anxiety, ADHD, mood disorder, PTSD) or a substance such as caffeine or stimulant medication"],"correct":3,"rationale":"Before treating insomnia as standalone, an underlying psychiatric cause or substance should be screened for and addressed as the primary driver, rather than jumping directly to symptomatic insomnia treatment."},{"topic":"Insomnia treatment","vignette":"A 10-year-old continues to struggle with sleep onset despite two weeks of consistent bedtime routine, no screens after dinner, and a fixed wake time. His parents ask about a supplement they read about online.","question":"What is the best-supported short-term pharmacologic option for pediatric insomnia, and what is its regulatory status in children?","options":["Melatonin — no medication currently has FDA approval for pediatric insomnia","A benzodiazepine, which carries FDA approval for pediatric insomnia","A stimulant medication used off-label for sleep initiation","Diphenhydramine, which has strong evidence and FDA approval for chronic pediatric use"],"correct":0,"rationale":"Melatonin is the best-supported short-term pharmacologic option for pediatric insomnia, though no medication currently carries FDA approval for this indication in children. Sedative-hypnotics are not recommended for chronic use given paradoxical activation risk."},{"topic":"Nightmare treatment","vignette":"A 9-year-old has frequent, extremely dysphoric dreams involving threats to his safety. Upon waking, he becomes immediately oriented, alert, and is able to describe the dream in detail.","question":"What feature distinguishes this presentation from a sleep terror?","options":["Occurring in the first half of the sleep period rather than the second half","The child's age, since sleep terrors occur only in children under age 5","The presence of a detailed, well-remembered dream, which also occurs in sleep terrors","Rapid full orientation on waking — in sleep terrors, the child instead remains confused and unresponsive"],"correct":3,"rationale":"Rapid full orientation on waking distinguishes a nightmare from a sleep terror (an NREM parasomnia), where the child remains confused/unresponsive. Nightmares typically occur in the second half of the major sleep episode and are well-remembered."},{"topic":"Nightmare treatment","vignette":"A 14-year-old with PTSD has severe, nightly trauma-related nightmares unresponsive to imagery rehearsal therapy and relaxation training after an adequate trial.","question":"Which medication has the best-known targeted evidence for trauma-related nightmares in this scenario?","options":["Diphenhydramine","Prazosin, with monitoring of orthostatic blood pressure","Bupropion","A benzodiazepine"],"correct":1,"rationale":"Prazosin (an alpha-1 antagonist) has the best-known targeted evidence for trauma-related nightmares — started low, with monitoring of orthostatic blood pressure. No medication carries FDA approval for pediatric nightmares."},{"topic":"AUD s/sx and treatment","vignette":"A 16-year-old drinks heavily most weekends, has unsuccessfully tried to cut back twice, spends significant time recovering from hangovers before school, and continues drinking despite a recent alcohol-related car accident.","question":"How many of the 11 DSM-5 Criterion A symptoms must be present within 12 months to diagnose alcohol use disorder?","options":["At least 4 of 11","All 11","At least 1 of 11","At least 2 of 11"],"correct":3,"rationale":"AUD Criterion A requires ≥2 of 11 symptoms within a 12-month period, with severity then rated: mild = 2-3 criteria, moderate = 4-5, severe = ≥6."},{"topic":"AUD s/sx and treatment","vignette":"A family asks whether their 17-year-old with newly diagnosed alcohol use disorder should aim for moderation or complete abstinence.","question":"What is the recommended treatment goal for adolescent AUD?","options":["Abstinence, not 'controlled drinking'","Controlled drinking with a defined weekly limit","Abstinence is recommended only if a comorbid psychiatric diagnosis is present","No specific goal is recommended; the choice should be entirely patient-directed"],"correct":0,"rationale":"The treatment goal for adolescent AUD is abstinence, not controlled drinking. Medical detoxification is rarely necessary in adolescents, and treatment emphasizes group therapy, self-help programs, motivational interviewing, and family therapy."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A 17-year-old who has used cannabis daily for 9 months stops abruptly. Within a week she develops irritability, insomnia with disturbing dreams, decreased appetite, and abdominal discomfort.","question":"How many of the listed symptoms are required, and within what approximate timeframe, to diagnose cannabis withdrawal?","options":["All listed symptoms developing within approximately 2 weeks of cessation","At least 1 symptom developing within 24 hours of cessation","At least 5 symptoms developing within approximately 1 month of cessation","At least 3 symptoms developing within approximately 1 week of cessation"],"correct":3,"rationale":"Cannabis withdrawal requires ≥3 of the listed symptoms (irritability/anger/aggression, nervousness/anxiety, sleep difficulty, decreased appetite/weight loss, restlessness, depressed mood, or ≥1 physical symptom) developing within approximately 1 week after cessation of heavy, prolonged use."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A 16-year-old is 4 days into cannabis cessation with irritability and disrupted sleep. His mother asks the prescriber whether a specific medication can be started to directly treat the withdrawal.","question":"What is the correct answer regarding pharmacotherapy for cannabis withdrawal, and what is the recommended approach instead?","options":["Yes, naltrexone is FDA-approved specifically for cannabis withdrawal","No FDA-approved medication exists; treatment is primarily supportive care with symptom-targeted management","No medication or psychotherapy has any established role; withdrawal simply resolves untreated","Yes, buprenorphine is FDA-approved specifically for cannabis withdrawal"],"correct":1,"rationale":"No medication is FDA-approved for cannabis withdrawal. Treatment is primarily supportive care with symptom-targeted management, alongside standard SUD treatment (motivational interviewing, CBT, family therapy, contingency management)."},{"topic":"Motivational Interviewing","vignette":"A clinician trained in motivational interviewing consistently uses four core communication skills throughout sessions with an ambivalent adolescent patient.","question":"Which mnemonic and skill set describes these core MI communication skills?","options":["SMART: Specific, Measurable, Achievable, Realistic, Timed","CARE: Compassion, Acceptance, Reflection, Empathy","SOAP: Subjective, Objective, Assessment, Plan","OARS: Open-ended questions, Affirmations, Reflections, Summarizing"],"correct":3,"rationale":"OARS — Open-ended questions, Affirmations, Reflections, Summarizing — is the core communication toolkit of motivational interviewing."},{"topic":"Motivational Interviewing","vignette":"A patient tells his clinician he isn't sure vaping is really a problem. Rather than listing the health risks, the clinician asks him to describe what he likes about vaping and what, if anything, concerns him about it.","question":"What core MI philosophy does this approach reflect?","options":["The practitioner does not argue, persuade, or confront — resistance is 'rolled with,' and the patient voices their own reasons for change, reinforcing motivation more than being told","The practitioner should always directly confront ambivalence to accelerate change","MI is only effective when paired with direct advice-giving in every session","MI requires the practitioner to set the treatment goals on the patient's behalf"],"correct":0,"rationale":"MI's central philosophy is that the practitioner does not argue, persuade, or confront — resistance is 'rolled with,' and eliciting the patient's own change talk reinforces motivation more effectively than being told what to do, reflecting the 'evocation' element of the MI Spirit."},{"topic":"Change theory","vignette":"A 17-year-old with cannabis use disorder states, 'I don't see why this is even a problem — everyone I know uses.' She shows no interest in discussing any change.","question":"Which Transtheoretical Model stage best fits, and what is the clinician's primary task at this stage?","options":["Action — support and reinforce new behavior","Preparation — help build a concrete, specific plan","Contemplation — explore ambivalence and decisional balance","Precontemplation — raise awareness, avoid confrontation, express empathy"],"correct":3,"rationale":"This patient shows no awareness of a problem and no interest in change — classic Precontemplation. The clinician's task is to raise awareness while avoiding confrontation and expressing empathy, rather than pushing action-oriented language."},{"topic":"Change theory","vignette":"A patient tells his clinician, 'I know my drinking is becoming a problem, but I'm not sure I'm ready to actually stop. Part of me still doesn't want to give it up.'","question":"Which Transtheoretical Model stage does this reflect?","options":["Precontemplation","Contemplation","Maintenance","Preparation"],"correct":1,"rationale":"Awareness that a problem exists, paired with clear ambivalence and no firm commitment to change, is the hallmark of Contemplation. The clinician's task here is to explore that ambivalence and evoke reasons for/against change."},{"topic":"Children and foster care","vignette":"A 9-year-old has moved through 6 different foster placements in 3 years, despite each home being adequate, due to administrative delays and disrupted matches.","question":"What is the primary concern with this pattern, independent of the original maltreatment that led to placement?","options":["Repeated placement changes matter only if the child is under age 3","This pattern is protective because it exposes the child to varied caregiving styles","This pattern carries no additional impact beyond the original maltreatment","Multiple foster placement changes/disruptions is itself an independent risk factor for poorer psychiatric outcomes"],"correct":3,"rationale":"A child moved through a succession of foster placements — rather than rapid reunification or permanency — is a recognized risk for worse outcomes; repeated placement changes themselves become an added adverse experience, independent of the original maltreatment."},{"topic":"Children and foster care","vignette":"A 7-year-old was removed from her home due to severe neglect and placed with a loving foster family. The foster parents ask why their daughter has ongoing attachment difficulties despite feeling this new home is safe.","question":"What explains the elevated psychiatric risk seen in children adopted or fostered past infancy?","options":["Risk stems not just from loss of the primary attachment figure, but often from the neglect, abuse, and multiple caregiver changes that preceded placement","Foster care itself is the primary cause of all attachment difficulties, regardless of prior history","Risk is exclusively genetic and unrelated to placement history","Attachment difficulties in foster children are always permanent and unresponsive to new caregiving"],"correct":0,"rationale":"Children adopted or fostered past infancy are at higher risk for psychiatric problems because of what led to placement — not just loss of the primary attachment figure, but often neglect, abuse, and multiple caregiver changes. Many show attachment difficulties, though some form stable relationships with new caregivers."},{"topic":"Mandated reporter","vignette":"An NP has a reasonable suspicion, but not definitive proof, that a 7-year-old patient is being physically abused at home based on an inconsistent explanation for a bruising pattern.","question":"What is the legal threshold and obligation in this situation?","options":["The clinician must report — reasonable suspicion, not certainty, is the legal threshold, and reporting is a legal, not optional, obligation","Reporting is discretionary and left to the clinician's personal judgment","The clinician should wait until definitive proof is obtained before reporting","The clinician should first confront the parents directly instead of reporting"],"correct":0,"rationale":"Reasonable suspicion, not certainty, is the legal threshold for mandated reporting — the clinician does not need to prove abuse occurred before reporting. This is a legal, not optional, obligation in all states."},{"topic":"Mandated reporter","vignette":"An NP files a report for suspected abuse in good faith, but the subsequent investigation does not substantiate the allegation.","question":"What is the legal consequence for the NP in this scenario?","options":["The clinician's license is automatically reviewed following any unsubstantiated report","The clinician is immune from liability for reporting in good faith, even if the investigation does not substantiate abuse","The clinician must formally retract the report to avoid legal consequences","The clinician faces legal liability for filing an unsubstantiated report"],"correct":1,"rationale":"Clinicians acting in good faith are immune from liability for reporting, even if the investigation does not substantiate abuse. Legal penalties, by contrast, can be assessed for failing to report — this asymmetry is intentional."},{"topic":"Grief in children","vignette":"A teacher reports that an 8-year-old boy whose older brother died three weeks ago was laughing and playing tag at recess, only to burst into tears at his desk 20 minutes later when a classmate mentioned brothers.","question":"How should this pattern be interpreted?","options":["This is a concerning sign of emotional detachment requiring immediate evaluation","This is normal grief behavior — children's grief tends to be intermittent, not continuous, unlike adults' sustained mourning","This indicates the child does not understand that death is permanent","This suggests the child lacked a meaningful attachment to his brother"],"correct":1,"rationale":"Children's grief is intermittent, not continuous — a child who plays normally and then suddenly grieves intensely when reminded of the loss is showing normal, not concerning, grief behavior, unlike the sustained mourning more typical of adults."},{"topic":"Grief in children","vignette":"A 5-year-old girl tells her aunt that her mother died 'because I was bad and didn't listen to her that morning.'","question":"What is the most appropriate clinical response to this belief?","options":["Spontaneously reassure the child that he was not responsible — magical thinking in young children can lead them to believe they caused the death","Avoid discussing the death directly until the child is older","Explain the actual medical cause of death in detail to logically correct the belief","Allow the belief to persist without comment since children naturally outgrow it"],"correct":0,"rationale":"Magical thinking in young children can lead them to believe they caused a death — they are often too frightened or guilty to voice this belief and should be spontaneously reassured they were not responsible."},{"topic":"Group therapy techniques","vignette":"A teenager in a group for adolescents with anxiety says, 'I always thought I was the only one who checks the stove five times before leaving the house — knowing other people here do it too is such a relief.'","question":"Which of Yalom's therapeutic factors is being illustrated?","options":["Universality","Catharsis","Altruism","Imitative behavior"],"correct":0,"rationale":"Universality is the realization 'I am not alone' in one's struggles — exactly what this member describes upon hearing others share similar experiences, distinct from altruism (helping others) or catharsis (relief from expressing strong emotion)."},{"topic":"Group therapy techniques","vignette":"In the second week of a new adolescent process group, members glance frequently at the facilitator for cues on how to behave, say little about themselves, and seem visibly anxious about being judged by the others.","question":"Which stage of Tuckman's model of group development does this represent?","options":["Performing","Forming","Norming","Storming"],"correct":1,"rationale":"Forming (orientation) is characterized by members adapting to the group, seeking guidance/approval from the leader, limited self-disclosure, and possible anxiety — the earliest stage before the necessary friction of Storming emerges."},{"topic":"Angry patient during family therapy","vignette":"Before starting the first session with a family known to child protective services for repeated volatile arguments, the therapist opens by stating that everyone will get a turn to speak, no one will raise their voice, and no one will bring up what was said in session once they leave.","question":"What is the primary purpose of this intervention?","options":["Rule-setting should only occur after the first major conflict arises in session","Rule-setting at the very start of the first session is the single most important preventive intervention for managing anger/conflict — it establishes the clinician as being 'in charge' of the frame and protects safety","This step is optional and mainly serves a legal/liability purpose","This intervention is primarily meant to punish the family for prior behavior"],"correct":1,"rationale":"Setting clear rules at the start of every family session — especially with chaotic, high-conflict, or abusive families — establishes the clinician as being 'in charge' of the frame and protects safety. This is proactive, not reactive."},{"topic":"Angry patient during family therapy","vignette":"A mother begins raising her voice and cutting off her son mid-sentence during a session. The therapist softens her tone, slows her pace, and says, 'It sounds like this really matters to you — can we find a way to say it that he can actually hear?'","question":"What technique is the therapist using in this moment of escalating anger?","options":["Reflective statements that validate the emotion without validating the behavior, combined with lowering her own voice/pace rather than matching intensity","Matching the father's volume and intensity to demonstrate active engagement","Ignoring the outburst entirely and continuing with the planned agenda","Direct confrontation of the father's behavior to assert authority"],"correct":0,"rationale":"In the moment of escalating anger, the recommended approach is to name what's happening calmly, redirect to established rules, lower one's own voice/pace, and use reflective statements that validate the emotion without validating the behavior — exactly as illustrated here."},{"topic":"Learning domains","vignette":"After a psychoeducation session, a father can correctly list the core symptoms of separation anxiety disorder, but he continues to allow his son to skip school whenever he complains of stomachaches before drop-off.","question":"Which learning domain has been addressed, and which remains unaddressed?","options":["Cognitive domain addressed; affective and/or psychomotor domains remain unaddressed","Psychomotor domain addressed; cognitive domain remains unaddressed","Affective domain addressed; cognitive domain remains unaddressed","All three domains have already been fully addressed"],"correct":0,"rationale":"The cognitive domain covers acquiring knowledge and intellectual understanding — this parent can state facts about OCD, satisfying the cognitive domain. No behavior change (psychomotor) or attitude shift (affective) has yet occurred."},{"topic":"Learning domains","vignette":"A nurse practitioner has a mother physically practice, and correctly demonstrate back, a specific breathing technique to use with her anxious daughter during a panic episode, rather than only explaining the technique verbally.","question":"Which learning domain is targeted by having her physically demonstrate the technique?","options":["None of the three domains applies to skill demonstration","Psychomotor domain","Affective domain","Cognitive domain"],"correct":1,"rationale":"The psychomotor domain covers physical skills and hands-on ability to perform a task — a parent correctly demonstrating a de-escalation technique is a clear example of psychomotor-domain learning, distinct from knowing facts (cognitive) or expressing willingness (affective)."},{"topic":"NSSI","vignette":"A 16-year-old is found to have superficial cutting marks on her forearms. She reports she cuts to 'make the numbness go away' and explicitly denies any wish to die.","question":"What is the key distinguishing feature between NSSI and a suicide attempt?","options":["The specific body location of the injury","The use of a sharp object rather than another method","No intent to die — the goal is typically emotion regulation, not death","The presence of any physical scarring"],"correct":2,"rationale":"The key distinguishing feature from suicide attempts is no intent to die. The goal of NSSI is typically emotion regulation or, less commonly, interpersonal communication — not death."},{"topic":"NSSI","vignette":"A 15-year-old with a history of NSSI over the past year presents for an unrelated medical visit.","question":"What is the recommended clinical practice given her NSSI history?","options":["Risk assessment is only warranted if the patient specifically requests it","A thorough suicide risk assessment should be performed, since NSSI is a significant risk factor for future suicide attempts even though the acute intent differs","NSSI and suicide attempts should be documented and treated identically","No suicide risk assessment is needed since NSSI by definition excludes suicidal intent"],"correct":1,"rationale":"NSSI is a significant risk factor for future suicide attempts, even though the acute intent differs — every NSSI presentation requires a thorough suicide risk assessment, since the two behaviors are related but distinct."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 20-year-old woman binge eats roughly 3 times per week, feels intense guilt and disgust afterward, and eats alone due to embarrassment. She has never vomited, fasted, or exercised to compensate, and her BMI is 29.","question":"Which DSM-5 criterion set does this presentation most fully satisfy?","options":["Binge-eating disorder","ARFID","Anorexia nervosa, binge-eating/purging type","Bulimia nervosa"],"correct":0,"rationale":"Recurrent binge eating with guilt, disgust, and eating alone due to embarrassment, without any compensatory behavior, at an elevated BMI, matches binge-eating disorder — the absence of purging/fasting/excessive exercise is the key feature separating this from bulimia."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 12-year-old boy has restricted his diet to plain crackers and water since a severe choking episode 4 months ago. He has lost 9% of his body weight and now requires a nutritional supplement drink to meet basic caloric needs.","question":"Which diagnosis fits, and which ARFID subtype does the choking history represent?","options":["Anorexia nervosa, restricting type","ARFID, sensory-based avoidance subtype","ARFID, fear-based/aversive-experience subtype","Bulimia nervosa"],"correct":2,"rationale":"This is ARFID — restriction driven by a specific aversive/traumatic eating experience (choking), not by fear of weight gain or body-image concerns. Dependence on a nutritional supplement satisfies the functional-consequence requirement under Criterion A."},{"topic":"ARFID s/sx","vignette":"An 11-year-old with ARFID has been eating fewer than 8 foods for years. His pediatrician orders an upper GI series and stool studies to rule out reflux and malabsorption before proceeding with behavioral treatment.","question":"What is the purpose of this work-up?","options":["This work-up is unnecessary since ARFID is purely a behavioral diagnosis","To rule out a medical cause (malabsorption, GI reflux) that could fully explain the poor intake before attributing it to ARFID","To confirm a diagnosis of anorexia nervosa instead","ARFID always requires an endoscopy before diagnosis can be made"],"correct":1,"rationale":"ARFID must be differentiated from medical causes of poor intake such as malabsorption, GI reflux, or neoplasm. If the eating disturbance is fully explained by an identified medical condition, ARFID would not be the appropriate diagnosis — hence the work-up before finalizing the diagnosis."},{"topic":"ARFID s/sx","vignette":"A 9-year-old boy in an eating disorders clinic is compared with same-age patients with anorexia and bulimia. He is younger than most of the AN/BN patients, has a comorbid anxiety disorder, and his weight percentile falls between the typical AN and BN ranges.","question":"What does this comparison illustrate about ARFID patients as a group, relative to AN/BN patients in clinical samples?","options":["ARFID patients never have any nutritional or medical comorbidities","ARFID patients are typically older and have identical comorbidity rates to AN/BN patients","ARFID patients tend to be younger, more often male, and more likely to have comorbid anxiety or medical conditions than AN/BN patients","ARFID patients have the lowest weight percentile of the three groups"],"correct":2,"rationale":"Clinical-sample data show that compared with AN/BN, ARFID patients tend to be younger, more often male, and more likely to have comorbid medical or anxiety disorders, with a median weight percentile between that of AN and BN patients."},{"topic":"Therapies for eating disorders","vignette":"A 17-year-old with bulimia nervosa and a stable home environment begins outpatient treatment.","question":"Which psychotherapy has the strongest evidence base for her presentation?","options":["Cognitive-behavioral therapy","Play therapy","Psychodynamic therapy as first-line","Family-Based Treatment, identical to the anorexia protocol"],"correct":0,"rationale":"CBT is the most effective treatment for bulimia nervosa in adults and is generally the first-line psychotherapy; a manualized family-based approach also has evidence in adolescents, particularly for those from high-conflict families."},{"topic":"Therapies for eating disorders","vignette":"A prescriber is selecting an adjunctive medication for a 16-year-old with bulimia nervosa who has had a partial response to CBT alone.","question":"Which medication has the strongest pediatric evidence base for this indication?","options":["Lisdexamfetamine","Risperidone","Fluoxetine","Topiramate"],"correct":2,"rationale":"Fluoxetine, studied at doses up to 60 mg/day, has the best pharmacologic evidence among adolescents with bulimia nervosa — the one eating disorder medication with meaningful pediatric evidence."},{"topic":"Enuresis vs Encopresis","vignette":"A 4-year-old boy has been passing stool into his clothing about twice a month for the past 4 months, with a palpable stool mass noted on abdominal exam.","question":"Does this presentation meet the minimum age and frequency thresholds for an encopresis diagnosis?","options":["No — the frequency threshold requires at least weekly episodes","Yes — age 4 meets the minimum diagnostic age, and the frequency (≥1 event/month for ≥3 months) is met","Yes, but only if the child also meets criteria for enuresis","No — the minimum diagnostic age for encopresis is 5 years"],"correct":1,"rationale":"Encopresis requires age ≥4 years and ≥1 qualifying event per month for ≥3 months — both are met here. The palpable stool mass indicates the 'with constipation and overflow incontinence' subtype, accounting for roughly 80% of encopresis cases."},{"topic":"Enuresis vs Encopresis","vignette":"A 10-year-old boy who takes an anticholinergic medication for a bladder condition has recurrent nighttime wetting. His prescriber wonders whether this should be coded as primary enuresis.","question":"What must be established before diagnosing enuresis in this case?","options":["That the child has never previously achieved bladder control","That the child also has a diagnosed anxiety disorder","That the wetting is not attributable to the medication or another medical condition","That the wetting occurs exclusively during the day"],"correct":2,"rationale":"DSM-5 Criterion D for enuresis requires that the symptom is not attributable to the physiological effects of a substance (e.g., a diuretic or antipsychotic) or another medical condition — this must be ruled out before diagnosing enuresis, particularly when a relevant medication is already in use."},{"topic":"Nocturnal enuresis treatment","vignette":"A 6-year-old still wets the bed most nights. His parents haven't tried anything yet and are considering buying a bedwetting alarm system online before their upcoming appointment.","question":"What should be recommended as the initial approach before any device or medication, given his age?","options":["Minimize shame/punishment while awaiting spontaneous maturation, restrict evening fluids, eliminate caffeine, and void at bedtime","Start DDAVP at the lowest available dose","Refer immediately for urologic imaging","Begin the urine alarm immediately regardless of age or motivation"],"correct":0,"rationale":"For young children, the first step is behavioral and supportive: minimizing shame/punishment while awaiting spontaneous maturation, restricting evening fluids, eliminating caffeine, voiding at bedtime, and having the child help change their own bed to reduce negative parental reactions."},{"topic":"Nocturnal enuresis treatment","vignette":"A 12-year-old is motivated to actively participate in resolving his bedwetting. His clinician recommends a reward system alongside exercises to increase bladder capacity.","question":"What combination of interventions is being described?","options":["DDAVP started immediately without any behavioral component","Psychotherapy alone as the primary intervention","A star chart/reward system combined with bladder training (delayed voiding practice, stream interruption)","Overnight catheterization"],"correct":2,"rationale":"For motivated older children, a star chart/reward monitoring system combined with daytime continence work — bladder training exercises, delayed voiding practice to increase bladder capacity, and stream interruption to strengthen sphincter awareness — is an appropriate step before or alongside the urine alarm."},{"topic":"Encopresis treatment","vignette":"A family has been administering daily enemas to their child at home for 6 weeks to manage encopresis, with increasing household tension and limited improvement.","question":"What guidance should be given regarding this approach?","options":["The frequency of enemas should be increased until soiling fully resolves","Repeated parent-administered enemas are discouraged because they are harmful to the parent-child relationship","Enemas are appropriate only for children under 4 and should be discontinued in this case","Daily home enemas should continue indefinitely as the standard maintenance approach"],"correct":1,"rationale":"Repeated parent-administered enemas are specifically discouraged in encopresis management due to their harmful effect on the parent-child relationship — bowel cleanout is meant to be a brief initial step, not an ongoing home regimen."},{"topic":"Encopresis treatment","vignette":"A 6-year-old with encopresis without constipation is starting a behavior-shaping program with his family.","question":"How should the reward structure of this program be organized?","options":["Rewards only for a fully clean week, with no partial credit given","No behavioral component is used for this subtype; medication is the mainstay","Rewards first for sitting on the toilet, then for successful bowel movements","Punishment for soiling episodes combined with rewards for full compliance"],"correct":2,"rationale":"The behavior-shaping program for encopresis without constipation provides rewards first for sitting on the toilet, then for successful bowel movements — a stepwise shaping approach rather than an all-or-nothing or punitive structure."},{"topic":"ODD vs CD vs IED","vignette":"A 12-year-old has had 3 outbursts this year involving punching a hole in a wall and shoving a peer hard enough to cause bruising. Each outburst was sudden and grossly disproportionate to a minor trigger, such as losing a video game.","question":"Which diagnosis and criterion pathway best fits?","options":["IED cannot be diagnosed because the outbursts occurred less than twice weekly","Oppositional defiant disorder — vindictiveness criterion","Conduct disorder — this falls under the aggression-to-people/animals category","Intermittent explosive disorder — 3 outbursts involving property damage or injurious assault within 12 months"],"correct":3,"rationale":"IED Criterion A can be satisfied either by twice-weekly non-destructive outbursts for 3 months, or by 3 outbursts within 12 months involving property damage or injurious physical assault — the impulsive, disproportionate nature further supports IED over conduct disorder."},{"topic":"ODD vs CD vs IED","vignette":"A 15-year-old has bullied peers, forced a classmate into unwanted physical contact, and repeatedly stayed out overnight without permission, with symptom onset beginning at age 14.","question":"Which diagnosis applies, and which DSM-5 category covers the forced physical contact?","options":["Oppositional defiant disorder — 'Vindictiveness' category","Conduct disorder — 'Serious Rule Violations' category","Conduct disorder — 'Aggression to People/Animals' category","Intermittent explosive disorder — Criterion A(1)"],"correct":2,"rationale":"Conduct disorder requires ≥3 of 15 behaviors across 4 categories within 12 months. Forcing someone into unwanted physical contact falls under 'Aggression to People/Animals'; staying out overnight without permission falls under 'Serious Rule Violations.' With onset at age 14 (after age 10), this would be specified as adolescent-onset."},{"topic":"Meds for physically aggressive children","vignette":"A resident considers prescribing a benzodiazepine as the first-line agent for a physically aggressive, non-psychotic 9-year-old in the emergency department.","question":"Why is this generally avoided as a default choice?","options":["Benzodiazepines are absolutely contraindicated in all pediatric patients","Benzodiazepines require IV access, which limits their use in this scenario","Benzodiazepines have no sedative properties in the pediatric population","Benzodiazepines can cause paradoxical disinhibition and worsen agitation in children"],"correct":3,"rationale":"Benzodiazepines should be avoided as a default choice for pediatric aggression because they can cause paradoxical disinhibition and worsen agitation — second-generation antipsychotics are generally preferred for acute agitation instead."},{"topic":"Meds for physically aggressive children","vignette":"A 10-year-old with newly treated ADHD (stimulant medication started 3 weeks ago) shows substantially reduced aggression at school, without any antiaggression medication being added.","question":"What principle does this improvement best illustrate?","options":["Stimulant medications are the first-line antiaggression treatment for all pediatric aggression","All pediatric aggression should be treated with an antipsychotic regardless of etiology","If aggression is secondary to a treatable comorbidity, treating that condition often reduces aggression more effectively than an antiaggression medication alone","This improvement is unrelated to the ADHD treatment and is likely coincidental"],"correct":2,"rationale":"The first step in managing pediatric aggression is identifying and addressing the underlying cause. When aggression is secondary to a treatable comorbidity like ADHD, treating that condition is often more effective than adding an antiaggression medication."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 13-year-old's parents separated 7 weeks ago. He has since developed irritability, poor concentration, and tearfulness clearly out of proportion to what would typically be expected, without meeting criteria for any other DSM-5 disorder.","question":"Which diagnosis fits, and what type of stressor does it require?","options":["Adjustment disorder cannot be diagnosed unless the stressor is life-threatening","Acute stress disorder — the separation meets Criterion A trauma exposure","PTSD — the parental separation meets Criterion A trauma exposure","Adjustment disorder — can follow any identifiable stressor, not necessarily life-threatening"],"correct":3,"rationale":"Adjustment disorder requires only an identifiable stressor of any severity (divorce, a move, a bad grade) — unlike PTSD/ASD, which require Criterion-A trauma (actual/threatened death, serious injury, or sexual violence). Onset is within 3 months of the stressor."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A clinician is deciding between adjustment disorder and PTSD for a 16-year-old who witnessed a violent assault 6 weeks ago and now meets full PTSD criteria.","question":"Which diagnosis takes precedence, and why?","options":["Neither diagnosis applies because 6 weeks exceeds the adjustment disorder window","Adjustment disorder — it is always diagnosed first as the less severe option","PTSD — when full criteria for PTSD or another specific disorder are met, that diagnosis takes precedence over adjustment disorder","Both diagnoses should be assigned simultaneously"],"correct":2,"rationale":"Per Adjustment Disorder Criterion C, when full criteria for PTSD or another specific disorder are met, that diagnosis takes precedence — adjustment disorder functions as a diagnosis of exclusion for a stress reaction not meeting criteria for a more specific disorder."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 17-year-old reports recurrent, extensive gaps in memory for periods of significant childhood abuse, well beyond what would be explained by ordinary forgetfulness. She shows no evidence of distinct personality states.","question":"Which dissociative disorder best fits this presentation?","options":["Depersonalization/derealization disorder","Acute stress disorder","Dissociative identity disorder","Dissociative amnesia"],"correct":3,"rationale":"Dissociative amnesia involves an inability to recall important autobiographical information, usually traumatic or stressful, that is too extensive to be ordinary forgetfulness — distinct from dissociative identity disorder (requires ≥2 distinct personality states) and depersonalization/derealization disorder (unreality/detachment with intact reality testing)."},{"topic":"Trauma therapy","vignette":"A school-based counseling program is designed to deliver group trauma treatment to several students exposed to a shooting near their school.","question":"Which trauma therapy model is specifically designed for this school-based group format?","options":["Child-Parent Psychotherapy","Narrative Exposure Therapy/KidNET","CBITS (Cognitive Behavioral Intervention for Trauma in Schools)","Seeking Safety"],"correct":2,"rationale":"CBITS is school-based group TF-CBT, designed for exactly this scenario. Child-Parent Psychotherapy targets young children and their caregiver dyad; Seeking Safety addresses co-occurring PTSD and substance use; NET/KidNET targets war/refugee trauma."},{"topic":"Trauma therapy","vignette":"A treatment program for traumatized children routinely screens the accompanying parent for their own trauma symptoms before initiating the child's treatment.","question":"What principle does this practice reflect?","options":["Caregiver screening is unique to one specific trauma model and not used broadly","Only the child's symptoms should ever be formally assessed in pediatric trauma care","Caregiver trauma symptoms are irrelevant to a child's treatment outcome","Family/caregiver involvement and screening/treating the caregiver's own trauma symptoms are consistent features across effective trauma therapy models"],"correct":3,"rationale":"Family/caregiver involvement and screening/treating the caregiver's own trauma symptoms is a consistent feature across effective pediatric trauma therapy models generally, since caregiver functioning significantly affects a child's recovery trajectory."},{"topic":"TF-CBT / PRACTICE","vignette":"A child has completed a detailed account of his traumatic experience in TF-CBT. His therapist now plans a session where he shares his progress and narrative directly with his mother in a supported setting.","question":"Which PRACTICE component is being implemented?","options":["Relaxation","In-vivo mastery of trauma reminders","Conjoint child-parent sessions","Psychoeducation and parenting skills"],"correct":2,"rationale":"Conjoint child-parent sessions are where the child shares progress/narrative with the caregiver in a supported setting — reflecting TF-CBT's explicit inclusion of the caregiver, not just the child, as a distinguishing feature of the model."},{"topic":"TF-CBT / PRACTICE","vignette":"A therapist explains to a worried family why TF-CBT does not begin with a detailed discussion of the traumatic event, despite that being the family's main concern.","question":"What is the correct explanation for this sequencing?","options":["The trauma narrative is optional and rarely used in TF-CBT","Conjoint sessions must occur before any individual skill-building begins","TF-CBT does not include a trauma narrative component at all","The stabilization/coping-skills components always come before trauma narrative work — trauma processing is never the starting point"],"correct":3,"rationale":"In TF-CBT, the stabilization/coping-skills components (Psychoeducation/Parenting, Relaxation, Affective modulation, Cognitive processing) always come before trauma narrative work, ensuring adequate coping skills exist before engaging with the traumatic memory."},{"topic":"TF-CBT / PRACTICE","vignette":"A child in TF-CBT has completed her trauma narrative and is now practicing calmly approaching a safe reminder of the trauma — a similar vehicle to the one involved in her accident — that she had been avoiding.","question":"Which PRACTICE component does this represent?","options":["Cognitive processing/coping","Enhancing safety","In-vivo mastery of trauma reminders","Affective modulation"],"correct":2,"rationale":"In-vivo mastery of trauma reminders involves real-world graded exposure to safe trauma reminders that are being avoided, distinct from the trauma narrative itself, which is the therapist-supported development of a detailed account of the traumatic event."},{"topic":"Insomnia treatment","vignette":"A 9-year-old has trouble falling asleep 4 nights weekly for the past 2 months, with mild daytime tiredness but no major functional impairment.","question":"Does this presentation meet full DSM-5 criteria for insomnia disorder?","options":["Yes, because any pediatric sleep difficulty automatically qualifies for the diagnosis","No — the frequency threshold of at least 3 nights weekly has not been met","Yes — all diagnostic criteria are clearly met","No — the duration threshold of at least 3 months has not yet been reached"],"correct":3,"rationale":"Insomnia Disorder requires occurrence ≥3 nights/week (met here) AND presence for ≥3 months (not yet met at 2 months) — the duration threshold separates a diagnosable disorder from a shorter period of difficulty."},{"topic":"Insomnia treatment","vignette":"A family asks what the recommended first step should be for their school-age child's new difficulty falling asleep, before any medication is considered.","question":"What is first-line management for pediatric insomnia across all ages?","options":["Behavioral/sleep hygiene measures — a consistent bedtime routine, using the bed only for sleep, a regular schedule, removing electronics, and avoiding naps/caffeine","A trial of a sedative-hypnotic medication","Melatonin as the very first step, before any behavioral changes are attempted","Referral for polysomnography before any behavioral intervention"],"correct":0,"rationale":"First-line management (all ages) for pediatric insomnia is behavioral/sleep hygiene: a consistent bedtime routine, using the bed only for sleep, a regular sleep-wake schedule, removing electronics, avoiding naps/caffeine, and a transitional object or night-light for younger children."},{"topic":"Nightmare treatment","vignette":"A family asks what the first step in managing their 7-year-old's frequent nightmares should be, before any medication is considered.","question":"What is the first-line behavioral/psychotherapeutic approach?","options":["A sedative-hypnotic to suppress dreaming","No intervention is warranted for pediatric nightmares","Prazosin as the initial step regardless of severity","Reassurance, normalizing the sleep schedule, relaxation/imagery, imagery rehearsal therapy, and systematic desensitization/dream reorganization"],"correct":3,"rationale":"First-line nightmare treatment is behavioral/psychotherapeutic: reassurance, normalizing the sleep schedule, relaxation/imagery, imagery rehearsal therapy, and systematic desensitization/dream reorganization — medication is reserved for significant, persistent, function-impairing cases."},{"topic":"Nightmare treatment","vignette":"A 15-year-old's nightmares are recognized as a core symptom of her underlying PTSD, occurring nearly every night.","question":"What should be prioritized as the primary intervention?","options":["Prazosin as monotherapy without addressing the PTSD","Treating the underlying PTSD, usually with TF-CBT, as the primary intervention","No treatment, since PTSD-related nightmares are expected to resolve without intervention","A nightly benzodiazepine for sleep suppression"],"correct":1,"rationale":"When nightmares are a symptom of PTSD, treating the underlying PTSD (usually with TF-CBT) is the primary intervention — nightmare-specific treatments like prazosin or imagery rehearsal are adjuncts, not replacements, for treating the root trauma-related disorder."},{"topic":"AUD s/sx and treatment","vignette":"An 18-year-old college freshman who has been drinking heavily nearly every day stops suddenly after being hospitalized for an unrelated injury. Within 12 hours, nursing notes describe diaphoresis, a resting heart rate of 118, hand tremor, and brief episodes of seeing shadows moving in the corner of the room.","question":"Which condition is this, and how many associated symptoms are required for diagnosis?","options":["Delirium tremens is the only possible diagnosis at this early stage","This does not meet criteria for any DSM-5 alcohol-related diagnosis","Alcohol use disorder — this represents Criterion A symptom #10 alone","Alcohol withdrawal — at least 2 of the listed symptoms (autonomic hyperactivity, tremor, insomnia, nausea/vomiting, transient hallucinations/illusions, psychomotor agitation, anxiety, seizures)"],"correct":3,"rationale":"Alcohol withdrawal requires ≥2 of the listed symptoms, developing within hours to days of cessation/reduction after heavy, prolonged use — met here with tremor, sweating/tachycardia (autonomic hyperactivity), and transient hallucinations/illusions."},{"topic":"AUD s/sx and treatment","vignette":"A 16-year-old boy whose father and paternal grandfather both struggled with alcoholism asks his NP whether his family history actually increases his own risk, or if it's 'just something that happens in some families by chance.'","question":"What should the NP explain about the genetic contribution to alcoholism risk based on family history?","options":["The genetic contribution to family history of alcoholism is strongest in males","Genetics play no meaningful role in adolescent alcohol use disorder risk","Family history is only a risk factor if both parents have AUD","The genetic contribution is equally strong regardless of the affected parent's sex"],"correct":0,"rationale":"A family history of alcoholism is a recognized risk factor for adolescent alcohol use, and the genetic contribution to that risk is described as strongest in males, alongside other markers like comorbid ADHD/ODD/CD and earlier-onset substance use."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A patient who uses cannabis occasionally, about once monthly, with no diagnosed cannabis use disorder, is being evaluated for possible cannabis withdrawal after a brief period of abstinence.","question":"Can cannabis withdrawal be diagnosed in this patient?","options":["No — cannabis withdrawal is not a recognized DSM-5 diagnosis","Yes, but only if the patient also has a mild cannabis use disorder","Yes — withdrawal can be diagnosed regardless of use pattern or disorder severity","No — cannabis withdrawal can only be diagnosed in the presence of a moderate or severe cannabis use disorder"],"correct":3,"rationale":"Cannabis withdrawal can only be diagnosed in the presence of a moderate or severe cannabis use disorder — occasional, non-disordered use does not meet the heavy, prolonged use pattern required for a withdrawal diagnosis."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A 17-year-old in treatment for cannabis use disorder admits that he frequently resumes use specifically because it relieves his irritability and sleep difficulty.","question":"What treatment-planning point does this illustrate?","options":["This pattern indicates he does not actually have a cannabis use disorder","Many adolescents use cannabis or another substance specifically to relieve withdrawal symptoms — an important relapse driver to address in treat
