er diet to minimize stool bulk","A stool softener or mineral oil, a high-fiber diet, a regular toileting routine, and a mild suppository if needed","Weekly enemas administered by the parent indefinitely"],"correct":2,"rationale":"Bowel retraining after initial cleanout includes a stool softener or mineral oil, a high-fiber diet, a regular toileting routine, and a mild suppository if needed — all combined with the behavioral program, not a cessation of care."},{"topic":"ODD vs CD vs IED","vignette":"A clinician is comparing three disruptive behavior presentations: one involving persistent oppositional arguing without rights violations, one involving serious rights-violating behavior like theft and cruelty, and one involving impulsive anger-based outbursts grossly out of proportion to the trigger.","question":"Which disorder corresponds to each description, in order?","options":["ODD, IED, Conduct Disorder","IED, ODD, Conduct Disorder","Conduct Disorder, ODD, IED","ODD, Conduct Disorder, IED"],"correct":3,"rationale":"ODD involves oppositional, argumentative behavior without rights violations; Conduct Disorder involves serious violations of others' rights or major societal norms (theft, cruelty, weapons); IED involves impulsive, anger-based aggression grossly out of proportion to the trigger, never premeditated or goal-directed."},{"topic":"ODD vs CD vs IED","vignette":"A 9-year-old with ADHD and ODD is found to also have impulsive aggressive outbursts that occur far more frequently and severely than what is typically seen in either of his existing diagnoses, causing significant distress.","question":"Can intermittent explosive disorder be diagnosed in addition to his existing diagnoses?","options":["Yes, but only if the child is older than 12","No — a diagnosis of ADHD automatically excludes any additional impulse-control diagnosis","Yes — IED can be diagnosed alongside ADHD, CD, ODD, or ASD when the aggressive outbursts exceed what is typical for those conditions and warrant independent attention","No — IED can only be diagnosed in the absence of any other psychiatric condition"],"correct":2,"rationale":"IED can be diagnosed in addition to ADHD, CD, ODD, or ASD when the impulsive aggressive outbursts exceed what's typically seen in those disorders and warrant independent clinical attention — it is not automatically subsumed under a comorbid diagnosis."},{"topic":"Meds for physically aggressive children","vignette":"A 15-year-old with longstanding conduct disorder and no psychotic symptoms continues to show frequent aggressive behavior despite six months of multisystemic family therapy. His mother asks whether a medication could simply 'fix the aggression.'","question":"What is the appropriate approach to medication in this scenario?","options":["Medication is entirely contraindicated in conduct disorder","Stimulant medication should be started regardless of whether ADHD is present","A second-generation antipsychotic should be initiated immediately as first-line monotherapy","Evidence for medication in chronic CD-related aggression without psychosis is weak; behavioral, family, and multisystemic interventions remain the mainstay, with medication reserved for comorbid conditions"],"correct":3,"rationale":"For chronic conduct-disorder-related aggression without psychosis, medication evidence is weak; behavioral, family, and multisystemic interventions remain the mainstay, with medication reserved for treating comorbid conditions (ADHD, mood, anxiety) rather than the aggression itself."},{"topic":"Meds for physically aggressive children","vignette":"A previously calm 10-year-old suddenly becomes aggressive, disoriented, and combative in the emergency department. The team orders basic labs and a toxicology screen before proceeding further.","question":"What principle is guiding this initial work-up?","options":["Sudden-onset aggression in children is always primarily psychiatric","Medical causes only need consideration if there is a prior psychiatric history","Always rule out a medical/organic or substance-related cause of sudden aggression before treating it as purely psychiatric","Toxicology screening is not indicated in pediatric aggression work-ups"],"correct":2,"rationale":"Before treating sudden pediatric aggression as purely psychiatric, medical/organic causes and substance intoxication/withdrawal must be ruled out — a foundational safety step given the broad differential for out-of-control behavior."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"Four adolescents present at a clinic: one 2 weeks after a life-threatening trauma, one 5 weeks after a life-threatening trauma, one with recurrent unreality episodes and no trauma history, and one 8 weeks after a stressful but non-life-threatening family move.","question":"Which diagnostic assignment correctly matches each timeframe and trigger?","options":["Adjustment disorder always requires more than 6 months to become diagnosable","All four presentations require an identical Criterion-A trauma exposure","PTSD (2 weeks), acute stress disorder (5 weeks), both requiring the same life-threatening trauma type","Acute stress disorder (2 weeks), PTSD (5 weeks), a dissociative disorder (no trauma required), adjustment disorder (any stressor, within 3 months)"],"correct":3,"rationale":"Acute stress disorder spans 3 days to 1 month post-trauma; PTSD requires >1 month; both require Criterion-A trauma exposure. Dissociative disorders require no specific trauma type. Adjustment disorder requires only an identifiable stressor of any severity, with onset within 3 months of the stressor."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 16-year-old reports persistent episodes where his surroundings feel 'foggy and unreal,' as though he is viewing the world through glass, occurring several times weekly for the past 4 months. He denies any identifiable trauma and remains fully aware the sensation isn't literally true.","question":"What best describes the stressor requirement for his likely diagnosis compared with PTSD or acute stress disorder?","options":["This diagnosis cannot be made without an identifiable precipitating event of some kind","This diagnosis requires the same Criterion-A trauma exposure as PTSD and ASD","Dissociative disorders like this one do not require a specific stressor type, unlike PTSD/ASD, which require Criterion-A-level trauma","This diagnosis requires a stressor of any severity, exactly like adjustment disorder"],"correct":2,"rationale":"Depersonalization/derealization disorder does not require a specific stressor type at all, unlike PTSD/ASD (which require Criterion-A-level trauma) or adjustment disorder (which requires an identifiable stressor of any severity) — it can occur with or without an identifiable trigger."},{"topic":"Trauma therapy","vignette":"A refugee adolescent with a history of war-zone violence exposure is referred for trauma-focused treatment.","question":"Which model was specifically developed for populations with this type of trauma history?","options":["EMDR only","Seeking Safety","CBITS","Narrative Exposure Therapy / KidNET"],"correct":3,"rationale":"Narrative Exposure Therapy (and its child-adapted version, KidNET) was specifically developed for war/refugee trauma populations, using a structured lifeline narrative approach — CBITS is school-based, and Seeking Safety targets co-occurring substance use."},{"topic":"Trauma therapy","vignette":"A 16-year-old with PTSD and a co-occurring substance use disorder is being referred for trauma-focused treatment.","question":"Which model was specifically designed to address PTSD alongside substance use?","options":["Child-Parent Psychotherapy","Trauma Systems Therapy","Seeking Safety","CBITS"],"correct":2,"rationale":"Seeking Safety is the trauma therapy model specifically designed for PTSD co-occurring with substance use, addressing both simultaneously rather than sequentially."},{"topic":"TF-CBT / PRACTICE","vignette":"A TF-CBT program is nearing the end of treatment, working with a family to develop a written plan for handling future triggers and reinforcing the skills learned throughout treatment.","question":"Which final PRACTICE component does this represent?","options":["Psychoeducation and parenting skills","Relaxation","Trauma narrative and processing","Enhancing safety"],"correct":3,"rationale":"Enhancing safety — safety planning and future skills for the child and family — is the final PRACTICE component, typically addressed as treatment nears completion, building on the preceding stabilization and processing work."},{"topic":"TF-CBT / PRACTICE","vignette":"A clinician describes a key feature of TF-CBT that sets it apart from many purely individual child trauma therapies: it includes structured components specifically involving the parent, not just the child.","question":"Which two PRACTICE components most directly reflect this caregiver-inclusive design?","options":["Trauma narrative and Enhancing safety","Relaxation and Affective modulation","Psychoeducation/Parenting and Conjoint child-parent sessions","Cognitive processing and In-vivo mastery"],"correct":2,"rationale":"TF-CBT is explicitly designed to include the caregiver — the Psychoeducation/Parenting component (parenting strategies to support the child) and the Conjoint child-parent sessions component (sharing progress/narrative with the caregiver) are the two elements most directly reflecting this distinguishing, caregiver-inclusive design."},{"topic":"Insomnia treatment","vignette":"A 16-year-old with PTSD reports that trauma-related nightmares are the primary driver of her ongoing difficulty sleeping.","question":"What should be prioritized in her treatment plan?","options":["Treating insomnia and PTSD as entirely separate, unrelated conditions","Melatonin alone, without addressing the PTSD","Starting a benzodiazepine immediately for symptomatic relief before addressing PTSD","Treating the underlying PTSD, with consideration of prazosin if nightmares specifically are driving the insomnia"],"correct":3,"rationale":"When insomnia is trauma-related, treating the underlying PTSD is the priority; if nightmares specifically drive the insomnia, prazosin should be considered as a targeted adjunct rather than treating the sleep symptom in isolation."},{"topic":"Insomnia treatment","vignette":"A prescriber is asked why a prescription hypnotic would be an unusual first-choice medication for a child's chronic sleep-onset difficulty.","question":"What is the correct clinical reasoning for this caution?","options":["Prescription hypnotics are the preferred first-line treatment for children under age 10","Behavioral measures should only be attempted after medication has failed","Behavioral measures plus melatonin are the preferred approach; prescription hypnotics/benzodiazepines are rarely appropriate as first-line in pediatric insomnia given lack of FDA approval and paradoxical activation risk","Sedative-hypnotics carry no risk of paradoxical reaction in children"],"correct":2,"rationale":"Behavioral measures plus melatonin represent the preferred pediatric insomnia approach, while a prescription hypnotic or benzodiazepine as first-line is generally avoided given the lack of FDA approval for pediatric insomnia and the risk of paradoxical activation."},{"topic":"Nightmare treatment","vignette":"A clinician documents that an 8-year-old's nightmares occur 2 to 3 times weekly but not nightly.","question":"How would this frequency be classified under DSM-5 severity specifiers for nightmare disorder?","options":["This frequency does not correspond to any severity specifier","Severe — occurring nightly","Mild — less than 1 episode per week","Moderate — at least 1 episode per week but less than nightly"],"correct":3,"rationale":"Nightmare disorder severity is rated by frequency: mild = <1 episode/week; moderate = ≥1/week but <nightly; severe = nightly. At 2-3 times weekly, this falls into the moderate category."},{"topic":"Nightmare treatment","vignette":"A prescriber is considering off-label adjunctive options for a teenager with hyperarousal-related nightmares, in addition to low-dose trazodone for sleep.","question":"Which additional agents are recognized off-label/adjunctive options for hyperarousal and nightmares?","options":["Clonidine and guanfacine","Fluoxetine and sertraline","Lithium and valproate","Risperidone and aripiprazole"],"correct":0,"rationale":"Clonidine and guanfacine are recognized off-label/adjunctive agents for hyperarousal/nightmares, alongside low-dose trazodone for sleep — prazosin remains the agent with the best-known targeted nightmare-specific evidence."},{"topic":"AUD s/sx and treatment","vignette":"An adolescent treatment team is comparing the typical course of alcohol use in teenagers versus adults.","question":"Which statement accurately reflects adolescent-specific features of AUD?","options":["Adolescents require the same 12-month symptom threshold but progress more slowly to a use disorder than adults","Underage alcohol use is never clinically significant unless physical dependence develops","Physical dependence is more common in adolescents than in adults with AUD","Adolescents cross from use to abuse more easily than adults, and physical dependence is comparatively rare in this age group"],"correct":3,"rationale":"Adolescents cross from use to abuse more easily than adults, and some experts consider any underage alcohol use 'abuse' — though physical dependence itself is comparatively rare in adolescents compared with adults with chronic AUD."},{"topic":"AUD s/sx and treatment","vignette":"A treatment team is designing an outpatient plan for a 16-year-old with moderate AUD (4 Criterion A symptoms present) and no significant withdrawal risk.","question":"Which combination of interventions reflects the recommended treatment approach?","options":["Pharmacotherapy for AUD as the primary intervention, given the moderate severity rating","Developmentally appropriate group therapy, self-help 12-step programs, motivational interviewing, family therapy, and relapse prevention","Individual insight-oriented psychodynamic therapy alone","Routine inpatient medical detoxification"],"correct":1,"rationale":"Treatment for adolescent AUD emphasizes group therapy, self-help 12-step programs, motivational interviewing, family therapy, and relapse prevention. Pharmacological treatment is rarely used given limited evidence in this age group, and relapse is treated as an expected part of recovery."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A treatment team is educating a family that cannabis withdrawal carries real clinical significance and should not be dismissed as purely psychological.","question":"Which symptoms are described as the most common presenting features of cannabis withdrawal?","options":["Psychotic symptoms and severe agitation","Fever and diaphoresis exclusively","Seizures and autonomic instability","Irritability and sleep disturbance"],"correct":3,"rationale":"Irritability and sleep disturbance are described as the most common presenting symptoms of cannabis withdrawal — a distinguishing feature from the more severe autonomic/seizure profile associated with alcohol withdrawal."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"One week after stopping daily cannabis use, a patient describes ongoing fatigue and trouble concentrating at work, and notes that his initial loss of appetite and insomnia have now flipped into increased appetite and excessive sleepiness.","question":"How are these additional features classified relative to the DSM-5 Criterion B symptom list for cannabis withdrawal?","options":["They are additional features often seen beyond the core Criterion B list, not required for diagnosis","They are required Criterion B symptoms that must be present for diagnosis","They rule out a diagnosis of cannabis withdrawal","They indicate a different diagnosis entirely, such as alcohol withdrawal"],"correct":0,"rationale":"Fatigue, yawning, difficulty concentrating, and a rebound period of increased appetite/hypersomnia are described as additional features often seen beyond the core Criterion B symptom list — supportive but not required for the diagnosis."},{"topic":"Motivational Interviewing","vignette":"A clinician describes MI's foundational belief that the motivation to change already exists within the patient, and that the practitioner's role is to draw it out rather than impose it.","question":"Which element of the 'Spirit' of MI is being described?","options":["Compassion","Acceptance","Partnership","Evocation"],"correct":3,"rationale":"Evocation describes the belief that motivation to change already exists within the patient — the practitioner's job is to draw it out, not impose it. The other Spirit elements are Partnership, Acceptance, and Compassion."},{"topic":"Motivational Interviewing","vignette":"An adapted substance-use treatment protocol incorporates personalized feedback, places responsibility for change with the patient, offers advice only with permission, and presents a menu of change options.","question":"Which MI-based protocol is being described?","options":["OARS","FRAMES","SBIRT","PRACTICE"],"correct":1,"rationale":"FRAMES (Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy) is a well-known adapted substance-use protocol built on MI principles, distinct from OARS (the core communication skills) and PRACTICE (the unrelated TF-CBT mnemonic)."},{"topic":"Motivational Interviewing","vignette":"A patient in the Focusing phase of MI repeatedly raises reasons why change would be too difficult. The clinician avoids confronting this directly and continues asking open-ended questions to help the patient find their own direction.","question":"What MI technique is the clinician using?","options":["Direct persuasion","The Planning phase's action-step technique","Confrontational interviewing","Rolling with resistance"],"correct":3,"rationale":"In the Focusing phase, MI uses open-ended questions rather than unsolicited advice and 'rolls with resistance' rather than confronting it — this non-confrontational stance is a hallmark MI technique used across all four phases."},{"topic":"Change theory","vignette":"A clinician is reviewing the five main stages of the Transtheoretical Model of Change with a colleague new to the model.","question":"Which sequence is correct?","options":["Precontemplation, Contemplation, Preparation, Action, Maintenance","Contemplation, Precontemplation, Action, Preparation, Maintenance","Action, Maintenance, Precontemplation, Contemplation, Preparation","Preparation, Precontemplation, Contemplation, Maintenance, Action"],"correct":0,"rationale":"Precontemplation → Contemplation → Preparation → Action → Maintenance is the correct TTM sequence, with (Relapse) as a common but non-required detour back to an earlier stage."},{"topic":"Change theory","vignette":"A clinician uses action-oriented language ('let's pick a quit date') with a patient who is still in Precontemplation and has expressed no interest in changing.","question":"What is the core clinical error in this approach?","options":["Failing to complete a formal substance use screening tool first","Violating patient confidentiality","Using OARS skills incorrectly during the conversation","Failing to match the intervention to the patient's actual stage of change, rather than pushing action language on a precontemplative patient"],"correct":3,"rationale":"Matching the intervention to the patient's actual stage of change — not pushing 'action' language on a precontemplative patient — is the core clinical application of both MI and the Transtheoretical Model."},{"topic":"Children and foster care","vignette":"A 13-year-old with severe out-of-control behavior is being considered for a foster placement as part of his treatment plan, separate from any active child protection concern.","question":"What is a recognized additional use of foster care described in this context?","options":["Foster care is used exclusively in confirmed child maltreatment cases and never for behavioral containment","Foster care can be used as a containment/adjunctive option in severe out-of-control behavior or when the home environment cannot safely support the child during treatment","Foster care can only be initiated by court order, never as part of a treatment plan","Foster placement is contraindicated whenever a child has a behavioral disorder"],"correct":1,"rationale":"Beyond its primary child-protection role, foster care is also used as a containment/adjunctive option in severe out-of-control behavior or when the home environment cannot safely support the child during treatment."},{"topic":"Children and foster care","vignette":"A foster parent expresses frustration that her newly placed foster child does not show affection the way she expected, and worries she is failing as a caregiver.","question":"Which component of the recommended clinical approach directly addresses this situation?","options":["Referral of the foster parent for individual psychotherapy unrelated to the placement","No intervention is needed since this is an expected caregiver reaction requiring no support","Immediate removal of the child from this placement","Support for the foster/adoptive caregivers themselves, including psychoeducation and realistic expectations"],"correct":3,"rationale":"The recommended clinical approach explicitly includes support for foster/adoptive caregivers — psychoeducation and realistic expectations about attachment difficulties — since many fostered/adopted children show attachment difficulties stemming from their pre-placement history."},{"topic":"Mandated reporter","vignette":"A newer NP asks a colleague whether mandated reporting requires the clinician to have definitively confirmed that abuse occurred before filing a report.","question":"What is the correct response?","options":["No — mandated reporting is not confined to confirmed abuse; if the evidence is sufficient to raise a serious question or reasonable suspicion, it must be reported","Yes — a report can only be filed once abuse has been confirmed by an official investigation","Only physicians, not nurse practitioners, carry a mandated reporting obligation","Reporting requirements vary so much that no general answer applies to this question"],"correct":0,"rationale":"Mandated reporting is not confined to confirmed abuse — if evidence is sufficient to raise a serious question or reasonable suspicion, it must be reported to prompt an official investigation. All states require professionals who suspect child abuse to report it, regardless of discipline."},{"topic":"Mandated reporter","vignette":"A clinician who suspects abuse decides not to report because she is not '100% certain' and worries about damaging her relationship with the family if she is wrong.","question":"What is the risk of this decision?","options":["Legal penalties can be assessed for failing to report, regardless of the clinician's motivation for withholding the report","This decision is appropriate because certainty is required before reporting","There is no legal consequence as long as the clinician documents her reasoning for not reporting","This decision only carries risk if the abuse is later confirmed by another source"],"correct":0,"rationale":"Failing to report suspected abuse carries legal risk for the clinician — the flip side of the good-faith immunity protection for reporting. The reasonable-suspicion standard means uncertainty is not a valid reason to withhold a report."},{"topic":"Grief in children","vignette":"A father is debating whether to let his 9-year-old daughter attend her mother's funeral, worried that seeing the casket will traumatize her.","question":"What does the evidence suggest, and what is the recommended clinical guidance for this father?","options":["The decision should be made entirely by the surviving parent without input from the child","Funeral attendance has not been shown to increase later psychiatric symptoms; the child should be allowed some choice in attending","Funeral attendance is mandatory for healthy grief processing at any age","Children should never be allowed to attend funerals under age 10"],"correct":1,"rationale":"Clinical guidance is to allow the child some choice in attending the funeral — attendance has not been shown to increase later psychiatric symptoms. Clinicians should also provide extra adult support and explain death matter-of-factly, consistent with family beliefs."},{"topic":"Grief in children","vignette":"A clinician compares the diagnostic duration threshold for persistent complex bereavement disorder between a bereaved child and a bereaved adult.","question":"What is the correct duration comparison?","options":["Children require a longer duration (18 months or more) than adults because grief is considered more resilient in childhood","Children require only 6 months or more of severe grief reactions, compared with 12 months or more in adults","Children and adults require the identical 12-month duration threshold","There is no duration threshold specified for either children or adults"],"correct":1,"rationale":"Persistent complex bereavement disorder is distinguished from normal grief by severe reactions persisting ≥12 months in adults but only ≥6 months in children — a lower threshold reflecting how much grief can already impair a child's functioning."},{"topic":"Group therapy techniques","vignette":"A quiet, socially withdrawn member of a teen support group spends an entire session helping a newer, more distressed member calm down, and afterward tells the facilitator he 'actually felt useful for once.'","question":"Which Yalom therapeutic factor best captures this experience?","options":["Altruism","Interpersonal learning","Development of socializing techniques","Universality"],"correct":0,"rationale":"Altruism describes how helping others in the group boosts a member's own self-worth, distinct from universality (realizing one is not alone) or interpersonal learning (gaining insight into one's own relational patterns)."},{"topic":"Group therapy techniques","vignette":"In the final two sessions of a 20-week adolescent process group, several members become unusually quiet, one snaps irritably at the facilitator, and another jokes about 'not caring anyway' that the group is ending.","question":"Which Tuckman stage is the group currently in, and what should the leader do?","options":["Adjourning — the leader should directly address termination, since members may have strong emotional reactions to the group ending","Performing — the leader should focus solely on deepening ongoing therapeutic work","Storming — the leader should introduce new conflict-resolution rules","Forming — the leader should reintroduce basic ground rules"],"correct":0,"rationale":"Adjourning is the termination stage, where members may have strong emotional reactions to the group ending — the leader's role is to directly address termination and these reactions rather than avoiding the topic."},{"topic":"Angry patient during family therapy","vignette":"Throughout a session, both parents describe their 13-year-old son's defiance as the sole cause of the family's chaos. The therapist responds, 'I'm curious what each of you notices about your own part in how these moments unfold.'","question":"What clinical purpose does this reframing technique serve?","options":["It has no established clinical purpose and is discouraged in family therapy","It reframes the presenting problem as a family system issue rather than one member's fault, reducing defensiveness and scapegoating","It is primarily used to identify which family member should be excluded from future sessions","It assigns blame more evenly but does not change the underlying family dynamic"],"correct":1,"rationale":"Reframing the presenting problem as a family system issue, not one member's fault, reduces defensiveness and scapegoating of the identified patient — which is often a driver of anger in session."},{"topic":"Angry patient during family therapy","vignette":"A therapist summarizes the correct order of priorities for a colleague when a family member becomes angry and dysregulated mid-session.","question":"What is the correct priority sequence?","options":["Both should occur simultaneously regardless of the family member's regulation state","De-escalate first, problem-solve second — do not try to process content while a family member is dysregulated","Problem-solve first to resolve the underlying issue, then de-escalate","Neither de-escalation nor problem-solving should occur; the session should simply end"],"correct":1,"rationale":"The clinician's task when anger escalates is to de-escalate first, problem-solve second — attempting to process content or resolve conflict while a family member remains dysregulated is unlikely to be productive and can worsen safety."},{"topic":"Learning domains","vignette":"A clinic's new-medication teaching process is a printed page of dosing instructions and possible side effects handed to parents at checkout, with no time set aside to discuss worries or practice giving the dose.","question":"Which domains of learning are missing from this teaching process?","options":["Affective and psychomotor domains","Only the psychomotor domain is missing; the affective domain is not relevant to medication teaching","No domains are missing; a handout addresses all three domains","Only the cognitive domain is missing"],"correct":0,"rationale":"This plan addresses only the cognitive domain. It is missing the affective domain (discussing the family's attitudes and concerns) and the psychomotor domain (demonstrating and practicing actual administration technique)."},{"topic":"Learning domains","vignette":"A clinician matches each of the three learning domains with its correct one-word description while precepting a student.","question":"Which matching is correct?","options":["Cognitive = knowing; Affective = feeling/valuing; Psychomotor = doing","Cognitive = feeling/valuing; Affective = doing; Psychomotor = knowing","Cognitive = doing; Affective = knowing; Psychomotor = feeling/valuing","All three domains describe the same underlying construct"],"correct":0,"rationale":"Cognitive = knowing (facts, intellectual understanding); Affective = feeling/valuing (attitudes, willingness to engage); Psychomotor = doing (physical skills, demonstrated competence). A teaching plan that only transmits facts is incomplete without addressing attitudes and skill practice."},{"topic":"NSSI","vignette":"A 16-year-old who cuts several times a month describes overwhelming waves of emotion she 'can't sit with' and says the urge to self-harm builds until she acts on it.","question":"Which treatment has the strongest evidence base for her presentation, and why?","options":["Trauma-Focused CBT as the only evidence-based option","Dialectical behavior therapy, largely because of its emotion-regulation and distress-tolerance skills modules","Motivational interviewing as a standalone treatment","Family-Based Treatment (Maudsley model)"],"correct":1,"rationale":"Dialectical Behavior Therapy has the strongest evidence base for NSSI, particularly its emotion-regulation and distress-tolerance skills modules, alongside safety planning and treating underlying mood/anxiety/trauma."},{"topic":"NSSI","vignette":"A 15-year-old admits she scratches her arms mainly after fights with her best friend, explaining, 'She always comes back and apologizes and pays attention to me again once she sees it.'","question":"Which DSM-5 proposed NSSI expectation does this reflect?","options":["Obtaining relief from a negative feeling/cognitive state only","Inducing a positive feeling state only","Resolving an interpersonal difficulty","This does not correspond to any recognized NSSI expectation"],"correct":2,"rationale":"Proposed Criterion B requires at least one expectation: relief from a negative feeling/cognitive state, resolving an interpersonal difficulty, or inducing a positive feeling state. Using self-injury to influence a partner's attention reflects the interpersonal-difficulty-resolution expectation."},{"topic":"NSSI","vignette":"A 13-year-old with intellectual disability engages in repetitive head-banging as part of a broader pattern of stereotyped, repetitive movements observed since early childhood.","question":"How does this presentation relate to the DSM-5 proposed NSSI criteria?","options":["NSSI criteria exclude all patients with intellectual disability from consideration entirely","In neurodevelopmental disorders, self-injury that is part of a stereotypy pattern does not meet the proposed NSSI criteria","Stereotyped self-injury in neurodevelopmental disorders should instead be coded as a suicide attempt","This automatically meets full NSSI criteria regardless of the stereotypy pattern"],"correct":1,"rationale":"Per proposed NSSI Criterion F, the behavior does not occur exclusively during psychosis, delirium, or substance intoxication/withdrawal; in neurodevelopmental disorders, self-injury is not counted toward NSSI if it is part of a stereotypy pattern, and it is not better explained by another disorder."}]},{"key":"all","label":"All 6 Combined (300 Questions)","questions":[{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 15-year-old girl is 78% of expected body weight for her height. She insists she 'feels fat' despite her BMI of 15.9, and restricts intake to under 700 kcal/day while exercising for 2 hours nightly. She denies binge eating or purging.","question":"Which diagnosis and subtype best fits this presentation?","options":["Avoidant/restrictive food intake disorder","Anorexia nervosa, binge-eating/purging type","Bulimia nervosa","Anorexia nervosa, restricting type"],"correct":3,"rationale":"All three AN criteria are met: significantly low weight (Criterion A), intense fear of gaining weight despite being underweight (Criterion B), and disturbed body image (Criterion C). With no binge/purge behavior in the last 3 months, this is the restricting subtype. ARFID is excluded because body image disturbance and fear of weight gain are present — ARFID by definition has no body-image driver."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 17-year-old male has a normal BMI. He reports eating a very large amount of food in under an hour, feeling out of control while doing so, twice a week for the past 4 months. Afterward he feels intensely guilty and eats alone to hide it, but he has never vomited, used laxatives, or fasted afterward.","question":"Which diagnosis is most consistent with this history?","options":["ARFID","Bulimia nervosa","Binge-eating disorder","Anorexia nervosa, binge-eating/purging type"],"correct":2,"rationale":"Recurrent binge eating with loss of control, at least weekly for 3+ months, with marked distress, and — critically — the absence of any compensatory behavior (vomiting, laxatives, fasting, excessive exercise) is what distinguishes BED from bulimia nervosa. Normal weight and no fear of weight gain rule out anorexia."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A mother brings in her 6-year-old with intellectual disability because the child has repeatedly been caught eating paint chips and soil from the backyard over the past two months. The child is not underweight and shows no interest in dieting.","question":"What is the most important immediate medical work-up for this presentation?","options":["Thyroid-stimulating hormone","Serum electrolytes and ECG for QT prolongation","Amylase and lipase","Serum lead level"],"correct":3,"rationale":"This is Pica — persistent ingestion of nonnutritive, nonfood substances for over a month, developmentally inappropriate, more prevalent with intellectual disability. Paint chips and soil carry a lead-toxicity risk, so a blood lead level is the key medical screen (pediatric consultation recommended above 4 mcg/dL)."},{"topic":"ARFID s/sx","vignette":"A 5-year-old girl choked badly on a piece of chicken 6 months ago. Since then she refuses all solid food, will only drink smoothies, and becomes panicked and tearful when solid food is placed in front of her.","question":"Which of the three common ARFID clinical presentations does this best represent?","options":["Sensory-based avoidance of food characteristics","Apparent lack of interest in eating/food","Fear-based avoidance following an aversive eating experience","Body-image-driven restriction"],"correct":2,"rationale":"Of the three common ARFID presentations, this is the fear-based/aversive-experience subtype — avoidance triggered by a specific traumatic event (choking), the least common of the three subtypes per Eddy et al., but a classic vignette presentation."},{"topic":"ARFID s/sx","vignette":"An 8-year-old boy has never shown much interest in food, often forgetting to eat and needing repeated prompting from his parents at every meal. He is not underweight but his growth has plateaued.","question":"Which ARFID subtype, and which is most common according to the frequency ranking taught for this exam?","options":["Fear-based avoidance — the most common subtype","Body-image disturbance — not an ARFID subtype at all","Lack of interest in eating — the most common subtype","Sensory-based avoidance — the most common subtype"],"correct":2,"rationale":"The three ARFID subtypes ranked by frequency (Eddy et al.) are: (1) lack of interest in food — most common; (2) sensory-based avoidance — next most common; (3) aversive/traumatic-experience type — least common. This vignette (low appetite drive, prompting needed) is the lack-of-interest presentation."},{"topic":"Therapies for eating disorders","vignette":"A 15-year-old with new-onset anorexia nervosa and a supportive, motivated family is being referred for outpatient treatment.","question":"What is the first-line, best-evidence treatment approach for this adolescent?","options":["Inpatient hospitalization regardless of medical stability","Individual CBT alone, without family involvement","SSRIs as monotherapy prior to any behavioral intervention","Family-Based Treatment (Maudsley model), empowering the parents to take charge of refeeding at home"],"correct":3,"rationale":"Family-Based Treatment (the Maudsley model) has the strongest empirical support for adolescent anorexia nervosa. Parents are empowered as part of the solution — not blamed — and take charge of refeeding at home. Individual therapy/CBT is a second choice for families unable or unwilling to engage in FBT."},{"topic":"Therapies for eating disorders","vignette":"An inpatient team is refeeding a severely malnourished 16-year-old with anorexia nervosa. The dietitian recommends a cautious initial caloric advancement.","question":"What is the primary safety rationale for gradual, rather than rapid, refeeding?","options":["Rapid refeeding is contraindicated only in ARFID, not anorexia","Rapid refeeding causes serotonin syndrome","Too-rapid refeeding risks refeeding syndrome","Rapid refeeding always triggers purging behavior"],"correct":2,"rationale":"Too-rapid refeeding in a severely malnourished patient risks refeeding syndrome (dangerous electrolyte shifts, particularly phosphate) — a classic patient-safety exam point. Target weight gain is gradual: roughly 1 lb/week outpatient or 2-3 lb/week inpatient, toward ~90% of ideal body weight."},{"topic":"Enuresis vs Encopresis","vignette":"A 6-year-old boy wets the bed most nights but has never had a daytime accident. His parents ask when this should be considered a diagnosable condition rather than normal development.","question":"What is the minimum age and frequency threshold required to diagnose enuresis?","options":["Chronological age ≥ 4 years, with wetting ≥ once weekly for ≥ 3 consecutive months","Chronological age ≥ 5 years, with wetting on any single occasion","Chronological age ≥ 7 years, with wetting nightly for ≥ 1 month","Chronological age ≥ 5 years, with wetting ≥ twice weekly for ≥ 3 consecutive months (or clinically significant distress)"],"correct":3,"rationale":"Enuresis requires chronological age ≥ 5 years (Criterion C) and frequency ≥ twice/week for ≥ 3 consecutive months, or clinically significant distress/impairment (Criterion B). This boy's presentation — nocturnal-only wetting — is the most common (monosymptomatic) subtype."},{"topic":"Enuresis vs Encopresis","vignette":"A 5-year-old girl has been passing stool into her underwear about twice a month for the past 4 months. Exam reveals a palpable fecal mass in the lower abdomen.","question":"What is the minimum age required to diagnose encopresis, and which specifier applies here?","options":["Age ≥ 5 years; without constipation and overflow incontinence","Age ≥ 4 years; without constipation and overflow incontinence","Age ≥ 4 years; with constipation and overflow incontinence","Age ≥ 3 years; with constipation and overflow incontinence"],"correct":2,"rationale":"Encopresis requires chronological age ≥ 4 years and ≥ 1 event/month for ≥ 3 months. A palpable fecal mass indicates the 'with constipation and overflow incontinence' specifier, which accounts for ~80% of cases (poorly formed stool, continuous leaking)."},{"topic":"Nocturnal enuresis treatment","vignette":"A motivated 9-year-old with persistent nocturnal enuresis has failed simple behavioral measures (fluid restriction, voiding before bed). His parents want the treatment with the best long-term success rate.","question":"What is the first-line treatment for persistent nocturnal enuresis with the highest durable success rate?","options":["Scheduled parental awakenings alone, indefinitely","Oxybutynin","The urine alarm ('bell and pad')","Desmopressin (DDAVP) nasal spray"],"correct":2,"rationale":"The urine alarm is first-line for persistent nocturnal enuresis and has the highest success rate of behavioral options (~75% at 6 months, ~56% sustained at 12 months), compared with ~6-16% with observation alone. DDAVP has higher relapse after discontinuation and the nasal spray carries a hyponatremia risk, so oral form is preferred when medication is used."},{"topic":"Nocturnal enuresis treatment","vignette":"A family needs a rapid, short-term solution for their 10-year-old's bedwetting before an overnight camp trip next week; there isn't time to trial a urine alarm program.","question":"What is the most appropriate short-term option, and what is its key limitation?","options":["Oral DDAVP; it permanently cures enuresis in most children","Intranasal DDAVP, preferred over oral due to fewer side effects","Imipramine, which has no relapse risk on discontinuation","Oral DDAVP (desmopressin); most children relapse when the medication is stopped"],"correct":3,"rationale":"DDAVP at bedtime can help short-term in children needing a rapid result (e.g., camp), but most relapse when it is stopped. Oral form is preferred over intranasal spray due to hyponatremia risk with the spray, and it should be avoided in children with fever, vomiting, diarrhea, or other sodium-imbalance risk."},{"topic":"Encopresis treatment","vignette":"An 8-year-old presents with fecal soiling and a large palpable stool mass on abdominal exam, confirming the constipation/overflow subtype of encopresis.","question":"What is the correct sequence of treatment?","options":["Behavioral toileting program alone, without addressing the impaction","Repeated parent-administered enemas as the primary long-term strategy","Initial bowel cleanout (PEG or enemas), followed by bowel retraining (stool softener, high-fiber diet, toileting routine) combined with a behavioral program","Immediate psychiatric referral before any medical management"],"correct":2,"rationale":"For constipation-type encopresis, the correct sequence is always cleanout first (oral PEG or enemas), then bowel retraining (stool softener/mineral oil, high-fiber diet, regular toileting routine, mild suppository if needed) combined with the behavioral program — behavioral programs alone fail if the bowel remains impacted. Repeated parent-administered enemas are discouraged as harmful to the parent-child relationship."},{"topic":"Encopresis treatment","vignette":"A 9-year-old boy without any history of constipation is found to be deliberately smearing stool during conflicts with his stepfather. Bowel exam is normal.","question":"What treatment approach is most appropriate for this presentation?","options":["A mild suppository program alone","High-fiber diet as the sole intervention","Family behavioral treatment addressing the exacerbating family dynamics","Bowel cleanout with PEG followed by mineral oil"],"correct":2,"rationale":"Encopresis without constipation, especially when manipulative/deliberate, requires family behavioral treatment that addresses the exacerbating dynamics — not the bowel-cleanout protocol reserved for the constipation/overflow subtype (~80% of cases)."},{"topic":"ODD vs CD vs IED","vignette":"A 10-year-old has a 7-month history of frequently losing his temper, arguing with teachers, deliberately annoying his younger sister, and blaming others for his own mistakes. He has never physically hurt anyone or damaged property, and has never stolen anything.","question":"Which diagnosis best fits?","options":["Conduct disorder","Oppositional defiant disorder","Intermittent explosive disorder","Disruptive mood dysregulation disorder"],"correct":1,"rationale":"This pattern — angry/irritable mood, argumentative/defiant behavior, and vindictiveness lasting ≥ 6 months, without violating others' basic rights or major norms — is classic ODD. Conduct disorder requires more serious rights-violating behavior (aggression to people/animals, property destruction, theft, or serious rule violations), which is absent here."},{"topic":"ODD vs CD vs IED","vignette":"A 14-year-old has, over the past year, broken into a neighbor's garage, been physically cruel to the family cat, and used a weapon in a fight at school. Symptoms began before age 10.","question":"Which specifier applies, and what is its prognostic significance?","options":["Childhood-onset type — associated with a better long-term prognosis than adolescent-onset","Childhood-onset type — associated with more physical aggression and higher risk of progressing to adult antisocial personality disorder","Unspecified onset — prognosis cannot be determined","Adolescent-onset type — associated with a better prognosis for remission"],"correct":1,"rationale":"Childhood-onset conduct disorder (≥1 symptom before age 10) is associated with male predominance, more physical aggression, and a higher risk of progressing to adult antisocial personality disorder — a worse prognosis than adolescent-onset CD, which has no symptoms before age 10 and a better prognosis for remission."},{"topic":"Meds for physically aggressive children","vignette":"A 13-year-old is acutely agitated and physically aggressive on an inpatient unit with a suspected psychotic process. The team needs a rapid-acting medication option.","question":"Which agents are preferred for acute agitation/psychotic aggression in youth?","options":["Haloperidol as the preferred first-line agent","Fluoxetine for immediate sedation","Benzodiazepines as the default first-line choice","Second-generation antipsychotics, particularly risperidone and olanzapine"],"correct":3,"rationale":"Second-generation antipsychotics — particularly risperidone and olanzapine — are preferred over haloperidol for acutely agitated youth, given comparable efficacy, rapid onset, sedative effect, availability in rapidly-dissolving oral form, and comparatively lower extrapyramidal side effects. Benzodiazepines are avoided as a default due to paradoxical disinhibition risk."},{"topic":"Meds for physically aggressive children","vignette":"A 9-year-old with autism spectrum disorder has chronic, severe irritability and aggression that has not responded to behavioral interventions.","question":"Which medications are FDA-approved specifically for irritability/aggression associated with ASD?","options":["Haloperidol and chlorpromazine","Risperidone and aripiprazole","Lorazepam and clonazepam","Fluoxetine and sertraline"],"correct":1,"rationale":"For chronic/severe aggression associated with ASD or intellectual disability, risperidone and aripiprazole are the FDA-approved options for irritability/aggression — distinct from the acute-agitation preference for risperidone/olanzapine in general pediatric aggression."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 16-year-old was in a serious car accident 10 days ago. She now reports intrusive memories, avoidance of cars, dissociative episodes, and hyperarousal.","question":"Given the timeframe, which diagnosis is most appropriate right now?","options":["Depersonalization/derealization disorder","Acute stress disorder","Adjustment disorder","PTSD"],"correct":1,"rationale":"Acute stress disorder is diagnosed between 3 days and 1 month post-trauma; PTSD requires symptoms persisting beyond 1 month. At 10 days out, with the same Criterion-A trauma exposure and qualifying symptoms, acute stress disorder is the correct diagnosis for now — this could evolve into PTSD if symptoms persist past a month."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 14-year-old reports recurrent episodes of feeling 'like I'm watching myself from outside my body' and that her surroundings feel 'foggy and unreal.' She recognizes these feelings are not literally true and has no history of a specific trauma.","question":"Which feature distinguishes this presentation from psychosis?","options":["Reality testing remains intact — she knows the experience isn't 'real'","The presence of a specific identifiable trauma","The persistence of symptoms beyond 6 months","The presence of auditory hallucinations"],"correct":0,"rationale":"Depersonalization/derealization disorder is defined by intact reality testing — the person knows the unreality feeling isn't literally true — which is exactly what separates it from psychosis. Unlike PTSD/ASD, no specific Criterion-A trauma is required for this diagnosis."},{"topic":"Trauma therapy","vignette":"A vignette asks for 'the' recommended trauma therapy for a child with PTSD, without further specifying which particular model.","question":"When no further detail is given, which model is the safest, most defensible answer?","options":["Trauma-Focused CBT (TF-CBT)","Medication management alone","Psychodynamic psychotherapy","Play therapy alone"],"correct":0,"rationale":"TF-CBT is the gold-standard trauma therapy with the strongest empirical support in youth — when a vignette asks for 'the' trauma therapy without more detail, TF-CBT is the safest, most defensible answer. Psychotherapy is first-line for trauma-related presentations; medication is adjunctive only."},{"topic":"Trauma therapy","vignette":"A therapist begins working with a traumatized 10-year-old by teaching breathing exercises and safety planning before any discussion of the traumatic event itself.","question":"What principle does this sequencing reflect across effective trauma therapy models?","options":["Medication should be started before any psychotherapy begins","Trauma narrative work should always begin in the first session","Family involvement should be avoided until stabilization is complete","Grounding/stabilization skills are taught before any trauma memory processing — safety and self-regulation come first"],"correct":3,"rationale":"Across effective trauma therapy models, grounding/stabilization skills are taught before any trauma memory processing (narrative work, exposure) — safety and self-regulation always come first. Family/caregiver involvement and screening the caregiver's own trauma symptoms are also consistent features of effective models."},{"topic":"TF-CBT / PRACTICE","vignette":"A supervisor asks a trainee to name the 8 components of TF-CBT in the correct order, using the mnemonic taught in class.","question":"Which mnemonic and component order is correct?","options":["PRACTICE: Psychoeducation/Parenting, Relaxation, Affective modulation, Cognitive processing, Trauma narrative, In-vivo mastery, Conjoint sessions, Enhancing safety","PROCESS: Psychoeducation, Relaxation, Ordering, Cognitive work, Exposure, Safety, Stabilization","PRACTICE: Psychoeducation, Relaxation, Assessment, Cognitive processing, Trauma narrative, Imagery, Conjoint sessions, Evaluation","TRAUMA: Triage, Rapport, Assessment, Understanding, Mastery, Aftercare"],"correct":0,"rationale":"PRACTICE is the single most likely fill-in-the-blank/matching item from this whole topic: Psychoeducation and Parenting skills, Relaxation, Affective modulation, Cognitive processing/coping, Trauma narrative and processing, In-vivo mastery of trauma reminders, Conjoint child-parent sessions, Enhancing safety."},{"topic":"TF-CBT / PRACTICE","vignette":"A therapist using TF-CBT has completed relaxation training and affective modulation skills with a traumatized 11-year-old and is now ready to move to the next component.","question":"What is the next PRACTICE component in sequence, and what does it involve?","options":["Cognitive processing/coping — identifying and correcting distorted trauma-related thoughts such as self-blame","Enhancing safety — the final planning component","Conjoint child-parent sessions — before any individual work is completed","Trauma narrative — immediately beginning detailed exposure to the traumatic memory"],"correct":0,"rationale":"After Psychoeducation/Parenting, Relaxation, and Affective modulation, the next PRACTICE component is Cognitive processing/coping — identifying and correcting distorted trauma-related thoughts (e.g., self-blame) — which comes before the Trauma narrative component."},{"topic":"TF-CBT / PRACTICE","vignette":"A child has completed a detailed trauma narrative in TF-CBT. The therapist now plans a session where the child shares their progress and narrative directly with their caregiver in a supported setting.","question":"Which PRACTICE component is being implemented?","options":["Conjoint child-parent sessions","In-vivo mastery of trauma reminders","Psychoeducation and parenting skills","Relaxation"],"correct":0,"rationale":"Conjoint child-parent sessions are where the child shares their progress/narrative with the caregiver in a supported setting — this reflects TF-CBT's design to explicitly include the caregiver, not just the child, as a distinguishing feature of the model."},{"topic":"Insomnia treatment","vignette":"A 9-year-old has difficulty falling asleep without a parent present in the room, occurring nightly for the past 4 months, with resulting daytime irritability and school difficulty.","question":"Before treating this as a standalone sleep disorder, what should be screened for first?","options":["An underlying psychiatric cause (anxiety, ADHD, mood disorder, PTSD) or a substance such as caffeine or stimulant medication","A trial of a benzodiazepine should be started immediately","This is always a normal developmental variant that requires no evaluation","A sleep study should be ordered before any other evaluation"],"correct":0,"rationale":"Before treating insomnia as standalone, screen for an underlying psychiatric cause (anxiety, ADHD, mood disorder, PTSD) or a substance (caffeine, stimulant medication) — treatment should address any identified underlying driver rather than jumping straight to symptomatic insomnia treatment."},{"topic":"Insomnia treatment","vignette":"A family asks about the best-supported over-the-counter option for short-term help with their child's difficulty falling asleep, after behavioral sleep hygiene measures alone haven't fully resolved it.","question":"What is the best-supported short-term pharmacologic option, and what is its FDA status in children?","options":["A stimulant medication used off-label for insomnia","A benzodiazepine, which is FDA-approved for pediatric insomnia","Diphenhydramine, which has strong evidence and is FDA-approved for chronic pediatric use","Melatonin — no medication currently has FDA approval for pediatric insomnia"],"correct":3,"rationale":"Melatonin is the best-supported short-term pharmacologic option for pediatric insomnia — but no medication currently has FDA approval for pediatric insomnia. Sedative-hypnotics are not recommended for chronic use, and children can have a paradoxical activation/agitation response."},{"topic":"Nightmare treatment","vignette":"A 10-year-old has frequent, extremely dysphoric dreams involving threats to his safety. Upon waking, he is immediately oriented, alert, and can describe the dream in detail.","question":"What feature distinguishes this from a sleep terror?","options":["Rapid full orientation on waking — in sleep terrors, the child remains confused/unresponsive","The presence of a detailed, well-remembered dream — sleep terrors also feature detailed dream recall","The child's age — sleep terrors only occur in children under 5","Occurring in the first half of the sleep period rather than the second half"],"correct":0,"rationale":"Rapid full orientation on waking is what separates a nightmare from a sleep terror (an NREM parasomnia), where the child remains confused/unresponsive. Nightmares generally occur in the second half of the major sleep episode and are well-remembered, unlike sleep terrors."},{"topic":"Nightmare treatment","vignette":"A 13-year-old with PTSD has severe, nightly trauma-related nightmares that have not responded to behavioral interventions (imagery rehearsal therapy, relaxation) after an adequate trial.","question":"Which medication has the best-known targeted evidence for trauma-related nightmares?","options":["Prazosin, with monitoring of orthostatic blood pressure","Bupropion","A benzodiazepine","Diphenhydramine"],"correct":0,"rationale":"Prazosin (an alpha-1 antagonist) has the best-known targeted evidence for trauma-related nightmares — start low and monitor orthostatic blood pressure. No medication has FDA approval for pediatric nightmares; medication is reserved for significant, function-impairing nightmares persisting despite psychotherapy."},{"topic":"AUD s/sx and treatment","vignette":"A 17-year-old has been drinking heavily most weekends for the past year. He has tried to cut back twice without success, spends significant time recovering from hangovers before school, and continues drinking despite a recent DUI.","question":"How many of the 11 DSM-5 Criterion A symptoms must be present within 12 months to diagnose alcohol use disorder?","options":["≥ 2 of 11","≥ 1 of 11","≥ 4 of 11","All 11 of 11"],"correct":0,"rationale":"AUD Criterion A requires ≥2 of 11 symptoms within a 12-month period — the same threshold structure as all DSM-5 substance use disorders. Severity is then rated: mild = 2-3 criteria, moderate = 4-5, severe = ≥6."},{"topic":"AUD s/sx and treatment","vignette":"A family asks what the treatment goal should be for their 16-year-old recently diagnosed with alcohol use disorder — whether he should aim for moderation or complete abstinence.","question":"What is the recommended treatment goal for adolescent AUD?","options":["Abstinence only if there is a comorbid psychiatric diagnosis","Abstinence, not 'controlled drinking'","No specific goal is recommended; it is entirely patient-directed","Controlled drinking with a set weekly limit"],"correct":1,"rationale":"The treatment goal for adolescent AUD is abstinence, not 'controlled drinking.' Medical detoxification is rarely necessary in adolescents, and treatment emphasizes developmentally appropriate group therapy, self-help programs (AA), motivational interviewing, and family therapy — pharmacotherapy for AUD itself is rarely used in this age group."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A 17-year-old who has used cannabis daily for 8 months stops abruptly. Within a week he develops irritability, insomnia with disturbing dreams, decreased appetite, and abdominal discomfort.","question":"How many of the listed symptoms are required, within approximately what timeframe, to diagnose cannabis withdrawal?","options":["≥1 symptom developing within 24 hours of cessation","All listed symptoms developing within approximately 2 weeks of cessation","≥5 symptoms developing within approximately 1 month of cessation","≥3 symptoms developing within approximately 1 week of cessation"],"correct":3,"rationale":"Cannabis withdrawal requires ≥3 of the listed symptoms (irritability/anger/aggression; nervousness/anxiety; sleep difficulty; decreased appetite/weight loss; restlessness; depressed mood; ≥1 physical symptom) developing within approximately 1 week after cessation of heavy, prolonged use."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A prescriber is asked whether any FDA-approved medication exists specifically for cannabis withdrawal.","question":"What is the correct answer, and what is the recommended treatment approach instead?","options":["No medication or psychotherapy has any role; withdrawal simply resolves untreated","No FDA-approved medication exists; treatment is primarily supportive care with symptom-targeted management","Yes, naltrexone is FDA-approved specifically for cannabis withdrawal","Yes, buprenorphine is FDA-approved specifically for cannabis withdrawal"],"correct":1,"rationale":"No medication is FDA-approved for cannabis withdrawal. Treatment is primarily supportive care: symptom-targeted management (sleep hygiene/short-term sleep aid for insomnia, reassurance/relaxation for anxiety/irritability, monitoring for depressed mood), plus underlying SUD treatment (motivational interviewing, CBT, family therapy, contingency management, relapse prevention)."},{"topic":"Motivational Interviewing","vignette":"A prescriber is asked to name the four core communication skills at the heart of motivational interviewing, using the standard mnemonic.","question":"Which mnemonic and skill set is correct?","options":["SMART: Specific, Measurable, Achievable, Realistic, Timed","OARS: Open-ended questions, Affirmations, Reflections, Summarizing","CARE: Compassion, Acceptance, Reflection, Empathy","SOAP: Subjective, Objective, Assessment, Plan"],"correct":1,"rationale":"OARS = Open-ended questions, Affirmations, Reflections, Summarizing — the core communication toolkit of motivational interviewing, expected to be spelled out precisely on the exam."},{"topic":"Motivational Interviewing","vignette":"A clinician using MI resists the urge to argue with an ambivalent patient about the benefits of quitting cannabis, and instead reflects the patient's own stated reasons for wanting to change.","question":"What core MI philosophy does this illustrate?","options":["MI requires the practitioner to set the treatment goals for the patient","The practitioner does not argue, persuade, or confront — resistance is 'rolled with,' and the patient voices their own reasons for change, which reinforces motivation more than being told","The practitioner should always directly confront ambivalence to speed up change","MI is only effective when paired with direct advice-giving in every session"],"correct":1,"rationale":"MI's central philosophy is that the practitioner does not argue, persuade, or confront — resistance is 'rolled with,' and eliciting the patient's own change talk reinforces motivation more effectively than being told what to do. This reflects the 'evocation' element of the MI Spirit."},{"topic":"Change theory","vignette":"A 16-year-old with cannabis use disorder says, 'I don't really see why this is a problem — everyone I know smokes.' She shows no interest in discussing change.","question":"Which stage of the Transtheoretical Model best fits, and what is the clinician's task at this stage?","options":["Preparation — help build a concrete, specific plan","Precontemplation — raise awareness, avoid confrontation, express empathy","Action — support and reinforce new behavior","Contemplation — explore ambivalence and decisional balance"],"correct":1,"rationale":"This patient shows no awareness of a problem and no interest in change — classic Precontemplation. The clinician's task at this stage is to raise awareness while avoiding confrontation and expressing empathy, rather than pushing action-oriented language."},{"topic":"Change theory","vignette":"A patient tells his NP, 'I know drinking is becoming a problem, but I'm not sure I'm ready to actually stop yet. Part of me still doesn't want to give it up.'","question":"Which Transtheoretical Model stage does this reflect?","options":["Preparation","Maintenance","Precontemplation","Contemplation"],"correct":3,"rationale":"Awareness that a problem exists, paired with clear ambivalence and no firm commitment to change, is the hallmark of the Contemplation stage. The clinician's task here is to explore that ambivalence and evoke reasons for/against change (decisional balance)."},{"topic":"Children and foster care","vignette":"An 8-year-old has moved through 5 different foster placements in 2 years, despite each home being adequate, because of administrative delays and disrupted matches.","question":"What is the primary concern with this pattern, independent of the original maltreatment?","options":["This pattern is protective because it exposes the child to varied caregiving styles","Multiple foster placement changes/disruptions is itself an independent risk factor for poorer psychiatric outcomes","This pattern has no additional impact beyond the original maltreatment","Repeated placement changes only matter if the child is under age 3"],"correct":1,"rationale":"A child moved through a succession of foster placements — rather than rapid reunification or permanency — is a recognized risk for worse outcomes; repeated placement changes themselves become an added adverse experience, independent of the maltreatment that led to the original placement."},{"topic":"Children and foster care","vignette":"A 6-year-old was removed from her home due to neglect and placed with a new foster family. The foster parents ask why their daughter has attachment difficulties despite feeling this new home is safe and loving.","question":"What explains the elevated psychiatric risk in children adopted or fostered past infancy?","options":["Attachment difficulties in foster children are always permanent and unresponsive to new caregiving","Risk stems not just from loss of the primary attachment figure, but often from neglect, abuse, and multiple caregiver changes preceding placement","Risk is exclusively genetic and unrelated to placement history","Foster care itself is the primary cause of all attachment difficulties, regardless of prior history"],"correct":1,"rationale":"Children adopted or fostered past infancy are at higher risk for psychiatric problems because of what led to placement — not just loss of the primary attachment figure, but often neglect, abuse, and multiple caregiver changes. Many show attachment difficulties and social/attentional problems, though some form stable, affectionate relationships with new caregivers."},{"topic":"Mandated reporter","vignette":"An NP has a 'reasonable suspicion,' but not definitive proof, that an 8-year-old patient is being physically abused at home based on an unusual bruising pattern.","question":"What is the legal threshold and obligation in this situation?","options":["Reporting is discretionary and left to the clinician's personal judgment","The clinician must report — 'reasonable suspicion,' not certainty, is the legal threshold, and reporting is a legal, not optional, obligation","The clinician should wait until definitive proof is obtained before reporting","The clinician should first confront the parents directly instead of reporting"],"correct":1,"rationale":"The exam-safe rule: when in doubt, report. 'Reasonable suspicion,' not certainty, is the legal threshold for mandated reporting — the clinician does not need to prove abuse occurred before reporting to prompt an official investigation. This is a legal, not optional, obligation in all states."},{"topic":"Mandated reporter","vignette":"An NP reports suspected abuse in good faith, but the subsequent investigation does not substantiate the allegation.","question":"What is the legal consequence for the NP in this scenario?","options":["The clinician's license is automatically reviewed following any unsubstantiated report","The clinician is immune from liability for reporting in good faith, even if the investigation does not substantiate abuse","The clinician faces legal liability for an unsubstantiated report","The clinician must retract the report formally to avoid legal consequences"],"correct":1,"rationale":"Clinicians acting in good faith are immune from liability for reporting, even if the investigation does not substantiate abuse. Conversely, legal penalties can be assessed for failing to report — this asymmetry is intentional and a common exam point."},{"topic":"Grief in children","vignette":"A 7-year-old whose grandmother died last week is observed playing happily with friends an hour after crying inconsolably about the loss.","question":"How should this pattern be interpreted?","options":["This suggests the child did not have a meaningful attachment to the grandmother","This is a concerning sign of emotional detachment requiring immediate evaluation","This indicates the child does not understand that the death is permanent","This is normal grief behavior — children's grief tends to be intermittent, not continuous, unlike adults' sustained mourning"],"correct":3,"rationale":"Children's grief is intermittent, not continuous — a child who is playing happily an hour after crying about a loss is showing normal, not concerning, grief behavior. They may play normally, then suddenly grieve intensely, rather than showing sustained continuous mourning like adults."},{"topic":"Grief in children","vignette":"A 6-year-old boy insists that his father's sudden death was his own fault because he 'didn't clean his room like Daddy asked.'","question":"What is the most appropriate clinical response to this belief?","options":["Spontaneously reassure the child that he was not responsible — magical thinking in young children can lead them to believe they caused the death","Avoid discussing the death directly until the child is older","Allow the belief to persist without comment since children will naturally outgrow it","Explain in detail the actual medical cause of death to correct the belief logically"],"correct":0,"rationale":"Magical thinking in young children can lead them to believe they caused the death — they are often too frightened or guilty to voice this belief and should be spontaneously reassured they were not responsible, as part of proactive grief psychoeducation."},{"topic":"Group therapy techniques","vignette":"A group therapy member says, 'Hearing that other people struggle with the same intrusive thoughts I have makes me feel so much less alone.'","question":"Which of Yalom's therapeutic factors is being illustrated?","options":["Universality","Catharsis","Imitative behavior","Altruism"],"correct":0,"rationale":"Universality is the realization 'I am not alone' in one's struggles — exactly what this member describes upon hearing others share similar experiences, distinct from altruism (helping others) or catharsis (relief from expressing strong emotion)."},{"topic":"Group therapy techniques","vignette":"A new therapy group is in its first few sessions. Members are polite, somewhat guarded, seek guidance from the leader, and show limited self-disclosure.","question":"Which stage of Tuckman's model of group development does this represent?","options":["Forming","Norming","Storming","Performing"],"correct":0,"rationale":"Forming (orientation) is characterized by members adapting to the group, seeking guidance/approval from the leader, limited self-disclosure, and possible anxiety — the earliest stage before the necessary friction of Storming emerges."},{"topic":"Angry patient during family therapy","vignette":"A therapist begins the very first session with a chaotic, high-conflict family by clearly stating the ground rules: no name-calling, no interrupting, no speaking for another family member, and no continuing arguments after the session ends.","question":"What is the primary purpose of this intervention?","options":["Rule-setting at the very start of the first session is the single most important preventive intervention for managing anger/conflict — it establishes the clinician as being 'in charge' of the frame and protects safety","This intervention is primarily meant to punish the family for prior behavior","This step is optional and mainly serves a legal/liability purpose","Rule-setting should only occur after the first major conflict arises in session"],"correct":0,"rationale":"Setting clear rules at the start of every family session — especially with chaotic, high-conflict, or abusive families — establishes the clinician as being 'in charge' of the frame and protects safety. This is proactive, not reactive, and is the single most important preventive intervention for managing anger/conflict."},{"topic":"Angry patient during family therapy","vignette":"During a session, a father becomes increasingly loud and agitated, interrupting his teenage daughter repeatedly. The therapist calmly states, 'I can see how frustrated you are — let's find a way to say that so everyone can hear it,' while lowering her own voice.","question":"What technique is the therapist using in this moment of escalating anger?","options":["Matching the father's volume and intensity to demonstrate active engagement","Ignoring the outburst entirely and continuing with the planned agenda","Direct confrontation of the father's behavior to assert authority","Reflective statements that validate the emotion without validating the behavior, combined with lowering her own voice/pace rather than matching intensity"],"correct":3,"rationale":"In the moment of escalating anger, the recommended approach is to name what's happening calmly, redirect to established rules, lower one's own voice/pace rather than matching intensity, and use reflective statements that validate the emotion without validating the behavior — exactly as illustrated here."},{"topic":"Learning domains","vignette":"A parent can accurately state the core symptom categories of OCD after a psychoeducation session but has not yet demonstrated any change in how she responds to her child's compulsions at home.","question":"Which learning domain has been addressed, and which remains unaddressed?","options":["All three domains have been fully addressed","Affective domain addressed; cognitive domain remains unaddressed","Cognitive domain addressed; affective and/or psychomotor domains remain unaddressed","Psychomotor domain addressed; cognitive domain remains unaddressed"],"correct":2,"rationale":"The cognitive domain covers acquiring knowledge and intellectual understanding ('knowing that') — this parent can state facts about OCD, satisfying the cognitive domain. However, no behavior change (psychomotor) or expressed attitude shift/willingness to engage (affective) has yet occurred."},{"topic":"Learning domains","vignette":"A psychoeducation session teaches a father not just what ADHD is, but also has him practice, and demonstrate competently, a specific behavioral de-escalation technique with his child.","question":"Which learning domain is targeted by having him physically demonstrate the technique?","options":["Affective domain","None of the three domains applies to skill demonstration","Psychomotor domain","Cognitive domain"],"correct":2,"rationale":"The psychomotor domain covers physical skills and hands-on ability to perform a task ('knowing how,' demonstrated competence) — a parent correctly demonstrating a de-escalation technique is a clear example of psychomotor-domain learning, distinct from simply knowing facts (cognitive) or expressing willingness (affective)."},{"topic":"NSSI","vignette":"A 15-year-old is found to have superficial cutting marks on her forearms. She reports she cuts to 'make the numbness go away' and explicitly denies any wish to die.","question":"What is the key distinguishing feature between NSSI and a suicide attempt?","options":["The use of a sharp object rather than another method","The specific body location of the injury","No intent to die — the goal is typically emotion regulation, not death","The presence of any physical scarring"],"correct":2,"rationale":"The key distinguishing feature from suicide attempts is no intent to die. The goal of NSSI is typically emotion regulation (relief from unbearable negative affect) or, less commonly, interpersonal communication — not death. Common methods include cutting, scratching, or burning, most often on the forearms or thighs."},{"topic":"NSSI","vignette":"A 16-year-old with a history of NSSI over the past year is now presenting for an unrelated medical visit.","question":"What is the recommended clinical practice given her NSSI history?","options":["Risk assessment is only warranted if the patient specifically requests it","No suicide risk assessment is needed since NSSI by definition excludes suicidal intent","A thorough suicide risk assessment should be performed, since NSSI is a significant risk factor for future suicide attempts even though the acute intent differs","NSSI and suicide attempts should be treated as clinically interchangeable and documented identically"],"correct":2,"rationale":"NSSI is a significant risk factor for future suicide attempts, even though the acute intent differs — every NSSI presentation requires a thorough suicide risk assessment. The two behaviors are related but distinct, not interchangeable terms."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 9-year-old boy has been a 'picky eater' since toddlerhood. He eats only 5 beige, crunchy foods and refuses anything with mixed textures. He has fallen from the 40th to the 8th percentile for weight over the past year, but he has never expressed any concern about his weight or shape.","question":"Which feature most clearly rules out anorexia nervosa in favor of ARFID here?","options":["ARFID cannot occur before adolescence","His weight loss is not severe enough to meet Criterion A for anorexia","He has a texture-based rather than caloric restriction","There is no fear of weight gain or disturbance in body-image perception"],"correct":3,"rationale":"ARFID's defining differentiator from anorexia/bulimia is the absence of fear of weight gain and absence of body-image disturbance — the restriction here is driven by sensory sensitivity to texture, not shape/weight concerns. ARFID can occur at any age, including early childhood, unlike the other option's claim."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 16-year-old female with a BMI of 22 reports self-induced vomiting after large binges, on average 3 times a week for the past 4 months. She also uses laxatives 'to be safe.' Her self-worth is almost entirely determined by her weight.","question":"Which criterion, if absent, would instead point toward binge-eating disorder rather than bulimia nervosa?","options":["Eating an objectively large amount of food with a sense of loss of control","Binge eating occurring at least once weekly for 3 months","Recurrent inappropriate compensatory behavior (vomiting, laxatives, fasting, excessive exercise)","Marked distress regarding the binge eating"],"correct":2,"rationale":"Compensatory behavior is the single defining feature separating BN fr
