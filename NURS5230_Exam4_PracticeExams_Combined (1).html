 grounding/stabilization skills are taught before any trauma memory processing (narrative work, exposure) — safety and self-regulation always come first, regardless of the specific model used."},{"topic":"TF-CBT / PRACTICE","vignette":"A trainee is learning the 8 components of TF-CBT using the mnemonic taught in her program.","question":"Which mnemonic and component order is correct?","options":["TRAUMA: Triage, Rapport, Assessment, Understanding, Mastery, Aftercare","PRACTICE: Psychoeducation, Relaxation, Assessment, Cognitive processing, Trauma narrative, Imagery, Conjoint sessions, Evaluation","PROCESS: Psychoeducation, Relaxation, Ordering, Cognitive work, Exposure, Safety, Stabilization","PRACTICE: Psychoeducation/Parenting, Relaxation, Affective modulation, Cognitive processing, Trauma narrative, In-vivo mastery, Conjoint sessions, Enhancing safety"],"correct":3,"rationale":"PRACTICE is the core TF-CBT mnemonic: Psychoeducation and Parenting skills, Relaxation, Affective modulation, Cognitive processing/coping, Trauma narrative and processing, In-vivo mastery of trauma reminders, Conjoint child-parent sessions, Enhancing safety."},{"topic":"TF-CBT / PRACTICE","vignette":"A TF-CBT therapist has just finished teaching diaphragmatic breathing and progressive muscle relaxation to an 8-year-old survivor of a house fire, and has begun helping him name and rate the intensity of his fear and guilt.","question":"Which PRACTICE component is currently being addressed, and what comes immediately after it?","options":["Trauma narrative — beginning detailed exposure to the traumatic memory immediately","Enhancing safety — the final planning component","Cognitive processing/coping — identifying and correcting distorted trauma-related thoughts such as self-blame","Conjoint child-parent sessions — before any individual work is completed"],"correct":2,"rationale":"After Psychoeducation/Parenting, Relaxation, and Affective modulation, the next component is Cognitive processing/coping — identifying and correcting distorted trauma-related thoughts (e.g., self-blame) — which precedes the trauma narrative component."},{"topic":"Insomnia treatment","vignette":"An 8-year-old has nightly difficulty falling asleep without a parent present, resulting in daytime irritability and academic difficulty over the past 4 months.","question":"Before treating this as a standalone sleep disorder, what should be evaluated first?","options":["A benzodiazepine trial should be started immediately","This should be treated as a normal developmental variant requiring no evaluation","A sleep study should be ordered before any other evaluation","An underlying psychiatric cause (anxiety, ADHD, mood disorder, PTSD) or a substance such as caffeine or stimulant medication"],"correct":3,"rationale":"Before treating insomnia as standalone, an underlying psychiatric cause or substance should be screened for and addressed as the primary driver, rather than jumping directly to symptomatic insomnia treatment."},{"topic":"Insomnia treatment","vignette":"A 10-year-old continues to struggle with sleep onset despite two weeks of consistent bedtime routine, no screens after dinner, and a fixed wake time. His parents ask about a supplement they read about online.","question":"What is the best-supported short-term pharmacologic option for pediatric insomnia, and what is its regulatory status in children?","options":["Melatonin — no medication currently has FDA approval for pediatric insomnia","A benzodiazepine, which carries FDA approval for pediatric insomnia","A stimulant medication used off-label for sleep initiation","Diphenhydramine, which has strong evidence and FDA approval for chronic pediatric use"],"correct":0,"rationale":"Melatonin is the best-supported short-term pharmacologic option for pediatric insomnia, though no medication currently carries FDA approval for this indication in children. Sedative-hypnotics are not recommended for chronic use given paradoxical activation risk."},{"topic":"Nightmare treatment","vignette":"A 9-year-old has frequent, extremely dysphoric dreams involving threats to his safety. Upon waking, he becomes immediately oriented, alert, and is able to describe the dream in detail.","question":"What feature distinguishes this presentation from a sleep terror?","options":["Occurring in the first half of the sleep period rather than the second half","The child's age, since sleep terrors occur only in children under age 5","The presence of a detailed, well-remembered dream, which also occurs in sleep terrors","Rapid full orientation on waking — in sleep terrors, the child instead remains confused and unresponsive"],"correct":3,"rationale":"Rapid full orientation on waking distinguishes a nightmare from a sleep terror (an NREM parasomnia), where the child remains confused/unresponsive. Nightmares typically occur in the second half of the major sleep episode and are well-remembered."},{"topic":"Nightmare treatment","vignette":"A 14-year-old with PTSD has severe, nightly trauma-related nightmares unresponsive to imagery rehearsal therapy and relaxation training after an adequate trial.","question":"Which medication has the best-known targeted evidence for trauma-related nightmares in this scenario?","options":["Diphenhydramine","Prazosin, with monitoring of orthostatic blood pressure","Bupropion","A benzodiazepine"],"correct":1,"rationale":"Prazosin (an alpha-1 antagonist) has the best-known targeted evidence for trauma-related nightmares — started low, with monitoring of orthostatic blood pressure. No medication carries FDA approval for pediatric nightmares."},{"topic":"AUD s/sx and treatment","vignette":"A 16-year-old drinks heavily most weekends, has unsuccessfully tried to cut back twice, spends significant time recovering from hangovers before school, and continues drinking despite a recent alcohol-related car accident.","question":"How many of the 11 DSM-5 Criterion A symptoms must be present within 12 months to diagnose alcohol use disorder?","options":["At least 4 of 11","All 11","At least 1 of 11","At least 2 of 11"],"correct":3,"rationale":"AUD Criterion A requires ≥2 of 11 symptoms within a 12-month period, with severity then rated: mild = 2-3 criteria, moderate = 4-5, severe = ≥6."},{"topic":"AUD s/sx and treatment","vignette":"A family asks whether their 17-year-old with newly diagnosed alcohol use disorder should aim for moderation or complete abstinence.","question":"What is the recommended treatment goal for adolescent AUD?","options":["Abstinence, not 'controlled drinking'","Controlled drinking with a defined weekly limit","Abstinence is recommended only if a comorbid psychiatric diagnosis is present","No specific goal is recommended; the choice should be entirely patient-directed"],"correct":0,"rationale":"The treatment goal for adolescent AUD is abstinence, not controlled drinking. Medical detoxification is rarely necessary in adolescents, and treatment emphasizes group therapy, self-help programs, motivational interviewing, and family therapy."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A 17-year-old who has used cannabis daily for 9 months stops abruptly. Within a week she develops irritability, insomnia with disturbing dreams, decreased appetite, and abdominal discomfort.","question":"How many of the listed symptoms are required, and within what approximate timeframe, to diagnose cannabis withdrawal?","options":["All listed symptoms developing within approximately 2 weeks of cessation","At least 1 symptom developing within 24 hours of cessation","At least 5 symptoms developing within approximately 1 month of cessation","At least 3 symptoms developing within approximately 1 week of cessation"],"correct":3,"rationale":"Cannabis withdrawal requires ≥3 of the listed symptoms (irritability/anger/aggression, nervousness/anxiety, sleep difficulty, decreased appetite/weight loss, restlessness, depressed mood, or ≥1 physical symptom) developing within approximately 1 week after cessation of heavy, prolonged use."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A 16-year-old is 4 days into cannabis cessation with irritability and disrupted sleep. His mother asks the prescriber whether a specific medication can be started to directly treat the withdrawal.","question":"What is the correct answer regarding pharmacotherapy for cannabis withdrawal, and what is the recommended approach instead?","options":["Yes, naltrexone is FDA-approved specifically for cannabis withdrawal","No FDA-approved medication exists; treatment is primarily supportive care with symptom-targeted management","No medication or psychotherapy has any established role; withdrawal simply resolves untreated","Yes, buprenorphine is FDA-approved specifically for cannabis withdrawal"],"correct":1,"rationale":"No medication is FDA-approved for cannabis withdrawal. Treatment is primarily supportive care with symptom-targeted management, alongside standard SUD treatment (motivational interviewing, CBT, family therapy, contingency management)."},{"topic":"Motivational Interviewing","vignette":"A clinician trained in motivational interviewing consistently uses four core communication skills throughout sessions with an ambivalent adolescent patient.","question":"Which mnemonic and skill set describes these core MI communication skills?","options":["SMART: Specific, Measurable, Achievable, Realistic, Timed","CARE: Compassion, Acceptance, Reflection, Empathy","SOAP: Subjective, Objective, Assessment, Plan","OARS: Open-ended questions, Affirmations, Reflections, Summarizing"],"correct":3,"rationale":"OARS — Open-ended questions, Affirmations, Reflections, Summarizing — is the core communication toolkit of motivational interviewing."},{"topic":"Motivational Interviewing","vignette":"A patient tells his clinician he isn't sure vaping is really a problem. Rather than listing the health risks, the clinician asks him to describe what he likes about vaping and what, if anything, concerns him about it.","question":"What core MI philosophy does this approach reflect?","options":["The practitioner does not argue, persuade, or confront — resistance is 'rolled with,' and the patient voices their own reasons for change, reinforcing motivation more than being told","The practitioner should always directly confront ambivalence to accelerate change","MI is only effective when paired with direct advice-giving in every session","MI requires the practitioner to set the treatment goals on the patient's behalf"],"correct":0,"rationale":"MI's central philosophy is that the practitioner does not argue, persuade, or confront — resistance is 'rolled with,' and eliciting the patient's own change talk reinforces motivation more effectively than being told what to do, reflecting the 'evocation' element of the MI Spirit."},{"topic":"Change theory","vignette":"A 17-year-old with cannabis use disorder states, 'I don't see why this is even a problem — everyone I know uses.' She shows no interest in discussing any change.","question":"Which Transtheoretical Model stage best fits, and what is the clinician's primary task at this stage?","options":["Action — support and reinforce new behavior","Preparation — help build a concrete, specific plan","Contemplation — explore ambivalence and decisional balance","Precontemplation — raise awareness, avoid confrontation, express empathy"],"correct":3,"rationale":"This patient shows no awareness of a problem and no interest in change — classic Precontemplation. The clinician's task is to raise awareness while avoiding confrontation and expressing empathy, rather than pushing action-oriented language."},{"topic":"Change theory","vignette":"A patient tells his clinician, 'I know my drinking is becoming a problem, but I'm not sure I'm ready to actually stop. Part of me still doesn't want to give it up.'","question":"Which Transtheoretical Model stage does this reflect?","options":["Precontemplation","Contemplation","Maintenance","Preparation"],"correct":1,"rationale":"Awareness that a problem exists, paired with clear ambivalence and no firm commitment to change, is the hallmark of Contemplation. The clinician's task here is to explore that ambivalence and evoke reasons for/against change."},{"topic":"Children and foster care","vignette":"A 9-year-old has moved through 6 different foster placements in 3 years, despite each home being adequate, due to administrative delays and disrupted matches.","question":"What is the primary concern with this pattern, independent of the original maltreatment that led to placement?","options":["Repeated placement changes matter only if the child is under age 3","This pattern is protective because it exposes the child to varied caregiving styles","This pattern carries no additional impact beyond the original maltreatment","Multiple foster placement changes/disruptions is itself an independent risk factor for poorer psychiatric outcomes"],"correct":3,"rationale":"A child moved through a succession of foster placements — rather than rapid reunification or permanency — is a recognized risk for worse outcomes; repeated placement changes themselves become an added adverse experience, independent of the original maltreatment."},{"topic":"Children and foster care","vignette":"A 7-year-old was removed from her home due to severe neglect and placed with a loving foster family. The foster parents ask why their daughter has ongoing attachment difficulties despite feeling this new home is safe.","question":"What explains the elevated psychiatric risk seen in children adopted or fostered past infancy?","options":["Risk stems not just from loss of the primary attachment figure, but often from the neglect, abuse, and multiple caregiver changes that preceded placement","Foster care itself is the primary cause of all attachment difficulties, regardless of prior history","Risk is exclusively genetic and unrelated to placement history","Attachment difficulties in foster children are always permanent and unresponsive to new caregiving"],"correct":0,"rationale":"Children adopted or fostered past infancy are at higher risk for psychiatric problems because of what led to placement — not just loss of the primary attachment figure, but often neglect, abuse, and multiple caregiver changes. Many show attachment difficulties, though some form stable relationships with new caregivers."},{"topic":"Mandated reporter","vignette":"An NP has a reasonable suspicion, but not definitive proof, that a 7-year-old patient is being physically abused at home based on an inconsistent explanation for a bruising pattern.","question":"What is the legal threshold and obligation in this situation?","options":["The clinician must report — reasonable suspicion, not certainty, is the legal threshold, and reporting is a legal, not optional, obligation","Reporting is discretionary and left to the clinician's personal judgment","The clinician should wait until definitive proof is obtained before reporting","The clinician should first confront the parents directly instead of reporting"],"correct":0,"rationale":"Reasonable suspicion, not certainty, is the legal threshold for mandated reporting — the clinician does not need to prove abuse occurred before reporting. This is a legal, not optional, obligation in all states."},{"topic":"Mandated reporter","vignette":"An NP files a report for suspected abuse in good faith, but the subsequent investigation does not substantiate the allegation.","question":"What is the legal consequence for the NP in this scenario?","options":["The clinician's license is automatically reviewed following any unsubstantiated report","The clinician is immune from liability for reporting in good faith, even if the investigation does not substantiate abuse","The clinician must formally retract the report to avoid legal consequences","The clinician faces legal liability for filing an unsubstantiated report"],"correct":1,"rationale":"Clinicians acting in good faith are immune from liability for reporting, even if the investigation does not substantiate abuse. Legal penalties, by contrast, can be assessed for failing to report — this asymmetry is intentional."},{"topic":"Grief in children","vignette":"A teacher reports that an 8-year-old boy whose older brother died three weeks ago was laughing and playing tag at recess, only to burst into tears at his desk 20 minutes later when a classmate mentioned brothers.","question":"How should this pattern be interpreted?","options":["This is a concerning sign of emotional detachment requiring immediate evaluation","This is normal grief behavior — children's grief tends to be intermittent, not continuous, unlike adults' sustained mourning","This indicates the child does not understand that death is permanent","This suggests the child lacked a meaningful attachment to his brother"],"correct":1,"rationale":"Children's grief is intermittent, not continuous — a child who plays normally and then suddenly grieves intensely when reminded of the loss is showing normal, not concerning, grief behavior, unlike the sustained mourning more typical of adults."},{"topic":"Grief in children","vignette":"A 5-year-old girl tells her aunt that her mother died 'because I was bad and didn't listen to her that morning.'","question":"What is the most appropriate clinical response to this belief?","options":["Spontaneously reassure the child that he was not responsible — magical thinking in young children can lead them to believe they caused the death","Avoid discussing the death directly until the child is older","Explain the actual medical cause of death in detail to logically correct the belief","Allow the belief to persist without comment since children naturally outgrow it"],"correct":0,"rationale":"Magical thinking in young children can lead them to believe they caused a death — they are often too frightened or guilty to voice this belief and should be spontaneously reassured they were not responsible."},{"topic":"Group therapy techniques","vignette":"A teenager in a group for adolescents with anxiety says, 'I always thought I was the only one who checks the stove five times before leaving the house — knowing other people here do it too is such a relief.'","question":"Which of Yalom's therapeutic factors is being illustrated?","options":["Universality","Catharsis","Altruism","Imitative behavior"],"correct":0,"rationale":"Universality is the realization 'I am not alone' in one's struggles — exactly what this member describes upon hearing others share similar experiences, distinct from altruism (helping others) or catharsis (relief from expressing strong emotion)."},{"topic":"Group therapy techniques","vignette":"In the second week of a new adolescent process group, members glance frequently at the facilitator for cues on how to behave, say little about themselves, and seem visibly anxious about being judged by the others.","question":"Which stage of Tuckman's model of group development does this represent?","options":["Performing","Forming","Norming","Storming"],"correct":1,"rationale":"Forming (orientation) is characterized by members adapting to the group, seeking guidance/approval from the leader, limited self-disclosure, and possible anxiety — the earliest stage before the necessary friction of Storming emerges."},{"topic":"Angry patient during family therapy","vignette":"Before starting the first session with a family known to child protective services for repeated volatile arguments, the therapist opens by stating that everyone will get a turn to speak, no one will raise their voice, and no one will bring up what was said in session once they leave.","question":"What is the primary purpose of this intervention?","options":["Rule-setting should only occur after the first major conflict arises in session","Rule-setting at the very start of the first session is the single most important preventive intervention for managing anger/conflict — it establishes the clinician as being 'in charge' of the frame and protects safety","This step is optional and mainly serves a legal/liability purpose","This intervention is primarily meant to punish the family for prior behavior"],"correct":1,"rationale":"Setting clear rules at the start of every family session — especially with chaotic, high-conflict, or abusive families — establishes the clinician as being 'in charge' of the frame and protects safety. This is proactive, not reactive."},{"topic":"Angry patient during family therapy","vignette":"A mother begins raising her voice and cutting off her son mid-sentence during a session. The therapist softens her tone, slows her pace, and says, 'It sounds like this really matters to you — can we find a way to say it that he can actually hear?'","question":"What technique is the therapist using in this moment of escalating anger?","options":["Reflective statements that validate the emotion without validating the behavior, combined with lowering her own voice/pace rather than matching intensity","Matching the father's volume and intensity to demonstrate active engagement","Ignoring the outburst entirely and continuing with the planned agenda","Direct confrontation of the father's behavior to assert authority"],"correct":0,"rationale":"In the moment of escalating anger, the recommended approach is to name what's happening calmly, redirect to established rules, lower one's own voice/pace, and use reflective statements that validate the emotion without validating the behavior — exactly as illustrated here."},{"topic":"Learning domains","vignette":"After a psychoeducation session, a father can correctly list the core symptoms of separation anxiety disorder, but he continues to allow his son to skip school whenever he complains of stomachaches before drop-off.","question":"Which learning domain has been addressed, and which remains unaddressed?","options":["Cognitive domain addressed; affective and/or psychomotor domains remain unaddressed","Psychomotor domain addressed; cognitive domain remains unaddressed","Affective domain addressed; cognitive domain remains unaddressed","All three domains have already been fully addressed"],"correct":0,"rationale":"The cognitive domain covers acquiring knowledge and intellectual understanding — this parent can state facts about OCD, satisfying the cognitive domain. No behavior change (psychomotor) or attitude shift (affective) has yet occurred."},{"topic":"Learning domains","vignette":"A nurse practitioner has a mother physically practice, and correctly demonstrate back, a specific breathing technique to use with her anxious daughter during a panic episode, rather than only explaining the technique verbally.","question":"Which learning domain is targeted by having her physically demonstrate the technique?","options":["None of the three domains applies to skill demonstration","Psychomotor domain","Affective domain","Cognitive domain"],"correct":1,"rationale":"The psychomotor domain covers physical skills and hands-on ability to perform a task — a parent correctly demonstrating a de-escalation technique is a clear example of psychomotor-domain learning, distinct from knowing facts (cognitive) or expressing willingness (affective)."},{"topic":"NSSI","vignette":"A 16-year-old is found to have superficial cutting marks on her forearms. She reports she cuts to 'make the numbness go away' and explicitly denies any wish to die.","question":"What is the key distinguishing feature between NSSI and a suicide attempt?","options":["The specific body location of the injury","The use of a sharp object rather than another method","No intent to die — the goal is typically emotion regulation, not death","The presence of any physical scarring"],"correct":2,"rationale":"The key distinguishing feature from suicide attempts is no intent to die. The goal of NSSI is typically emotion regulation or, less commonly, interpersonal communication — not death."},{"topic":"NSSI","vignette":"A 15-year-old with a history of NSSI over the past year presents for an unrelated medical visit.","question":"What is the recommended clinical practice given her NSSI history?","options":["Risk assessment is only warranted if the patient specifically requests it","A thorough suicide risk assessment should be performed, since NSSI is a significant risk factor for future suicide attempts even though the acute intent differs","NSSI and suicide attempts should be documented and treated identically","No suicide risk assessment is needed since NSSI by definition excludes suicidal intent"],"correct":1,"rationale":"NSSI is a significant risk factor for future suicide attempts, even though the acute intent differs — every NSSI presentation requires a thorough suicide risk assessment, since the two behaviors are related but distinct."}]},{"key":"5","label":"Practice Exam 5","questions":[{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 20-year-old woman binge eats roughly 3 times per week, feels intense guilt and disgust afterward, and eats alone due to embarrassment. She has never vomited, fasted, or exercised to compensate, and her BMI is 29.","question":"Which DSM-5 criterion set does this presentation most fully satisfy?","options":["Binge-eating disorder","ARFID","Anorexia nervosa, binge-eating/purging type","Bulimia nervosa"],"correct":0,"rationale":"Recurrent binge eating with guilt, disgust, and eating alone due to embarrassment, without any compensatory behavior, at an elevated BMI, matches binge-eating disorder — the absence of purging/fasting/excessive exercise is the key feature separating this from bulimia."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 12-year-old boy has restricted his diet to plain crackers and water since a severe choking episode 4 months ago. He has lost 9% of his body weight and now requires a nutritional supplement drink to meet basic caloric needs.","question":"Which diagnosis fits, and which ARFID subtype does the choking history represent?","options":["Anorexia nervosa, restricting type","ARFID, sensory-based avoidance subtype","ARFID, fear-based/aversive-experience subtype","Bulimia nervosa"],"correct":2,"rationale":"This is ARFID — restriction driven by a specific aversive/traumatic eating experience (choking), not by fear of weight gain or body-image concerns. Dependence on a nutritional supplement satisfies the functional-consequence requirement under Criterion A."},{"topic":"ARFID s/sx","vignette":"An 11-year-old with ARFID has been eating fewer than 8 foods for years. His pediatrician orders an upper GI series and stool studies to rule out reflux and malabsorption before proceeding with behavioral treatment.","question":"What is the purpose of this work-up?","options":["This work-up is unnecessary since ARFID is purely a behavioral diagnosis","To rule out a medical cause (malabsorption, GI reflux) that could fully explain the poor intake before attributing it to ARFID","To confirm a diagnosis of anorexia nervosa instead","ARFID always requires an endoscopy before diagnosis can be made"],"correct":1,"rationale":"ARFID must be differentiated from medical causes of poor intake such as malabsorption, GI reflux, or neoplasm. If the eating disturbance is fully explained by an identified medical condition, ARFID would not be the appropriate diagnosis — hence the work-up before finalizing the diagnosis."},{"topic":"ARFID s/sx","vignette":"A 9-year-old boy in an eating disorders clinic is compared with same-age patients with anorexia and bulimia. He is younger than most of the AN/BN patients, has a comorbid anxiety disorder, and his weight percentile falls between the typical AN and BN ranges.","question":"What does this comparison illustrate about ARFID patients as a group, relative to AN/BN patients in clinical samples?","options":["ARFID patients never have any nutritional or medical comorbidities","ARFID patients are typically older and have identical comorbidity rates to AN/BN patients","ARFID patients tend to be younger, more often male, and more likely to have comorbid anxiety or medical conditions than AN/BN patients","ARFID patients have the lowest weight percentile of the three groups"],"correct":2,"rationale":"Clinical-sample data show that compared with AN/BN, ARFID patients tend to be younger, more often male, and more likely to have comorbid medical or anxiety disorders, with a median weight percentile between that of AN and BN patients."},{"topic":"Therapies for eating disorders","vignette":"A 17-year-old with bulimia nervosa and a stable home environment begins outpatient treatment.","question":"Which psychotherapy has the strongest evidence base for her presentation?","options":["Cognitive-behavioral therapy","Play therapy","Psychodynamic therapy as first-line","Family-Based Treatment, identical to the anorexia protocol"],"correct":0,"rationale":"CBT is the most effective treatment for bulimia nervosa in adults and is generally the first-line psychotherapy; a manualized family-based approach also has evidence in adolescents, particularly for those from high-conflict families."},{"topic":"Therapies for eating disorders","vignette":"A prescriber is selecting an adjunctive medication for a 16-year-old with bulimia nervosa who has had a partial response to CBT alone.","question":"Which medication has the strongest pediatric evidence base for this indication?","options":["Lisdexamfetamine","Risperidone","Fluoxetine","Topiramate"],"correct":2,"rationale":"Fluoxetine, studied at doses up to 60 mg/day, has the best pharmacologic evidence among adolescents with bulimia nervosa — the one eating disorder medication with meaningful pediatric evidence."},{"topic":"Enuresis vs Encopresis","vignette":"A 4-year-old boy has been passing stool into his clothing about twice a month for the past 4 months, with a palpable stool mass noted on abdominal exam.","question":"Does this presentation meet the minimum age and frequency thresholds for an encopresis diagnosis?","options":["No — the frequency threshold requires at least weekly episodes","Yes — age 4 meets the minimum diagnostic age, and the frequency (≥1 event/month for ≥3 months) is met","Yes, but only if the child also meets criteria for enuresis","No — the minimum diagnostic age for encopresis is 5 years"],"correct":1,"rationale":"Encopresis requires age ≥4 years and ≥1 qualifying event per month for ≥3 months — both are met here. The palpable stool mass indicates the 'with constipation and overflow incontinence' subtype, accounting for roughly 80% of encopresis cases."},{"topic":"Enuresis vs Encopresis","vignette":"A 10-year-old boy who takes an anticholinergic medication for a bladder condition has recurrent nighttime wetting. His prescriber wonders whether this should be coded as primary enuresis.","question":"What must be established before diagnosing enuresis in this case?","options":["That the child has never previously achieved bladder control","That the child also has a diagnosed anxiety disorder","That the wetting is not attributable to the medication or another medical condition","That the wetting occurs exclusively during the day"],"correct":2,"rationale":"DSM-5 Criterion D for enuresis requires that the symptom is not attributable to the physiological effects of a substance (e.g., a diuretic or antipsychotic) or another medical condition — this must be ruled out before diagnosing enuresis, particularly when a relevant medication is already in use."},{"topic":"Nocturnal enuresis treatment","vignette":"A 6-year-old still wets the bed most nights. His parents haven't tried anything yet and are considering buying a bedwetting alarm system online before their upcoming appointment.","question":"What should be recommended as the initial approach before any device or medication, given his age?","options":["Minimize shame/punishment while awaiting spontaneous maturation, restrict evening fluids, eliminate caffeine, and void at bedtime","Start DDAVP at the lowest available dose","Refer immediately for urologic imaging","Begin the urine alarm immediately regardless of age or motivation"],"correct":0,"rationale":"For young children, the first step is behavioral and supportive: minimizing shame/punishment while awaiting spontaneous maturation, restricting evening fluids, eliminating caffeine, voiding at bedtime, and having the child help change their own bed to reduce negative parental reactions."},{"topic":"Nocturnal enuresis treatment","vignette":"A 12-year-old is motivated to actively participate in resolving his bedwetting. His clinician recommends a reward system alongside exercises to increase bladder capacity.","question":"What combination of interventions is being described?","options":["DDAVP started immediately without any behavioral component","Psychotherapy alone as the primary intervention","A star chart/reward system combined with bladder training (delayed voiding practice, stream interruption)","Overnight catheterization"],"correct":2,"rationale":"For motivated older children, a star chart/reward monitoring system combined with daytime continence work — bladder training exercises, delayed voiding practice to increase bladder capacity, and stream interruption to strengthen sphincter awareness — is an appropriate step before or alongside the urine alarm."},{"topic":"Encopresis treatment","vignette":"A family has been administering daily enemas to their child at home for 6 weeks to manage encopresis, with increasing household tension and limited improvement.","question":"What guidance should be given regarding this approach?","options":["The frequency of enemas should be increased until soiling fully resolves","Repeated parent-administered enemas are discouraged because they are harmful to the parent-child relationship","Enemas are appropriate only for children under 4 and should be discontinued in this case","Daily home enemas should continue indefinitely as the standard maintenance approach"],"correct":1,"rationale":"Repeated parent-administered enemas are specifically discouraged in encopresis management due to their harmful effect on the parent-child relationship — bowel cleanout is meant to be a brief initial step, not an ongoing home regimen."},{"topic":"Encopresis treatment","vignette":"A 6-year-old with encopresis without constipation is starting a behavior-shaping program with his family.","question":"How should the reward structure of this program be organized?","options":["Rewards only for a fully clean week, with no partial credit given","No behavioral component is used for this subtype; medication is the mainstay","Rewards first for sitting on the toilet, then for successful bowel movements","Punishment for soiling episodes combined with rewards for full compliance"],"correct":2,"rationale":"The behavior-shaping program for encopresis without constipation provides rewards first for sitting on the toilet, then for successful bowel movements — a stepwise shaping approach rather than an all-or-nothing or punitive structure."},{"topic":"ODD vs CD vs IED","vignette":"A 12-year-old has had 3 outbursts this year involving punching a hole in a wall and shoving a peer hard enough to cause bruising. Each outburst was sudden and grossly disproportionate to a minor trigger, such as losing a video game.","question":"Which diagnosis and criterion pathway best fits?","options":["IED cannot be diagnosed because the outbursts occurred less than twice weekly","Oppositional defiant disorder — vindictiveness criterion","Conduct disorder — this falls under the aggression-to-people/animals category","Intermittent explosive disorder — 3 outbursts involving property damage or injurious assault within 12 months"],"correct":3,"rationale":"IED Criterion A can be satisfied either by twice-weekly non-destructive outbursts for 3 months, or by 3 outbursts within 12 months involving property damage or injurious physical assault — the impulsive, disproportionate nature further supports IED over conduct disorder."},{"topic":"ODD vs CD vs IED","vignette":"A 15-year-old has bullied peers, forced a classmate into unwanted physical contact, and repeatedly stayed out overnight without permission, with symptom onset beginning at age 14.","question":"Which diagnosis applies, and which DSM-5 category covers the forced physical contact?","options":["Oppositional defiant disorder — 'Vindictiveness' category","Conduct disorder — 'Serious Rule Violations' category","Conduct disorder — 'Aggression to People/Animals' category","Intermittent explosive disorder — Criterion A(1)"],"correct":2,"rationale":"Conduct disorder requires ≥3 of 15 behaviors across 4 categories within 12 months. Forcing someone into unwanted physical contact falls under 'Aggression to People/Animals'; staying out overnight without permission falls under 'Serious Rule Violations.' With onset at age 14 (after age 10), this would be specified as adolescent-onset."},{"topic":"Meds for physically aggressive children","vignette":"A resident considers prescribing a benzodiazepine as the first-line agent for a physically aggressive, non-psychotic 9-year-old in the emergency department.","question":"Why is this generally avoided as a default choice?","options":["Benzodiazepines are absolutely contraindicated in all pediatric patients","Benzodiazepines require IV access, which limits their use in this scenario","Benzodiazepines have no sedative properties in the pediatric population","Benzodiazepines can cause paradoxical disinhibition and worsen agitation in children"],"correct":3,"rationale":"Benzodiazepines should be avoided as a default choice for pediatric aggression because they can cause paradoxical disinhibition and worsen agitation — second-generation antipsychotics are generally preferred for acute agitation instead."},{"topic":"Meds for physically aggressive children","vignette":"A 10-year-old with newly treated ADHD (stimulant medication started 3 weeks ago) shows substantially reduced aggression at school, without any antiaggression medication being added.","question":"What principle does this improvement best illustrate?","options":["Stimulant medications are the first-line antiaggression treatment for all pediatric aggression","All pediatric aggression should be treated with an antipsychotic regardless of etiology","If aggression is secondary to a treatable comorbidity, treating that condition often reduces aggression more effectively than an antiaggression medication alone","This improvement is unrelated to the ADHD treatment and is likely coincidental"],"correct":2,"rationale":"The first step in managing pediatric aggression is identifying and addressing the underlying cause. When aggression is secondary to a treatable comorbidity like ADHD, treating that condition is often more effective than adding an antiaggression medication."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 13-year-old's parents separated 7 weeks ago. He has since developed irritability, poor concentration, and tearfulness clearly out of proportion to what would typically be expected, without meeting criteria for any other DSM-5 disorder.","question":"Which diagnosis fits, and what type of stressor does it require?","options":["Adjustment disorder cannot be diagnosed unless the stressor is life-threatening","Acute stress disorder — the separation meets Criterion A trauma exposure","PTSD — the parental separation meets Criterion A trauma exposure","Adjustment disorder — can follow any identifiable stressor, not necessarily life-threatening"],"correct":3,"rationale":"Adjustment disorder requires only an identifiable stressor of any severity (divorce, a move, a bad grade) — unlike PTSD/ASD, which require Criterion-A trauma (actual/threatened death, serious injury, or sexual violence). Onset is within 3 months of the stressor."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A clinician is deciding between adjustment disorder and PTSD for a 16-year-old who witnessed a violent assault 6 weeks ago and now meets full PTSD criteria.","question":"Which diagnosis takes precedence, and why?","options":["Neither diagnosis applies because 6 weeks exceeds the adjustment disorder window","Adjustment disorder — it is always diagnosed first as the less severe option","PTSD — when full criteria for PTSD or another specific disorder are met, that diagnosis takes precedence over adjustment disorder","Both diagnoses should be assigned simultaneously"],"correct":2,"rationale":"Per Adjustment Disorder Criterion C, when full criteria for PTSD or another specific disorder are met, that diagnosis takes precedence — adjustment disorder functions as a diagnosis of exclusion for a stress reaction not meeting criteria for a more specific disorder."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 17-year-old reports recurrent, extensive gaps in memory for periods of significant childhood abuse, well beyond what would be explained by ordinary forgetfulness. She shows no evidence of distinct personality states.","question":"Which dissociative disorder best fits this presentation?","options":["Depersonalization/derealization disorder","Acute stress disorder","Dissociative identity disorder","Dissociative amnesia"],"correct":3,"rationale":"Dissociative amnesia involves an inability to recall important autobiographical information, usually traumatic or stressful, that is too extensive to be ordinary forgetfulness — distinct from dissociative identity disorder (requires ≥2 distinct personality states) and depersonalization/derealization disorder (unreality/detachment with intact reality testing)."},{"topic":"Trauma therapy","vignette":"A school-based counseling program is designed to deliver group trauma treatment to several students exposed to a shooting near their school.","question":"Which trauma therapy model is specifically designed for this school-based group format?","options":["Child-Parent Psychotherapy","Narrative Exposure Therapy/KidNET","CBITS (Cognitive Behavioral Intervention for Trauma in Schools)","Seeking Safety"],"correct":2,"rationale":"CBITS is school-based group TF-CBT, designed for exactly this scenario. Child-Parent Psychotherapy targets young children and their caregiver dyad; Seeking Safety addresses co-occurring PTSD and substance use; NET/KidNET targets war/refugee trauma."},{"topic":"Trauma therapy","vignette":"A treatment program for traumatized children routinely screens the accompanying parent for their own trauma symptoms before initiating the child's treatment.","question":"What principle does this practice reflect?","options":["Caregiver screening is unique to one specific trauma model and not used broadly","Only the child's symptoms should ever be formally assessed in pediatric trauma care","Caregiver trauma symptoms are irrelevant to a child's treatment outcome","Family/caregiver involvement and screening/treating the caregiver's own trauma symptoms are consistent features across effective trauma therapy models"],"correct":3,"rationale":"Family/caregiver involvement and screening/treating the caregiver's own trauma symptoms is a consistent feature across effective pediatric trauma therapy models generally, since caregiver functioning significantly affects a child's recovery trajectory."},{"topic":"TF-CBT / PRACTICE","vignette":"A child has completed a detailed account of his traumatic experience in TF-CBT. His therapist now plans a session where he shares his progress and narrative directly with his mother in a supported setting.","question":"Which PRACTICE component is being implemented?","options":["Relaxation","In-vivo mastery of trauma reminders","Conjoint child-parent sessions","Psychoeducation and parenting skills"],"correct":2,"rationale":"Conjoint child-parent sessions are where the child shares progress/narrative with the caregiver in a supported setting — reflecting TF-CBT's explicit inclusion of the caregiver, not just the child, as a distinguishing feature of the model."},{"topic":"TF-CBT / PRACTICE","vignette":"A therapist explains to a worried family why TF-CBT does not begin with a detailed discussion of the traumatic event, despite that being the family's main concern.","question":"What is the correct explanation for this sequencing?","options":["The trauma narrative is optional and rarely used in TF-CBT","Conjoint sessions must occur before any individual skill-building begins","TF-CBT does not include a trauma narrative component at all","The stabilization/coping-skills components always come before trauma narrative work — trauma processing is never the starting point"],"correct":3,"rationale":"In TF-CBT, the stabilization/coping-skills components (Psychoeducation/Parenting, Relaxation, Affective modulation, Cognitive processing) always come before trauma narrative work, ensuring adequate coping skills exist before engaging with the traumatic memory."},{"topic":"TF-CBT / PRACTICE","vignette":"A child in TF-CBT has completed her trauma narrative and is now practicing calmly approaching a safe reminder of the trauma — a similar vehicle to the one involved in her accident — that she had been avoiding.","question":"Which PRACTICE component does this represent?","options":["Cognitive processing/coping","Enhancing safety","In-vivo mastery of trauma reminders","Affective modulation"],"correct":2,"rationale":"In-vivo mastery of trauma reminders involves real-world graded exposure to safe trauma reminders that are being avoided, distinct from the trauma narrative itself, which is the therapist-supported development of a detailed account of the traumatic event."},{"topic":"Insomnia treatment","vignette":"A 9-year-old has trouble falling asleep 4 nights weekly for the past 2 months, with mild daytime tiredness but no major functional impairment.","question":"Does this presentation meet full DSM-5 criteria for insomnia disorder?","options":["Yes, because any pediatric sleep difficulty automatically qualifies for the diagnosis","No — the frequency threshold of at least 3 nights weekly has not been met","Yes — all diagnostic criteria are clearly met","No — the duration threshold of at least 3 months has not yet been reached"],"correct":3,"rationale":"Insomnia Disorder requires occurrence ≥3 nights/week (met here) AND presence for ≥3 months (not yet met at 2 months) — the duration threshold separates a diagnosable disorder from a shorter period of difficulty."},{"topic":"Insomnia treatment","vignette":"A family asks what the recommended first step should be for their school-age child's new difficulty falling asleep, before any medication is considered.","question":"What is first-line management for pediatric insomnia across all ages?","options":["Behavioral/sleep hygiene measures — a consistent bedtime routine, using the bed only for sleep, a regular schedule, removing electronics, and avoiding naps/caffeine","A trial of a sedative-hypnotic medication","Melatonin as the very first step, before any behavioral changes are attempted","Referral for polysomnography before any behavioral intervention"],"correct":0,"rationale":"First-line management (all ages) for pediatric insomnia is behavioral/sleep hygiene: a consistent bedtime routine, using the bed only for sleep, a regular sleep-wake schedule, removing electronics, avoiding naps/caffeine, and a transitional object or night-light for younger children."},{"topic":"Nightmare treatment","vignette":"A family asks what the first step in managing their 7-year-old's frequent nightmares should be, before any medication is considered.","question":"What is the first-line behavioral/psychotherapeutic approach?","options":["A sedative-hypnotic to suppress dreaming","No intervention is warranted for pediatric nightmares","Prazosin as the initial step regardless of severity","Reassurance, normalizing the sleep schedule, relaxation/imagery, imagery rehearsal therapy, and systematic desensitization/dream reorganization"],"correct":3,"rationale":"First-line nightmare treatment is behavioral/psychotherapeutic: reassurance, normalizing the sleep schedule, relaxation/imagery, imagery rehearsal therapy, and systematic desensitization/dream reorganization — medication is reserved for significant, persistent, function-impairing cases."},{"topic":"Nightmare treatment","vignette":"A 15-year-old's nightmares are recognized as a core symptom of her underlying PTSD, occurring nearly every night.","question":"What should be prioritized as the primary intervention?","options":["Prazosin as monotherapy without addressing the PTSD","Treating the underlying PTSD, usually with TF-CBT, as the primary intervention","No treatment, since PTSD-related nightmares are expected to resolve without intervention","A nightly benzodiazepine for sleep suppression"],"correct":1,"rationale":"When nightmares are a symptom of PTSD, treating the underlying PTSD (usually with TF-CBT) is the primary intervention — nightmare-specific treatments like prazosin or imagery rehearsal are adjuncts, not replacements, for treating the root trauma-related disorder."},{"topic":"AUD s/sx and treatment","vignette":"An 18-year-old college freshman who has been drinking heavily nearly every day stops suddenly after being hospitalized for an unrelated injury. Within 12 hours, nursing notes describe diaphoresis, a resting heart rate of 118, hand tremor, and brief episodes of seeing shadows moving in the corner of the room.","question":"Which condition is this, and how many associated symptoms are required for diagnosis?","options":["Delirium tremens is the only possible diagnosis at this early stage","This does not meet criteria for any DSM-5 alcohol-related diagnosis","Alcohol use disorder — this represents Criterion A symptom #10 alone","Alcohol withdrawal — at least 2 of the listed symptoms (autonomic hyperactivity, tremor, insomnia, nausea/vomiting, transient hallucinations/illusions, psychomotor agitation, anxiety, seizures)"],"correct":3,"rationale":"Alcohol withdrawal requires ≥2 of the listed symptoms, developing within hours to days of cessation/reduction after heavy, prolonged use — met here with tremor, sweating/tachycardia (autonomic hyperactivity), and transient hallucinations/illusions."},{"topic":"AUD s/sx and treatment","vignette":"A 16-year-old boy whose father and paternal grandfather both struggled with alcoholism asks his NP whether his family history actually increases his own risk, or if it's 'just something that happens in some families by chance.'","question":"What should the NP explain about the genetic contribution to alcoholism risk based on family history?","options":["The genetic contribution to family history of alcoholism is strongest in males","Genetics play no meaningful role in adolescent alcohol use disorder risk","Family history is only a risk factor if both parents have AUD","The genetic contribution is equally strong regardless of the affected parent's sex"],"correct":0,"rationale":"A family history of alcoholism is a recognized risk factor for adolescent alcohol use, and the genetic contribution to that risk is described as strongest in males, alongside other markers like comorbid ADHD/ODD/CD and earlier-onset substance use."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A patient who uses cannabis occasionally, about once monthly, with no diagnosed cannabis use disorder, is being evaluated for possible cannabis withdrawal after a brief period of abstinence.","question":"Can cannabis withdrawal be diagnosed in this patient?","options":["No — cannabis withdrawal is not a recognized DSM-5 diagnosis","Yes, but only if the patient also has a mild cannabis use disorder","Yes — withdrawal can be diagnosed regardless of use pattern or disorder severity","No — cannabis withdrawal can only be diagnosed in the presence of a moderate or severe cannabis use disorder"],"correct":3,"rationale":"Cannabis withdrawal can only be diagnosed in the presence of a moderate or severe cannabis use disorder — occasional, non-disordered use does not meet the heavy, prolonged use pattern required for a withdrawal diagnosis."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A 17-year-old in treatment for cannabis use disorder admits that he frequently resumes use specifically because it relieves his irritability and sleep difficulty.","question":"What treatment-planning point does this illustrate?","options":["This pattern indicates he does not actually have a cannabis use disorder","Many adolescents use cannabis or another substance specifically to relieve withdrawal symptoms — an important relapse driver to address in treatment planning","This should be treated primarily with a benzodiazepine to eliminate the withdrawal trigger","Withdrawal-driven relapse is unique to cannabis and does not occur with other substances"],"correct":1,"rationale":"Many adolescents report using cannabis or another substance specifically to relieve withdrawal symptoms — recognizing this as an important relapse driver is a key part of treatment planning for cannabis use disorder and its withdrawal syndrome."},{"topic":"Motivational Interviewing","vignette":"A clinician is in the early part of an MI conversation, focused primarily on building rapport and a collaborative relationship before addressing any specific behavior change.","question":"Which phase of MI is being described, and what comes next in sequence?","options":["Planning — the final phase, occurring first in this case","Focusing — followed by Engaging, then Evoking and Planning","Evoking — followed by Engaging, Focusing, and Planning","Engaging — followed by Focusing, Evoking, and Planning"],"correct":3,"rationale":"The 4 phases of MI occur in order: Engaging (building rapport) → Focusing (guiding toward a clear target for change) → Evoking (eliciting the patient's own change talk) → Planning (building a concrete plan once change talk predominates)."},{"topic":"Motivational Interviewing","vignette":"A patient who spent several sessions saying 'I suppose I need to deal with this eventually' now tells his clinician, 'I've decided — I'm going to talk to my coach about cutting back on supplements, and I already know what I'm going to say to him.'","question":"What does this language shift signal, and which MI phase does it indicate readiness for?","options":["Readiness for the Planning phase — signaled by language shifting from 'need/should' to 'will/plan/going to'","A relapse back into an earlier stage of ambivalence","No particular clinical significance","Readiness for the Engaging phase to begin"],"correct":0,"rationale":"Readiness to progress toward planning/action is signaled by a shift in language — from 'need to'/'should' toward 'will'/'going to'/'plan to' — this shift is the practical cue that a patient is ready to move into the Planning phase of MI."},{"topic":"Change theory","vignette":"A patient relapses to substance use after 4 months of sobriety. The treatment team frames this as an expected, normal part of the recovery process rather than a treatment failure.","question":"What principle from change theory supports this framing?","options":["Relapse should be treated as a moral failing requiring a consequence-based response","Relapse indicates the Transtheoretical Model does not apply to this patient","Relapse means the patient must restart treatment entirely from Precontemplation with a new therapist","Relapse is expected and should be reframed as a predictable part of the change process, not a catastrophe or reason to end treatment"],"correct":3,"rationale":"Relapse is explicitly framed as an expected, predictable part of the change process — not a catastrophe or reason to end treatment. This principle applies equally to substance use, eating disorder, and other behavior-change work."},{"topic":"Change theory","vignette":"A patient has been abstinent from alcohol for 9 months and is now working with her clinician to identify situations that could trigger a return to drinking.","question":"Which TTM stage is this, and what is the clinician's primary task?","options":["Action — actively modifying behavior for the first time","Maintenance — relapse-prevention planning and reinforcing gains","Contemplation — still ambivalent about whether to change","Preparation — building an initial plan before any behavior change has started"],"correct":1,"rationale":"Sustained change over several months with a focus on preventing relapse describes the Maintenance stage — the clinician's task is relapse-prevention planning and reinforcing the gains already made."},{"topic":"Children and foster care","vignette":"A family court is weighing whether to pursue reunification or terminate parental rights for a child in short-term foster care following a substantiated maltreatment case.","question":"What guiding principle should inform the pace of this decision?","options":["Reunification should never be considered once a child enters foster care","The child's stated preference should be the sole determining factor regardless of age","Decisions should always be delayed at least several years to maximize time for parental rehabilitation","Child welfare agencies and family courts should move quickly to determine whether parents can be rehabilitated and children returned, or whether parental rights should be terminated"],"correct":3,"rationale":"Short-term foster placement may be necessary while a home is stabilized, but child welfare agencies and family courts should move quickly to determine whether parents can be rehabilitated and children returned, or whether parental rights should be terminated — minimizing prolonged uncertainty and placement instability."},{"topic":"Children and foster care","vignette":"A psychiatric NP evaluates a new patient recently placed in foster care, with no prior clinical records available at the initial visit.","question":"What clinical assumption and approach is recommended at intake?","options":["A trauma-informed evaluation that assumes a trauma history until proven otherwise, with attention to attachment history","An assumption that the child has no trauma history unless explicitly documented","Treating the foster placement itself as the primary source of any presenting symptoms","Deferring any evaluation until the caseworker provides a full social history"],"correct":0,"rationale":"The recommended clinical approach for children in foster care includes a trauma-informed evaluation (assuming a trauma history until proven otherwise), coordination with caseworkers/courts, attention to attachment history, and support for foster/adoptive caregivers."},{"topic":"Mandated reporter","vignette":"A clinician suspects abuse based solely on a child's behavioral presentation and clinical judgment, without any direct disclosure from the child or an obvious physical exam finding.","question":"Does the mandated reporting duty apply in this scenario?","options":["Yes — the reporting duty applies regardless of the source of suspicion, including clinical judgment based on presentation/behavior","No — a report requires a physical exam finding or a collateral report","No — a report can only be made following direct disclosure by the child","The duty only applies if a parent confirms the suspicion"],"correct":0,"rationale":"Mandated reporting duty applies regardless of the source of suspicion — disclosure by the child, physical findings, a collateral report, or clinical judgment based on presentation/behavior can each independently trigger the reporting obligation."},{"topic":"Mandated reporter","vignette":"An NP is preparing to file a report for suspected abuse and is deciding how to handle communication with the family.","question":"What is standard practice regarding transparency with the family when abuse is suspected?","options":["Only inform the family if they directly ask whether a report was made","Tell the parents that an investigation will follow and that helpful services may be available through the child protection agency, except where it would endanger the child","Wait until the investigation concludes before telling the family a report was filed","Never inform the family that a report has been made under any circumstances"],"correct":1,"rationale":"Standard practice is to tell parents that an investigation will follow and that helpful services may be available through the child protection agency — transparency with the family, except where it would endanger the child, is part of standard practice."},{"topic":"Grief in children","vignette":"A 4-year-old repeatedly asks when her deceased mother is 'coming back from her trip.'","question":"What does this reflect about her developmental understanding of death?","options":["Children at this age have a fully realistic understanding of death's permanence","At ages 4-5, death is often understood as reversible, like sleep or a trip — a normal developmental stage, not denial","This indicates a pathological grief reaction requiring urgent intervention","This reflects dissociative symptoms consistent with complicated grief"],"correct":1,"rationale":"Children's understanding of death is developmental: under 2-3 years, no true understanding, only separation-related anxiety; ages 4-5, death is seen as reversible; more realistic understanding emerges around ages 10-11. This 4-year-old's belief is a normal developmental stage."},{"topic":"Grief in children","vignette":"A 10-year-old whose father died violently 9 months ago continues to show intense, unrelenting grief symptoms significantly interfering with school and friendships, well beyond what is typical for peers who experienced a natural-cause loss.","question":"What diagnostic consideration is most appropriate given the violent nature of the death and persistence of symptoms?","options":["Escalation to childhood traumatic grief or persistent complex bereavement disorder should be considered","This should be diagnosed as major depressive disorder exclusively, without consideration of a grief-specific process","No psychiatric diagnosis can apply to grief in children under any circumstances","This is entirely normal grief regardless of duration or the traumatic circumstances"],"correct":0,"rationale":"If a death was traumatic, normal grief may escalate to childhood traumatic grief or persistent complex bereavement disorder — clinicians distinguish normal bereavement from a disorder by intensity, quality, and persistence beyond expected norms."},{"topic":"Group therapy techniques","vignette":"By the fifth session of a support group, two members openly clash over how the group should spend its time, and several others take sides, creating visible tension that persists across sessions.","question":"How should this stage be understood within Tuckman's model?","options":["Storming — necessary friction for the group to mature, not a failed or pathological stage","Adjourning — the group is prematurely ending due to conflict","Forming — members are still orienting to the group's norms","A sign that the group therapy model has failed and should be discontinued"],"correct":0,"rationale":"Storming is a necessary, not a failed, stage — conflict as members find their place and surface differing ideas is expected as the group matures toward Norming and eventually Performing."},{"topic":"Group therapy techniques","vignette":"A supervisor reviewing a group therapy trainee's case notes points out that the members' sense of belonging and mutual acceptance is what is allowing them to tolerate disagreement and accept difficult feedback from one another.","question":"Which Yalom therapeutic factor does the supervisor's comment describe?","options":["Existential factors","Group cohesiveness","Corrective recapitulation of the primary family group","Instillation of hope"],"correct":1,"rationale":"Group cohesiveness — the sense of belonging and mutual acceptance — is considered by Yalom the primary therapeutic factor, foundational to enabling members to tolerate conflict, accept feedback, and engage in change."},{"topic":"Angry patient during family therapy","vignette":"During a heated exchange between two siblings in a family session, one teenager stands up, knocks over a chair, and appears ready to physically confront the other.","question":"What should the clinician do?","options":["End all future family sessions for this family permanently","Pause the joint session, briefly separate members, or shift to individual check-ins — safety takes priority over completing the planned agenda","Continue the session as planned to avoid rewarding the escalation with a break","Call the other family members into the room to help de-escalate the dysregulated member"],"correct":1,"rationale":"If a member becomes too dysregulated to continue safely, the clinician may need to pause the session, briefly separate members, or shift to individual check-ins before resuming — safety always takes priority over completing the planned agenda."},{"topic":"Angry patient during family therapy","vignette":"A highly charged, resistant family struggles to engage productively when the therapist asks direct problem-focused questions about the conflict.","question":"What alternative technique can help de-escalate tension while still surfacing the core conflict?","options":["A solution-oriented question, such as 'If you woke up tomorrow and your family was exactly how you wanted it, what would be different?'","Ending the session early whenever resistance is encountered","Asking each member to individually blame the identified patient for the conflict","Repeating the same problem-focused question more forcefully"],"correct":0,"rationale":"A solution-oriented question can de-escalate tension better than a problem-focused question with a resistant or highly charged family, while still surfacing the core conflict — shifting the frame from blame to a shared, future-oriented goal."},{"topic":"Learning domains","vignette":"A family understands the facts about their child's new diagnosis but continues to resist changes to their household routines, expressing ongoing skepticism about whether the diagnosis is even accurate.","question":"Which domain is the primary barrier to effective psychoeducation in this scenario?","options":["Affective domain — attitudes, values, feelings, and willingness to engage have not been addressed","Psychomotor domain — the family cannot physically perform any required tasks","Cognitive domain — the family lacks basic factual knowledge","This scenario does not relate to any of the three learning domains"],"correct":0,"rationale":"The affective domain covers attitudes, values, feelings, and willingness to engage — a family expressing skepticism and resisting change despite having factual knowledge illustrates an affective-domain barrier, not a cognitive knowledge gap."},{"topic":"Learning domains","vignette":"A clinic is redesigning its intake psychoeducation packet for families of children newly diagnosed with generalized anxiety disorder, currently just a two-page handout of facts and definitions.","question":"What should be added for the psychoeducation to be effective, beyond what the handout already provides?","options":["Addressing only the affective domain, since attitude change drives all behavior change","Addressing all three domains — cognitive, affective, and psychomotor — not just information transfer","Focusing exclusively on the psychomotor domain, since hands-on skills are remembered longest","Focusing exclusively on the cognitive domain, since factual knowledge is the foundation of all other learning"],"correct":1,"rationale":"Effective psychoeducation addresses all three domains, not just information transfer (cognitive) — a family can 'know' the facts but still resist behavior change without addressing attitudes (affective) and practiced skill (psychomotor)."},{"topic":"NSSI","vignette":"A school nurse documents that a 15-year-old has come in with fresh superficial scratches on her forearm on 7 separate occasions over the past year, each time reporting she did it to relieve overwhelming distress and with no wish to die.","question":"How many days of self-inflicted injury within the past year are required by DSM-5 proposed research criteria to consider a diagnosis of NSSI?","options":["At least 1 day","At least 10 days","At least 5 days","At least 20 days"],"correct":2,"rationale":"DSM-5 proposed criteria for NSSI require intentional self-inflicted injury on at least 5 days in the last year, likely to cause bleeding, bruising, or pain, with the expectation of only minor/moderate harm and no suicidal intent."},{"topic":"NSSI","vignette":"When a 16-year-old admits to cutting during a session, his counselor reacts with visible alarm, calls it 'a huge red flag,' and tells him he needs to promise right now that he will never do it again.","question":"What is the concern with this response, per recommended clinical approach?","options":["Shame-based responses are specifically effective for adolescent patients","Punitive or shaming responses increase secrecy and worsen the therapeutic alliance; a curious, function-focused approach is preferred","This response has no meaningful impact on the therapeutic relationship either way","This response is appropriate and should be used consistently to discourage the behavior"],"correct":1,"rationale":"Punitive or shaming responses to NSSI disclosure increase secrecy and worsen the therapeutic alliance. The recommended approach is curiosity about function rather than focusing only on stopping the behavior."}]},{"key":"6","label":"Practice Exam 6","questions":[{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 15-year-old with anorexia nervosa has been eating in binges roughly once a week for the past 2 months, immediately followed by self-induced vomiting, in addition to her ongoing severe caloric restriction. Her weight remains significantly below expected for her height.","question":"Which anorexia nervosa subtype applies?","options":["Binge-eating/purging type","This should be reclassified as binge-eating disorder instead of anorexia","This should be reclassified as bulimia nervosa instead of anorexia","Restricting type"],"correct":0,"rationale":"Anorexia nervosa is specified as binge-eating/purging type when the patient engages in recurrent binge eating or purging behavior within the last 3 months, while still meeting full anorexia criteria (significantly low weight, fear of weight gain, body-image disturbance) — as opposed to bulimia nervosa, which by definition does not occur in the setting of a significantly low body weight."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 5-year-old girl with intellectual disability has been observed eating small stones from the playground several times over the past 2 months. Her weight and growth are age-appropriate, and she shows no interest in dieting or her body shape.","question":"Which diagnosis fits, and what makes it distinct from the other eating/feeding disorders in this differential?","options":["ARFID — restriction driven by sensory sensitivity","Anorexia nervosa — restriction driven by fear of weight gain","Pica — the ingested material is nonnutritive and nonfood, unrelated to weight or body image","Binge-eating disorder — recurrent episodes of eating a large amount of food"],"correct":2,"rationale":"Pica is defined by persistent eating of nonnutritive, nonfood substances (here, stones) for at least a month, developmentally inappropriate, and unrelated to weight or shape concerns — distinguishing it from the other four diagnoses in this group, all of which involve actual food intake patterns."},{"topic":"ARFID s/sx","vignette":"A 4-year-old girl has never shown interest in eating, frequently forgets meals unless prompted repeatedly, and eats small portions even of preferred foods. Her growth has plateaued over the last 8 months.","question":"Which ARFID subtype is illustrated, and how common is it relative to the other subtypes?","options":["Fear-based avoidance — the most common of the three ARFID subtypes","Lack of interest in eating — the most common of the three ARFID subtypes","This does not correspond to any recognized ARFID subtype","Sensory-based avoidance — the most common of the three ARFID subtypes"],"correct":1,"rationale":"Low appetite drive and needing repeated prompting to eat reflect the 'lack of interest in eating' subtype, which is the most common of the three ARFID presentations, ahead of sensory-based avoidance and the least common, fear-based/aversive-experience type."},{"topic":"ARFID s/sx","vignette":"A multidisciplinary feeding team is treating a 6-year-old with ARFID, sensory-avoidance subtype, using graded food exposure and positive reinforcement for trying new foods, alongside a speech-language pathologist for oral-motor skills.","question":"What treatment principle does this approach reflect?","options":["First-line fluoxetine with behavioral therapy as an adjunct","Family-Based Treatment identical to the anorexia nervosa protocol","A multidisciplinary, behaviorally-based approach tailored to the specific restrictive driver underlying the ARFID presentation","Inpatient hospitalization is required for all ARFID cases regardless of severity"],"correct":2,"rationale":"ARFID treatment is multidisciplinary and behaviorally based, tailored to the specific restrictive driver (sensory, fear-based, or lack of interest), often involving SLP/OT feeding-team support — distinct from the Maudsley FBT model used specifically for adolescent anorexia."},{"topic":"Therapies for eating disorders","vignette":"A 22-year-old with binge-eating disorder and obesity is being evaluated for pharmacotherapy after limited response to CBT alone.","question":"Which medication is FDA-approved for binge-eating disorder in adults?","options":["Lisdexamfetamine","Naltrexone","Bupropion","Fluoxetine"],"correct":0,"rationale":"Lisdexamfetamine is FDA-approved for binge-eating disorder in adults, though pediatric data remain limited. CBT and interpersonal psychotherapy remain the first-line psychotherapies for BED."},{"topic":"Therapies for eating disorders","vignette":"A family and their 15-year-old daughter with anorexia nervosa are not able to engage consistently in whole-family sessions due to high conflict at home. The treatment team modifies the approach so the therapist meets with the parents alone.","question":"What does the evidence say about this modification, Parent-Focused Treatment, compared with standard conjoint FBT?","options":["Parent-Focused Treatment has been shown to be significantly inferior and is not recommended","Parent-Focused Treatment eliminates the need for any behavioral intervention","One RCT found Parent-Focused Treatment was more efficient at achieving weight restoration","Parent-Focused Treatment is only appropriate for bulimia nervosa, not anorexia"],"correct":2,"rationale":"Parent-Focused Treatment (PFT), where the therapist meets with parents only rather than the whole family, was found in one RCT to be more efficient at achieving weight restoration than standard conjoint FBT — a useful option for families where joint sessions are difficult."},{"topic":"Enuresis vs Encopresis","vignette":"A pediatric clinic is comparing two young patients: a 4-year-old with fecal soiling and a 4-year-old with nighttime bedwetting.","question":"Which statement about the diagnostic age thresholds for these two conditions is accurate?","options":["Neither child meets the minimum diagnostic age for either condition","The 4-year-old with soiling can meet the minimum age for encopresis, but the 4-year-old with wetting cannot yet meet the minimum age for enuresis","The minimum age for enuresis is younger than for encopresis","Both children meet the minimum diagnostic age for their respective conditions"],"correct":1,"rationale":"Encopresis requires a minimum age of 4 years, while enuresis requires a minimum age of 5 years — a frequently tested age discrepancy. The 4-year-old with soiling meets the encopresis age threshold, but a 4-year-old with wetting does not yet meet the enuresis age threshold."},{"topic":"Enuresis vs Encopresis","vignette":"A 7-year-old girl has both nighttime and daytime wetting episodes occurring 3-4 times weekly for the past 6 months, causing significant embarrassment and school avoidance.","question":"Which enuresis specifier applies to her presentation?","options":["Nocturnal only","Diurnal only","Nocturnal and diurnal","This does not meet criteria because both day and night symptoms are present"],"correct":2,"rationale":"Enuresis specifiers include nocturnal only (most common), diurnal only, or nocturnal and diurnal. With wetting occurring both at night and during the day, meeting the frequency (≥2x/week for ≥3 months) and distress criteria, the combined 'nocturnal and diurnal' specifier applies."},{"topic":"Nocturnal enuresis treatment","vignette":"A behavioral sleep clinic pairs the urine alarm with cleanliness training, retention control exercises, and an overlearning protocol for an 8-year-old with treatment-resistant bedwetting.","question":"What outcome would be expected from this combined behavioral approach?","options":["It stops bedwetting in about two-thirds of children","It is effective only in children younger than 5","It requires concurrent DDAVP to achieve any benefit","It provides no additional benefit compared with the alarm used alone"],"correct":0,"rationale":"Combining the urine alarm with cleanliness training, retention control, and overlearning stops bedwetting in about two-thirds of children — a notably stronger outcome than using the alarm in isolation."},{"topic":"Nocturnal enuresis treatment","vignette":"A 14-year-old's nocturnal enuresis began shortly after a traumatic car accident. Her family asks whether psychotherapy would help resolve the wetting directly.","question":"What is the appropriate role of psychotherapy in this case?","options":["Psychotherapy has no role in enuresis under any circumstances","Psychotherapy is the first-line treatment for all cases of enuresis","Psychotherapy is rarely useful for enuresis itself, but may help since this presentation appears trauma/stress-related","Psychotherapy should replace the urine alarm as the primary intervention in all cases"],"correct":2,"rationale":"Psychotherapy is rarely useful for enuresis itself but may help address psychosocial sequelae or cases that are trauma/stress-related — this patient's clear temporal link to a traumatic event makes psychotherapy a reasonable adjunct alongside standard behavioral measures."},{"topic":"Encopresis treatment","vignette":"Most children with encopresis are successfully managed by their pediatrician in primary care.","question":"Which cases warrant referral for additional psychological intervention?","options":["Only cases occurring in children younger than 4 years","Complex or treatment-resistant cases, particularly those with associated psychiatric conditions such as ODD or anxiety","Only cases without any evidence of constipation","All cases of encopresis, regardless of severity or response to initial treatment"],"correct":1,"rationale":"Most encopresis cases are managed by a pediatrician; complex or treatment-resistant cases, especially those with associated psychiatric disorders like ODD or anxiety, warrant referral for individual/family psychological intervention."},{"topic":"Encopresis treatment","vignette":"A pediatrician completes a 3-day oral polyethylene glycol cleanout for an impacted 8-year-old with chronic encopresis and is now planning the next phase of care.","question":"What should the subsequent maintenance ('bowel retraining') phase include?","options":["Discontinuation of all interventions now that the cleanout is complete","A low-fib
