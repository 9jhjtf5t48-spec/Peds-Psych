pattern indicates the patient does not actually have a cannabis use disorder","Withdrawal-driven relapse is unique to cannabis and does not occur with other substances"],"correct":1,"rationale":"Many adolescents report using cannabis or another substance specifically to relieve withdrawal symptoms — recognizing this as an important relapse driver is a key part of treatment planning for cannabis use disorder and its withdrawal syndrome."},{"topic":"Motivational Interviewing","vignette":"A clinician is in the early stage of an MI conversation, focused primarily on building rapport and a collaborative working relationship before addressing any specific behavior change.","question":"Which of the 4 phases of MI is being described, and what comes next in order?","options":["Planning — the final phase, occurring first in this case","Engaging — followed by Focusing, Evoking, and Planning","Focusing — followed by Engaging, then Evoking and Planning","Evoking — followed by Engaging, Focusing, and Planning"],"correct":1,"rationale":"The 4 phases of MI occur in order: Engaging (building rapport) → Focusing (guiding toward a clear target for change) → Evoking (eliciting the patient's own change talk) → Planning (building a concrete plan once change talk predominates)."},{"topic":"Motivational Interviewing","vignette":"During an MI session, a patient shifts from saying 'I guess I should probably cut back' to 'I'm going to cut back starting Monday and I have a plan for it.'","question":"What does this language shift signal, and which MI phase does it indicate readiness for?","options":["Readiness for the Engaging phase to begin","Readiness for the Planning phase — signaled by language shifting from 'need/should' to 'will/plan/going to'","A relapse into the Precontemplation stage","No clinical significance — MI does not track language shifts"],"correct":1,"rationale":"Readiness to progress toward planning/action is signaled by a shift in language — from 'need to'/'should' toward 'will'/'going to'/'plan to.' This language shift is the practical cue that a patient is ready to move into the Planning phase of MI."},{"topic":"Change theory","vignette":"A patient relapses to substance use after 3 months of sobriety. The treatment team frames this as an expected, normal part of the recovery process rather than a treatment failure.","question":"What principle from change theory supports this framing?","options":["Relapse means the Transtheoretical Model does not apply to this patient","Relapse is expected and should be reframed as a predictable part of the change process, not a catastrophe or reason to end treatment","Relapse should be treated as a moral failing requiring a consequence-based response","Relapse indicates the patient must restart treatment from Precontemplation with a new therapist"],"correct":1,"rationale":"Relapse is explicitly framed in change theory as an expected, predictable part of the change process — not a catastrophe or reason to end treatment. This principle applies equally to substance use, eating disorder, and other behavior-change work."},{"topic":"Change theory","vignette":"A patient has been successfully abstinent from alcohol for 8 months and is now working with her clinician on identifying situations that could trigger a return to drinking.","question":"Which TTM stage is this, and what is the clinician's primary task?","options":["Preparation — building an initial plan before any behavior change has started","Contemplation — still ambivalent about whether to change","Action — actively modifying behavior for the first time","Maintenance — relapse-prevention planning and reinforcing gains"],"correct":3,"rationale":"Sustained change over several months with a focus on preventing relapse describes the Maintenance stage — the clinician's task is relapse-prevention planning and reinforcing the gains already made, distinct from the Action stage's initial behavior modification."},{"topic":"Children and foster care","vignette":"A family court is deciding whether to pursue reunification or terminate parental rights for a child in short-term foster care following a substantiated maltreatment case.","question":"What guiding principle should inform the pace of this decision?","options":["The child's own stated preference should be the sole determining factor regardless of age","Child welfare agencies and family courts should move quickly to determine whether parents can be rehabilitated and children returned, or whether parental rights should be terminated","Decisions should always be delayed at least 5 years to allow maximal time for parental rehabilitation","Reunification should never be considered once a child enters foster care"],"correct":1,"rationale":"Short-term foster placement may be necessary while a home is stabilized and parents obtain treatment following maltreatment, but child welfare agencies and family courts should move quickly to determine whether parents can be rehabilitated and children returned, or whether parental rights should be terminated — minimizing prolonged uncertainty and placement instability."},{"topic":"Children and foster care","vignette":"A psychiatric NP evaluates a new patient who was recently placed in foster care, with no prior clinical information available.","question":"What clinical assumption and approach is recommended at intake?","options":["Deferring any evaluation until the caseworker provides a full social history","A trauma-informed evaluation that assumes a trauma history until proven otherwise, with attention to attachment history","Treating the foster placement itself as the primary source of any presenting symptoms","An assumption that the child has no trauma history unless explicitly documented"],"correct":1,"rationale":"Clinical approach for children in foster care includes a trauma-informed evaluation (assuming a trauma history until proven otherwise), coordination with caseworkers/courts, attention to attachment history, and support for the foster/adoptive caregivers themselves (psychoeducation, realistic expectations)."},{"topic":"Mandated reporter","vignette":"A clinician suspects abuse based solely on the child's behavioral presentation and clinical judgment, without any direct disclosure from the child or an obvious physical finding.","question":"Does the mandated reporting duty apply in this scenario?","options":["No — a report requires a physical exam finding or collateral report","Yes — the reporting duty applies regardless of the source of suspicion, including clinical judgment based on presentation/behavior","No — a report can only be made following direct disclosure by the child","The duty only applies if a parent confirms the suspicion"],"correct":1,"rationale":"Mandated reporting duty applies regardless of the source of suspicion — disclosure by the child, physical findings, a collateral report, or clinical judgment based on presentation/behavior can all independently trigger the reporting obligation."},{"topic":"Mandated reporter","vignette":"An NP is about to file a report for suspected abuse and is deciding how to communicate this with the family.","question":"What is standard practice regarding transparency with the family when abuse is suspected?","options":["Only inform the family if they directly ask whether a report was made","Tell the parents that an investigation will follow and that helpful services may be available through the child protection agency, except where it would endanger the child","Never inform the family that a report has been made under any circumstances","Wait for the investigation to conclude before telling the family a report was filed"],"correct":1,"rationale":"When abuse is suspected, standard practice is to tell the parents that an investigation will follow and that helpful services may be available through the child protection agency — transparency with the family, except where it would endanger the child, is part of standard practice."},{"topic":"Grief in children","vignette":"A 4-year-old asks repeatedly when her deceased mother is 'coming back from her trip.'","question":"What does this reflect about her developmental understanding of death?","options":["This reflects dissociative symptoms related to complicated grief","Children at this age have a fully realistic understanding of death's permanence","This indicates a pathological grief reaction requiring urgent intervention","At ages 4-5, death is often seen as reversible, like sleep or a trip — a normal developmental stage, not denial"],"correct":3,"rationale":"Children's understanding of death is developmental: under 2-3 years, no true understanding, only separation-related anxiety; ages 4-5, death is seen as reversible (like sleep or a trip); more realistic understanding emerges around ages 10-11. This 4-year-old's belief is a normal developmental stage, not a pathological sign."},{"topic":"Grief in children","vignette":"A 9-year-old whose father died violently 8 months ago continues to show intense, unrelenting grief symptoms significantly interfering with school and friendships, well beyond what is typical for her peers who lost a grandparent normally.","question":"What diagnostic consideration is most appropriate given the violent nature of the death and the persistence of symptoms?","options":["Escalation to childhood traumatic grief or persistent complex bereavement disorder should be considered","This should be diagnosed as major depressive disorder exclusively, with no consideration of a grief-specific process","This is entirely normal grief regardless of duration or the traumatic circumstances","No psychiatric diagnosis can apply to grief in children under any circumstances"],"correct":0,"rationale":"If a death was traumatic, normal grief may escalate to childhood traumatic grief or persistent complex bereavement disorder — clinicians distinguish normal bereavement from a disorder by intensity, quality, and persistence beyond expected norms, which is especially relevant given the violent death and 8-month duration here."},{"topic":"Group therapy techniques","vignette":"Several sessions into a therapy group, conflict emerges as members disagree openly and begin asserting differing viewpoints, creating noticeable tension.","question":"How should this stage be understood within Tuckman's model?","options":["Storming — necessary friction for the group to mature, not a failed or pathological stage","Adjourning — the group is prematurely ending due to conflict","A sign that the group therapy model has failed and should be discontinued","Forming — members are still orienting to the group's norms"],"correct":0,"rationale":"Storming is a necessary, not a failed, stage — conflict as members find their place and surface differing ideas is expected as the group matures toward Norming (aligning around common goals) and eventually Performing (autonomous, deeper work)."},{"topic":"Group therapy techniques","vignette":"A group therapist is asked which single therapeutic factor Yalom considered the most foundational, enabling members to tolerate conflict and accept feedback.","question":"Which factor is this?","options":["Group cohesiveness","Corrective recapitulation of the primary family group","Instillation of hope","Existential factors"],"correct":0,"rationale":"Group cohesiveness — the sense of belonging and mutual acceptance — is considered by Yalom the primary therapeutic factor, and it is the group leader's responsibility to actively build it. It is the foundational element enabling members to tolerate conflict, accept feedback, and engage in change."},{"topic":"Angry patient during family therapy","vignette":"A family member becomes too dysregulated to continue safely in a joint session, escalating toward physical aggression.","question":"What should the clinician do?","options":["Pause the joint session, briefly separate members, or shift to individual check-ins — safety takes priority over completing the planned agenda","Call the other family members into the room to help de-escalate the dysregulated member","Continue the session as planned to avoid rewarding the escalation with a break","End all future family sessions for this family permanently"],"correct":0,"rationale":"If a member is too dysregulated to continue safely, the clinician may need to pause the joint session, briefly separate members, or shift to individual check-ins before resuming — safety always takes priority over completing the planned agenda."},{"topic":"Angry patient during family therapy","vignette":"A highly charged, resistant family is struggling to engage productively when the therapist asks direct problem-focused questions about the conflict.","question":"What alternative technique can help de-escalate tension while still surfacing the core conflict?","options":["Ending the session early whenever resistance is encountered","Asking each member to individually blame the identified patient for the conflict","Repeating the same problem-focused question more forcefully","A solution-oriented question, such as 'If you woke up tomorrow and your family was exactly how you wanted it, what would be different?'"],"correct":3,"rationale":"A solution-oriented question can de-escalate tension better than a problem-focused question with a resistant or highly charged family, while still surfacing the core conflict — this technique shifts the frame from blame to a shared, future-oriented goal."},{"topic":"Learning domains","vignette":"A family 'knows' the facts about their child's new diagnosis but continues to resist any changes to their household routines, expressing skepticism about whether the diagnosis is even real.","question":"Which domain is the primary barrier to effective psychoeducation in this scenario?","options":["This scenario does not relate to any of Bloom's three learning domains","Cognitive domain — the family lacks basic factual knowledge","Affective domain — attitudes, values, feelings, and willingness to engage ('buy-in') have not been addressed","Psychomotor domain — the family cannot physically perform any required tasks"],"correct":2,"rationale":"The affective domain covers attitudes, values, feelings, and willingness to engage ('buy-in') — a family expressing skepticism and resisting change despite having factual knowledge illustrates an affective-domain barrier, not a cognitive knowledge gap."},{"topic":"Learning domains","vignette":"An NP is designing a comprehensive psychoeducation plan for a family newly navigating their child's bipolar disorder diagnosis.","question":"What does effective psychoeducation require, according to Bloom's Taxonomy as applied to patient teaching?","options":["Focusing exclusively on the psychomotor domain, since hands-on skills are what families remember longest","Addressing only the affective domain, since attitude change drives all behavior change","Addressing all three domains — cognitive, affective, and psychomotor — not just information transfer","Focusing exclusively on the cognitive domain, since factual knowledge is the foundation of all other learning"],"correct":2,"rationale":"Effective psychoeducation addresses all three domains, not just information transfer (cognitive) — a family can 'know' the facts but still resist behavior change without addressing attitudes (affective) and practiced skill (psychomotor)."},{"topic":"NSSI","vignette":"A 14-year-old reports 6 episodes of self-inflicted cutting over the past year, each done to relieve overwhelming emotional distress, with the expectation of only minor physical harm.","question":"How many days of self-inflicted injury within the past year are required by DSM-5 proposed research criteria to consider a diagnosis of NSSI?","options":["≥ 10 days","≥ 1 day","≥ 5 days","≥ 20 days"],"correct":2,"rationale":"DSM-5 proposed criteria (Conditions for Further Study) for NSSI require intentional self-inflicted injury on ≥5 days in the last year, likely to cause bleeding, bruising, or pain, with the expectation of only minor/moderate harm and no suicidal intent."},{"topic":"NSSI","vignette":"A therapist responds to a teenager's disclosure of self-harm by expressing shock and telling her she needs to 'just stop doing this immediately.'","question":"What is the concern with this response, per recommended clinical approach?","options":["Shame-based responses are effective specifically for adolescent patients","This response is appropriate and should be used consistently to discourage the behavior","Punitive or shaming responses increase secrecy and worsen the therapeutic alliance; a curious, function-focused approach is preferred","This response has no impact on the therapeutic relationship either way"],"correct":2,"rationale":"Punitive or shaming responses to NSSI disclosure increase secrecy and worsen the therapeutic alliance. The recommended approach is curiosity about function ('what does this help you with?') rather than focusing only on stopping the behavior."}]},{"key":"3","label":"Practice Exam 3","questions":[{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 14-year-old with autism spectrum disorder has eaten only 4 specific foods since early childhood. He depends on an oral nutritional supplement to meet caloric needs and has marked social impairment because he cannot eat at friends' houses or school events.","question":"Which DSM-5 criterion for ARFID is most clearly demonstrated by his dependence on oral nutritional supplements?","options":["Criterion C — the disturbance occurs exclusively during anorexia nervosa","Criterion B — the restriction is due to lack of available food","Criterion D — the restriction is better explained by a concurrent medical condition","A functional/nutritional consequence required under Criterion A (dependence on enteral feeding or oral nutritional supplements)"],"correct":3,"rationale":"ARFID Criterion A requires at least one of four functional consequences: significant weight loss/failure to grow, significant nutritional deficiency, dependence on enteral feeding or oral supplements, or marked psychosocial interference. Dependence on oral supplements satisfies this directly, and comorbid ASD is a recognized common association, not an exclusion."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A clinic is teaching a group of nursing students the fastest way to differentiate bulimia nervosa from binge-eating disorder on a vignette-based exam.","question":"What single feature should the students be taught to check first?","options":["Whether the patient reports guilt after eating","Whether binge episodes occur at least twice weekly","Whether a compensatory behavior (purging, laxatives, fasting, excessive exercise) is present","Whether the patient is underweight"],"correct":2,"rationale":"The fastest differentiator taught for this exam: compensatory behavior present = bulimia nervosa; compensatory behavior absent = binge-eating disorder. Both may show guilt, weekly-or-more frequency, and normal-to-elevated weight, so those features don't reliably distinguish the two."},{"topic":"ARFID s/sx","vignette":"A father reports his 4-year-old has 'always been picky' but now eats fewer than 6 total foods, refuses all fruits/vegetables, and school staff report she seems anxious around unfamiliar snacks at parties.","question":"Which piece of history would most strongly distinguish this from developmentally normal picky eating?","options":["A parent describing the child as a 'picky eater'","Any reported dislike of vegetables","The presence of any food refusal at school events","Failure to meet nutritional requirements, significant psychosocial interference, or lack of expected weight gain"],"correct":3,"rationale":"ARFID requires more than a narrow food preference — it requires demonstrable functional consequence: failure to meet nutritional/energy needs, weight/growth faltering, nutritional deficiency, supplement dependence, or marked psychosocial interference. Ordinary picky eating without these consequences does not meet criteria."},{"topic":"ARFID s/sx","vignette":"A multidisciplinary team is planning outpatient treatment for a 7-year-old recently diagnosed with ARFID, sensory-avoidance subtype.","question":"Which treatment approach is most appropriate?","options":["Fluoxetine as first-line pharmacotherapy","Family-Based Treatment (Maudsley model) identical to anorexia nervosa protocols","A multidisciplinary, family-based behavioral/CBT approach tailored to the specific restrictive driver, with SLP/OT involvement as needed","Lisdexamfetamine as first-line pharmacotherapy"],"correct":2,"rationale":"ARFID treatment is a multidisciplinary, family-involved behavioral approach (graded exposure, positive reinforcement, feeding-team involvement) tailored to the underlying driver — it is not simply the Maudsley FBT model used for AN, and no medication is first-line for ARFID (fluoxetine is the BN-specific evidence-based medication; lisdexamfetamine is FDA-approved for BED, not ARFID)."},{"topic":"Therapies for eating disorders","vignette":"A research team compares Family-Based Treatment to Parent-Focused Treatment (PFT), a modification in which the therapist meets only with the parents rather than the whole family, for adolescent anorexia nervosa.","question":"What did one randomized controlled trial find regarding PFT compared with standard FBT?","options":["PFT and FBT showed identical outcomes in every domain measured","PFT eliminated the need for any parental involvement","PFT was more efficient at achieving weight restoration","PFT was significantly less effective and is not recommended"],"correct":2,"rationale":"In one RCT, Parent-Focused Treatment (meeting with parents only, not the whole family) was found to be more efficient at weight restoration than standard conjoint FBT — a useful modification to know, though FBT remains the most broadly cited gold-standard reference."},{"topic":"Therapies for eating disorders","vignette":"A 19-year-old presents with recurrent binge eating, marked distress, no compensatory behaviors, and a normal-range weight.","question":"Which first-line psychotherapies are indicated for this presentation?","options":["Exposure and response prevention","Family-Based Treatment (Maudsley model)","Dialectical behavior therapy exclusively","CBT and interpersonal psychotherapy"],"correct":3,"rationale":"For binge-eating disorder, CBT and interpersonal psychotherapy are first-line psychotherapies; lisdexamfetamine is FDA-approved pharmacotherapy for BED in adults (limited pediatric data). FBT is specific to adolescent anorexia, not BED."},{"topic":"Enuresis vs Encopresis","vignette":"A clinician is distinguishing the substance involved and minimum diagnostic age for enuresis versus encopresis while teaching a psychoeducation session to nursing students.","question":"Which pairing is correct?","options":["Both disorders involve urine but differ only in age threshold","Enuresis = urine, age ≥ 4; Encopresis = feces, age ≥ 5","Enuresis = urine, age ≥ 5; Encopresis = feces, age ≥ 4","Enuresis = feces, age ≥ 5; Encopresis = urine, age ≥ 4"],"correct":2,"rationale":"Enuresis involves urine (age ≥ 5 years); encopresis involves feces (age ≥ 4 years). This age/substance pairing is one of the most frequently tested exam points for elimination disorders."},{"topic":"Enuresis vs Encopresis","vignette":"A child is diagnosed with enuresis. Her parents ask whether medication caused it, since she takes an anticholinergic for a different condition.","question":"Per DSM-5 Criterion D, what must be ruled out before diagnosing enuresis or encopresis?","options":["That the child has never previously been toilet trained","That there is no family history of elimination disorders","That the child has a comorbid anxiety disorder","That the symptom is not attributable to a substance (e.g., a diuretic or laxative) or another medical condition"],"correct":3,"rationale":"Criterion D for both enuresis and encopresis requires that the symptom is not attributable to a substance's physiological effect (e.g., a diuretic or antipsychotic for enuresis; a laxative for encopresis) or another medical condition (e.g., diabetes, spina bifida, seizure disorder) — except, for encopresis, through a mechanism involving constipation."},{"topic":"Nocturnal enuresis treatment","vignette":"A clinician is counseling a family that psychotherapy might not directly resolve their child's bedwetting.","question":"What is the correct role of psychotherapy in nocturnal enuresis management?","options":["First-line treatment that should be tried before any behavioral intervention","Contraindicated in all cases of enuresis","Rarely useful for enuresis itself, but may help address psychosocial sequelae (shame, social avoidance) or trauma/stress-related enuresis","Equally effective as the urine alarm for achieving dryness"],"correct":2,"rationale":"Psychotherapy is rarely useful for enuresis itself but may help address the psychosocial sequelae (shame, social avoidance) or address enuresis when it is trauma/stress-related — it is not a primary treatment for the wetting itself."},{"topic":"Nocturnal enuresis treatment","vignette":"A family combines the urine alarm with cleanliness training, retention control training, and overlearning for their child's persistent nocturnal enuresis.","question":"What outcome would be expected from this combined behavioral approach, per the evidence discussed in your course materials?","options":["It requires concurrent DDAVP to be effective","It is only appropriate for children under age 5","It stops bedwetting in about two-thirds of children","It has no additive benefit over the alarm alone"],"correct":2,"rationale":"Combining the urine alarm with cleanliness training, retention control, and overlearning stops bedwetting in about two-thirds of children — a stronger combined outcome than the alarm used in isolation."},{"topic":"Encopresis treatment","vignette":"A behavior-shaping program is being designed for a child with encopresis without constipation.","question":"What is the recommended structure of this behavioral program?","options":["Rewards only for a fully clean week with no partial credit","Punishment for soiling episodes paired with rewards for compliance","No behavioral component — medication is the mainstay for this subtype","Rewards first for sitting on the toilet, then for successful bowel movements"],"correct":3,"rationale":"For encopresis without constipation, the behavior-shaping program provides rewards first for sitting on the toilet, then for successful bowel movements — a stepwise shaping approach rather than an all-or-nothing reward structure or a punitive approach."},{"topic":"Encopresis treatment","vignette":"A 7-year-old with constipation-type encopresis has completed an initial bowel cleanout with PEG.","question":"What should the maintenance phase ('bowel retraining') include?","options":["Discontinuation of all interventions since the cleanout is complete","A low-fiber diet to reduce stool bulk","Stool softener or mineral oil, a high-fiber diet, a regular toileting routine, and a mild suppository if needed","Repeated enemas administered weekly by the parent indefinitely"],"correct":2,"rationale":"After initial cleanout, bowel retraining includes a stool softener or mineral oil, a high-fiber diet, a regular toileting routine, and a mild suppository if needed — all combined with the behavioral program, not discontinuation of care."},{"topic":"ODD vs CD vs IED","vignette":"A resident is trying to remember the fastest way to sort ODD, conduct disorder, and IED on a timed exam.","question":"Which summary correctly captures the core distinction taught for this exam?","options":["IED is simply a milder form of conduct disorder","All three disorders require the same minimum duration of symptoms","ODD = oppositional, not rights-violating; Conduct Disorder = violates others' rights/major norms; IED = impulsive, anger-based outbursts grossly out of proportion, never premeditated","ODD = violates others' rights; Conduct Disorder = argumentative only; IED = always premeditated"],"correct":2,"rationale":"The high-yield distinction: ODD is oppositional/argumentative without rights violations; conduct disorder involves serious violations of others' rights or major societal norms (theft, cruelty, weapons); IED is impulsive, anger-based aggression grossly out of proportion to the trigger and never premeditated or goal-directed."},{"topic":"ODD vs CD vs IED","vignette":"A 7-year-old has had twice-weekly verbal outbursts and non-injurious physical aggression (throwing objects, not at people) for the past 4 months, clearly out of proportion to minor frustrations, causing significant distress to the family.","question":"What is the minimum age requirement for diagnosing intermittent explosive disorder, and is it met here?","options":["Age ≥ 10 years — not met in this case","Age ≥ 6 years (or equivalent developmental level) — met in this case","Age ≥ 4 years — met in this case","There is no minimum age for IED"],"correct":1,"rationale":"IED Criterion E requires chronological age ≥ 6 years (or equivalent developmental level). At age 7, this child meets the age threshold, and the twice-weekly verbal/non-destructive physical aggression for 3+ months satisfies the frequency arm of Criterion A."},{"topic":"Meds for physically aggressive children","vignette":"A teenager with chronic conduct-disorder-related aggression, without psychosis, is being considered for medication after behavioral interventions have had limited effect.","question":"What is the appropriate framing for medication in this scenario?","options":["Stimulant medication is first-line regardless of comorbid ADHD status","Evidence for medication in chronic CD-related aggression without psychosis is weak; behavioral/family/multisystemic interventions remain the mainstay, with medication reserved for comorbid conditions","Medication is contraindicated entirely in conduct disorder","A second-generation antipsychotic should be started immediately as first-line monotherapy"],"correct":1,"rationale":"For chronic conduct-disorder-related aggression without psychosis, evidence for medication is weak; behavioral, family, and multisystemic interventions are the mainstay, with medication reserved for treating comorbid conditions (ADHD, mood, anxiety) rather than the aggression itself."},{"topic":"Meds for physically aggressive children","vignette":"A previously calm 11-year-old suddenly becomes aggressive and disoriented in the ED. Before attributing this to a psychiatric cause, the team orders basic labs and a toxicology screen.","question":"What principle guides this initial work-up?","options":["Sudden-onset aggression in children is always psychiatric in origin","Medical causes only need to be considered if the child has a prior psychiatric history","Toxicology screening is unnecessary in pediatric aggression evaluations","Always rule out a medical/organic or substance-related cause of sudden aggression before treating it as purely psychiatric"],"correct":3,"rationale":"Before treating sudden pediatric aggression as purely psychiatric, organic/medical causes and substance intoxication/withdrawal must be ruled out — this is a foundational safety step given the broad differential for out-of-control behavior (temper outbursts, ADHD, ODD/CD, intellectual disability/ASD, anxiety, organic causes, substance use, psychosis, abuse/PTSD)."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 17-year-old describes recurrent gaps in memory for important autobiographical information, well beyond ordinary forgetfulness, following a period of severe chronic abuse. There is no evidence of multiple distinct personality states.","question":"Which dissociative disorder best fits this presentation?","options":["Dissociative identity disorder","Dissociative amnesia","Acute stress disorder","Depersonalization/derealization disorder"],"correct":1,"rationale":"Dissociative amnesia involves inability to recall important autobiographical information, usually traumatic/stressful, that is too extensive to be ordinary forgetfulness — distinct from dissociative identity disorder (requires ≥2 distinct personality states) and depersonalization/derealization disorder (unreality/detachment with intact reality testing, not memory loss)."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A student is trying to quickly sort a vignette involving trauma exposure and dissociative symptoms during an exam.","question":"Which factor is the fastest sorting tool between PTSD/ASD and adjustment disorder or dissociative disorders?","options":["Whether symptoms occur during the day or at night","The stressor severity threshold: PTSD/ASD require Criterion-A-level trauma (death, serious injury, sexual violence); adjustment disorder can follow any stressor; dissociative disorders don't require a specific stressor type","Whether the patient is male or female","The patient's age at presentation"],"correct":1,"rationale":"The fastest sort taught for this exam is stressor severity: PTSD/ASD require a Criterion-A-level trauma; adjustment disorder can follow any identifiable stressor regardless of severity; dissociative disorders don't require a specific stressor type at all."},{"topic":"Trauma therapy","vignette":"A refugee child with a history of war-zone trauma is being evaluated for trauma-focused treatment options available in the literature.","question":"Which model was specifically developed for war/refugee trauma populations?","options":["Narrative Exposure Therapy / KidNET","CBITS","EMDR only","Seeking Safety"],"correct":0,"rationale":"Narrative Exposure Therapy (and its child-adapted version, KidNET) was specifically developed for war/refugee trauma populations, using a structured lifeline narrative approach. CBITS is school-based; Seeking Safety targets co-occurring substance use."},{"topic":"Trauma therapy","vignette":"A trauma treatment program screens not only the child but also the accompanying parent for trauma symptoms before beginning treatment.","question":"What principle does this practice reflect?","options":["Family/caregiver involvement and screening/treating the caregiver's own trauma symptoms are consistent features across effective trauma therapy models","Caregiver screening is unique to TF-CBT and not used in other models","Only the child's symptoms should ever be assessed in pediatric trauma care","Caregiver trauma symptoms are irrelevant to the child's treatment outcome"],"correct":0,"rationale":"Family/caregiver involvement, and screening/treating the caregiver's own trauma symptoms, is a consistent feature across effective pediatric trauma therapy models generally — not unique to any single approach — because caregiver functioning significantly affects the child's recovery."},{"topic":"TF-CBT / PRACTICE","vignette":"A child in TF-CBT has completed the trauma narrative and is now practicing calmly approaching a safe reminder of the trauma (e.g., a similar vehicle after a car accident) that she has been avoiding.","question":"Which PRACTICE component does this represent?","options":["Enhancing safety","Cognitive processing/coping","Affective modulation","In-vivo mastery of trauma reminders"],"correct":3,"rationale":"In-vivo mastery of trauma reminders involves real-world graded exposure to safe trauma reminders that are being avoided — distinct from the trauma narrative itself, which is the therapist-supported development of a detailed account of the traumatic event."},{"topic":"TF-CBT / PRACTICE","vignette":"A TF-CBT program is concluding treatment with a family by developing a written plan for handling future triggers and building on the skills the family has learned.","question":"Which final PRACTICE component does this represent?","options":["Enhancing safety","Trauma narrative and processing","Psychoeducation and parenting skills","Relaxation"],"correct":0,"rationale":"Enhancing safety — safety planning and future skills for the child and family — is the final PRACTICE component, typically addressed as treatment nears completion, building on all the preceding stabilization and processing work."},{"topic":"Insomnia treatment","vignette":"A prescriber is asked why a benzodiazepine would be an unusual first-line choice for a child's chronic insomnia on a vignette exam.","question":"What is the exam logic for this scenario?","options":["Behavioral measures + melatonin = the correct pediatric insomnia answer; a prescription hypnotic/benzodiazepine as first-line is almost always wrong in a pediatric vignette","Behavioral measures are only used as a last resort after medication fails","Sedative-hypnotics have no risk of paradoxical reaction in children","Benzodiazepines are the preferred first-line treatment in children under 10"],"correct":0,"rationale":"The exam logic taught for this topic: behavioral measures plus melatonin is the correct pediatric insomnia answer, while a prescription hypnotic or benzodiazepine as first-line is almost always the wrong choice in a pediatric vignette, given lack of FDA approval and paradoxical activation risk."},{"topic":"Insomnia treatment","vignette":"A 15-year-old with PTSD reports that trauma-related nightmares are the main driver of her ongoing insomnia.","question":"What is the most appropriate treatment priority?","options":["Treat the underlying PTSD, and consider prazosin if nightmares specifically are driving the insomnia","Start a benzodiazepine for immediate symptomatic relief before addressing PTSD","Insomnia and PTSD should be treated as entirely unrelated conditions","Melatonin alone is sufficient without addressing the PTSD"],"correct":0,"rationale":"When insomnia is trauma-related, the priority is treating the underlying PTSD; if nightmares specifically drive the insomnia, prazosin should be considered as a targeted adjunct — addressing the root cause rather than treating insomnia as an isolated symptom."},{"topic":"Nightmare treatment","vignette":"A clinician documents that a 9-year-old's nightmares occur 2-3 times per week but less than nightly.","question":"How would this frequency be classified under DSM-5 severity specifiers for nightmare disorder?","options":["Moderate — ≥1 episode/week but less than nightly","This frequency does not meet any severity specifier","Severe — occurring nightly","Mild — less than 1 episode/week"],"correct":0,"rationale":"Nightmare disorder severity is rated by frequency: mild = <1 episode/week; moderate = ≥1/week but <nightly; severe = nightly. At 2-3 times weekly, this falls into the moderate category."},{"topic":"Nightmare treatment","vignette":"Two off-label medications are being considered as adjuncts for a teen with hyperarousal-related nightmares, alongside low-dose trazodone for sleep.","question":"Which additional agents are mentioned as off-label/adjunctive options for hyperarousal and nightmares?","options":["Lithium and valproate","Fluoxetine and sertraline","Risperidone and aripiprazole","Clonidine and guanfacine"],"correct":3,"rationale":"Other off-label/adjunctive agents for hyperarousal/nightmares include clonidine and guanfacine, alongside low-dose trazodone for sleep — prazosin remains the agent with the best-known targeted nightmare evidence, but no medication carries FDA approval for pediatric nightmares."},{"topic":"AUD s/sx and treatment","vignette":"A clinician explains why adolescents are considered to progress from alcohol use to a use disorder more readily than adults.","question":"Which statement reflects the course of AUD specific to adolescents, per your course materials?","options":["Adolescents cross from use to abuse more easily than adults; some experts consider any underage alcohol use 'abuse,' though physical dependence is comparatively rare in adolescents","Physical dependence is more common in adolescents than in adults","Underage alcohol use is never considered clinically significant unless physical dependence is present","Adolescents require the same 12-month symptom count as adults but progress more slowly to a use disorder"],"correct":0,"rationale":"Adolescents cross from use to abuse more easily than adults, and some experts consider any underage alcohol use 'abuse' — though physical dependence itself is comparatively rare in adolescents compared with adults with chronic AUD."},{"topic":"AUD s/sx and treatment","vignette":"A treatment team is designing a comprehensive outpatient plan for a 17-year-old with moderate AUD (4 Criterion A symptoms) and no significant withdrawal risk.","question":"Which combination of interventions reflects the recommended treatment approach?","options":["Developmentally appropriate group therapy, self-help 12-step programs, motivational interviewing, family therapy, and relapse prevention","Individual insight-oriented psychodynamic therapy alone","Inpatient medical detoxification as a routine requirement","Pharmacotherapy for AUD as the primary intervention, given the moderate severity rating"],"correct":0,"rationale":"Treatment for adolescent AUD emphasizes developmentally appropriate group therapy with peers, self-help 12-step programs (AA), motivational interviewing, family therapy (structural/behavioral approaches), and relapse prevention. Pharmacological treatments are rarely used given the limited evidence base in this age group, and relapse should be treated as an expected part of recovery, not a treatment failure."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A clinician is teaching that cannabis withdrawal should not be dismissed as 'just psychological' since it carries real clinical significance.","question":"Which symptoms are described as the most common presenting features of cannabis withdrawal?","options":["Irritability and sleep disturbance","Seizures and autonomic instability","Psychotic symptoms and severe agitation","Fever and diaphoresis exclusively"],"correct":0,"rationale":"Cannabis withdrawal is real and clinically significant; irritability and sleep disturbance are the most common presenting symptoms — a key exam pearl distinguishing this from the more severe autonomic/seizure profile of alcohol withdrawal."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A patient reports fatigue, yawning, and difficulty concentrating 5 days after stopping heavy cannabis use, alongside a rebound period of increased appetite and hypersomnia following the initial appetite loss.","question":"How are these additional features classified relative to DSM-5 Criterion B?","options":["They rule out a cannabis withdrawal diagnosis","They are additional features often seen beyond the core Criterion B symptom list, not required for diagnosis","They indicate a different diagnosis entirely (alcohol withdrawal)","They are required Criterion B symptoms and must be present for diagnosis"],"correct":1,"rationale":"Fatigue, yawning, difficulty concentrating, and a rebound period of increased appetite/hypersomnia following initial appetite loss/insomnia are described as additional features often seen beyond the core Criterion B symptom list — supportive of the diagnosis but not required criteria themselves."},{"topic":"Motivational Interviewing","vignette":"A prescriber describes MI's foundational belief that the motivation to change already exists within the patient, and that the practitioner's role is to draw it out rather than impose it.","question":"Which element of the 'Spirit' of MI is being described?","options":["Acceptance","Compassion","Partnership","Evocation"],"correct":3,"rationale":"Evocation is the MI Spirit element describing the belief that motivation to change already exists within the patient — the practitioner's job is to draw it out, not impose it. The other Spirit elements are Partnership (working with, not on, the patient), Acceptance (respecting autonomy, affirming strengths), and Compassion (prioritizing patient well-being)."},{"topic":"Motivational Interviewing","vignette":"A substance-use treatment protocol incorporates personalized feedback, places responsibility for change with the patient, gives advice only with permission, and offers a menu of change options.","question":"Which adapted MI-based protocol is being described, and what does its mnemonic stand for?","options":["SBIRT: Screening, Brief Intervention, Referral to Treatment — unrelated to MI","FRAMES: Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy","OARS: Open questions, Affirmations, Reflections, Summarizing","PRACTICE: the TF-CBT treatment component mnemonic"],"correct":1,"rationale":"FRAMES (Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy) is a well-known adapted substance-use protocol built on MI principles — distinct from OARS (the core communication skills) and PRACTICE (the unrelated TF-CBT mnemonic)."},{"topic":"Motivational Interviewing","vignette":"A patient in the Focusing phase of MI keeps bringing up reasons why change would be too hard. The clinician avoids confronting this directly and instead continues asking open questions to help the patient find their own direction.","question":"What MI technique is the clinician using?","options":["Direct persuasion","Rolling with resistance","The Planning phase's action-step technique","Confrontational interviewing"],"correct":1,"rationale":"In the Focusing phase, MI uses open questions rather than unsolicited advice, and 'rolls with resistance' rather than confronting it directly — this non-confrontational stance is a hallmark MI technique across all four phases."},{"topic":"Change theory","vignette":"A trainee is asked to list the five main stages of the Transtheoretical Model of Change in the correct order.","question":"Which sequence is correct?","options":["Preparation → Precontemplation → Contemplation → Maintenance → Action","Precontemplation → Contemplation → Preparation → Action → Maintenance","Contemplation → Precontemplation → Action → Preparation → Maintenance","Action → Maintenance → Precontemplation → Contemplation → Preparation"],"correct":1,"rationale":"Precontemplation → Contemplation → Preparation → Action → Maintenance is the correct TTM sequence — a high-yield fact taught as the backbone of both MI and general behavior-change counseling, with (Relapse) as a common but non-required detour back to an earlier stage."},{"topic":"Change theory","vignette":"A clinician incorrectly uses action-oriented language ('let's set a quit date') with a patient who is still in the Precontemplation stage and has expressed no interest in changing.","question":"What is the core clinical error being made here?","options":["Violating patient confidentiality","Failing to match the intervention to the patient's actual stage of change, rather than pushing action language on a precontemplative patient","Failing to complete a formal substance use screening tool first","Using OARS skills incorrectly"],"correct":1,"rationale":"Matching your intervention to the patient's actual stage of change — not pushing 'action' language on a precontemplative patient — is the core clinical application tested on exams for both MI and the Transtheoretical Model."},{"topic":"Children and foster care","vignette":"A 12-year-old with severe out-of-control behavior is being considered for a foster placement as part of his treatment plan, separate from any child protection concern.","question":"What is an additional recognized use of foster care described in this context?","options":["Foster placement is contraindicated whenever a child has a behavioral disorder","Foster care can only be initiated by a court order, never as part of a treatment plan","Foster care is used exclusively in confirmed child maltreatment cases and never for behavioral containment","Foster care can be used as a containment/adjunctive option in severe out-of-control behavior or when the home environment cannot safely support the child during treatment"],"correct":3,"rationale":"Beyond its primary child-protection role, foster care is also used as a containment/adjunctive option in severe out-of-control behavior or when the home environment cannot safely support the child during treatment — a distinct clinical use worth recognizing."},{"topic":"Children and foster care","vignette":"A foster parent expresses frustration that her foster child does not show affection the way she expected, and feels she is 'failing' as a caregiver.","question":"Which component of the recommended clinical approach directly addresses this situation?","options":["No intervention is needed since this is a normal and expected caregiver reaction","Support for the foster/adoptive caregivers themselves, including psychoeducation and realistic expectations","Immediate removal of the child from this placement","Referral of the foster parent for individual psychotherapy unrelated to the placement"],"correct":1,"rationale":"The recommended clinical approach explicitly includes support for foster/adoptive caregivers themselves — psychoeducation and realistic expectations about attachment difficulties — since many fostered/adopted children show attachment difficulties stemming from their pre-placement history, not caregiver failure."},{"topic":"Mandated reporter","vignette":"A nursing student asks whether mandated reporting requires the clinician to have definitively confirmed that abuse occurred.","question":"What is the correct response?","options":["Reporting requirements vary so much by state that no general answer applies","No — mandated reporting is not confined to confirmed abuse; if evidence is sufficient to raise a serious question/reasonable suspicion, it must be reported","Only physicians, not nurse practitioners, carry a mandated reporting obligation","Yes — a report can only be filed once abuse has been confirmed by an official investigation"],"correct":1,"rationale":"Mandated reporting is not confined to confirmed abuse — if the evidence is sufficient to raise a serious question or reasonable suspicion, it must be reported to prompt an official investigation. All states require professionals who suspect child abuse to report it; this is a universal legal obligation across the profession, not confirmation-dependent."},{"topic":"Mandated reporter","vignette":"A clinician who suspected abuse chooses not to report because she is not '100% certain' and worries about damaging the family relationship if she is wrong.","question":"What is the risk of this decision?","options":["The decision is appropriate because certainty is required before reporting","Legal penalties can be assessed for failing to report, regardless of the clinician's motivation for not reporting","There is no legal consequence as long as the clinician documents her reasoning","This decision only carries risk if the abuse is later confirmed by another source"],"correct":1,"rationale":"Failing to report suspected abuse carries legal risk for the clinician — this is the flip side of the good-faith immunity protection for reporting. The 'reasonable suspicion' standard means uncertainty is not a valid reason to withhold a report."},{"topic":"Grief in children","vignette":"A hospice social worker asks whether attending the funeral could psychologically harm a grieving 8-year-old.","question":"What does the evidence suggest, and what is the recommended clinical guidance?","options":["The decision should be made entirely by the surviving parent without input from the child","Funeral attendance has not been shown to increase later psychiatric symptoms; allow the child some choice in attending","Children should never be allowed to attend funerals under age 10","Funeral attendance is mandatory for healthy grief processing at any age"],"correct":1,"rationale":"Clinical guidance is to allow the child some choice in attending the funeral — attendance has not been shown to increase later psychiatric symptoms. Clinicians should also provide extra adult support, since the surviving parent may be too grief-absorbed to be fully available, and explain death in a matter-of-fact, concrete way consistent with family beliefs."},{"topic":"Grief in children","vignette":"A comparison is drawn between the diagnostic duration threshold for persistent complex bereavement disorder in children versus adults.","question":"What is the correct duration comparison?","options":["There is no duration threshold specified for either children or adults","Children require a longer duration (≥18 months) than adults because grief is considered more resilient in childhood","Children and adults require the identical ≥12-month duration threshold","Children require only ≥6 months of severe grief reactions, compared with ≥12 months in adults"],"correct":3,"rationale":"Persistent complex bereavement disorder is distinguished from normal grief by severe grief reactions persisting ≥12 months in adults, but only ≥6 months in children — a lower threshold reflecting how much grief can already impair a child's functioning."},{"topic":"Group therapy techniques","vignette":"A group member who has struggled with social isolation reports that being able to comfort and support another member in the group has boosted his own sense of self-worth.","question":"Which Yalom factor best captures this experience?","options":["Altruism","Interpersonal learning","Universality","Development of socializing techniques"],"correct":0,"rationale":"Altruism is the therapeutic factor describing how helping others in the group boosts a member's own self-worth — distinct from universality (realizing one is not alone) or interpersonal learning (gaining insight into one's own relational patterns)."},{"topic":"Group therapy techniques","vignette":"A well-established therapy group is ending after 6 months. Several members express sadness and some express anger about the group ending, wanting to avoid discussing it directly.","question":"Which Tuckman stage is the group currently in, and what should the leader do?","options":["Adjourning — the leader should directly address termination, since members may have strong emotional reactions to the group ending","Performing — the leader should focus solely on deepening ongoing therapeutic work","Forming — the leader should reintroduce basic ground rules","Storming — the leader should introduce new conflict-resolution rules"],"correct":0,"rationale":"Adjourning is the termination stage, where members may have strong emotional reactions to the group ending — the leader's role is to directly address termination and these reactions rather than avoiding the topic, consistent with Tuckman's 5-stage model (Forming → Storming → Norming → Performing → Adjourning)."},{"topic":"Angry patient during family therapy","vignette":"A family repeatedly blames their 'identified patient' (the child with the diagnosis) for all family conflict. The therapist instead asks, 'What part of the problem does each of you think you play?'","question":"What clinical purpose does this reframing technique serve?","options":["It reframes the presenting problem as a family system issue rather than one member's fault, reducing defensiveness and scapegoating","It is primarily used to identify which family member should be excluded from future sessions","It assigns blame more evenly but does not change the underlying family dynamic","It has no established clinical purpose and is discouraged in family therapy"],"correct":0,"rationale":"Reframing the presenting problem as a family system issue, not one member's fault, reduces defensiveness and scapegoating of the identified patient — which is often a driver of anger in session. This systemic reframe is a core family therapy technique."},{"topic":"Angry patient during family therapy","vignette":"A therapist is asked to summarize the correct order of priorities when a family member becomes angry and dysregulated mid-session.","question":"What is the correct priority sequence?","options":["De-escalate first, problem-solve second — do not try to process content while a family member is dysregulated","Neither de-escalation nor problem-solving should occur; the session should simply end","Problem-solve first to resolve the underlying issue, then de-escalate","Both should occur simultaneously regardless of the family member's regulation state"],"correct":0,"rationale":"The clinician's job when anger escalates is to de-escalate first, problem-solve second — attempting to process content or resolve the underlying conflict while a family member is still dysregulated is unlikely to be productive and can worsen safety."},{"topic":"Learning domains","vignette":"A nursing instructor asks students to match each of Bloom's three learning domains with its correct one-word description.","question":"Which matching is correct?","options":["All three domains describe the same underlying construct","Cognitive = feeling/valuing; Affective = doing; Psychomotor = knowing","Cognitive = doing; Affective = knowing; Psychomotor = feeling/valuing","Cognitive = knowing; Affective = feeling/valuing; Psychomotor = doing"],"correct":3,"rationale":"Cognitive = knowing (facts, concepts, intellectual understanding); Affective = feeling/valuing (attitudes, willingness to engage); Psychomotor = doing (physical skills, demonstrated competence). A teaching plan that only transmits facts without addressing attitudes or skill practice is incomplete — a classic patient-education exam point."},{"topic":"Learning domains","vignette":"A teaching plan for a new medication consists entirely of a handout listing side effects and dosing information, with no discussion of the family's concerns or any demonstration of administration technique.","question":"Which domains of Bloom's Taxonomy are missing from this plan?","options":["Only the psychomotor domain is missing; affective domain is not relevant to medication teaching","Only the cognitive domain is missing","Affective and psychomotor domains","No domains are missing; a handout addresses all three domains"],"correct":2,"rationale":"This plan addresses only the cognitive domain (facts about side effects/dosing). It is missing the affective domain (discussing the family's attitudes, concerns, willingness to give the medication) and the psychomotor domain (demonstrating and having the caregiver practice actual administration technique)."},{"topic":"NSSI","vignette":"A clinician is selecting a treatment approach for a 17-year-old with frequent NSSI driven by difficulty tolerating intense emotions.","question":"Which treatment has the strongest evidence base for NSSI, and why?","options":["Motivational interviewing as a standalone treatment","Trauma-Focused CBT as the only evidence-based option","Dialectical behavior therapy, largely because of its emotion-regulation and distress-tolerance skills modules","Family-Based Treatment (Maudsley model)"],"correct":2,"rationale":"Dialectical Behavior Therapy (DBT) has the strongest evidence base for NSSI, particularly its emotion-regulation and distress-tolerance skills modules. Safety planning, means restriction, and treating underlying mood/anxiety/trauma are also essential components of care."},{"topic":"NSSI","vignette":"A 13-year-old with an intellectual disability engages in repetitive head-banging as part of a broader pattern of stereotyped movements.","question":"How does this presentation relate to the DSM-5 proposed NSSI criteria?","options":["Stereotyped self-injury in neurodevelopmental disorders is diagnosed as a suicide attempt by default","This automatically meets full NSSI criteria regardless of the stereotypy pattern","In neurodevelopmental disorders, self-injury that is part of a stereotypy pattern does not meet proposed NSSI criteria","NSSI criteria exclude all patients with intellectual disability from consideration"],"correct":2,"rationale":"Per proposed NSSI Criterion F, the behavior does not occur exclusively during psychosis, delirium, or substance intoxication/withdrawal; in neurodevelopmental disorders, it is not counted if part of a stereotypy pattern, and is not better explained by another disorder (e.g., trichotillomania, excoriation disorder, stereotypic movement disorder)."},{"topic":"NSSI","vignette":"A patient engages in self-injury specifically after arguments with her boyfriend, stating it 'gets him to pay attention to me and take me seriously.'","question":"Which DSM-5 proposed NSSI expectation (Criterion B) does this reflect?","options":["This does not correspond to any Criterion B expectation","To obtain relief from a negative feeling/cognitive state only","To resolve an interpersonal difficulty","To induce a positive feeling state only"],"correct":2,"rationale":"Criterion B requires the behavior be done with at least one expectation: relief from a negative feeling/cognitive state, resolving an interpersonal difficulty, or inducing a positive feeling state. Using self-injury to influence a partner's attention/response reflects the interpersonal-difficulty-resolution expectation — less common than emotion regulation, but a recognized function."}]},{"key":"4","label":"Practice Exam 4","questions":[{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 13-year-old girl has lost 18% of her body weight over 5 months through severe caloric restriction and compulsive exercise. She weighs herself 10 times a day and states she 'can still see fat' on her thighs despite a BMI of 15.2.","question":"Which DSM-5 criterion is illustrated by her belief that she 'can still see fat' despite being underweight?","options":["Disturbance in the way body weight/shape is experienced (Criterion C)","Persistent eating of nonnutritive substances (a Pica criterion)","Recurrent binge eating with loss of control (a bulimia criterion)","Restriction of energy intake leading to low body weight (Criterion A)"],"correct":0,"rationale":"Anorexia Criterion C covers disturbance in how body weight/shape is experienced, undue influence of weight/shape on self-evaluation, or persistent lack of recognition of the seriousness of low body weight — her perceptual distortion despite objective underweight status is a textbook example."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 19-year-old male eats a large pizza and a box of cookies within 45 minutes, feeling completely unable to stop, then immediately runs 6 miles and skips his next two meals. This pattern occurs about twice a week.","question":"Which combination of behaviors places this presentation in the bulimia nervosa category rather than binge-eating disorder?","options":["The binge occurs within a discrete 2-hour period","He reports a sense of loss of control during the binge","The binge is followed by compensatory behavior (excessive exercise, fasting) aimed at preventing weight gain","The episodes occur at least twice weekly"],"correct":2,"rationale":"Both BN and BED share loss-of-control binge eating within a discrete period, occurring at least weekly. What makes this bulimia rather than BED is the compensatory behavior — excessive exercise and fasting after the binge, specifically aimed at preventing weight gain."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A toddler with autism spectrum disorder has been eating small amounts of carpet fiber and drywall dust for the past 6 weeks. A blood lead level returns at 6 mcg/dL.","question":"Given this lead level, what is the recommended next step?","options":["Immediate inpatient psychiatric admission","Pediatric consultation, since the level exceeds the 4 mcg/dL threshold for referral","A trial of an SSRI to reduce the ingestion behavior","No further action is needed since this level is within normal limits"],"correct":1,"rationale":"For Pica, periodic blood lead testing is recommended given the toxicity risk from nonfood substances like paint, dust, or soil, with pediatric consultation recommended if levels exceed 4 mcg/dL — this child's level of 6 mcg/dL crosses that threshold."},{"topic":"ARFID s/sx","vignette":"A 6-year-old has eaten fewer than 10 total foods since birth, all of similar beige color and crunchy texture. He gags and cries when offered anything with a different texture, though his growth curve has stayed stable.","question":"Which of the three common ARFID presentations does this best represent?","options":["Fear-based avoidance following an aversive eating experience","Apparent lack of interest in eating/food","Sensory-based avoidance of food characteristics","Body-image-driven restriction"],"correct":2,"rationale":"Texture-driven food refusal without any history of a specific aversive event, and without a low appetite drive, points to the sensory-based avoidance subtype of ARFID — the second most common of the three subtypes."},{"topic":"ARFID s/sx","vignette":"A 7-year-old girl with newly diagnosed ARFID is found on labs to have iron-deficiency anemia and low vitamin D. Her growth chart shows a drop from the 50th to the 15th percentile for weight over the past year.","question":"Which DSM-5 ARFID Criterion A consequence is demonstrated by these lab findings?","options":["Significant nutritional deficiency","Marked interference with psychosocial functioning","Significant weight loss alone, without any nutritional deficiency","Dependence on enteral feeding or oral supplements"],"correct":0,"rationale":"ARFID Criterion A requires at least one of four functional consequences: significant weight loss/failure to grow, significant nutritional deficiency, dependence on enteral feeding/supplements, or marked psychosocial interference. Iron-deficiency anemia and low vitamin D directly demonstrate a significant nutritional deficiency."},{"topic":"Therapies for eating disorders","vignette":"A 14-year-old with a 6-month history of anorexia nervosa has a stable, engaged family willing to participate actively in her care.","question":"What treatment approach should be recommended first, and what is the parents' role in it?","options":["Individual CBT alone, with parents excluded from sessions","Immediate long-term inpatient admission regardless of medical stability","Family-Based Treatment (Maudsley model), with parents empowered to take charge of refeeding at home","Fluoxetine as first-line monotherapy before any psychotherapy is attempted"],"correct":2,"rationale":"Family-Based Treatment (the Maudsley model) has the strongest empirical support for adolescent anorexia nervosa, with parents empowered as part of the solution and placed in charge of refeeding at home — not blamed for causing the illness."},{"topic":"Therapies for eating disorders","vignette":"A hospitalized 15-year-old with severe anorexia nervosa is started on a refeeding protocol. The team deliberately limits initial caloric advancement and monitors phosphate closely.","question":"What complication is this cautious approach designed to prevent?","options":["Neuroleptic malignant syndrome","Refeeding syndrome","Alcohol withdrawal seizures","Serotonin syndrome"],"correct":1,"rationale":"Too-rapid refeeding in a severely malnourished patient risks refeeding syndrome, marked by dangerous electrolyte shifts (especially phosphate) — a key patient-safety consideration guiding gradual caloric advancement (roughly 1 lb/week outpatient, 2-3 lb/week inpatient)."},{"topic":"Enuresis vs Encopresis","vignette":"A 6-year-old boy has nighttime wetting episodes 4 times per week for the past 5 months, with no daytime accidents.","question":"Does this presentation meet DSM-5 criteria for enuresis, and which subtype applies?","options":["No — the frequency threshold of twice weekly has not been met","No — age 6 is below the minimum diagnostic age of 7","Yes — nocturnal-only enuresis, meeting both the age and frequency thresholds","Yes, but this should be classified as diurnal enuresis"],"correct":2,"rationale":"Enuresis requires age ≥5 years and frequency ≥2x/week for ≥3 consecutive months (or clinically significant distress). At age 6 with 4 nighttime episodes weekly for 5 months and no daytime accidents, this meets criteria for the nocturnal-only (monosymptomatic) subtype, the most common presentation."},{"topic":"Enuresis vs Encopresis","vignette":"A 5-year-old girl has soiled her underwear with normal-formed stool on 3 separate occasions over the past 4 months, always during arguments with her older brother. Physical exam and abdominal imaging show no evidence of constipation.","question":"Which encopresis specifier applies, and what association is commonly seen with this presentation?","options":["Without constipation and overflow incontinence — often associated with oppositional or deliberate soiling behavior","This does not meet diagnostic criteria because the stool is normal-formed","This requires an additional diagnosis of major depressive disorder before encopresis can be coded","With constipation and overflow incontinence — the most common subtype overall"],"correct":0,"rationale":"Encopresis without constipation and overflow incontinence ('functional nonretentive fecal incontinence') presents with normal-form stool and intermittent, often situational soiling, and is frequently associated with ODD/conduct disorder or deliberate soiling tied to family conflict."},{"topic":"Nocturnal enuresis treatment","vignette":"A 9-year-old with persistent nocturnal enuresis has already tried fluid restriction and voiding before bed without success. His parents want the treatment option with the best durable, long-term success rate.","question":"Which treatment should be recommended?","options":["Intranasal DDAVP as monotherapy","Oral DDAVP as monotherapy","The urine alarm ('bell and pad')","An anticholinergic medication"],"correct":2,"rationale":"The urine alarm is first-line for persistent nocturnal enuresis, with the highest success rate of behavioral options (~75% at 6 months, ~56% sustained at 12 months) — substantially better long-term durability than medication, which carries a high relapse rate on discontinuation."},{"topic":"Nocturnal enuresis treatment","vignette":"A family needs a short-term solution for their 11-year-old's bedwetting before a week-long summer camp, with no time to establish a urine alarm program beforehand.","question":"What is an appropriate short-term option, and what counseling point should accompany it?","options":["Oral DDAVP, with reassurance that relapse after discontinuation is rare","Oral DDAVP, with counseling that most children relapse once it is discontinued","Intranasal DDAVP, preferred for its lower hyponatremia risk compared with oral form","The urine alarm, since it works within 2-3 nights"],"correct":1,"rationale":"DDAVP can provide short-term help for situational needs like camp, but most children relapse when it is stopped. Oral form is preferred over intranasal spray due to a hyponatremia risk specific to the nasal spray formulation."},{"topic":"Encopresis treatment","vignette":"An 8-year-old with chronic constipation and fecal soiling is found to have a large palpable stool mass on exam, confirming the constipation/overflow subtype of encopresis.","question":"What is the correct treatment sequence?","options":["A behavioral toileting program alone, without addressing the impaction first","Weekly parent-administered enemas as an ongoing maintenance strategy","Initial bowel cleanout (PEG or enemas), then bowel retraining (stool softener, high-fiber diet, toileting routine) combined with a behavioral program","Immediate psychiatric referral before any medical management"],"correct":2,"rationale":"For constipation-type encopresis, treatment always begins with bowel cleanout (oral PEG or enemas), followed by bowel retraining (stool softener/mineral oil, high-fiber diet, regular toileting routine) combined with the behavioral program — behavioral measures alone will fail if impaction persists."},{"topic":"Encopresis treatment","vignette":"A 9-year-old without any constipation has been intentionally smearing stool during conflicts with his stepfather. Bowel exam and imaging are normal.","question":"What treatment approach is indicated?","options":["A daily suppository regimen","A high-fiber diet as the sole intervention","Bowel cleanout with PEG followed by mineral oil","Family behavioral treatment addressing the exacerbating family dynamics"],"correct":3,"rationale":"Encopresis without constipation, particularly when manipulative or deliberate, calls for family behavioral treatment addressing the underlying family dynamics driving the behavior — not the bowel-cleanout protocol reserved for the constipation/overflow subtype."},{"topic":"ODD vs CD vs IED","vignette":"An 11-year-old has an 8-month history of frequently losing his temper, arguing with his teachers, and deliberately annoying his younger sibling. He has never damaged property, stolen anything, or hurt another person or animal.","question":"Which diagnosis fits this pattern?","options":["Disruptive mood dysregulation disorder","Conduct disorder","Oppositional defiant disorder","Intermittent explosive disorder"],"correct":2,"rationale":"Angry/irritable mood, argumentative/defiant behavior, and vindictiveness lasting ≥6 months, without any violation of others' rights or major societal norms, is classic ODD. Conduct disorder requires more serious rights-violating behavior, which is absent here."},{"topic":"ODD vs CD vs IED","vignette":"A 13-year-old has, over the past year, broken into a neighbor's shed, deliberately set fire to a trash can, and been physically cruel to a stray cat. His first symptom (fire-setting at a friend's house) occurred at age 9.","question":"Which conduct disorder specifier applies, and what is its prognostic implication?","options":["Unspecified onset — no prognostic information can be inferred","Childhood-onset type — associated with a better long-term prognosis than adolescent-onset","Adolescent-onset type — associated with a better prognosis for remission","Childhood-onset type — associated with more physical aggression and higher risk of progressing to adult antisocial personality disorder"],"correct":3,"rationale":"Childhood-onset conduct disorder (≥1 symptom before age 10) carries a worse prognosis — more physical aggression and higher risk of progression to adult antisocial personality disorder — compared with adolescent-onset CD, which has a better prognosis for remission."},{"topic":"ODD vs CD vs IED","vignette":"A 10-year-old has had twice-weekly verbal outbursts and object-throwing (not directed at people) for the past 4 months, clearly disproportionate to minor frustrations, causing significant family distress.","question":"Does this presentation meet the minimum age requirement for intermittent explosive disorder?","options":["No — IED requires a minimum age of 10 years, which is not yet met","IED has no minimum age requirement","Yes — IED requires a minimum age of 6 years, which is met here","No — IED requires a minimum age of 12 years"],"correct":2,"rationale":"IED Criterion E requires chronological age ≥6 years (or equivalent developmental level). At age 10, this child meets the age threshold, and the twice-weekly verbal/non-destructive outbursts for 3+ months satisfy the frequency arm of Criterion A."},{"topic":"Meds for physically aggressive children","vignette":"A 14-year-old is acutely agitated and physically aggressive on an inpatient unit, with a suspected underlying psychotic process. The team needs a rapid-acting agent.","question":"Which class of medication is preferred for this scenario?","options":["A selective serotonin reuptake inhibitor for immediate sedation","Benzodiazepines as the default first-line choice","Haloperidol as the preferred first-line agent","Second-generation antipsychotics, particularly risperidone or olanzapine"],"correct":3,"rationale":"Second-generation antipsychotics — particularly risperidone and olanzapine — are preferred over haloperidol for acutely agitated youth, given comparable efficacy, rapid onset, sedative effect, rapidly-dissolving oral forms, and lower extrapyramidal side effects. Benzodiazepines are avoided by default due to paradoxical disinhibition risk."},{"topic":"Meds for physically aggressive children","vignette":"An 8-year-old with autism spectrum disorder has chronic, severe irritability and aggression unresponsive to behavioral interventions alone.","question":"Which medications carry FDA approval specifically for irritability/aggression associated with ASD?","options":["Lorazepam and clonazepam","Haloperidol and chlorpromazine","Risperidone and aripiprazole","Sertraline and fluoxetine"],"correct":2,"rationale":"For chronic/severe aggression associated with ASD or intellectual disability, risperidone and aripiprazole are the FDA-approved options for irritability/aggression, distinct from the acute-agitation preference for risperidone/olanzapine in general pediatric aggression."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 15-year-old was assaulted 3 weeks ago. She now has intrusive memories, avoidance of places resembling the assault site, dissociative episodes, and marked hyperarousal.","question":"Given this timeframe, which diagnosis is most appropriate right now?","options":["Adjustment disorder","Depersonalization/derealization disorder","Acute stress disorder","PTSD"],"correct":3,"rationale":"PTSD requires symptoms persisting beyond 1 month post-trauma; acute stress disorder covers 3 days to 1 month. At 3 weeks out, with qualifying Criterion-A trauma exposure and symptoms, this has now crossed into the PTSD timeframe."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 13-year-old describes recurring episodes of feeling detached from her own body, as if 'floating above and watching myself.' She recognizes these feelings are not literally real and has no identifiable trauma history.","question":"What feature of her presentation distinguishes it from a psychotic process?","options":["The presence of an identifiable trauma trigger","The presence of auditory hallucinations accompanying the episodes","Reality testing remains intact — she recognizes the experience is not literally real","Symptom persistence beyond 6 months"],"correct":2,"rationale":"Depersonalization/derealization disorder is defined by intact reality testing — the person knows the unreality feeling isn't literally true — distinguishing it from psychosis. Unlike PTSD/ASD, no specific Criterion-A trauma is required for this diagnosis."},{"topic":"Trauma therapy","vignette":"A 12-year-old with new-onset PTSD is referred for psychotherapy, without a specific treatment model requested by the referring provider.","question":"Which model is the safest, most defensible first-line choice absent further detail?","options":["Medication management as the primary intervention","Psychodynamic psychotherapy","Play therapy alone","Trauma-Focused CBT (TF-CBT)"],"correct":3,"rationale":"TF-CBT is the gold-standard trauma therapy with the strongest empirical support in youth. Psychotherapy is first-line for trauma-related presentations; medication remains adjunctive only."},{"topic":"Trauma therapy","vignette":"A therapist begins working with a traumatized 9-year-old by teaching diaphragmatic breathing and developing a family safety plan before any discussion of the traumatic event itself.","question":"What principle does this treatment sequencing reflect?","options":["Medication should be initiated before any psychotherapy begins","Trauma narrative work should always begin in the first session","Grounding/stabilization skills are taught before any trauma memory processing — safety and self-regulation come first","Family involvement should be delayed until stabilization is fully complete"],"correct":2,"rationale":"Across effective trauma therapy models,
