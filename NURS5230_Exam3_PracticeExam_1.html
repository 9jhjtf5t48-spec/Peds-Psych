<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NURS 5230 — Exam 3 Practice Exam</title>
<style>
  :root {
    --ink: #1a2332;
    --ink-soft: #4a5568;
    --paper: #faf8f3;
    --paper-line: #e4dfd3;
    --rule: #c9c0aa;
    --navy: #1f3864;
    --navy-deep: #142544;
    --clinical-teal: #0e6b64;
    --correct: #1e6b3e;
    --correct-bg: #e7f3ea;
    --incorrect: #a3312a;
    --incorrect-bg: #faeae8;
    --amber: #9a6b12;
    --amber-bg: #fbf1de;
    --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --font-sans: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #eae6da;
      --ink-soft: #b7b1a0;
      --paper: #171a1f;
      --paper-line: #2a2f38;
      --rule: #3c4250;
      --navy: #6f8fc9;
      --navy-deep: #0e1620;
      --clinical-teal: #5fb8ac;
      --correct: #7fce9a;
      --correct-bg: #163325;
      --incorrect: #e69890;
      --incorrect-bg: #3a1e1c;
      --amber: #e0b258;
      --amber-bg: #3a2f16;
    }
  }
  :root[data-theme="dark"] {
    --ink: #eae6da; --ink-soft: #b7b1a0; --paper: #171a1f; --paper-line: #2a2f38;
    --rule: #3c4250; --navy: #6f8fc9; --navy-deep: #0e1620; --clinical-teal: #5fb8ac;
    --correct: #7fce9a; --correct-bg: #163325; --incorrect: #e69890; --incorrect-bg: #3a1e1c;
    --amber: #e0b258; --amber-bg: #3a2f16;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--paper); color: var(--ink);
    font-family: var(--font-sans);
  }
  body { min-height: 100vh; display: flex; flex-direction: column; }

  .masthead {
    background: var(--navy-deep);
    color: #f2efe6;
    padding: 22px 24px 18px;
    border-bottom: 4px solid var(--clinical-teal);
  }
  .masthead-inner {
    max-width: 760px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  .masthead h1 {
    font-family: var(--font-serif);
    font-size: 1.5rem; margin: 0; font-weight: 600; letter-spacing: 0.2px;
  }
  .masthead .sub {
    font-size: 0.82rem; color: #c7cede; margin-top: 4px; font-family: var(--font-sans);
  }
  .exam-badge {
    font-family: var(--font-sans); font-size: 0.72rem; color: var(--navy-deep);
    background: #d9c896; padding: 4px 10px; border-radius: 2px; white-space: nowrap;
    font-weight: 600;
  }

  main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }

  /* progress rail */
  .progress-rail { margin-bottom: 22px; }
  .progress-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 8px; }
  .progress-track { height: 6px; background: var(--paper-line); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--clinical-teal); transition: width 0.25s ease; }
  .score-chip { font-variant-numeric: tabular-nums; }

  /* landing */
  .landing { text-align: left; }
  .landing h2 { font-family: var(--font-serif); font-size: 1.6rem; margin: 0 0 10px; }
  .landing p { color: var(--ink-soft); line-height: 1.6; max-width: 58ch; }
  .landing .meta-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px; margin: 22px 0 28px; padding: 18px; background: var(--navy-deep);
    border-radius: 3px; color: #f2efe6;
  }
  .meta-item .num { font-family: var(--font-serif); font-size: 1.5rem; color: #d9c896; display: block; }
  .meta-item .label { font-size: 0.74rem; color: #c7cede; text-transform: none; }

  /* question card */
  .case-card {
    border: 1px solid var(--paper-line);
    background: color-mix(in srgb, var(--paper) 96%, var(--ink) 4%);
    border-radius: 2px;
    padding: 22px 22px 6px;
    margin-bottom: 18px;
  }
  .case-label {
    font-size: 0.72rem; letter-spacing: 0.3px; color: var(--clinical-teal);
    font-weight: 600; margin-bottom: 10px;
  }
  .vignette {
    font-family: var(--font-serif); font-size: 1.08rem; line-height: 1.62;
    color: var(--ink); margin-bottom: 16px; padding-bottom: 16px;
    border-bottom: 1px solid var(--paper-line);
  }
  .question-stem { font-size: 1rem; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }

  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .option {
    display: flex; align-items: flex-start; gap: 12px;
    border: 1px solid var(--rule); border-radius: 2px;
    padding: 12px 14px; cursor: pointer; background: var(--paper);
    transition: border-color 0.15s ease, background 0.15s ease;
    font-size: 0.96rem; line-height: 1.45;
  }
  .option:hover:not(.locked) { border-color: var(--navy); }
  .option .letter {
    font-family: var(--font-serif); font-weight: 700; color: var(--navy);
    flex-shrink: 0; width: 22px;
  }
  .option.selected:not(.locked) { border-color: var(--navy); background: color-mix(in srgb, var(--navy) 8%, var(--paper)); }
  .option.locked { cursor: default; }
  .option.correct-answer { border-color: var(--correct); background: var(--correct-bg); }
  .option.correct-answer .letter { color: var(--correct); }
  .option.wrong-answer { border-color: var(--incorrect); background: var(--incorrect-bg); }
  .option.wrong-answer .letter { color: var(--incorrect); }
  .option-tag { margin-left: auto; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
  .option-tag.correct-tag { background: var(--correct); color: #fff; }
  .option-tag.wrong-tag { background: var(--incorrect); color: #fff; }

  .submit-row { display: flex; justify-content: flex-end; margin-bottom: 18px; }
  .btn {
    font-family: var(--font-sans); font-size: 0.9rem; font-weight: 600;
    padding: 10px 22px; border-radius: 2px; border: none; cursor: pointer;
    transition: opacity 0.15s ease, transform 0.05s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--navy-deep); }
  .btn-ghost { background: transparent; color: var(--navy); border: 1px solid var(--rule); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--navy); }
  .btn-wide { width: 100%; }

  .rationale {
    border-top: 1px dashed var(--rule); margin-top: 4px; padding: 16px 0 20px;
    animation: fadein 0.25s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .rationale-verdict { font-weight: 700; font-size: 0.92rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .rationale-verdict.is-correct { color: var(--correct); }
  .rationale-verdict.is-incorrect { color: var(--incorrect); }
  .verdict-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .verdict-dot.dot-correct { background: var(--correct); }
  .verdict-dot.dot-incorrect { background: var(--incorrect); }
  .rationale-text { font-size: 0.94rem; line-height: 1.6; color: var(--ink-soft); }
  .rationale-tag { font-size: 0.72rem; color: var(--clinical-teal); font-weight: 600; margin-bottom: 8px; display: block; }

  .nav-row {
    display: flex; justify-content: space-between; align-items: center; margin-top: 8px;
  }
  .nav-row .spacer { flex: 1; }

  /* summary screen */
  .summary { text-align: left; }
  .summary h2 { font-family: var(--font-serif); font-size: 1.8rem; margin: 0 0 6px; }
  .score-hero {
    display: flex; align-items: baseline; gap: 14px; margin: 20px 0 6px;
    padding: 24px; background: var(--navy-deep); border-radius: 3px; color: #f2efe6;
  }
  .score-hero .big { font-family: var(--font-serif); font-size: 3rem; color: #d9c896; line-height: 1; }
  .score-hero .pct { font-size: 1.1rem; color: #c7cede; }
  .summary-note { color: var(--ink-soft); font-size: 0.9rem; margin: 14px 0 26px; line-height: 1.6; }

  .topic-table { width: 100%; border-collapse: collapse; margin-bottom: 28px; }
  .topic-table th, .topic-table td {
    text-align: left; padding: 9px 10px; font-size: 0.88rem;
    border-bottom: 1px solid var(--paper-line);
  }
  .topic-table th { color: var(--ink-soft); font-weight: 600; font-size: 0.76rem; }
  .topic-table td.num-col { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-cell { display: flex; align-items: center; gap: 8px; }
  .bar-track { flex: 1; height: 6px; background: var(--paper-line); border-radius: 3px; overflow: hidden; min-width: 60px; }
  .bar-fill { height: 100%; background: var(--clinical-teal); }
  .bar-fill.weak { background: var(--incorrect); }

  .review-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
  .review-item {
    border: 1px solid var(--paper-line); border-left: 3px solid var(--incorrect);
    padding: 12px 14px; border-radius: 2px; font-size: 0.88rem; cursor: pointer;
    background: color-mix(in srgb, var(--paper) 96%, var(--ink) 4%);
  }
  .review-item .q-num { color: var(--incorrect); font-weight: 700; margin-right: 6px; }
  .review-item .q-topic { color: var(--ink-soft); font-size: 0.78rem; }

  .jump-nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0 8px; }
  .jump-dot {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center; font-size: 0.72rem;
    cursor: pointer; background: var(--paper); color: var(--ink-soft); flex-shrink: 0;
  }
  .jump-dot.answered-correct { background: var(--correct); border-color: var(--correct); color: #fff; }
  .jump-dot.answered-incorrect { background: var(--incorrect); border-color: var(--incorrect); color: #fff; }
  .jump-dot.current { outline: 2px solid var(--navy); outline-offset: 2px; }

  footer { text-align: center; padding: 18px; font-size: 0.74rem; color: var(--ink-soft); }

  @media (max-width: 520px) {
    .masthead h1 { font-size: 1.2rem; }
    .vignette { font-size: 1rem; }
    .score-hero .big { font-size: 2.2rem; }
  }
</style>
</head>

<footer>NURS 5230 &middot; Exam 3 Prep &middot; 50 vignette-style items &middot; Not a substitute for course materials</footer>

<script>
const QUESTIONS = [{"topic":"Trauma Victim S/Sx","vignette":"An 8-year-old girl is brought in after witnessing a severe car accident 2 weeks ago. Her mother reports the child now re-enacts crash scenes repeatedly with her toy cars, startles at loud noises, and has become clingy at bedtime.","question":"Which symptom cluster does the repetitive crash re-enactment play best represent?","options":["Avoidance","Intrusion","Negative alterations in cognition/mood","Arousal and reactivity"],"correct":1,"rationale":"Repetitive trauma-themed play/reenactment is the developmentally appropriate way young children express intrusive memories, so it falls under the Intrusion cluster (Criterion B), not avoidance or arousal, which involve staying away from reminders or hypervigilance/startle, respectively."},{"topic":"Trauma Victim S/Sx","vignette":"A 10-year-old boy who survived a house fire 6 weeks ago now refuses to discuss the event, avoids the street where his house was, and tells his mother he 'doesn't remember much' about that night, though his behavior suggests otherwise.","question":"His avoidance of trauma reminders and reported gaps in recall best reflect which two DSM-5-TR PTSD symptom domains, respectively?","options":["Arousal; Intrusion","Avoidance; Negative alterations in cognition/mood","Intrusion; Avoidance","Negative alterations in mood; Arousal"],"correct":1,"rationale":"Avoiding the street (an external reminder) is Criterion C (avoidance); the reported memory gaps reflect dissociative amnesia for key aspects of the event, a Criterion D symptom (negative alterations in cognition/mood)."},{"topic":"Trauma Victim S/Sx","vignette":"A 6-year-old girl exposed to domestic violence in the home now has frequent temper outbursts at daycare, hits other children without clear provocation, and is described as 'jumpy' by her teacher.","question":"These behaviors most directly reflect which PTSD symptom cluster?","options":["Intrusion","Avoidance","Arousal and reactivity","Negative alterations in cognition/mood"],"correct":2,"rationale":"Irritable behavior, angry/aggressive outbursts, and an exaggerated startle response (being 'jumpy') are hallmark arousal/reactivity symptoms (Criterion E), which are often the most visible PTSD presentation in young children."},{"topic":"PTSD S/Sx and Triggers","vignette":"A 14-year-old boy with a history of physical abuse becomes suddenly aggressive and starts yelling whenever a teacher raises their voice in class, even mildly. He later cannot explain why he reacted so strongly.","question":"This reaction is best explained by which concept?","options":["Malingering for secondary gain","A trauma trigger activating the trauma memory network outside conscious awareness","A primary psychotic symptom","Age-appropriate oppositional behavior"],"correct":1,"rationale":"A raised voice is a plausible trauma reminder (trigger) for a child with a history of physical abuse involving yelling; triggers can activate an intrusion/arousal response even without the person consciously linking the reminder to the trauma."},{"topic":"PTSD S/Sx and Triggers","vignette":"A PMHNP is evaluating a 9-year-old with confirmed PTSD following a dog attack. The child has had daily nightmares, hypervigilance, and avoidance of parks for 5 weeks.","question":"Which diagnostic duration threshold has this child now met?","options":["The 3-day minimum for Acute Stress Disorder","The 1-month minimum required for a PTSD diagnosis","The 6-month minimum for delayed-onset PTSD","No threshold; duration is not part of PTSD criteria"],"correct":1,"rationale":"PTSD (Criterion F) requires symptom duration of more than 1 month; at 5 weeks, this child has crossed that threshold, distinguishing the presentation from Acute Stress Disorder (3 days–1 month)."},{"topic":"PTSD and Substance Use","vignette":"A 16-year-old with PTSD following sexual assault reports smoking cannabis daily, stating it is 'the only thing that helps me sleep and stops the memories from popping up.'","question":"This pattern is best understood as an example of which concept?","options":["Primary cannabis use disorder unrelated to trauma","The self-medication hypothesis, where PTSD symptoms precede and drive substance use","Evidence that the PTSD diagnosis is incorrect","A normal developmental experimentation pattern"],"correct":1,"rationale":"Adolescents with PTSD frequently self-medicate intrusive memories, hyperarousal, and insomnia with cannabis; PTSD often precedes the onset of substance use in youth, consistent with the self-medication hypothesis."},{"topic":"PTSD and Substance Use","vignette":"A 17-year-old girl has PTSD and a comorbid cannabis use disorder. She is not yet willing to discuss the details of her trauma but agrees to attend therapy focused on coping skills.","question":"Which evidence-informed treatment model is best suited to this stage of readiness?","options":["Trauma narrative exposure as the first step","Seeking Safety, a present-focused model for co-occurring PTSD and substance use","Inpatient detoxification only, with no psychotherapy","Play therapy without a structured curriculum"],"correct":1,"rationale":"Seeking Safety is specifically designed for co-occurring PTSD and substance use disorder and does not require a detailed trauma narrative, making it appropriate for a patient not yet ready for trauma-focused exposure work."},{"topic":"PTSD in the School Setting","vignette":"A 12-year-old survivor of a community shooting has PTSD symptoms triggered by fire alarms and shows declining grades and avoidance of school. The family has limited access to outpatient mental health services.","question":"Which intervention is most appropriate given these circumstances?","options":["Cognitive-Behavioral Intervention for Trauma in Schools (CBITS)","Inpatient psychiatric hospitalization","Discontinuing school attendance until symptoms resolve","Long-term psychodynamic psychotherapy only"],"correct":0,"rationale":"CBITS is a school-day, group-delivered adaptation of TF-CBT designed for exactly this situation — limited outpatient access and community/school-wide trauma — and can be implemented within the school setting."},{"topic":"PTSD in the School Setting","vignette":"A teacher asks a PMHNP for guidance on supporting a trauma-exposed student who becomes distressed during unannounced fire drills.","question":"Which recommendation is most appropriate?","options":["Prohibit the student from ever leaving the classroom","Provide advance warning of drills and a safe space or pass to step out when triggered","Recommend the student repeat the same grade","Avoid informing school staff of the trauma history to protect privacy at all costs"],"correct":1,"rationale":"Practical school accommodations — advance warning of loud/startling events and access to a quiet space — reduce unnecessary triggering while keeping the student engaged in school, consistent with trauma-informed school practices."},{"topic":"PTSD Recommended Therapies","vignette":"A clinician is selecting first-line psychotherapy for an 11-year-old with PTSD following physical abuse. The child's mother is engaged and willing to participate in treatment.","question":"Which therapy has the strongest empirical support for this presentation?","options":["Trauma-Focused Cognitive Behavioral Therapy (TF-CBT)","Psychoanalysis","Applied Behavior Analysis","Social skills training alone"],"correct":0,"rationale":"TF-CBT is the gold-standard, most empirically supported trauma therapy for children and adolescents, and it explicitly incorporates caregiver involvement (the 'conjoint' and parenting-skills components), fitting this family's engagement."},{"topic":"PTSD Recommended Therapies","vignette":"A prescriber is asked to list the components of TF-CBT in order for a case presentation.","question":"Which mnemonic correctly represents the components of TF-CBT?","options":["SOAP: Subjective, Objective, Assessment, Plan","PRACTICE: Psychoeducation/Parenting, Relaxation, Affective modulation, Cognitive processing, Trauma narrative, In-vivo mastery, Conjoint sessions, Enhancing safety","CBT: Cognitive, Behavioral, Therapeutic","FRAMES: Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy"],"correct":1,"rationale":"TF-CBT's components are captured by PRACTICE. FRAMES is a motivational interviewing-related mnemonic, not a TF-CBT component list."},{"topic":"PTSD Recommended Therapies","vignette":"A 15-year-old with PTSD has not responded adequately to trauma-focused psychotherapy alone. The prescriber is considering adjunct medication.","question":"Which statement about pharmacotherapy for pediatric PTSD is most accurate?","options":["Benzodiazepines are first-line and highly effective","No medication currently has strong RCT support for pediatric PTSD; medication remains adjunctive to psychotherapy","Antipsychotics are FDA-approved as first-line PTSD treatment in youth","Medication should always precede psychotherapy in PTSD"],"correct":1,"rationale":"Psychotherapy (particularly TF-CBT) is first-line for pediatric PTSD. No medication currently has strong randomized controlled trial support in youth; medication is reserved as an adjunct for specific indications."},{"topic":"What is Trauma-Focused Therapy","vignette":"A nursing student asks how 'trauma-focused therapy' differs from generic supportive counseling for a traumatized child.","question":"Which explanation is most accurate?","options":["They are identical terms for the same intervention","Trauma-focused therapy directly and explicitly addresses the traumatic experience and its aftermath, rather than only treating downstream symptoms","Trauma-focused therapy never involves the caregiver","Supportive counseling always outperforms trauma-focused therapy in RCTs"],"correct":1,"rationale":"Trauma-focused therapy explicitly and directly processes the traumatic experience (safety/stabilization, titrated processing, correcting trauma-related distortions), distinguishing it from supportive approaches that may build rapport/coping without directly addressing the trauma memory."},{"topic":"What is Trauma-Focused Therapy","vignette":"A resident asks which single therapy model is the safest, most defensible answer when a vignette asks to identify a 'trauma-focused therapy' without further detail.","question":"What is the best answer?","options":["Applied Behavior Analysis","Trauma-Focused CBT (TF-CBT)","Motivational Interviewing","Systematic desensitization for a specific phobia"],"correct":1,"rationale":"TF-CBT is the prototypical, most-studied trauma-focused therapy in youth and is the safest default answer when a vignette does not specify a more particular model."},{"topic":"Trauma Narratives","vignette":"A therapist has completed psychoeducation, relaxation training, and affective modulation skills with an 11-year-old trauma survivor and now wants to move to the next TF-CBT component.","question":"What should occur next?","options":["Termination of treatment, as skills-building alone is sufficient","Development of the trauma narrative with therapist support","Immediate discharge to a support group","Referral for inpatient hospitalization"],"correct":1,"rationale":"After stabilization/coping-skills components (Psychoeducation, Relaxation, Affective modulation, Cognitive processing) are established, TF-CBT proceeds to the Trauma narrative component — gradual, supported exposure to the trauma memory."},{"topic":"Trauma Narratives","vignette":"During trauma narrative work, a 9-year-old's therapist keeps having the child retell the story of the assault over several sessions, adding detail each time and identifying distorted beliefs like self-blame.","question":"What is the primary therapeutic purpose of this repeated retelling?","options":["To re-traumatize the child intentionally","To gradually process and integrate the memory while correcting distorted trauma-related cognitions","To gather forensic evidence for law enforcement","To assess for malingering"],"correct":1,"rationale":"The trauma narrative provides controlled, therapist-supported exposure to reduce avoidance and allow the memory to be processed/integrated, while cognitive processing identifies and corrects distortions such as self-blame."},{"topic":"PTSD vs Acute Stress Disorder","vignette":"A 13-year-old was involved in a serious car accident 10 days ago. She has intrusive memories, dissociative episodes, avoidance of cars, and sleep disturbance causing significant distress and school impairment.","question":"Based on symptom duration alone, which diagnosis is most appropriate at this time?","options":["Posttraumatic Stress Disorder","Acute Stress Disorder","Adjustment Disorder","Generalized Anxiety Disorder"],"correct":1,"rationale":"At 10 days post-trauma (within the 3-day to 1-month window), Acute Stress Disorder is the appropriate diagnosis; PTSD cannot be diagnosed until symptoms have persisted beyond 1 month."},{"topic":"PTSD vs Acute Stress Disorder","vignette":"A child originally diagnosed with Acute Stress Disorder after a natural disaster continues to have significant intrusion, avoidance, negative mood, and arousal symptoms at the 6-week follow-up visit.","question":"What is the most appropriate next step?","options":["Continue the Acute Stress Disorder diagnosis indefinitely","Reclassify the diagnosis to PTSD, since symptoms have persisted beyond 1 month","Diagnose a specific phobia instead","Conclude the child is malingering"],"correct":1,"rationale":"When symptoms persist beyond the 1-month threshold, the diagnosis converts from Acute Stress Disorder to PTSD; this is a well-recognized diagnostic transition, not a sign of fabrication."},{"topic":"PTSD vs Acute Stress Disorder","vignette":"A prescriber is comparing the diagnostic structures of Acute Stress Disorder and PTSD for a study group.","question":"Which statement accurately differentiates the two disorders' symptom structures?","options":["ASD requires 9 of 14 symptoms across 5 categories including dissociation; PTSD requires all of 4 distinct symptom clusters (A–H criteria)","PTSD requires fewer symptoms than ASD","Dissociation is a required symptom in PTSD but never appears in ASD","ASD and PTSD have identical symptom criteria, differing only in duration"],"correct":0,"rationale":"ASD uses a flexible count (≥ 9 of 14 symptoms across 5 categories including dissociation); PTSD requires meeting all of Criteria A–H, organized into 4 distinct clusters (intrusion, avoidance, negative mood/cognition, arousal), with dissociation only in a specifier, not a required cluster."},{"topic":"Nightmares — Medication","vignette":"A 10-year-old with PTSD continues to have severe, function-impairing nightmares despite 12 weeks of TF-CBT and behavioral sleep interventions.","question":"Which medication has the best-known targeted evidence for trauma-related nightmares?","options":["Diphenhydramine","Prazosin","Fluoxetine as monotherapy for nightmares specifically","Lorazepam"],"correct":1,"rationale":"Prazosin, an alpha-1 antagonist, has the best-known (though still limited pediatric) evidence targeted specifically at trauma-related nightmares; orthostatic blood pressure should be monitored."},{"topic":"Nightmares — Medication","vignette":"A prescriber starts a child on prazosin for trauma-related nightmares.","question":"Which monitoring parameter is most important with this medication?","options":["Serum lithium level","Orthostatic blood pressure","QTc interval only","Liver transaminases weekly"],"correct":1,"rationale":"Prazosin is an alpha-1 antagonist that can cause orthostatic hypotension, so blood pressure (particularly orthostatic changes) should be monitored, especially when starting or titrating the dose."},{"topic":"Divorcing Parents / Adjustment Disorder","vignette":"A 9-year-old boy has developed anxiety and school refusal beginning 6 weeks after his parents announced their divorce. He does not meet full criteria for any specific anxiety or mood disorder.","question":"Which diagnosis and treatment combination best fits this scenario?","options":["Major depressive disorder; SSRI monotherapy","Adjustment disorder; family therapy","Generalized anxiety disorder; benzodiazepine therapy","Conduct disorder; multisystemic therapy"],"correct":1,"rationale":"Symptoms beginning within 3 months of an identifiable stressor (the divorce announcement) that do not meet criteria for another specific disorder point to adjustment disorder; family therapy addressing the disrupted family system is the best-fit treatment."},{"topic":"Divorcing Parents / Adjustment Disorder","vignette":"During a family therapy session with high-conflict divorcing parents, arguments repeatedly escalate with each parent interrupting and blaming the other.","question":"Which technique would best help structure this communication?","options":["Allowing the argument to continue until it resolves itself","Establishing a rule, such as a talking stick, so only the person holding it may speak","Ending therapy immediately and referring to litigation","Seeing each parent individually and never allowing joint sessions"],"correct":1,"rationale":"Setting clear communication ground rules — such as a talking stick, where only the holder may speak — enforces turn-taking and reduces chaotic, escalating exchanges, a core family-therapy technique for high-conflict families."},{"topic":"Talking Stick Basics","vignette":"A family therapist introduces an object that only the currently speaking family member may hold, and all other members must listen without interrupting.","question":"What is the primary therapeutic purpose of this technique?","options":["To determine who is at fault in the family conflict","To enforce turn-taking and ensure quieter members, often the child, are heard","To speed up the session so it ends early","To replace the need for any other therapeutic rules"],"correct":1,"rationale":"The talking stick enforces turn-taking, slows reactive exchanges, and ensures quieter family members (often the child) get an uninterrupted voice — it is a structured communication tool, not a diagnostic or fault-finding device."},{"topic":"Grounding vs Desensitization","vignette":"A 12-year-old becomes acutely dissociative and overwhelmed during a session, reporting she feels like she is 'not really here.' The therapist has her name five things she can see and feel her feet on the floor.","question":"What technique is being used, and what is its goal?","options":["Systematic desensitization; to reduce a conditioned fear response through exposure","Grounding; to reorient the patient to present-moment safety","Trauma narrative work; to process the traumatic memory","Cognitive restructuring; to correct a distorted belief"],"correct":1,"rationale":"Grounding orients attention to present-moment sensory input (what can be seen, felt) to stabilize a dissociating or overwhelmed patient; it is not exposure-based and is used for in-the-moment stabilization, not memory processing."},{"topic":"Grounding vs Desensitization","vignette":"A therapist gradually and repeatedly exposes a trauma survivor to a previously avoided but safe reminder of the trauma (a similar car) while pairing this with relaxation techniques, until the anxiety response diminishes.","question":"Which technique is being described, and when is it appropriately introduced in treatment?","options":["Grounding; introduced before any stabilization skills are taught","Desensitization; introduced after stabilization/grounding skills are established","Family therapy; introduced during the first session","Motivational interviewing; introduced only for substance use"],"correct":1,"rationale":"This is systematic desensitization, an exposure-based technique. It is appropriately introduced after the patient has stabilization/grounding skills in place, since exposure work before stabilization risks retraumatization or overwhelm."},{"topic":"Separation vs Social Anxiety","vignette":"A 7-year-old refuses to attend sleepovers or go to school unless her mother is nearby, has recurrent nightmares about being separated from her mother, and reports stomachaches each morning before school. She interacts normally with peers when her mother is present.","question":"Which diagnosis is most likely?","options":["Social Anxiety Disorder","Separation Anxiety Disorder","Generalized Anxiety Disorder","Selective Mutism"],"correct":1,"rationale":"The anxiety is specifically tied to separation from the attachment figure, with normal social functioning when the mother is present — the hallmark of Separation Anxiety Disorder rather than Social Anxiety Disorder, where anxiety persists even with a caregiver present due to fear of social scrutiny."},{"topic":"Separation vs Social Anxiety","vignette":"A 14-year-old avoids presenting in class and eating in the school cafeteria even when her best friend is sitting right next to her, fearing she will be judged or embarrassed.","question":"Which diagnosis is most consistent with this presentation?","options":["Separation Anxiety Disorder","Social Anxiety Disorder","Panic Disorder","Selective Mutism"],"correct":1,"rationale":"The anxiety persists even with a trusted friend present because the trigger is fear of negative social evaluation/scrutiny, not separation from an attachment figure — this is the defining feature of Social Anxiety Disorder."},{"topic":"Separation vs Social Anxiety","vignette":"A clinician is teaching students the fastest way to differentiate Separation Anxiety Disorder from Social Anxiety Disorder in a pediatric vignette.","question":"Which single question best differentiates the two?","options":["Does the child have a fever?","Is the child anxious only when separated from a caregiver, or anxious even when the caregiver is present because of social scrutiny?","Does the child have a tic disorder?","Is the child male or female?"],"correct":1,"rationale":"This is the fastest differentiator: anxiety tied specifically to separation points to Separation Anxiety Disorder, while anxiety persisting even with the caregiver present (due to fear of social evaluation) points to Social Anxiety Disorder."},{"topic":"Social Anxiety Dx and Therapy","vignette":"A 15-year-old with social anxiety disorder and her family are deciding on first-line treatment. She has not yet tried any intervention.","question":"What should be recommended first?","options":["A benzodiazepine as a standing daily medication","Cognitive-behavioral therapy with graded exposure and social skills training","Fluoxetine as first-line before any psychotherapy is attempted","No treatment, since the disorder typically remits on its own"],"correct":1,"rationale":"CBT with graded exposure (fear hierarchy) and social skills training is first-line for social anxiety disorder; medication is reserved for severe symptoms or inadequate response to therapy, and benzodiazepines lack controlled efficacy evidence in youth."},{"topic":"Social Anxiety Dx and Therapy","vignette":"A study compared Social Effectiveness Therapy for Children (SET-C) against fluoxetine and placebo for pediatric social anxiety disorder.","question":"What was the general finding relevant to treatment selection?","options":["Fluoxetine alone outperformed SET-C and placebo","SET-C outperformed fluoxetine alone and placebo, reinforcing psychotherapy as first-line","Placebo outperformed both active treatments","No difference was found between any of the three arms"],"correct":1,"rationale":"SET-C outperformed fluoxetine alone and placebo in head-to-head comparison, supporting the recommendation that psychotherapy be first-line for pediatric social anxiety disorder, with medication reserved for refractory or severe cases."},{"topic":"Panic Disorder Dx","vignette":"A 16-year-old presents to the ED with sudden chest pain, palpitations, shortness of breath, and a fear of 'going crazy,' which peaked within about 8 minutes and then resolved. This is her third such episode this month, and she has begun avoiding the mall where the first episode occurred.","question":"Which diagnosis best fits this presentation?","options":["Generalized Anxiety Disorder","Panic Disorder","Specific Phobia","Social Anxiety Disorder"],"correct":1,"rationale":"Recurrent, unexpected panic attacks (abrupt symptom surge peaking within minutes, ≥ 4 of 13 characteristic symptoms) plus ongoing worry/behavior change (avoidance of the mall) for more than a month meet criteria for Panic Disorder."},{"topic":"Panic Disorder Dx","vignette":"A clinician is explaining why a single panic attack, by itself, is not sufficient for a diagnosis of Panic Disorder.","question":"What additional criterion must be met?","options":["The attack must occur during sleep","At least 1 month of persistent concern about additional attacks or significant related behavior change following the attack","The attack must be confirmed by EEG","The patient must have a family history of panic disorder"],"correct":1,"rationale":"Criterion B requires that at least one attack be followed by ≥ 1 month of persistent worry about additional attacks or their consequences, or significant maladaptive behavior change — an isolated attack alone (Criterion A) is necessary but not sufficient for the diagnosis."},{"topic":"Panic Disorder Dx","vignette":"A 15-year-old has recurrent panic attacks that occur exclusively right before required class presentations, along with intense fear of embarrassment in front of peers.","question":"Which diagnosis is most likely, given the specific trigger pattern?","options":["Panic Disorder, since panic attacks are present","Social Anxiety Disorder with panic attacks occurring only in social/performance contexts","Separation Anxiety Disorder","Agoraphobia"],"correct":1,"rationale":"Panic Disorder requires attacks to be unexpected and not confined to a specific trigger category; attacks occurring only in social/performance situations are better explained by social anxiety disorder with panic attacks as a feature, not an independent Panic Disorder diagnosis."},{"topic":"Selective Mutism","vignette":"A 5-year-old speaks fluently and appropriately at home but has not spoken a single word at school for the past 3 months, despite normal receptive and expressive language skills documented by a speech evaluation.","question":"Which diagnosis is most likely?","options":["Autism Spectrum Disorder","Selective Mutism","A language disorder","Intellectual disability"],"correct":1,"rationale":"Consistent failure to speak in specific settings (school) despite speaking normally in others (home), with normal language ability and duration ≥ 1 month, meets criteria for Selective Mutism, which is classified as an anxiety disorder in DSM-5."},{"topic":"Selective Mutism","vignette":"A family wants to know the first-line treatment approach for their child recently diagnosed with selective mutism.","question":"What should be recommended?","options":["Immediate initiation of an SSRI as the sole treatment","Behavioral therapy with systematic desensitization/shaping, involving both parents and teachers","Waiting without intervention, since it always resolves spontaneously","Strict punishment for refusal to speak"],"correct":1,"rationale":"First-line treatment for selective mutism is behavioral therapy — office-based systematic desensitization/shaping with active parent and teacher involvement; medication is reserved for cases resistant to psychosocial treatment."},{"topic":"Insomnia Treatment","vignette":"A 10-year-old without a significant psychiatric history has developed difficulty falling asleep over the past month, coinciding with a new tablet in her bedroom that she uses until late at night.","question":"What is the most appropriate first-line intervention?","options":["Initiate a benzodiazepine nightly","Behavioral sleep hygiene measures, including removing screens from the bedroom","Order a sleep study before any intervention","Start an antipsychotic for sleep"],"correct":1,"rationale":"First-line management of pediatric insomnia is behavioral/sleep hygiene — consistent bedtime routine, removing electronics from the bedroom, and a regular sleep-wake schedule — before considering any pharmacologic option."},{"topic":"Insomnia Treatment","vignette":"A child's insomnia persists despite consistent sleep hygiene measures, and the family asks about a pharmacologic option with the best support for short-term use in children.","question":"Which agent is most appropriate to recommend?","options":["Melatonin","A benzodiazepine","An atypical antipsychotic","A barbiturate"],"correct":0,"rationale":"Melatonin is the best-supported pharmacologic option for short-term pediatric insomnia, with a favorable side-effect profile; no medication currently has FDA approval for pediatric insomnia, and benzodiazepines/antipsychotics are not recommended for this indication."},{"topic":"OCD Dx and Medications","vignette":"A 12-year-old spends more than 3 hours daily performing handwashing rituals and checking behaviors that he recognizes are excessive but cannot stop, causing significant distress and school absences.","question":"Which class of first-line psychotherapy is most appropriate?","options":["Psychodynamic psychotherapy","Cognitive-behavioral therapy with Exposure and Response Prevention (ERP)","Supportive counseling only","Family systems therapy alone, without individual treatment"],"correct":1,"rationale":"CBT with ERP is first-line for mild-to-moderate pediatric OCD; it involves gradual exposure to the obsession trigger while preventing the compulsive response, allowing anxiety to habituate."},{"topic":"OCD Dx and Medications","vignette":"A prescriber is selecting a medication for a 10-year-old with severe OCD who has had a partial response to CBT alone.","question":"Which medication is FDA-approved for pediatric OCD?","options":["Bupropion","Sertraline","Lithium","Quetiapine as monotherapy"],"correct":1,"rationale":"Sertraline, along with fluoxetine, fluvoxamine, and clomipramine, is FDA-approved for pediatric OCD. Combination CBT plus medication is the most effective approach per the POTS trial."},{"topic":"OCD Dx and Medications","vignette":"An 11-year-old with OCD has had only partial response after 12 weeks of an adequate sertraline dose combined with ERP.","question":"Which augmentation strategy is best supported?","options":["Switching immediately to a benzodiazepine as monotherapy","Adding a low-dose atypical antipsychotic such as risperidone or aripiprazole","Discontinuing all treatment and reassessing in 1 year","Doubling the psychotherapy session length with no medication change"],"correct":1,"rationale":"For partial responders, augmentation with a low-dose atypical antipsychotic (risperidone or aripiprazole are best-supported) is a recognized strategy, particularly when comorbid tics are present."},{"topic":"OCD Patient Education","vignette":"A father has been helping his daughter complete her handwashing rituals each morning so she is not late for school, believing this is the most supportive approach.","question":"What is the most important psychoeducation point for this family?","options":["Continue the current approach, since it reduces the child's morning distress","Reducing family accommodation, even though well-intentioned, is important because it reinforces OCD symptoms over time","Family involvement should be eliminated entirely from treatment","The father should take over performing all rituals himself"],"correct":1,"rationale":"Family accommodation — participating in or facilitating rituals — is well-intentioned but reinforces the OCD cycle; a key psychoeducation goal is helping families gradually reduce accommodation while still providing support."},{"topic":"PANDAS","vignette":"An 8-year-old with no prior psychiatric history develops severe obsessive-compulsive symptoms and motor tics literally overnight, two weeks after being treated for strep throat.","question":"Which condition should be considered given this presentation?","options":["Generalized Anxiety Disorder","PANDAS (Pediatric Autoimmune Neuropsychiatric Disorders Associated with Streptococcal infections)","Autism Spectrum Disorder","Adjustment Disorder"],"correct":1,"rationale":"A sudden, dramatic ('overnight') onset of OCD symptoms and/or tics in a school-age child temporally associated with streptococcal infection is the classic clinical clue for PANDAS."},{"topic":"PANDAS","vignette":"A resident asks whether a single confirmatory laboratory test exists to diagnose PANDAS.","question":"What is the most accurate response?","options":["Yes, a specific PANDAS antibody test is diagnostic and required","No; PANDAS diagnosis is clinical and remains controversial, without a single definitive lab test","Yes, MRI findings are pathognomonic for PANDAS","No; PANDAS can only be diagnosed post-mortem"],"correct":1,"rationale":"PANDAS diagnosis is clinical, based on prepubertal onset, episodic course with abrupt exacerbations, temporal association with strep infection, and associated OCD/tics or neurological findings; there is no single definitive laboratory test, and the diagnosis remains controversial."},{"topic":"Sertraline","vignette":"A prescriber is initiating sertraline in a 7-year-old with OCD.","question":"Which statement about sertraline in this age group is accurate?","options":["Sertraline is FDA-approved for OCD in children age 6 and older","Sertraline is only approved for adult depression, never for pediatric use","Sertraline is contraindicated in all children under age 12","Sertraline is FDA-approved for pediatric bipolar disorder"],"correct":0,"rationale":"Sertraline is FDA-approved for OCD in children as young as age 6; this is the key on-label pediatric indication to know, while most other pediatric uses of sertraline are off-label."},{"topic":"Sertraline","vignette":"A prescriber is starting sertraline in a highly anxious adolescent with panic disorder, compared to another adolescent starting sertraline for OCD.","question":"How should the starting dose and titration typically differ between these two patients?","options":["Both should start at the same dose and same titration speed","The panic disorder patient should start at a lower dose (e.g., 25 mg) and titrate more slowly, due to increased sensitivity to early activation","The OCD patient should start at a much lower dose than the panic disorder patient","Sertraline should never be used for panic disorder"],"correct":1,"rationale":"Anxious/panic-prone patients are more sensitive to early SSRI activation (jitteriness, increased anxiety), so a lower starting dose and slower titration is used for panic disorder/PTSD/anxiety compared to standard OCD or depression dosing."},{"topic":"Sertraline","vignette":"A family asks why their teenager's sertraline was prescribed to be taken in the morning rather than at night.","question":"What is the most accurate explanation?","options":["Morning dosing has no clinical rationale and either time is equivalent","Morning dosing helps reduce the risk of medication-induced insomnia","Morning dosing prevents all possible side effects","Sertraline must be taken with a fatty meal for absorption, which only occurs at breakfast"],"correct":1,"rationale":"Sertraline is generally dosed once daily in the morning to reduce the risk of insomnia, since activation/insomnia is a recognized side effect for some patients."},{"topic":"PTSD S/Sx and Triggers","vignette":"A 7-year-old survivor of a severe flood is only able to demonstrate 5 of the usual adult PTSD symptom criteria, showing mostly behavioral regression and extreme tantrums rather than clearly verbalized fear.","question":"How does DSM-5-TR address PTSD diagnosis in children age 6 and younger?","options":["Children under 6 can never be diagnosed with PTSD","A separate, developmentally modified criteria set applies, requiring fewer symptoms and allowing more behavioral expression","The same adult criteria must be met exactly, with no modification","PTSD in this age group is diagnosed only by EEG findings"],"correct":1,"rationale":"DSM-5-TR includes a separate, developmentally modified PTSD criteria set for children ≤ 6 years, which requires fewer symptoms and accounts for behavioral (rather than verbalized) presentations, such as reenactment play and temper tantrums counting toward arousal criteria."},{"topic":"Talking Stick Basics","vignette":"A therapist introduces the talking stick technique at the very beginning of the first family therapy session with a high-conflict blended family, before any content is discussed.","question":"Why is introducing this rule at the start of the first session considered best practice?","options":["It has no real clinical benefit and is only symbolic","It proactively establishes the clinician's control of the session frame and helps prevent escalation before it starts","It replaces the need for any further rules","It is only useful for sessions involving children under age 5"],"correct":1,"rationale":"Setting communication ground rules such as the talking stick at the very start of treatment is a proactive, preventive intervention that establishes the clinician's role in managing session safety and structure, rather than reacting only after conflict has already escalated."},{"topic":"OCD Patient Education","vignette":"A mother of a child newly diagnosed with OCD is worried her son's compulsions are simply 'bad behavior' he could stop if properly disciplined.","question":"Which psychoeducation point is most important to address this concern?","options":["Agreeing that stricter discipline will resolve the compulsions","Explaining OCD as a neurobiological, brain circuitry-based condition rather than a character flaw or willful behavior","Avoiding any explanation of the neurobiology, since it may confuse the family","Telling the mother that medication alone, without any behavioral component, will fix the problem"],"correct":1,"rationale":"A core OCD psychoeducation point is framing the disorder as a neurobiological condition (involving cortico-striato-thalamo-cortical circuitry and serotonin dysregulation), not a character flaw or something the child can simply stop through willpower or punishment."}];
const TOTAL = QUESTIONS.length;

let state = {
  screen: "landing", // landing | quiz | summary
  index: 0,
  answers: new Array(TOTAL).fill(null), // selected option index or null
  submitted: new Array(TOTAL).fill(false),
};

function letterFor(i) { return String.fromCharCode(65 + i); }

function saveState() {
  try {
    localStorage.setItem("nurs5230_exam1_state", JSON.stringify({
      index: state.index, answers: state.answers, submitted: state.submitted, screen: state.screen
    }));
  } catch(e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem("nurs5230_exam1_state");
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved && Array.isArray(saved.answers) && saved.answers.length === TOTAL) {
      state.index = saved.index || 0;
      state.answers = saved.answers;
      state.submitted = saved.submitted || new Array(TOTAL).fill(false);
      if (saved.screen === "summary") state.screen = "summary";
      else if (saved.answers.some(a => a !== null)) state.screen = "quiz";
    }
  } catch(e) {}
}

function computeScore() {
  let correct = 0, answered = 0;
  for (let i = 0; i < TOTAL; i++) {
    if (state.submitted[i]) {
      answered++;
      if (state.answers[i] === QUESTIONS[i].correct) correct++;
    }
  }
  return { correct, answered };
}

function computeTopicBreakdown() {
  const byTopic = {};
  QUESTIONS.forEach((q, i) => {
    if (!byTopic[q.topic]) byTopic[q.topic] = { correct: 0, total: 0 };
    if (state.submitted[i]) {
      byTopic[q.topic].total++;
      if (state.answers[i] === q.correct) byTopic[q.topic].correct++;
    }
  });
  return byTopic;
}

function render() {
  const app = document.getElementById("app");
  if (state.screen === "landing") app.innerHTML = renderLanding();
  else if (state.screen === "quiz") app.innerHTML = renderQuiz();
  else app.innerHTML = renderSummary();
  attachHandlers();
  saveState();
}

function renderLanding() {
  const hasProgress = state.answers.some(a => a !== null);
  return `
    <div class="landing">
      <h2>NURS 5230 — Exam 3 Practice Exam</h2>
      <p>Anxiety, OCD & Related, and Trauma- and Stressor-Related Disorders. Fifty vignette-style, moderate-to-difficult multiple choice questions covering every topic on your Exam 3 study guide. Answer each question and submit to see the rationale immediately, then move to the next case. Your final grade appears once you submit the full exam.</p>
      <div class="meta-grid">
        <div class="meta-item"><span class="num">${TOTAL}</span><span class="label">Vignette questions</span></div>
        <div class="meta-item"><span class="num">Mod&ndash;High</span><span class="label">Difficulty level</span></div>
        <div class="meta-item"><span class="num">21</span><span class="label">Topics covered</span></div>
      </div>
      <button class="btn btn-primary" id="startBtn">${hasProgress ? "Resume exam" : "Begin exam"}</button>
      ${hasProgress ? '<button class="btn btn-ghost" id="restartBtn" style="margin-left:10px;">Start over</button>' : ""}
    </div>
  `;
}

function renderQuiz() {
  const i = state.index;
  const q = QUESTIONS[i];
  const submitted = state.submitted[i];
  const selected = state.answers[i];
  const pct = Math.round(((i) / TOTAL) * 100);
  const sc = computeScore();

  let optionsHtml = q.options.map((opt, oi) => {
    let cls = "option";
    let tag = "";
    if (submitted) {
      cls += " locked";
      if (oi === q.correct) { cls += " correct-answer"; tag = '<span class="option-tag correct-tag">Correct</span>'; }
      else if (oi === selected) { cls += " wrong-answer"; tag = '<span class="option-tag wrong-tag">Your answer</span>'; }
    } else if (selected === oi) {
      cls += " selected";
    }
    return `<div class="${cls}" data-oi="${oi}">
      <span class="letter">${letterFor(oi)}</span>
      <span>${opt}</span>
      ${tag}
    </div>`;
  }).join("");

  let rationaleHtml = "";
  if (submitted) {
    const isCorrect = selected === q.correct;
    rationaleHtml = `
      <div class="rationale">
        <span class="rationale-tag">Rationale</span>
        <div class="rationale-verdict ${isCorrect ? "is-correct" : "is-incorrect"}">
          <span class="verdict-dot ${isCorrect ? "dot-correct" : "dot-incorrect"}"></span>
          ${isCorrect ? "Correct" : "Incorrect \u2014 correct answer is " + letterFor(q.correct)}
        </div>
        <div class="rationale-text">${q.rationale}</div>
      </div>
    `;
  }

  const submitDisabled = selected === null || submitted;
  const isLast = i === TOTAL - 1;

  return `
    <div class="progress-rail">
      <div class="progress-row">
        <span>Question ${i + 1} of ${TOTAL}</span>
        <span class="score-chip">${sc.answered} answered &middot; ${sc.correct} correct so far</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="case-card">
      <div class="case-label">CLINICAL VIGNETTE</div>
      <div class="vignette">${q.vignette}</div>
      <div class="question-stem">${q.question}</div>
      <div class="options" id="optionsWrap">${optionsHtml}</div>
      ${!submitted ? `<div class="submit-row"><button class="btn btn-primary" id="submitBtn" ${submitDisabled ? "disabled" : ""}>Submit answer</button></div>` : ""}
      ${rationaleHtml}
    </div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="backBtn" ${i === 0 ? "disabled" : ""}>&larr; Back</button>
      <div class="spacer"></div>
      ${isLast
        ? `<button class="btn btn-primary" id="finishBtn" ${!submitted ? "disabled" : ""}>Submit exam for final grade</button>`
        : `<button class="btn btn-primary" id="nextBtn" ${!submitted ? "disabled" : ""}>Next &rarr;</button>`
      }
    </div>
  `;
}

function renderSummary() {
  const sc = computeScore();
  const pct = Math.round((sc.correct / TOTAL) * 100);
  const breakdown = computeTopicBreakdown();
  const topics = Object.keys(breakdown).sort();

  let rows = topics.map(t => {
    const b = breakdown[t];
    const p = b.total ? Math.round((b.correct / b.total) * 100) : 0;
    const weak = b.total && (b.correct / b.total) < 0.6;
    return `<tr>
      <td>${t}</td>
      <td class="num-col">${b.correct}/${b.total}</td>
      <td><div class="bar-cell"><div class="bar-track"><div class="bar-fill ${weak ? "weak" : ""}" style="width:${p}%"></div></div><span style="min-width:34px;text-align:right;">${p}%</span></div></td>
    </tr>`;
  }).join("");

  const missed = [];
  QUESTIONS.forEach((q, i) => {
    if (state.answers[i] !== q.correct) missed.push(i);
  });

  let missedHtml = missed.length
    ? `<div class="review-list">` + missed.map(i => `
        <div class="review-item" data-jump="${i}">
          <span class="q-num">Q${i + 1}</span>${QUESTIONS[i].question}
          <div class="q-topic">${QUESTIONS[i].topic}</div>
        </div>
      `).join("") + `</div>`
    : '<p class="summary-note">No missed questions \u2014 clean sweep.</p>';

  let jumpDots = QUESTIONS.map((q, i) => {
    let cls = "jump-dot";
    if (state.submitted[i]) cls += state.answers[i] === q.correct ? " answered-correct" : " answered-incorrect";
    return `<div class="${cls}" data-jump="${i}">${i + 1}</div>`;
  }).join("");

  return `
    <div class="summary">
      <h2>Final Grade</h2>
      <div class="score-hero">
        <div class="big">${sc.correct}/${TOTAL}</div>
        <div class="pct">${pct}% correct</div>
      </div>
      <p class="summary-note">Review your performance by topic below to target your remaining study time, or jump back into any question to re-read its rationale.</p>

      <table class="topic-table">
        <thead><tr><th>Topic</th><th>Score</th><th>Accuracy</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>

      <h2 style="font-size:1.1rem;">Questions to revisit</h2>
      ${missedHtml}

      <h2 style="font-size:1.1rem;">Jump to any question</h2>
      <div class="jump-nav">${jumpDots}</div>

      <div class="nav-row" style="margin-top:24px;">
        <button class="btn btn-ghost" id="restartBtn2">Restart exam</button>
        <div class="spacer"></div>
      </div>
    </div>
  `;
}

function attachHandlers() {
  const startBtn = document.getElementById("startBtn");
  if (startBtn) startBtn.onclick = () => { state.screen = "quiz"; render(); };

  const restartBtn = document.getElementById("restartBtn");
  if (restartBtn) restartBtn.onclick = resetExam;
  const restartBtn2 = document.getElementById("restartBtn2");
  if (restartBtn2) restartBtn2.onclick = resetExam;

  const optWrap = document.getElementById("optionsWrap");
  if (optWrap && !state.submitted[state.index]) {
    optWrap.querySelectorAll(".option").forEach(el => {
      el.onclick = () => {
        state.answers[state.index] = parseInt(el.getAttribute("data-oi"), 10);
        render();
      };
    });
  }

  const submitBtn = document.getElementById("submitBtn");
  if (submitBtn) submitBtn.onclick = () => {
    state.submitted[state.index] = true;
    render();
  };

  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.onclick = () => { if (state.index > 0) { state.index--; render(); window.scrollTo(0,0); } };

  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.onclick = () => { if (state.index < TOTAL - 1) { state.index++; render(); window.scrollTo(0,0); } };

  const finishBtn = document.getElementById("finishBtn");
  if (finishBtn) finishBtn.onclick = () => { state.screen = "summary"; render(); window.scrollTo(0,0); };

  document.querySelectorAll("[data-jump]").forEach(el => {
    el.onclick = () => {
      state.index = parseInt(el.getAttribute("data-jump"), 10);
      state.screen = "quiz";
      render();
      window.scrollTo(0,0);
    };
  });
}

function resetExam() {
  state = { screen: "landing", index: 0, answers: new Array(TOTAL).fill(null), submitted: new Array(TOTAL).fill(false) };
  try { localStorage.removeItem("nurs5230_exam1_state"); } catch(e) {}
  render();
}

loadState();
render();
</script>
