/stress-related enuresis","Equally effective as the urine alarm for achieving dryness"],"correct":2,"rationale":"Psychotherapy is rarely useful for enuresis itself but may help address the psychosocial sequelae (shame, social avoidance) or address enuresis when it is trauma/stress-related — it is not a primary treatment for the wetting itself."},{"topic":"Nocturnal enuresis treatment","vignette":"A family combines the urine alarm with cleanliness training, retention control training, and overlearning for their child's persistent nocturnal enuresis.","question":"What outcome would be expected from this combined behavioral approach, per the evidence discussed in your course materials?","options":["It requires concurrent DDAVP to be effective","It is only appropriate for children under age 5","It stops bedwetting in about two-thirds of children","It has no additive benefit over the alarm alone"],"correct":2,"rationale":"Combining the urine alarm with cleanliness training, retention control, and overlearning stops bedwetting in about two-thirds of children — a stronger combined outcome than the alarm used in isolation."},{"topic":"Encopresis treatment","vignette":"A behavior-shaping program is being designed for a child with encopresis without constipation.","question":"What is the recommended structure of this behavioral program?","options":["Rewards only for a fully clean week with no partial credit","Punishment for soiling episodes paired with rewards for compliance","No behavioral component — medication is the mainstay for this subtype","Rewards first for sitting on the toilet, then for successful bowel movements"],"correct":3,"rationale":"For encopresis without constipation, the behavior-shaping program provides rewards first for sitting on the toilet, then for successful bowel movements — a stepwise shaping approach rather than an all-or-nothing reward structure or a punitive approach."},{"topic":"Encopresis treatment","vignette":"A 7-year-old with constipation-type encopresis has completed an initial bowel cleanout with PEG.","question":"What should the maintenance phase ('bowel retraining') include?","options":["Discontinuation of all interventions since the cleanout is complete","A low-fiber diet to reduce stool bulk","Stool softener or mineral oil, a high-fiber diet, a regular toileting routine, and a mild suppository if needed","Repeated enemas administered weekly by the parent indefinitely"],"correct":2,"rationale":"After initial cleanout, bowel retraining includes a stool softener or mineral oil, a high-fiber diet, a regular toileting routine, and a mild suppository if needed — all combined with the behavioral program, not discontinuation of care."},{"topic":"ODD vs CD vs IED","vignette":"A resident is trying to remember the fastest way to sort ODD, conduct disorder, and IED on a timed exam.","question":"Which summary correctly captures the core distinction taught for this exam?","options":["IED is simply a milder form of conduct disorder","All three disorders require the same minimum duration of symptoms","ODD = oppositional, not rights-violating; Conduct Disorder = violates others' rights/major norms; IED = impulsive, anger-based outbursts grossly out of proportion, never premeditated","ODD = violates others' rights; Conduct Disorder = argumentative only; IED = always premeditated"],"correct":2,"rationale":"The high-yield distinction: ODD is oppositional/argumentative without rights violations; conduct disorder involves serious violations of others' rights or major societal norms (theft, cruelty, weapons); IED is impulsive, anger-based aggression grossly out of proportion to the trigger and never premeditated or goal-directed."},{"topic":"ODD vs CD vs IED","vignette":"A 7-year-old has had twice-weekly verbal outbursts and non-injurious physical aggression (throwing objects, not at people) for the past 4 months, clearly out of proportion to minor frustrations, causing significant distress to the family.","question":"What is the minimum age requirement for diagnosing intermittent explosive disorder, and is it met here?","options":["Age ≥ 10 years — not met in this case","Age ≥ 6 years (or equivalent developmental level) — met in this case","Age ≥ 4 years — met in this case","There is no minimum age for IED"],"correct":1,"rationale":"IED Criterion E requires chronological age ≥ 6 years (or equivalent developmental level). At age 7, this child meets the age threshold, and the twice-weekly verbal/non-destructive physical aggression for 3+ months satisfies the frequency arm of Criterion A."},{"topic":"Meds for physically aggressive children","vignette":"A teenager with chronic conduct-disorder-related aggression, without psychosis, is being considered for medication after behavioral interventions have had limited effect.","question":"What is the appropriate framing for medication in this scenario?","options":["Stimulant medication is first-line regardless of comorbid ADHD status","Evidence for medication in chronic CD-related aggression without psychosis is weak; behavioral/family/multisystemic interventions remain the mainstay, with medication reserved for comorbid conditions","Medication is contraindicated entirely in conduct disorder","A second-generation antipsychotic should be started immediately as first-line monotherapy"],"correct":1,"rationale":"For chronic conduct-disorder-related aggression without psychosis, evidence for medication is weak; behavioral, family, and multisystemic interventions are the mainstay, with medication reserved for treating comorbid conditions (ADHD, mood, anxiety) rather than the aggression itself."},{"topic":"Meds for physically aggressive children","vignette":"A previously calm 11-year-old suddenly becomes aggressive and disoriented in the ED. Before attributing this to a psychiatric cause, the team orders basic labs and a toxicology screen.","question":"What principle guides this initial work-up?","options":["Sudden-onset aggression in children is always psychiatric in origin","Medical causes only need to be considered if the child has a prior psychiatric history","Toxicology screening is unnecessary in pediatric aggression evaluations","Always rule out a medical/organic or substance-related cause of sudden aggression before treating it as purely psychiatric"],"correct":3,"rationale":"Before treating sudden pediatric aggression as purely psychiatric, organic/medical causes and substance intoxication/withdrawal must be ruled out — this is a foundational safety step given the broad differential for out-of-control behavior (temper outbursts, ADHD, ODD/CD, intellectual disability/ASD, anxiety, organic causes, substance use, psychosis, abuse/PTSD)."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 17-year-old describes recurrent gaps in memory for important autobiographical information, well beyond ordinary forgetfulness, following a period of severe chronic abuse. There is no evidence of multiple distinct personality states.","question":"Which dissociative disorder best fits this presentation?","options":["Dissociative identity disorder","Dissociative amnesia","Acute stress disorder","Depersonalization/derealization disorder"],"correct":1,"rationale":"Dissociative amnesia involves inability to recall important autobiographical information, usually traumatic/stressful, that is too extensive to be ordinary forgetfulness — distinct from dissociative identity disorder (requires ≥2 distinct personality states) and depersonalization/derealization disorder (unreality/detachment with intact reality testing, not memory loss)."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A student is trying to quickly sort a vignette involving trauma exposure and dissociative symptoms during an exam.","question":"Which factor is the fastest sorting tool between PTSD/ASD and adjustment disorder or dissociative disorders?","options":["Whether symptoms occur during the day or at night","The stressor severity threshold: PTSD/ASD require Criterion-A-level trauma (death, serious injury, sexual violence); adjustment disorder can follow any stressor; dissociative disorders don't require a specific stressor type","Whether the patient is male or female","The patient's age at presentation"],"correct":1,"rationale":"The fastest sort taught for this exam is stressor severity: PTSD/ASD require a Criterion-A-level trauma; adjustment disorder can follow any identifiable stressor regardless of severity; dissociative disorders don't require a specific stressor type at all."},{"topic":"Trauma therapy","vignette":"A refugee child with a history of war-zone trauma is being evaluated for trauma-focused treatment options available in the literature.","question":"Which model was specifically developed for war/refugee trauma populations?","options":["Narrative Exposure Therapy / KidNET","CBITS","EMDR only","Seeking Safety"],"correct":0,"rationale":"Narrative Exposure Therapy (and its child-adapted version, KidNET) was specifically developed for war/refugee trauma populations, using a structured lifeline narrative approach. CBITS is school-based; Seeking Safety targets co-occurring substance use."},{"topic":"Trauma therapy","vignette":"A trauma treatment program screens not only the child but also the accompanying parent for trauma symptoms before beginning treatment.","question":"What principle does this practice reflect?","options":["Family/caregiver involvement and screening/treating the caregiver's own trauma symptoms are consistent features across effective trauma therapy models","Caregiver screening is unique to TF-CBT and not used in other models","Only the child's symptoms should ever be assessed in pediatric trauma care","Caregiver trauma symptoms are irrelevant to the child's treatment outcome"],"correct":0,"rationale":"Family/caregiver involvement, and screening/treating the caregiver's own trauma symptoms, is a consistent feature across effective pediatric trauma therapy models generally — not unique to any single approach — because caregiver functioning significantly affects the child's recovery."},{"topic":"TF-CBT / PRACTICE","vignette":"A child in TF-CBT has completed the trauma narrative and is now practicing calmly approaching a safe reminder of the trauma (e.g., a similar vehicle after a car accident) that she has been avoiding.","question":"Which PRACTICE component does this represent?","options":["Enhancing safety","Cognitive processing/coping","Affective modulation","In-vivo mastery of trauma reminders"],"correct":3,"rationale":"In-vivo mastery of trauma reminders involves real-world graded exposure to safe trauma reminders that are being avoided — distinct from the trauma narrative itself, which is the therapist-supported development of a detailed account of the traumatic event."},{"topic":"TF-CBT / PRACTICE","vignette":"A TF-CBT program is concluding treatment with a family by developing a written plan for handling future triggers and building on the skills the family has learned.","question":"Which final PRACTICE component does this represent?","options":["Enhancing safety","Trauma narrative and processing","Psychoeducation and parenting skills","Relaxation"],"correct":0,"rationale":"Enhancing safety — safety planning and future skills for the child and family — is the final PRACTICE component, typically addressed as treatment nears completion, building on all the preceding stabilization and processing work."},{"topic":"Insomnia treatment","vignette":"A prescriber is asked why a benzodiazepine would be an unusual first-line choice for a child's chronic insomnia on a vignette exam.","question":"What is the exam logic for this scenario?","options":["Behavioral measures + melatonin = the correct pediatric insomnia answer; a prescription hypnotic/benzodiazepine as first-line is almost always wrong in a pediatric vignette","Behavioral measures are only used as a last resort after medication fails","Sedative-hypnotics have no risk of paradoxical reaction in children","Benzodiazepines are the preferred first-line treatment in children under 10"],"correct":0,"rationale":"The exam logic taught for this topic: behavioral measures plus melatonin is the correct pediatric insomnia answer, while a prescription hypnotic or benzodiazepine as first-line is almost always the wrong choice in a pediatric vignette, given lack of FDA approval and paradoxical activation risk."},{"topic":"Insomnia treatment","vignette":"A 15-year-old with PTSD reports that trauma-related nightmares are the main driver of her ongoing insomnia.","question":"What is the most appropriate treatment priority?","options":["Treat the underlying PTSD, and consider prazosin if nightmares specifically are driving the insomnia","Start a benzodiazepine for immediate symptomatic relief before addressing PTSD","Insomnia and PTSD should be treated as entirely unrelated conditions","Melatonin alone is sufficient without addressing the PTSD"],"correct":0,"rationale":"When insomnia is trauma-related, the priority is treating the underlying PTSD; if nightmares specifically drive the insomnia, prazosin should be considered as a targeted adjunct — addressing the root cause rather than treating insomnia as an isolated symptom."},{"topic":"Nightmare treatment","vignette":"A clinician documents that a 9-year-old's nightmares occur 2-3 times per week but less than nightly.","question":"How would this frequency be classified under DSM-5 severity specifiers for nightmare disorder?","options":["Moderate — ≥1 episode/week but less than nightly","This frequency does not meet any severity specifier","Severe — occurring nightly","Mild — less than 1 episode/week"],"correct":0,"rationale":"Nightmare disorder severity is rated by frequency: mild = <1 episode/week; moderate = ≥1/week but <nightly; severe = nightly. At 2-3 times weekly, this falls into the moderate category."},{"topic":"Nightmare treatment","vignette":"Two off-label medications are being considered as adjuncts for a teen with hyperarousal-related nightmares, alongside low-dose trazodone for sleep.","question":"Which additional agents are mentioned as off-label/adjunctive options for hyperarousal and nightmares?","options":["Lithium and valproate","Fluoxetine and sertraline","Risperidone and aripiprazole","Clonidine and guanfacine"],"correct":3,"rationale":"Other off-label/adjunctive agents for hyperarousal/nightmares include clonidine and guanfacine, alongside low-dose trazodone for sleep — prazosin remains the agent with the best-known targeted nightmare evidence, but no medication carries FDA approval for pediatric nightmares."},{"topic":"AUD s/sx and treatment","vignette":"A clinician explains why adolescents are considered to progress from alcohol use to a use disorder more readily than adults.","question":"Which statement reflects the course of AUD specific to adolescents, per your course materials?","options":["Adolescents cross from use to abuse more easily than adults; some experts consider any underage alcohol use 'abuse,' though physical dependence is comparatively rare in adolescents","Physical dependence is more common in adolescents than in adults","Underage alcohol use is never considered clinically significant unless physical dependence is present","Adolescents require the same 12-month symptom count as adults but progress more slowly to a use disorder"],"correct":0,"rationale":"Adolescents cross from use to abuse more easily than adults, and some experts consider any underage alcohol use 'abuse' — though physical dependence itself is comparatively rare in adolescents compared with adults with chronic AUD."},{"topic":"AUD s/sx and treatment","vignette":"A treatment team is designing a comprehensive outpatient plan for a 17-year-old with moderate AUD (4 Criterion A symptoms) and no significant withdrawal risk.","question":"Which combination of interventions reflects the recommended treatment approach?","options":["Developmentally appropriate group therapy, self-help 12-step programs, motivational interviewing, family therapy, and relapse prevention","Individual insight-oriented psychodynamic therapy alone","Inpatient medical detoxification as a routine requirement","Pharmacotherapy for AUD as the primary intervention, given the moderate severity rating"],"correct":0,"rationale":"Treatment for adolescent AUD emphasizes developmentally appropriate group therapy with peers, self-help 12-step programs (AA), motivational interviewing, family therapy (structural/behavioral approaches), and relapse prevention. Pharmacological treatments are rarely used given the limited evidence base in this age group, and relapse should be treated as an expected part of recovery, not a treatment failure."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A clinician is teaching that cannabis withdrawal should not be dismissed as 'just psychological' since it carries real clinical significance.","question":"Which symptoms are described as the most common presenting features of cannabis withdrawal?","options":["Irritability and sleep disturbance","Seizures and autonomic instability","Psychotic symptoms and severe agitation","Fever and diaphoresis exclusively"],"correct":0,"rationale":"Cannabis withdrawal is real and clinically significant; irritability and sleep disturbance are the most common presenting symptoms — a key exam pearl distinguishing this from the more severe autonomic/seizure profile of alcohol withdrawal."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A patient reports fatigue, yawning, and difficulty concentrating 5 days after stopping heavy cannabis use, alongside a rebound period of increased appetite and hypersomnia following the initial appetite loss.","question":"How are these additional features classified relative to DSM-5 Criterion B?","options":["They rule out a cannabis withdrawal diagnosis","They are additional features often seen beyond the core Criterion B symptom list, not required for diagnosis","They indicate a different diagnosis entirely (alcohol withdrawal)","They are required Criterion B symptoms and must be present for diagnosis"],"correct":1,"rationale":"Fatigue, yawning, difficulty concentrating, and a rebound period of increased appetite/hypersomnia following initial appetite loss/insomnia are described as additional features often seen beyond the core Criterion B symptom list — supportive of the diagnosis but not required criteria themselves."},{"topic":"Motivational Interviewing","vignette":"A prescriber describes MI's foundational belief that the motivation to change already exists within the patient, and that the practitioner's role is to draw it out rather than impose it.","question":"Which element of the 'Spirit' of MI is being described?","options":["Acceptance","Compassion","Partnership","Evocation"],"correct":3,"rationale":"Evocation is the MI Spirit element describing the belief that motivation to change already exists within the patient — the practitioner's job is to draw it out, not impose it. The other Spirit elements are Partnership (working with, not on, the patient), Acceptance (respecting autonomy, affirming strengths), and Compassion (prioritizing patient well-being)."},{"topic":"Motivational Interviewing","vignette":"A substance-use treatment protocol incorporates personalized feedback, places responsibility for change with the patient, gives advice only with permission, and offers a menu of change options.","question":"Which adapted MI-based protocol is being described, and what does its mnemonic stand for?","options":["SBIRT: Screening, Brief Intervention, Referral to Treatment — unrelated to MI","FRAMES: Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy","OARS: Open questions, Affirmations, Reflections, Summarizing","PRACTICE: the TF-CBT treatment component mnemonic"],"correct":1,"rationale":"FRAMES (Feedback, Responsibility, Advice, Menu, Empathy, Self-efficacy) is a well-known adapted substance-use protocol built on MI principles — distinct from OARS (the core communication skills) and PRACTICE (the unrelated TF-CBT mnemonic)."},{"topic":"Motivational Interviewing","vignette":"A patient in the Focusing phase of MI keeps bringing up reasons why change would be too hard. The clinician avoids confronting this directly and instead continues asking open questions to help the patient find their own direction.","question":"What MI technique is the clinician using?","options":["Direct persuasion","Rolling with resistance","The Planning phase's action-step technique","Confrontational interviewing"],"correct":1,"rationale":"In the Focusing phase, MI uses open questions rather than unsolicited advice, and 'rolls with resistance' rather than confronting it directly — this non-confrontational stance is a hallmark MI technique across all four phases."},{"topic":"Change theory","vignette":"A trainee is asked to list the five main stages of the Transtheoretical Model of Change in the correct order.","question":"Which sequence is correct?","options":["Preparation → Precontemplation → Contemplation → Maintenance → Action","Precontemplation → Contemplation → Preparation → Action → Maintenance","Contemplation → Precontemplation → Action → Preparation → Maintenance","Action → Maintenance → Precontemplation → Contemplation → Preparation"],"correct":1,"rationale":"Precontemplation → Contemplation → Preparation → Action → Maintenance is the correct TTM sequence — a high-yield fact taught as the backbone of both MI and general behavior-change counseling, with (Relapse) as a common but non-required detour back to an earlier stage."},{"topic":"Change theory","vignette":"A clinician incorrectly uses action-oriented language ('let's set a quit date') with a patient who is still in the Precontemplation stage and has expressed no interest in changing.","question":"What is the core clinical error being made here?","options":["Violating patient confidentiality","Failing to match the intervention to the patient's actual stage of change, rather than pushing action language on a precontemplative patient","Failing to complete a formal substance use screening tool first","Using OARS skills incorrectly"],"correct":1,"rationale":"Matching your intervention to the patient's actual stage of change — not pushing 'action' language on a precontemplative patient — is the core clinical application tested on exams for both MI and the Transtheoretical Model."},{"topic":"Children and foster care","vignette":"A 12-year-old with severe out-of-control behavior is being considered for a foster placement as part of his treatment plan, separate from any child protection concern.","question":"What is an additional recognized use of foster care described in this context?","options":["Foster placement is contraindicated whenever a child has a behavioral disorder","Foster care can only be initiated by a court order, never as part of a treatment plan","Foster care is used exclusively in confirmed child maltreatment cases and never for behavioral containment","Foster care can be used as a containment/adjunctive option in severe out-of-control behavior or when the home environment cannot safely support the child during treatment"],"correct":3,"rationale":"Beyond its primary child-protection role, foster care is also used as a containment/adjunctive option in severe out-of-control behavior or when the home environment cannot safely support the child during treatment — a distinct clinical use worth recognizing."},{"topic":"Children and foster care","vignette":"A foster parent expresses frustration that her foster child does not show affection the way she expected, and feels she is 'failing' as a caregiver.","question":"Which component of the recommended clinical approach directly addresses this situation?","options":["No intervention is needed since this is a normal and expected caregiver reaction","Support for the foster/adoptive caregivers themselves, including psychoeducation and realistic expectations","Immediate removal of the child from this placement","Referral of the foster parent for individual psychotherapy unrelated to the placement"],"correct":1,"rationale":"The recommended clinical approach explicitly includes support for foster/adoptive caregivers themselves — psychoeducation and realistic expectations about attachment difficulties — since many fostered/adopted children show attachment difficulties stemming from their pre-placement history, not caregiver failure."},{"topic":"Mandated reporter","vignette":"A nursing student asks whether mandated reporting requires the clinician to have definitively confirmed that abuse occurred.","question":"What is the correct response?","options":["Reporting requirements vary so much by state that no general answer applies","No — mandated reporting is not confined to confirmed abuse; if evidence is sufficient to raise a serious question/reasonable suspicion, it must be reported","Only physicians, not nurse practitioners, carry a mandated reporting obligation","Yes — a report can only be filed once abuse has been confirmed by an official investigation"],"correct":1,"rationale":"Mandated reporting is not confined to confirmed abuse — if the evidence is sufficient to raise a serious question or reasonable suspicion, it must be reported to prompt an official investigation. All states require professionals who suspect child abuse to report it; this is a universal legal obligation across the profession, not confirmation-dependent."},{"topic":"Mandated reporter","vignette":"A clinician who suspected abuse chooses not to report because she is not '100% certain' and worries about damaging the family relationship if she is wrong.","question":"What is the risk of this decision?","options":["The decision is appropriate because certainty is required before reporting","Legal penalties can be assessed for failing to report, regardless of the clinician's motivation for not reporting","There is no legal consequence as long as the clinician documents her reasoning","This decision only carries risk if the abuse is later confirmed by another source"],"correct":1,"rationale":"Failing to report suspected abuse carries legal risk for the clinician — this is the flip side of the good-faith immunity protection for reporting. The 'reasonable suspicion' standard means uncertainty is not a valid reason to withhold a report."},{"topic":"Grief in children","vignette":"A hospice social worker asks whether attending the funeral could psychologically harm a grieving 8-year-old.","question":"What does the evidence suggest, and what is the recommended clinical guidance?","options":["The decision should be made entirely by the surviving parent without input from the child","Funeral attendance has not been shown to increase later psychiatric symptoms; allow the child some choice in attending","Children should never be allowed to attend funerals under age 10","Funeral attendance is mandatory for healthy grief processing at any age"],"correct":1,"rationale":"Clinical guidance is to allow the child some choice in attending the funeral — attendance has not been shown to increase later psychiatric symptoms. Clinicians should also provide extra adult support, since the surviving parent may be too grief-absorbed to be fully available, and explain death in a matter-of-fact, concrete way consistent with family beliefs."},{"topic":"Grief in children","vignette":"A comparison is drawn between the diagnostic duration threshold for persistent complex bereavement disorder in children versus adults.","question":"What is the correct duration comparison?","options":["There is no duration threshold specified for either children or adults","Children require a longer duration (≥18 months) than adults because grief is considered more resilient in childhood","Children and adults require the identical ≥12-month duration threshold","Children require only ≥6 months of severe grief reactions, compared with ≥12 months in adults"],"correct":3,"rationale":"Persistent complex bereavement disorder is distinguished from normal grief by severe grief reactions persisting ≥12 months in adults, but only ≥6 months in children — a lower threshold reflecting how much grief can already impair a child's functioning."},{"topic":"Group therapy techniques","vignette":"A group member who has struggled with social isolation reports that being able to comfort and support another member in the group has boosted his own sense of self-worth.","question":"Which Yalom factor best captures this experience?","options":["Altruism","Interpersonal learning","Universality","Development of socializing techniques"],"correct":0,"rationale":"Altruism is the therapeutic factor describing how helping others in the group boosts a member's own self-worth — distinct from universality (realizing one is not alone) or interpersonal learning (gaining insight into one's own relational patterns)."},{"topic":"Group therapy techniques","vignette":"A well-established therapy group is ending after 6 months. Several members express sadness and some express anger about the group ending, wanting to avoid discussing it directly.","question":"Which Tuckman stage is the group currently in, and what should the leader do?","options":["Adjourning — the leader should directly address termination, since members may have strong emotional reactions to the group ending","Performing — the leader should focus solely on deepening ongoing therapeutic work","Forming — the leader should reintroduce basic ground rules","Storming — the leader should introduce new conflict-resolution rules"],"correct":0,"rationale":"Adjourning is the termination stage, where members may have strong emotional reactions to the group ending — the leader's role is to directly address termination and these reactions rather than avoiding the topic, consistent with Tuckman's 5-stage model (Forming → Storming → Norming → Performing → Adjourning)."},{"topic":"Angry patient during family therapy","vignette":"A family repeatedly blames their 'identified patient' (the child with the diagnosis) for all family conflict. The therapist instead asks, 'What part of the problem does each of you think you play?'","question":"What clinical purpose does this reframing technique serve?","options":["It reframes the presenting problem as a family system issue rather than one member's fault, reducing defensiveness and scapegoating","It is primarily used to identify which family member should be excluded from future sessions","It assigns blame more evenly but does not change the underlying family dynamic","It has no established clinical purpose and is discouraged in family therapy"],"correct":0,"rationale":"Reframing the presenting problem as a family system issue, not one member's fault, reduces defensiveness and scapegoating of the identified patient — which is often a driver of anger in session. This systemic reframe is a core family therapy technique."},{"topic":"Angry patient during family therapy","vignette":"A therapist is asked to summarize the correct order of priorities when a family member becomes angry and dysregulated mid-session.","question":"What is the correct priority sequence?","options":["De-escalate first, problem-solve second — do not try to process content while a family member is dysregulated","Neither de-escalation nor problem-solving should occur; the session should simply end","Problem-solve first to resolve the underlying issue, then de-escalate","Both should occur simultaneously regardless of the family member's regulation state"],"correct":0,"rationale":"The clinician's job when anger escalates is to de-escalate first, problem-solve second — attempting to process content or resolve the underlying conflict while a family member is still dysregulated is unlikely to be productive and can worsen safety."},{"topic":"Learning domains","vignette":"A nursing instructor asks students to match each of Bloom's three learning domains with its correct one-word description.","question":"Which matching is correct?","options":["All three domains describe the same underlying construct","Cognitive = feeling/valuing; Affective = doing; Psychomotor = knowing","Cognitive = doing; Affective = knowing; Psychomotor = feeling/valuing","Cognitive = knowing; Affective = feeling/valuing; Psychomotor = doing"],"correct":3,"rationale":"Cognitive = knowing (facts, concepts, intellectual understanding); Affective = feeling/valuing (attitudes, willingness to engage); Psychomotor = doing (physical skills, demonstrated competence). A teaching plan that only transmits facts without addressing attitudes or skill practice is incomplete — a classic patient-education exam point."},{"topic":"Learning domains","vignette":"A teaching plan for a new medication consists entirely of a handout listing side effects and dosing information, with no discussion of the family's concerns or any demonstration of administration technique.","question":"Which domains of Bloom's Taxonomy are missing from this plan?","options":["Only the psychomotor domain is missing; affective domain is not relevant to medication teaching","Only the cognitive domain is missing","Affective and psychomotor domains","No domains are missing; a handout addresses all three domains"],"correct":2,"rationale":"This plan addresses only the cognitive domain (facts about side effects/dosing). It is missing the affective domain (discussing the family's attitudes, concerns, willingness to give the medication) and the psychomotor domain (demonstrating and having the caregiver practice actual administration technique)."},{"topic":"NSSI","vignette":"A clinician is selecting a treatment approach for a 17-year-old with frequent NSSI driven by difficulty tolerating intense emotions.","question":"Which treatment has the strongest evidence base for NSSI, and why?","options":["Motivational interviewing as a standalone treatment","Trauma-Focused CBT as the only evidence-based option","Dialectical behavior therapy, largely because of its emotion-regulation and distress-tolerance skills modules","Family-Based Treatment (Maudsley model)"],"correct":2,"rationale":"Dialectical Behavior Therapy (DBT) has the strongest evidence base for NSSI, particularly its emotion-regulation and distress-tolerance skills modules. Safety planning, means restriction, and treating underlying mood/anxiety/trauma are also essential components of care."},{"topic":"NSSI","vignette":"A 13-year-old with an intellectual disability engages in repetitive head-banging as part of a broader pattern of stereotyped movements.","question":"How does this presentation relate to the DSM-5 proposed NSSI criteria?","options":["Stereotyped self-injury in neurodevelopmental disorders is diagnosed as a suicide attempt by default","This automatically meets full NSSI criteria regardless of the stereotypy pattern","In neurodevelopmental disorders, self-injury that is part of a stereotypy pattern does not meet proposed NSSI criteria","NSSI criteria exclude all patients with intellectual disability from consideration"],"correct":2,"rationale":"Per proposed NSSI Criterion F, the behavior does not occur exclusively during psychosis, delirium, or substance intoxication/withdrawal; in neurodevelopmental disorders, it is not counted if part of a stereotypy pattern, and is not better explained by another disorder (e.g., trichotillomania, excoriation disorder, stereotypic movement disorder)."},{"topic":"NSSI","vignette":"A patient engages in self-injury specifically after arguments with her boyfriend, stating it 'gets him to pay attention to me and take me seriously.'","question":"Which DSM-5 proposed NSSI expectation (Criterion B) does this reflect?","options":["This does not correspond to any Criterion B expectation","To obtain relief from a negative feeling/cognitive state only","To resolve an interpersonal difficulty","To induce a positive feeling state only"],"correct":2,"rationale":"Criterion B requires the behavior be done with at least one expectation: relief from a negative feeling/cognitive state, resolving an interpersonal difficulty, or inducing a positive feeling state. Using self-injury to influence a partner's attention/response reflects the interpersonal-difficulty-resolution expectation — less common than emotion regulation, but a recognized function."}]}];
const STORAGE_PREFIX = "nurs5230_exam4combined_";

let state = loadState();

function defaultState() {
  return { screen: "select", examKey: null, idx: 0, answers: {}, submitted: {} };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + "state");
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return defaultState();
}
function saveState() {
  try { localStorage.setItem(STORAGE_PREFIX + "state", JSON.stringify(state)); } catch(e) {}
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function currentExam() {
  return EXAMS.find(e => e.key === state.examKey);
}

function chooseExam(key) {
  state = defaultState();
  state.examKey = key;
  state.screen = "landing";
  saveState();
  render();
}

function startQuiz() {
  const key = state.examKey;
  state = defaultState();
  state.examKey = key;
  state.screen = "quiz";
  saveState();
  render();
}

function backToSelect() {
  state = defaultState();
  saveState();
  render();
}

function selectOption(qIdx, optIdx) {
  if (state.submitted[qIdx]) return;
  state.answers[qIdx] = optIdx;
  saveState();
  render();
}
function submitAnswer(qIdx) {
  if (state.answers[qIdx] === undefined) return;
  state.submitted[qIdx] = true;
  saveState();
  render();
}
function nextQuestion() {
  const q = currentExam().questions;
  if (state.idx < q.length - 1) { state.idx++; saveState(); render(); }
  else { finishQuiz(); }
}
function prevQuestion() {
  if (state.idx > 0) { state.idx--; saveState(); render(); }
}
function finishQuiz() {
  state.screen = "summary";
  saveState();
  render();
}
function restart() {
  const key = state.examKey;
  state = defaultState();
  state.examKey = key;
  saveState();
  render();
}

function computeScore() {
  const questions = currentExam().questions;
  let correct = 0;
  const byTopic = {};
  questions.forEach((q, i) => {
    if (!byTopic[q.topic]) byTopic[q.topic] = { correct: 0, total: 0 };
    byTopic[q.topic].total++;
    if (state.submitted[i] && state.answers[i] === q.correct) {
      correct++;
      byTopic[q.topic].correct++;
    }
  });
  return { correct, total: questions.length, byTopic };
}

function render() {
  const app = document.getElementById("app");
  if (state.screen === "select") app.innerHTML = renderSelect();
  else if (state.screen === "landing") app.innerHTML = renderLanding();
  else if (state.screen === "quiz") app.innerHTML = renderQuiz();
  else app.innerHTML = renderSummary();
  attachHandlers();
  window.scrollTo(0,0);
}

function renderSelect() {
  const opts = EXAMS.map(e => `
    <div class="exam-option" data-key="${e.key}">
      <div class="ename">${escapeHtml(e.label)}</div>
      <div class="emeta">${e.questions.length} vignette-style questions</div>
    </div>
  `).join("");
  return `
  <div class="card">
    <span class="badge">NURS 5230 &middot; Exam 4 Practice</span>
    <h1>Exam 4 Practice Exams</h1>
    <h2>Modules 6&ndash;7: Feeding/Eating, Elimination, Disruptive/Conduct, Trauma, Substance Use &amp; Special Circumstances</h2>
    <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:18px;">Choose which set to take. Each exam covers all 24 topics from your instructor's Exam 4 study guide, with instant rationale after each answer and a final score + topic breakdown.</p>
    <div id="exam-options">${opts}</div>
  </div>
  <footer>Self-graded practice tool. Not affiliated with your program.</footer>
  `;
}

function renderLanding() {
  const exam = currentExam();
  return `
  <div class="card">
    <span class="badge">NURS 5230 &middot; Exam 4 Practice</span>
    <h1>${escapeHtml(exam.label)}</h1>
    <h2>Modules 6&ndash;7 &middot; Exam 4 topic list</h2>
    <p style="color:var(--text-muted); font-size:0.95rem;">${exam.questions.length} vignette-style questions &middot; instant rationale after each answer &middot; final score + topic breakdown at the end.</p>
    <div class="row">
      <button class="btn" id="start-btn">Start Exam</button>
      <button class="btn secondary" id="back-select-btn">Choose a Different Exam</button>
    </div>
  </div>
  <footer>Self-graded practice tool. Not affiliated with your program.</footer>
  `;
}

function renderQuiz() {
  const exam = currentExam();
  const questions = exam.questions;
  const i = state.idx;
  const q = questions[i];
  const submitted = !!state.submitted[i];
  const selected = state.answers[i];
  const pct = Math.round((i / questions.length) * 100);
  const letters = ["A","B","C","D"];

  let optionsHtml = q.options.map((opt, oi) => {
    let cls = "option";
    if (submitted) {
      if (oi === q.correct) cls += " correct";
      else if (oi === selected) cls += " incorrect";
    } else if (selected === oi) cls += " selected";
    return `<div class="${cls}" data-oi="${oi}">
      <span class="letter">${letters[oi]}.</span>
      <span>${escapeHtml(opt)}</span>
    </div>`;
  }).join("");

  let rationaleHtml = "";
  if (submitted) {
    const isCorrect = selected === q.correct;
    rationaleHtml = `<div class="rationale ${isCorrect ? "correct-box" : "incorrect-box"}">
      <span class="rationale-label">${isCorrect ? "Correct" : "Incorrect"} &mdash; ${escapeHtml(letters[q.correct])}. ${escapeHtml(q.options[q.correct])}</span>
      ${escapeHtml(q.rationale)}
    </div>`;
  }

  return `
  <div class="card">
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="qnum">${escapeHtml(exam.label)} &middot; Question ${i+1} of ${questions.length}</div>
    <div class="topic-tag">${escapeHtml(q.topic)}</div>
    ${q.vignette ? `<div class="vignette">${escapeHtml(q.vignette)}</div>` : ""}
    <p class="question-text">${escapeHtml(q.question)}</p>
    <div id="options">${optionsHtml}</div>
    ${rationaleHtml}
    <div class="row">
      <button class="btn secondary" id="back-btn" ${i===0?"disabled":""}>Back</button>
      ${submitted
        ? `<button class="btn" id="next-btn">${i === questions.length-1 ? "See Results" : "Next"}</button>`
        : `<button class="btn" id="submit-btn" ${selected===undefined?"disabled":""}>Submit Answer</button>`
      }
    </div>
  </div>
  `;
}

function renderSummary() {
  const exam = currentExam();
  const { correct, total, byTopic } = computeScore();
  const pct = Math.round((correct/total)*100);
  const rows = Object.keys(byTopic).map(t => {
    const s = byTopic[t];
    return `<tr><td>${escapeHtml(t)}</td><td>${s.correct}/${s.total}</td></tr>`;
  }).join("");
  return `
  <div class="card">
    <span class="badge">Results</span>
    <h1>${escapeHtml(exam.label)}</h1>
    <div class="summary-stat">
      <div class="summary-score">${correct}/${total}</div>
      <div class="summary-pct">${pct}% correct</div>
    </div>
    <table class="topics">
      <thead><tr><th>Topic</th><th>Score</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="row">
      <button class="btn" id="restart-btn">Retake This Exam</button>
      <button class="btn secondary" id="back-select-btn">Choose a Different Exam</button>
    </div>
  </div>
  `;
}

function attachHandlers() {
  document.querySelectorAll(".exam-option").forEach(el => {
    el.onclick = () => chooseExam(el.dataset.key);
  });
  const startBtn = document.getElementById("start-btn");
  if (startBtn) startBtn.onclick = startQuiz;
  const restartBtn = document.getElementById("restart-btn");
  if (restartBtn) restartBtn.onclick = restart;
  const backSelectBtn = document.getElementById("back-select-btn");
  if (backSelectBtn) backSelectBtn.onclick = backToSelect;
  const backBtn = document.getElementById("back-btn");
  if (backBtn) backBtn.onclick = prevQuestion;
  const nextBtn = document.getElementById("next-btn");
  if (nextBtn) nextBtn.onclick = nextQuestion;
  const submitBtn = document.getElementById("submit-btn");
  if (submitBtn) submitBtn.onclick = () => submitAnswer(state.idx);
  document.querySelectorAll(".option").forEach(el => {
    el.onclick = () => selectOption(state.idx, parseInt(el.dataset.oi,10));
  });
}

render();
</script>
</body>
</html>
