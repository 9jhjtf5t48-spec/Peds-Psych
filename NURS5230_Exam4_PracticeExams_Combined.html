upervisor asks a trainee to name the 8 components of TF-CBT in the correct order, using the mnemonic taught in class.","question":"Which mnemonic and component order is correct?","options":["PRACTICE: Psychoeducation/Parenting, Relaxation, Affective modulation, Cognitive processing, Trauma narrative, In-vivo mastery, Conjoint sessions, Enhancing safety","PROCESS: Psychoeducation, Relaxation, Ordering, Cognitive work, Exposure, Safety, Stabilization","PRACTICE: Psychoeducation, Relaxation, Assessment, Cognitive processing, Trauma narrative, Imagery, Conjoint sessions, Evaluation","TRAUMA: Triage, Rapport, Assessment, Understanding, Mastery, Aftercare"],"correct":0,"rationale":"PRACTICE is the single most likely fill-in-the-blank/matching item from this whole topic: Psychoeducation and Parenting skills, Relaxation, Affective modulation, Cognitive processing/coping, Trauma narrative and processing, In-vivo mastery of trauma reminders, Conjoint child-parent sessions, Enhancing safety."},{"topic":"TF-CBT / PRACTICE","vignette":"A therapist using TF-CBT has completed relaxation training and affective modulation skills with a traumatized 11-year-old and is now ready to move to the next component.","question":"What is the next PRACTICE component in sequence, and what does it involve?","options":["Cognitive processing/coping — identifying and correcting distorted trauma-related thoughts such as self-blame","Enhancing safety — the final planning component","Conjoint child-parent sessions — before any individual work is completed","Trauma narrative — immediately beginning detailed exposure to the traumatic memory"],"correct":0,"rationale":"After Psychoeducation/Parenting, Relaxation, and Affective modulation, the next PRACTICE component is Cognitive processing/coping — identifying and correcting distorted trauma-related thoughts (e.g., self-blame) — which comes before the Trauma narrative component."},{"topic":"TF-CBT / PRACTICE","vignette":"A child has completed a detailed trauma narrative in TF-CBT. The therapist now plans a session where the child shares their progress and narrative directly with their caregiver in a supported setting.","question":"Which PRACTICE component is being implemented?","options":["Conjoint child-parent sessions","In-vivo mastery of trauma reminders","Psychoeducation and parenting skills","Relaxation"],"correct":0,"rationale":"Conjoint child-parent sessions are where the child shares their progress/narrative with the caregiver in a supported setting — this reflects TF-CBT's design to explicitly include the caregiver, not just the child, as a distinguishing feature of the model."},{"topic":"Insomnia treatment","vignette":"A 9-year-old has difficulty falling asleep without a parent present in the room, occurring nightly for the past 4 months, with resulting daytime irritability and school difficulty.","question":"Before treating this as a standalone sleep disorder, what should be screened for first?","options":["An underlying psychiatric cause (anxiety, ADHD, mood disorder, PTSD) or a substance such as caffeine or stimulant medication","A trial of a benzodiazepine should be started immediately","This is always a normal developmental variant that requires no evaluation","A sleep study should be ordered before any other evaluation"],"correct":0,"rationale":"Before treating insomnia as standalone, screen for an underlying psychiatric cause (anxiety, ADHD, mood disorder, PTSD) or a substance (caffeine, stimulant medication) — treatment should address any identified underlying driver rather than jumping straight to symptomatic insomnia treatment."},{"topic":"Insomnia treatment","vignette":"A family asks about the best-supported over-the-counter option for short-term help with their child's difficulty falling asleep, after behavioral sleep hygiene measures alone haven't fully resolved it.","question":"What is the best-supported short-term pharmacologic option, and what is its FDA status in children?","options":["A stimulant medication used off-label for insomnia","A benzodiazepine, which is FDA-approved for pediatric insomnia","Diphenhydramine, which has strong evidence and is FDA-approved for chronic pediatric use","Melatonin — no medication currently has FDA approval for pediatric insomnia"],"correct":3,"rationale":"Melatonin is the best-supported short-term pharmacologic option for pediatric insomnia — but no medication currently has FDA approval for pediatric insomnia. Sedative-hypnotics are not recommended for chronic use, and children can have a paradoxical activation/agitation response."},{"topic":"Nightmare treatment","vignette":"A 10-year-old has frequent, extremely dysphoric dreams involving threats to his safety. Upon waking, he is immediately oriented, alert, and can describe the dream in detail.","question":"What feature distinguishes this from a sleep terror?","options":["Rapid full orientation on waking — in sleep terrors, the child remains confused/unresponsive","The presence of a detailed, well-remembered dream — sleep terrors also feature detailed dream recall","The child's age — sleep terrors only occur in children under 5","Occurring in the first half of the sleep period rather than the second half"],"correct":0,"rationale":"Rapid full orientation on waking is what separates a nightmare from a sleep terror (an NREM parasomnia), where the child remains confused/unresponsive. Nightmares generally occur in the second half of the major sleep episode and are well-remembered, unlike sleep terrors."},{"topic":"Nightmare treatment","vignette":"A 13-year-old with PTSD has severe, nightly trauma-related nightmares that have not responded to behavioral interventions (imagery rehearsal therapy, relaxation) after an adequate trial.","question":"Which medication has the best-known targeted evidence for trauma-related nightmares?","options":["Prazosin, with monitoring of orthostatic blood pressure","Bupropion","A benzodiazepine","Diphenhydramine"],"correct":0,"rationale":"Prazosin (an alpha-1 antagonist) has the best-known targeted evidence for trauma-related nightmares — start low and monitor orthostatic blood pressure. No medication has FDA approval for pediatric nightmares; medication is reserved for significant, function-impairing nightmares persisting despite psychotherapy."},{"topic":"AUD s/sx and treatment","vignette":"A 17-year-old has been drinking heavily most weekends for the past year. He has tried to cut back twice without success, spends significant time recovering from hangovers before school, and continues drinking despite a recent DUI.","question":"How many of the 11 DSM-5 Criterion A symptoms must be present within 12 months to diagnose alcohol use disorder?","options":["≥ 2 of 11","≥ 1 of 11","≥ 4 of 11","All 11 of 11"],"correct":0,"rationale":"AUD Criterion A requires ≥2 of 11 symptoms within a 12-month period — the same threshold structure as all DSM-5 substance use disorders. Severity is then rated: mild = 2-3 criteria, moderate = 4-5, severe = ≥6."},{"topic":"AUD s/sx and treatment","vignette":"A family asks what the treatment goal should be for their 16-year-old recently diagnosed with alcohol use disorder — whether he should aim for moderation or complete abstinence.","question":"What is the recommended treatment goal for adolescent AUD?","options":["Abstinence only if there is a comorbid psychiatric diagnosis","Abstinence, not 'controlled drinking'","No specific goal is recommended; it is entirely patient-directed","Controlled drinking with a set weekly limit"],"correct":1,"rationale":"The treatment goal for adolescent AUD is abstinence, not 'controlled drinking.' Medical detoxification is rarely necessary in adolescents, and treatment emphasizes developmentally appropriate group therapy, self-help programs (AA), motivational interviewing, and family therapy — pharmacotherapy for AUD itself is rarely used in this age group."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A 17-year-old who has used cannabis daily for 8 months stops abruptly. Within a week he develops irritability, insomnia with disturbing dreams, decreased appetite, and abdominal discomfort.","question":"How many of the listed symptoms are required, within approximately what timeframe, to diagnose cannabis withdrawal?","options":["≥1 symptom developing within 24 hours of cessation","All listed symptoms developing within approximately 2 weeks of cessation","≥5 symptoms developing within approximately 1 month of cessation","≥3 symptoms developing within approximately 1 week of cessation"],"correct":3,"rationale":"Cannabis withdrawal requires ≥3 of the listed symptoms (irritability/anger/aggression; nervousness/anxiety; sleep difficulty; decreased appetite/weight loss; restlessness; depressed mood; ≥1 physical symptom) developing within approximately 1 week after cessation of heavy, prolonged use."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A prescriber is asked whether any FDA-approved medication exists specifically for cannabis withdrawal.","question":"What is the correct answer, and what is the recommended treatment approach instead?","options":["No medication or psychotherapy has any role; withdrawal simply resolves untreated","No FDA-approved medication exists; treatment is primarily supportive care with symptom-targeted management","Yes, naltrexone is FDA-approved specifically for cannabis withdrawal","Yes, buprenorphine is FDA-approved specifically for cannabis withdrawal"],"correct":1,"rationale":"No medication is FDA-approved for cannabis withdrawal. Treatment is primarily supportive care: symptom-targeted management (sleep hygiene/short-term sleep aid for insomnia, reassurance/relaxation for anxiety/irritability, monitoring for depressed mood), plus underlying SUD treatment (motivational interviewing, CBT, family therapy, contingency management, relapse prevention)."},{"topic":"Motivational Interviewing","vignette":"A prescriber is asked to name the four core communication skills at the heart of motivational interviewing, using the standard mnemonic.","question":"Which mnemonic and skill set is correct?","options":["SMART: Specific, Measurable, Achievable, Realistic, Timed","OARS: Open-ended questions, Affirmations, Reflections, Summarizing","CARE: Compassion, Acceptance, Reflection, Empathy","SOAP: Subjective, Objective, Assessment, Plan"],"correct":1,"rationale":"OARS = Open-ended questions, Affirmations, Reflections, Summarizing — the core communication toolkit of motivational interviewing, expected to be spelled out precisely on the exam."},{"topic":"Motivational Interviewing","vignette":"A clinician using MI resists the urge to argue with an ambivalent patient about the benefits of quitting cannabis, and instead reflects the patient's own stated reasons for wanting to change.","question":"What core MI philosophy does this illustrate?","options":["MI requires the practitioner to set the treatment goals for the patient","The practitioner does not argue, persuade, or confront — resistance is 'rolled with,' and the patient voices their own reasons for change, which reinforces motivation more than being told","The practitioner should always directly confront ambivalence to speed up change","MI is only effective when paired with direct advice-giving in every session"],"correct":1,"rationale":"MI's central philosophy is that the practitioner does not argue, persuade, or confront — resistance is 'rolled with,' and eliciting the patient's own change talk reinforces motivation more effectively than being told what to do. This reflects the 'evocation' element of the MI Spirit."},{"topic":"Change theory","vignette":"A 16-year-old with cannabis use disorder says, 'I don't really see why this is a problem — everyone I know smokes.' She shows no interest in discussing change.","question":"Which stage of the Transtheoretical Model best fits, and what is the clinician's task at this stage?","options":["Preparation — help build a concrete, specific plan","Precontemplation — raise awareness, avoid confrontation, express empathy","Action — support and reinforce new behavior","Contemplation — explore ambivalence and decisional balance"],"correct":1,"rationale":"This patient shows no awareness of a problem and no interest in change — classic Precontemplation. The clinician's task at this stage is to raise awareness while avoiding confrontation and expressing empathy, rather than pushing action-oriented language."},{"topic":"Change theory","vignette":"A patient tells his NP, 'I know drinking is becoming a problem, but I'm not sure I'm ready to actually stop yet. Part of me still doesn't want to give it up.'","question":"Which Transtheoretical Model stage does this reflect?","options":["Preparation","Maintenance","Precontemplation","Contemplation"],"correct":3,"rationale":"Awareness that a problem exists, paired with clear ambivalence and no firm commitment to change, is the hallmark of the Contemplation stage. The clinician's task here is to explore that ambivalence and evoke reasons for/against change (decisional balance)."},{"topic":"Children and foster care","vignette":"An 8-year-old has moved through 5 different foster placements in 2 years, despite each home being adequate, because of administrative delays and disrupted matches.","question":"What is the primary concern with this pattern, independent of the original maltreatment?","options":["This pattern is protective because it exposes the child to varied caregiving styles","Multiple foster placement changes/disruptions is itself an independent risk factor for poorer psychiatric outcomes","This pattern has no additional impact beyond the original maltreatment","Repeated placement changes only matter if the child is under age 3"],"correct":1,"rationale":"A child moved through a succession of foster placements — rather than rapid reunification or permanency — is a recognized risk for worse outcomes; repeated placement changes themselves become an added adverse experience, independent of the maltreatment that led to the original placement."},{"topic":"Children and foster care","vignette":"A 6-year-old was removed from her home due to neglect and placed with a new foster family. The foster parents ask why their daughter has attachment difficulties despite feeling this new home is safe and loving.","question":"What explains the elevated psychiatric risk in children adopted or fostered past infancy?","options":["Attachment difficulties in foster children are always permanent and unresponsive to new caregiving","Risk stems not just from loss of the primary attachment figure, but often from neglect, abuse, and multiple caregiver changes preceding placement","Risk is exclusively genetic and unrelated to placement history","Foster care itself is the primary cause of all attachment difficulties, regardless of prior history"],"correct":1,"rationale":"Children adopted or fostered past infancy are at higher risk for psychiatric problems because of what led to placement — not just loss of the primary attachment figure, but often neglect, abuse, and multiple caregiver changes. Many show attachment difficulties and social/attentional problems, though some form stable, affectionate relationships with new caregivers."},{"topic":"Mandated reporter","vignette":"An NP has a 'reasonable suspicion,' but not definitive proof, that an 8-year-old patient is being physically abused at home based on an unusual bruising pattern.","question":"What is the legal threshold and obligation in this situation?","options":["Reporting is discretionary and left to the clinician's personal judgment","The clinician must report — 'reasonable suspicion,' not certainty, is the legal threshold, and reporting is a legal, not optional, obligation","The clinician should wait until definitive proof is obtained before reporting","The clinician should first confront the parents directly instead of reporting"],"correct":1,"rationale":"The exam-safe rule: when in doubt, report. 'Reasonable suspicion,' not certainty, is the legal threshold for mandated reporting — the clinician does not need to prove abuse occurred before reporting to prompt an official investigation. This is a legal, not optional, obligation in all states."},{"topic":"Mandated reporter","vignette":"An NP reports suspected abuse in good faith, but the subsequent investigation does not substantiate the allegation.","question":"What is the legal consequence for the NP in this scenario?","options":["The clinician's license is automatically reviewed following any unsubstantiated report","The clinician is immune from liability for reporting in good faith, even if the investigation does not substantiate abuse","The clinician faces legal liability for an unsubstantiated report","The clinician must retract the report formally to avoid legal consequences"],"correct":1,"rationale":"Clinicians acting in good faith are immune from liability for reporting, even if the investigation does not substantiate abuse. Conversely, legal penalties can be assessed for failing to report — this asymmetry is intentional and a common exam point."},{"topic":"Grief in children","vignette":"A 7-year-old whose grandmother died last week is observed playing happily with friends an hour after crying inconsolably about the loss.","question":"How should this pattern be interpreted?","options":["This suggests the child did not have a meaningful attachment to the grandmother","This is a concerning sign of emotional detachment requiring immediate evaluation","This indicates the child does not understand that the death is permanent","This is normal grief behavior — children's grief tends to be intermittent, not continuous, unlike adults' sustained mourning"],"correct":3,"rationale":"Children's grief is intermittent, not continuous — a child who is playing happily an hour after crying about a loss is showing normal, not concerning, grief behavior. They may play normally, then suddenly grieve intensely, rather than showing sustained continuous mourning like adults."},{"topic":"Grief in children","vignette":"A 6-year-old boy insists that his father's sudden death was his own fault because he 'didn't clean his room like Daddy asked.'","question":"What is the most appropriate clinical response to this belief?","options":["Spontaneously reassure the child that he was not responsible — magical thinking in young children can lead them to believe they caused the death","Avoid discussing the death directly until the child is older","Allow the belief to persist without comment since children will naturally outgrow it","Explain in detail the actual medical cause of death to correct the belief logically"],"correct":0,"rationale":"Magical thinking in young children can lead them to believe they caused the death — they are often too frightened or guilty to voice this belief and should be spontaneously reassured they were not responsible, as part of proactive grief psychoeducation."},{"topic":"Group therapy techniques","vignette":"A group therapy member says, 'Hearing that other people struggle with the same intrusive thoughts I have makes me feel so much less alone.'","question":"Which of Yalom's therapeutic factors is being illustrated?","options":["Universality","Catharsis","Imitative behavior","Altruism"],"correct":0,"rationale":"Universality is the realization 'I am not alone' in one's struggles — exactly what this member describes upon hearing others share similar experiences, distinct from altruism (helping others) or catharsis (relief from expressing strong emotion)."},{"topic":"Group therapy techniques","vignette":"A new therapy group is in its first few sessions. Members are polite, somewhat guarded, seek guidance from the leader, and show limited self-disclosure.","question":"Which stage of Tuckman's model of group development does this represent?","options":["Forming","Norming","Storming","Performing"],"correct":0,"rationale":"Forming (orientation) is characterized by members adapting to the group, seeking guidance/approval from the leader, limited self-disclosure, and possible anxiety — the earliest stage before the necessary friction of Storming emerges."},{"topic":"Angry patient during family therapy","vignette":"A therapist begins the very first session with a chaotic, high-conflict family by clearly stating the ground rules: no name-calling, no interrupting, no speaking for another family member, and no continuing arguments after the session ends.","question":"What is the primary purpose of this intervention?","options":["Rule-setting at the very start of the first session is the single most important preventive intervention for managing anger/conflict — it establishes the clinician as being 'in charge' of the frame and protects safety","This intervention is primarily meant to punish the family for prior behavior","This step is optional and mainly serves a legal/liability purpose","Rule-setting should only occur after the first major conflict arises in session"],"correct":0,"rationale":"Setting clear rules at the start of every family session — especially with chaotic, high-conflict, or abusive families — establishes the clinician as being 'in charge' of the frame and protects safety. This is proactive, not reactive, and is the single most important preventive intervention for managing anger/conflict."},{"topic":"Angry patient during family therapy","vignette":"During a session, a father becomes increasingly loud and agitated, interrupting his teenage daughter repeatedly. The therapist calmly states, 'I can see how frustrated you are — let's find a way to say that so everyone can hear it,' while lowering her own voice.","question":"What technique is the therapist using in this moment of escalating anger?","options":["Matching the father's volume and intensity to demonstrate active engagement","Ignoring the outburst entirely and continuing with the planned agenda","Direct confrontation of the father's behavior to assert authority","Reflective statements that validate the emotion without validating the behavior, combined with lowering her own voice/pace rather than matching intensity"],"correct":3,"rationale":"In the moment of escalating anger, the recommended approach is to name what's happening calmly, redirect to established rules, lower one's own voice/pace rather than matching intensity, and use reflective statements that validate the emotion without validating the behavior — exactly as illustrated here."},{"topic":"Learning domains","vignette":"A parent can accurately state the core symptom categories of OCD after a psychoeducation session but has not yet demonstrated any change in how she responds to her child's compulsions at home.","question":"Which learning domain has been addressed, and which remains unaddressed?","options":["All three domains have been fully addressed","Affective domain addressed; cognitive domain remains unaddressed","Cognitive domain addressed; affective and/or psychomotor domains remain unaddressed","Psychomotor domain addressed; cognitive domain remains unaddressed"],"correct":2,"rationale":"The cognitive domain covers acquiring knowledge and intellectual understanding ('knowing that') — this parent can state facts about OCD, satisfying the cognitive domain. However, no behavior change (psychomotor) or expressed attitude shift/willingness to engage (affective) has yet occurred."},{"topic":"Learning domains","vignette":"A psychoeducation session teaches a father not just what ADHD is, but also has him practice, and demonstrate competently, a specific behavioral de-escalation technique with his child.","question":"Which learning domain is targeted by having him physically demonstrate the technique?","options":["Affective domain","None of the three domains applies to skill demonstration","Psychomotor domain","Cognitive domain"],"correct":2,"rationale":"The psychomotor domain covers physical skills and hands-on ability to perform a task ('knowing how,' demonstrated competence) — a parent correctly demonstrating a de-escalation technique is a clear example of psychomotor-domain learning, distinct from simply knowing facts (cognitive) or expressing willingness (affective)."},{"topic":"NSSI","vignette":"A 15-year-old is found to have superficial cutting marks on her forearms. She reports she cuts to 'make the numbness go away' and explicitly denies any wish to die.","question":"What is the key distinguishing feature between NSSI and a suicide attempt?","options":["The use of a sharp object rather than another method","The specific body location of the injury","No intent to die — the goal is typically emotion regulation, not death","The presence of any physical scarring"],"correct":2,"rationale":"The key distinguishing feature from suicide attempts is no intent to die. The goal of NSSI is typically emotion regulation (relief from unbearable negative affect) or, less commonly, interpersonal communication — not death. Common methods include cutting, scratching, or burning, most often on the forearms or thighs."},{"topic":"NSSI","vignette":"A 16-year-old with a history of NSSI over the past year is now presenting for an unrelated medical visit.","question":"What is the recommended clinical practice given her NSSI history?","options":["Risk assessment is only warranted if the patient specifically requests it","No suicide risk assessment is needed since NSSI by definition excludes suicidal intent","A thorough suicide risk assessment should be performed, since NSSI is a significant risk factor for future suicide attempts even though the acute intent differs","NSSI and suicide attempts should be treated as clinically interchangeable and documented identically"],"correct":2,"rationale":"NSSI is a significant risk factor for future suicide attempts, even though the acute intent differs — every NSSI presentation requires a thorough suicide risk assessment. The two behaviors are related but distinct, not interchangeable terms."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 9-year-old boy has been a 'picky eater' since toddlerhood. He eats only 5 beige, crunchy foods and refuses anything with mixed textures. He has fallen from the 40th to the 8th percentile for weight over the past year, but he has never expressed any concern about his weight or shape.","question":"Which feature most clearly rules out anorexia nervosa in favor of ARFID here?","options":["ARFID cannot occur before adolescence","His weight loss is not severe enough to meet Criterion A for anorexia","He has a texture-based rather than caloric restriction","There is no fear of weight gain or disturbance in body-image perception"],"correct":3,"rationale":"ARFID's defining differentiator from anorexia/bulimia is the absence of fear of weight gain and absence of body-image disturbance — the restriction here is driven by sensory sensitivity to texture, not shape/weight concerns. ARFID can occur at any age, including early childhood, unlike the other option's claim."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 16-year-old female with a BMI of 22 reports self-induced vomiting after large binges, on average 3 times a week for the past 4 months. She also uses laxatives 'to be safe.' Her self-worth is almost entirely determined by her weight.","question":"Which criterion, if absent, would instead point toward binge-eating disorder rather than bulimia nervosa?","options":["Eating an objectively large amount of food with a sense of loss of control","Binge eating occurring at least once weekly for 3 months","Recurrent inappropriate compensatory behavior (vomiting, laxatives, fasting, excessive exercise)","Marked distress regarding the binge eating"],"correct":2,"rationale":"Compensatory behavior is the single defining feature separating BN from BED — both disorders share recurrent binge eating and self-evaluation tied to shape/weight, but only bulimia includes purging, laxative misuse, fasting, or excessive exercise to prevent weight gain."},{"topic":"ARFID s/sx","vignette":"A pediatric NP is evaluating a 10-year-old with restrictive eating to rule out ARFID. Growth chart review shows falling percentiles, and labs reveal iron-deficiency anemia.","question":"Which of the following would argue AGAINST an ARFID diagnosis and toward a purely medical cause instead?","options":["Onset in early childhood","Comorbid anxiety disorder","Dependence on nutritional supplements","A history and exam finding consistent with malabsorption or GI reflux fully explaining the poor intake"],"correct":3,"rationale":"ARFID must be differentiated from medical causes of poor intake such as malabsorption, GI reflux, or neoplasm — if a medical condition fully accounts for the restrictive eating, ARFID is not the appropriate diagnosis (per DSM-5 Criterion D and the evaluation guidance to rule out organic causes first)."},{"topic":"ARFID s/sx","vignette":"A 13-year-old girl with ARFID (sensory-based avoidance type) is being evaluated in an eating disorders clinic. Her clinician notes she is younger, more often male-typical in epidemiologic comparison, and has a higher rate of comorbid anxiety than the anorexia/bulimia patients in the same clinic.","question":"This epidemiologic comparison is most consistent with which finding from clinical-sample studies of ARFID?","options":["ARFID has no known comorbidity pattern distinct from AN/BN","ARFID patients are typically older and predominantly female, similar to AN/BN","Compared with AN/BN, ARFID patients tend to be younger, more often male, and more likely to have comorbid anxiety or medical disorders","ARFID patients have a lower median weight percentile than AN patients"],"correct":2,"rationale":"Clinical-sample data (e.g., ~14% of an eating disorders clinic's 8-18 year-old presentations) show ARFID patients skew younger and more often male compared with AN/BN, with higher rates of comorbid medical and anxiety disorders, and a median weight percentile between that of AN and BN patients — not lower than AN."},{"topic":"Therapies for eating disorders","vignette":"A 17-year-old with bulimia nervosa and no significant family conflict is starting outpatient treatment.","question":"Which treatment has the strongest evidence base for bulimia nervosa in this scenario?","options":["Psychodynamic psychotherapy","Antipsychotic medication","Cognitive-behavioral therapy","Family-Based Treatment identical to the anorexia protocol"],"correct":2,"rationale":"CBT is the most effective treatment for bulimia nervosa in adults and is generally preferred; a manualized family-based treatment also has empirical support for adolescents, particularly useful for those from high-conflict families where individual CBT may be less feasible."},{"topic":"Therapies for eating disorders","vignette":"A 16-year-old with bulimia nervosa has not responded adequately to CBT alone. The prescriber is considering adjunctive medication.","question":"Which medication has the best pediatric evidence base for bulimia nervosa?","options":["Topiramate","Lisdexamfetamine","Risperidone","Fluoxetine, studied at doses up to 60 mg/day"],"correct":3,"rationale":"Fluoxetine (up to 60 mg/day studied) has the best pharmacologic evidence among adolescents with bulimia nervosa — it is the only eating disorder with meaningful medication support. Lisdexamfetamine is FDA-approved for BED in adults; topiramate/risperidone are not first-line BN agents."},{"topic":"Enuresis vs Encopresis","vignette":"A nursing student is confused about why a 4-year-old with occasional fecal soiling can be diagnosed with encopresis, while a 4-year-old who wets the bed cannot yet be diagnosed with enuresis.","question":"What explains this age discrepancy?","options":["Encopresis has no minimum age requirement at all","Both disorders share the same minimum age of 4 years — the student is mistaken","The DSM-5 minimum age is 4 years for encopresis but 5 years for enuresis","Both disorders share the same minimum age of 5 years — the student is mistaken"],"correct":2,"rationale":"This age threshold difference is a classic exam trap: encopresis requires age ≥ 4 years, while enuresis requires age ≥ 5 years (or equivalent developmental level for either). Bowel continence is developmentally expected slightly earlier than bladder continence."},{"topic":"Enuresis vs Encopresis","vignette":"A 7-year-old boy has normal-form stool found intermittently in his underwear, occurring only when he is angry with his parents. He has no history of constipation and a normal bowel exam.","question":"Which encopresis specifier and typical association fits this presentation?","options":["With constipation and overflow incontinence — the most common subtype","This does not meet criteria for encopresis because the stool is normal-form","This requires a diagnosis of conduct disorder before encopresis can be diagnosed","Without constipation and overflow incontinence — often associated with oppositional defiant disorder or deliberate soiling"],"correct":3,"rationale":"'Without constipation and overflow incontinence' (functional nonretentive fecal incontinence) presents with normal-form stool, intermittent soiling, and is often associated with ODD/conduct disorder or deliberate soiling — distinct from the more common constipation-related subtype (~80% of cases)."},{"topic":"Nocturnal enuresis treatment","vignette":"The parents of a 5-year-old with occasional nighttime wetting ask what the very first step in management should be, before any device or medication is considered.","question":"What is the recommended first step for young children with nocturnal enuresis?","options":["Start the urine alarm immediately regardless of age","Begin DDAVP at the lowest available dose","Minimize shame/punishment while awaiting spontaneous maturation; restrict evening fluids, eliminate caffeine, void at bedtime","Refer directly to urology for cystoscopy"],"correct":2,"rationale":"For young children, the first step is behavioral and supportive: minimizing shame/punishment while awaiting spontaneous maturation, restricting fluids before bedtime, eliminating caffeinated beverages, voiding at bedtime, and having the child help change their own bed to reduce negative parental reactions."},{"topic":"Nocturnal enuresis treatment","vignette":"A 12-year-old is motivated to work on his bedwetting and wants an active role. His NP recommends a reward-based system alongside bladder-capacity exercises.","question":"Which combination of interventions is being described?","options":["Overnight catheterization","Immediate initiation of DDAVP without behavioral measures","A star chart/reward system plus daytime bladder training (delayed voiding, stream interruption)","Psychotherapy alone, since enuresis is primarily psychological in origin"],"correct":2,"rationale":"For motivated older children, a star chart/reward monitoring system combined with daytime continence work — bladder training exercises, practicing delayed voiding to increase bladder capacity, and stream interruption to strengthen sphincter awareness — is an appropriate next step before or alongside the urine alarm."},{"topic":"Encopresis treatment","vignette":"A family has been giving their child daily enemas at home for the past 2 months to manage encopresis, with limited success and increasing conflict.","question":"What is the most appropriate guidance regarding this approach?","options":["Daily home enemas are the recommended long-term maintenance strategy","Enemas should be increased in frequency until soiling resolves completely","Enemas are only appropriate for children under 4 years old","Repeated parent-administered enemas are discouraged — they are harmful to the parent-child relationship"],"correct":3,"rationale":"Repeated parent-administered enemas are specifically discouraged in encopresis management because they are harmful to the parent-child relationship — cleanout is typically a brief initial step, not an ongoing home regimen."},{"topic":"Encopresis treatment","vignette":"Most cases of encopresis are initially managed in a primary care setting, but a subset requires referral.","question":"Which cases of encopresis warrant referral for psychological intervention?","options":["All cases of encopresis, regardless of severity","Only cases in children younger than 4 years","Complex or treatment-resistant cases, especially those with associated psychiatric disorders such as ODD or anxiety","Only cases without any constipation"],"correct":2,"rationale":"Most encopresis cases can be managed by a pediatrician; more complex/resistant cases need psychological intervention, particularly individual/family psychiatric care focused on associated psychiatric disorders (e.g., ODD, anxiety) driving resistant soiling."},{"topic":"ODD vs CD vs IED","vignette":"A 12-year-old boy has had 3 outbursts in the past year involving punching holes in walls and shoving a classmate hard enough to cause a bruise. Each outburst was sudden, unplanned, and grossly out of proportion to the trigger (being told to stop playing a video game).","question":"Which diagnosis and criterion count best fits?","options":["IED cannot be diagnosed because the outbursts occurred less than twice weekly","Oppositional defiant disorder — vindictiveness criterion","Intermittent explosive disorder — 3 outbursts involving property damage/injurious assault within 12 months","Conduct disorder — this meets the aggression-to-people/animals category"],"correct":2,"rationale":"IED Criterion A can be met either by twice-weekly non-destructive outbursts for 3 months OR by 3 outbursts involving damage/destruction of property and/or physical assault causing injury within 12 months. The impulsive, non-premeditated, disproportionate nature (Criteria B-C) further supports IED over conduct disorder, which requires a broader pattern of rights-violating behavior, not isolated impulsive outbursts."},{"topic":"ODD vs CD vs IED","vignette":"A clinician is asked whether intermittent explosive disorder can be diagnosed in a child who already carries a diagnosis of ADHD and oppositional defiant disorder.","question":"What is the correct answer?","options":["No — IED is always subsumed under an existing ODD diagnosis and cannot be diagnosed separately","Yes — IED can be diagnosed in addition to ADHD, CD, ODD, or ASD when the impulsive aggressive outbursts exceed what's typically seen in those disorders and warrant independent attention","No — a diagnosis of ADHD automatically excludes IED","Yes, but only if the child is under age 6"],"correct":1,"rationale":"IED can be diagnosed alongside ADHD, CD, ODD, or ASD when the impulsive aggressive outbursts exceed what is typically seen in those other conditions and warrant independent clinical attention — it is not automatically subsumed under a comorbid diagnosis."},{"topic":"ODD vs CD vs IED","vignette":"A 16-year-old has a 2-year history of bullying peers, forcing a peer into unwanted sexual contact, and repeatedly staying out all night despite being forbidden, beginning after age 13.","question":"Which diagnosis fits, and which DSM-5 criterion category does the forced sexual contact fall under?","options":["Oppositional defiant disorder — 'Vindictiveness' category","Conduct disorder — 'Aggression to People/Animals' category","Intermittent explosive disorder — Criterion A(1)","Conduct disorder — 'Serious Rule Violations' category"],"correct":1,"rationale":"Conduct disorder requires ≥3 of 15 behaviors across 4 categories in the past 12 months. Forcing someone into sexual activity falls under 'Aggression to People/Animals,' alongside bullying/threatening, physical fights, weapon use, and physical cruelty. Staying out overnight despite prohibition (onset before age 13) falls under 'Serious Rule Violations.' With onset after age 10, this would be specified as adolescent-onset."},{"topic":"Meds for physically aggressive children","vignette":"A resident wants to prescribe a benzodiazepine as the first-line agent for a physically aggressive but non-psychotic 8-year-old in the emergency department.","question":"Why is this generally not recommended?","options":["Benzodiazepines have no sedative effect in children","Benzodiazepines require IV access only, limiting emergency use","Benzodiazepines are contraindicated in all pediatric patients regardless of indication","Benzodiazepines can cause paradoxical disinhibition and worsen agitation in children"],"correct":3,"rationale":"Benzodiazepines should be avoided as a default choice for pediatric aggression because they can cause paradoxical disinhibition and worsen agitation in children — second-generation antipsychotics are generally preferred for acute agitation."},{"topic":"Meds for physically aggressive children","vignette":"A child with newly diagnosed ADHD has been increasingly aggressive at school. Before starting an antiaggression medication, the NP first addresses the underlying ADHD with stimulant treatment, and the aggression substantially improves.","question":"What principle does this case best illustrate?","options":["Stimulants are the first-line antiaggression medication for all pediatric aggression","If aggression is secondary to a treatable comorbidity, treating that condition often reduces aggression more effectively than an antiaggression medication alone","ADHD and aggression are unrelated and this improvement is coincidental","Aggression should always be treated with an antipsychotic regardless of etiology"],"correct":1,"rationale":"Medication is not first-line for aggression in general — the first step is identifying and addressing the underlying cause (ADHD, ODD/CD, intellectual disability/ASD, anxiety, organic/medical causes, substance use, psychosis, abuse/PTSD). When aggression is secondary to a treatable comorbidity like ADHD, treating that condition is often more effective than an antiaggression medication alone."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A 12-year-old's parents divorced 6 weeks ago. He has since shown declining grades, irritability, and tearfulness that is clearly out of proportion to what would typically be expected, but he does not meet full criteria for any other DSM-5 disorder.","question":"Which diagnosis fits, and what stressor characteristic is required?","options":["Adjustment disorder cannot be diagnosed unless the stressor is life-threatening","Adjustment disorder — can follow any identifiable stressor, not necessarily life-threatening","Acute stress disorder — divorce meets Criterion A trauma exposure","PTSD — divorce meets Criterion A trauma exposure"],"correct":1,"rationale":"Adjustment disorder requires only an identifiable stressor (of any severity — divorce, a move, a bad grade), unlike PTSD/ASD which require a Criterion-A trauma (actual/threatened death, serious injury, or sexual violence). Onset is within 3 months of the stressor and symptoms resolve within 6 months of the stressor ending."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"A clinician is deciding between an adjustment disorder diagnosis and PTSD for a 15-year-old who witnessed a violent assault 2 months ago and now meets full PTSD criteria.","question":"Which diagnosis should take precedence?","options":["PTSD — if full criteria for PTSD (or another specific disorder) are met, that diagnosis takes precedence over adjustment disorder","Adjustment disorder — it should always be diagnosed first as the less severe option","Both diagnoses should be given simultaneously","Neither diagnosis applies because 2 months exceeds the adjustment disorder window"],"correct":0,"rationale":"Per Adjustment Disorder Criterion C, if full criteria for PTSD or another specific disorder are met, that diagnosis takes precedence over adjustment disorder — adjustment disorder is essentially a diagnosis of exclusion for a stress reaction that doesn't meet criteria for a more specific disorder."},{"topic":"PTSD vs ASD vs Dissociative Disorder vs Adjustment Disorder","vignette":"Four patients present to clinic: one 5 weeks after a serious trauma, one 2 weeks after a serious trauma, one with unexplained dissociative episodes and no trauma history, and one 6 weeks after a stressful but non-life-threatening move.","question":"Which pairing of duration/trigger and diagnosis is correct?","options":["PTSD requires >1 month post-trauma; ASD requires 3 days-1 month; dissociative disorders require no specific trauma; adjustment disorder requires any stressor with onset within 3 months","Adjustment disorder always requires more than 6 months to resolve","All four diagnoses require the same Criterion-A trauma exposure","PTSD requires 3 days-1 month; ASD requires >1 month; both require a life-threatening trauma"],"correct":0,"rationale":"This is the core comparison for this topic: PTSD (>1 month post-trauma), ASD (3 days to 1 month post-trauma) both require Criterion-A trauma exposure; dissociative disorders (e.g., depersonalization/derealization) require no specific trauma type; adjustment disorder requires only an identifiable stressor of any severity, with onset within 3 months and resolution within 6 months of the stressor ending."},{"topic":"Trauma therapy","vignette":"A school counselor wants a group-based, school-delivered trauma treatment option for several students exposed to community violence.","question":"Which trauma therapy model is specifically designed for this school-based group format?","options":["Narrative Exposure Therapy/KidNET","Child-Parent Psychotherapy","Seeking Safety","CBITS (Cognitive Behavioral Intervention for Trauma in Schools)"],"correct":3,"rationale":"CBITS is school-based group TF-CBT, designed for exactly this scenario. Child-Parent Psychotherapy targets young children and their caregiver dyad; Seeking Safety addresses co-occurring PTSD and substance use; NET/KidNET is designed for war/refugee trauma."},{"topic":"Trauma therapy","vignette":"A 17-year-old with PTSD and a co-occurring substance use disorder is referred for trauma-focused treatment.","question":"Which model was specifically designed to address PTSD alongside substance use?","options":["Seeking Safety","Child-Parent Psychotherapy","Trauma Systems Therapy","CBITS"],"correct":0,"rationale":"Seeking Safety is the trauma therapy model specifically designed for PTSD co-occurring with substance use. Trauma Systems Therapy addresses the interaction between a child's trauma symptoms and their surrounding social environment/system more broadly."},{"topic":"TF-CBT / PRACTICE","vignette":"A therapist is explaining to a family why TF-CBT does not begin with detailed discussion of the traumatic event, even though that is the family's main concern.","question":"What is the correct explanation for this sequencing?","options":["Stabilization/coping-skills components (Psychoeducation/Parenting, Relaxation, Affective modulation, Cognitive processing) always come before trauma narrative work — trauma processing is never the starting point","Conjoint sessions must occur before any individual skill-building","The trauma narrative is optional and rarely used in TF-CBT","TF-CBT does not include any trauma narrative component at all"],"correct":0,"rationale":"In TF-CBT, the stabilization/coping-skills components (the P-R-A-C portion of PRACTICE) always come before trauma narrative work — trauma processing is never the starting point, ensuring the child has sufficient coping skills before engaging with the traumatic memory."},{"topic":"TF-CBT / PRACTICE","vignette":"A researcher is asked what distinguishes TF-CBT from many other individual child trauma therapies.","question":"What is a key distinguishing design feature of TF-CBT?","options":["It is explicitly designed to include the caregiver, not just the child, through parenting-skills components and conjoint sessions","It excludes any caregiver involvement to protect confidentiality","It focuses exclusively on medication augmentation","It has no structured component sequence"],"correct":0,"rationale":"TF-CBT is explicitly designed to include the caregiver, not just the child — the conjoint sessions and parenting-skills component (the 'P' in PRACTICE) are distinguishing features that set it apart from purely individual trauma therapy approaches."},{"topic":"Insomnia treatment","vignette":"A 7-year-old has trouble falling asleep 4 nights per week for the past 2 months, with mild daytime tiredness but no significant functional impairment.","question":"Does this meet full DSM-5 criteria for insomnia disorder?","options":["No — the duration threshold of ≥3 months has not yet been met","Yes, because any sleep difficulty in children automatically qualifies","No — the frequency threshold of ≥3 nights/week has not been met","Yes — all criteria are clearly met"],"correct":0,"rationale":"Insomnia Disorder requires occurrence ≥3 nights/week (Criterion C, met here) AND presence for ≥3 months (Criterion D, NOT yet met at 2 months) — the duration threshold is what separates a diagnosable disorder from a few rough weeks, and this case falls short of it."},{"topic":"Insomnia treatment","vignette":"A prescriber is asked to recommend the first-line, non-pharmacologic approach for a school-age child with new-onset difficulty falling asleep, prior to any medication trial.","question":"What is first-line management across all pediatric ages for insomnia?","options":["Melatonin as the very first step, before any behavioral changes","A trial of a sedative-hypnotic medication","Referral for polysomnography prior to any behavioral intervention","Behavioral/sleep hygiene measures — consistent bedtime routine, bed used only for sleep, regular schedule, removing electronics, avoiding naps/caffeine"],"correct":3,"rationale":"First-line (all ages) for pediatric insomnia is behavioral/sleep hygiene: consistent bedtime routine, bed used only for sleep, regular sleep-wake schedule, removing electronics from the bedroom, avoiding naps/caffeine, and a transitional object or night-light for younger children — medication is considered afterward if needed."},{"topic":"Nightmare treatment","vignette":"A family asks what the very first step in managing their 8-year-old's frequent nightmares should be, before any medication is considered.","question":"What is the first-line behavioral/psychotherapeutic approach?","options":["Reassurance, normalizing the sleep schedule, relaxation/imagery, imagery rehearsal therapy, and systematic desensitization/dream reorganization","Prazosin as the initial step regardless of severity","No intervention is recommended for pediatric nightmares","A sedative-hypnotic to suppress dreaming"],"correct":0,"rationale":"The first step in nightmare treatment is behavioral/psychotherapeutic: reassurance, normalizing sleep schedule, relaxation/imagery, imagery rehearsal therapy, and systematic desensitization/dream reorganization — medication is reserved for significant, persistent, function-impairing cases."},{"topic":"Nightmare treatment","vignette":"A 14-year-old's nightmares are identified as a core symptom of her underlying PTSD, occurring nearly every night.","question":"What is the primary intervention that should be prioritized?","options":["Treating the underlying PTSD, usually with TF-CBT, as the primary intervention","No treatment is needed since nightmares in PTSD are expected to resolve without intervention","A benzodiazepine nightly for sleep suppression","Prazosin as monotherapy without addressing the PTSD"],"correct":0,"rationale":"If nightmares are a PTSD symptom, treating the underlying PTSD (usually with TF-CBT) is the primary intervention — nightmare-specific treatments (prazosin, imagery rehearsal) are adjuncts to, not replacements for, treating the root trauma-related disorder."},{"topic":"AUD s/sx and treatment","vignette":"A 15-year-old with a strong family history of alcoholism is being counseled about her elevated risk.","question":"What is noted about the genetic contribution to alcoholism risk?","options":["The genetic contribution to family history of alcoholism is strongest in males","Genetics play no meaningful role in adolescent alcohol use disorder risk","The genetic contribution is equally strong regardless of sex","Family history only matters if both parents have AUD"],"correct":0,"rationale":"A family history of alcoholism is a recognized risk factor for adolescent alcohol use, and the genetic contribution to that risk is described as strongest in males, alongside other risk markers such as comorbid ADHD/ODD/CD and earlier-onset substance use."},{"topic":"AUD s/sx and treatment","vignette":"A 16-year-old abruptly stops heavy, prolonged alcohol use and within a day develops tremor, sweating, a heart rate of 112, and reports transient visual illusions.","question":"Which condition is this, and how many of the associated symptoms are required for diagnosis?","options":["This does not meet criteria for any DSM-5 alcohol-related diagnosis","Alcohol withdrawal — ≥2 of the listed symptoms (autonomic hyperactivity, tremor, insomnia, nausea/vomiting, transient hallucinations/illusions, psychomotor agitation, anxiety, seizures)","Delirium tremens is the only possible diagnosis at this stage","Alcohol use disorder — this is simply Criterion A symptom #10"],"correct":1,"rationale":"Alcohol withdrawal is a separate diagnosis requiring ≥2 of: autonomic hyperactivity (sweating, HR>100), hand tremor, insomnia, nausea/vomiting, transient hallucinations/illusions, psychomotor agitation, anxiety, or generalized tonic-clonic seizures, developing within hours to days of cessation/reduction after heavy, prolonged use."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A cannabis withdrawal diagnosis is being considered for a patient who uses cannabis occasionally, about once monthly, with no other substance use disorder diagnosis.","question":"Can cannabis withdrawal be diagnosed in this patient?","options":["Yes, but only if the patient also has a mild cannabis use disorder","No — cannabis withdrawal does not exist as a DSM-5 diagnosis","Yes — withdrawal can be diagnosed regardless of use pattern or disorder severity","No — cannabis withdrawal can only be diagnosed in the presence of a moderate or severe cannabis use disorder"],"correct":3,"rationale":"Cannabis withdrawal can only be diagnosed in the presence of a moderate or severe cannabis use disorder — occasional, non-disordered use would not meet the heavy, prolonged use pattern (Criterion A) required for the withdrawal diagnosis."},{"topic":"Cannabis withdrawal s/sx and treatment","vignette":"A 16-year-old in treatment for cannabis use disorder admits that he often uses cannabis again specifically because it makes his irritability and insomnia go away.","question":"What treatment-planning point does this illustrate?","options":["This should be treated with a benzodiazepine to eliminate the withdrawal trigger","Many adolescents use cannabis (or another substance) specifically to relieve withdrawal symptoms — an important relapse driver to address in treatment planning","This pattern indicates the patient does not actually have a cannabis use disorder","Withdrawal-driven relapse is unique to cannabis and does not occur with other substances"],"correct":1,"rationale":"Many adolescents report using cannabis or another substance specifically to relieve withdrawal symptoms — recognizing this as an important relapse driver is a key part of treatment planning for cannabis use disorder and its withdrawal syndrome."},{"topic":"Motivational Interviewing","vignette":"A clinician is in the early stage of an MI conversation, focused primarily on building rapport and a collaborative working relationship before addressing any specific behavior change.","question":"Which of the 4 phases of MI is being described, and what comes next in order?","options":["Planning — the final phase, occurring first in this case","Engaging — followed by Focusing, Evoking, and Planning","Focusing — followed by Engaging, then Evoking and Planning","Evoking — followed by Engaging, Focusing, and Planning"],"correct":1,"rationale":"The 4 phases of MI occur in order: Engaging (building rapport) → Focusing (guiding toward a clear target for change) → Evoking (eliciting the patient's own change talk) → Planning (building a concrete plan once change talk predominates)."},{"topic":"Motivational Interviewing","vignette":"During an MI session, a patient shifts from saying 'I guess I should probably cut back' to 'I'm going to cut back starting Monday and I have a plan for it.'","question":"What does this language shift signal, and which MI phase does it indicate readiness for?","options":["Readiness for the Engaging phase to begin","Readiness for the Planning phase — signaled by language shifting from 'need/should' to 'will/plan/going to'","A relapse into the Precontemplation stage","No clinical significance — MI does not track language shifts"],"correct":1,"rationale":"Readiness to progress toward planning/action is signaled by a shift in language — from 'need to'/'should' toward 'will'/'going to'/'plan to.' This language shift is the practical cue that a patient is ready to move into the Planning phase of MI."},{"topic":"Change theory","vignette":"A patient relapses to substance use after 3 months of sobriety. The treatment team frames this as an expected, normal part of the recovery process rather than a treatment failure.","question":"What principle from change theory supports this framing?","options":["Relapse means the Transtheoretical Model does not apply to this patient","Relapse is expected and should be reframed as a predictable part of the change process, not a catastrophe or reason to end treatment","Relapse should be treated as a moral failing requiring a consequence-based response","Relapse indicates the patient must restart treatment from Precontemplation with a new therapist"],"correct":1,"rationale":"Relapse is explicitly framed in change theory as an expected, predictable part of the change process — not a catastrophe or reason to end treatment. This principle applies equally to substance use, eating disorder, and other behavior-change work."},{"topic":"Change theory","vignette":"A patient has been successfully abstinent from alcohol for 8 months and is now working with her clinician on identifying situations that could trigger a return to drinking.","question":"Which TTM stage is this, and what is the clinician's primary task?","options":["Preparation — building an initial plan before any behavior change has started","Contemplation — still ambivalent about whether to change","Action — actively modifying behavior for the first time","Maintenance — relapse-prevention planning and reinforcing gains"],"correct":3,"rationale":"Sustained change over several months with a focus on preventing relapse describes the Maintenance stage — the clinician's task is relapse-prevention planning and reinforcing the gains already made, distinct from the Action stage's initial behavior modification."},{"topic":"Children and foster care","vignette":"A family court is deciding whether to pursue reunification or terminate parental rights for a child in short-term foster care following a substantiated maltreatment case.","question":"What guiding principle should inform the pace of this decision?","options":["The child's own stated preference should be the sole determining factor regardless of age","Child welfare agencies and family courts should move quickly to determine whether parents can be rehabilitated and children returned, or whether parental rights should be terminated","Decisions should always be delayed at least 5 years to allow maximal time for parental rehabilitation","Reunification should never be considered once a child enters foster care"],"correct":1,"rationale":"Short-term foster placement may be necessary while a home is stabilized and parents obtain treatment following maltreatment, but child welfare agencies and family courts should move quickly to determine whether parents can be rehabilitated and children returned, or whether parental rights should be terminated — minimizing prolonged uncertainty and placement instability."},{"topic":"Children and foster care","vignette":"A psychiatric NP evaluates a new patient who was recently placed in foster care, with no prior clinical information available.","question":"What clinical assumption and approach is recommended at intake?","options":["Deferring any evaluation until the caseworker provides a full social history","A trauma-informed evaluation that assumes a trauma history until proven otherwise, with attention to attachment history","Treating the foster placement itself as the primary source of any presenting symptoms","An assumption that the child has no trauma history unless explicitly documented"],"correct":1,"rationale":"Clinical approach for children in foster care includes a trauma-informed evaluation (assuming a trauma history until proven otherwise), coordination with caseworkers/courts, attention to attachment history, and support for the foster/adoptive caregivers themselves (psychoeducation, realistic expectations)."},{"topic":"Mandated reporter","vignette":"A clinician suspects abuse based solely on the child's behavioral presentation and clinical judgment, without any direct disclosure from the child or an obvious physical finding.","question":"Does the mandated reporting duty apply in this scenario?","options":["No — a report requires a physical exam finding or collateral report","Yes — the reporting duty applies regardless of the source of suspicion, including clinical judgment based on presentation/behavior","No — a report can only be made following direct disclosure by the child","The duty only applies if a parent confirms the suspicion"],"correct":1,"rationale":"Mandated reporting duty applies regardless of the source of suspicion — disclosure by the child, physical findings, a collateral report, or clinical judgment based on presentation/behavior can all independently trigger the reporting obligation."},{"topic":"Mandated reporter","vignette":"An NP is about to file a report for suspected abuse and is deciding how to communicate this with the family.","question":"What is standard practice regarding transparency with the family when abuse is suspected?","options":["Only inform the family if they directly ask whether a report was made","Tell the parents that an investigation will follow and that helpful services may be available through the child protection agency, except where it would endanger the child","Never inform the family that a report has been made under any circumstances","Wait for the investigation to conclude before telling the family a report was filed"],"correct":1,"rationale":"When abuse is suspected, standard practice is to tell the parents that an investigation will follow and that helpful services may be available through the child protection agency — transparency with the family, except where it would endanger the child, is part of standard practice."},{"topic":"Grief in children","vignette":"A 4-year-old asks repeatedly when her deceased mother is 'coming back from her trip.'","question":"What does this reflect about her developmental understanding of death?","options":["This reflects dissociative symptoms related to complicated grief","Children at this age have a fully realistic understanding of death's permanence","This indicates a pathological grief reaction requiring urgent intervention","At ages 4-5, death is often seen as reversible, like sleep or a trip — a normal developmental stage, not denial"],"correct":3,"rationale":"Children's understanding of death is developmental: under 2-3 years, no true understanding, only separation-related anxiety; ages 4-5, death is seen as reversible (like sleep or a trip); more realistic understanding emerges around ages 10-11. This 4-year-old's belief is a normal developmental stage, not a pathological sign."},{"topic":"Grief in children","vignette":"A 9-year-old whose father died violently 8 months ago continues to show intense, unrelenting grief symptoms significantly interfering with school and friendships, well beyond what is typical for her peers who lost a grandparent normally.","question":"What diagnostic consideration is most appropriate given the violent nature of the death and the persistence of symptoms?","options":["Escalation to childhood traumatic grief or persistent complex bereavement disorder should be considered","This should be diagnosed as major depressive disorder exclusively, with no consideration of a grief-specific process","This is entirely normal grief regardless of duration or the traumatic circumstances","No psychiatric diagnosis can apply to grief in children under any circumstances"],"correct":0,"rationale":"If a death was traumatic, normal grief may escalate to childhood traumatic grief or persistent complex bereavement disorder — clinicians distinguish normal bereavement from a disorder by intensity, quality, and persistence beyond expected norms, which is especially relevant given the violent death and 8-month duration here."},{"topic":"Group therapy techniques","vignette":"Several sessions into a therapy group, conflict emerges as members disagree openly and begin asserting differing viewpoints, creating noticeable tension.","question":"How should this stage be understood within Tuckman's model?","options":["Storming — necessary friction for the group to mature, not a failed or pathological stage","Adjourning — the group is prematurely ending due to conflict","A sign that the group therapy model has failed and should be discontinued","Forming — members are still orienting to the group's norms"],"correct":0,"rationale":"Storming is a necessary, not a failed, stage — conflict as members find their place and surface differing ideas is expected as the group matures toward Norming (aligning around common goals) and eventually Performing (autonomous, deeper work)."},{"topic":"Group therapy techniques","vignette":"A group therapist is asked which single therapeutic factor Yalom considered the most foundational, enabling members to tolerate conflict and accept feedback.","question":"Which factor is this?","options":["Group cohesiveness","Corrective recapitulation of the primary family group","Instillation of hope","Existential factors"],"correct":0,"rationale":"Group cohesiveness — the sense of belonging and mutual acceptance — is considered by Yalom the primary therapeutic factor, and it is the group leader's responsibility to actively build it. It is the foundational element enabling members to tolerate conflict, accept feedback, and engage in change."},{"topic":"Angry patient during family therapy","vignette":"A family member becomes too dysregulated to continue safely in a joint session, escalating toward physical aggression.","question":"What should the clinician do?","options":["Pause the joint session, briefly separate members, or shift to individual check-ins — safety takes priority over completing the planned agenda","Call the other family members into the room to help de-escalate the dysregulated member","Continue the session as planned to avoid rewarding the escalation with a break","End all future family sessions for this family permanently"],"correct":0,"rationale":"If a member is too dysregulated to continue safely, the clinician may need to pause the joint session, briefly separate members, or shift to individual check-ins before resuming — safety always takes priority over completing the planned agenda."},{"topic":"Angry patient during family therapy","vignette":"A highly charged, resistant family is struggling to engage productively when the therapist asks direct problem-focused questions about the conflict.","question":"What alternative technique can help de-escalate tension while still surfacing the core conflict?","options":["Ending the session early whenever resistance is encountered","Asking each member to individually blame the identified patient for the conflict","Repeating the same problem-focused question more forcefully","A solution-oriented question, such as 'If you woke up tomorrow and your family was exactly how you wanted it, what would be different?'"],"correct":3,"rationale":"A solution-oriented question can de-escalate tension better than a problem-focused question with a resistant or highly charged family, while still surfacing the core conflict — this technique shifts the frame from blame to a shared, future-oriented goal."},{"topic":"Learning domains","vignette":"A family 'knows' the facts about their child's new diagnosis but continues to resist any changes to their household routines, expressing skepticism about whether the diagnosis is even real.","question":"Which domain is the primary barrier to effective psychoeducation in this scenario?","options":["This scenario does not relate to any of Bloom's three learning domains","Cognitive domain — the family lacks basic factual knowledge","Affective domain — attitudes, values, feelings, and willingness to engage ('buy-in') have not been addressed","Psychomotor domain — the family cannot physically perform any required tasks"],"correct":2,"rationale":"The affective domain covers attitudes, values, feelings, and willingness to engage ('buy-in') — a family expressing skepticism and resisting change despite having factual knowledge illustrates an affective-domain barrier, not a cognitive knowledge gap."},{"topic":"Learning domains","vignette":"An NP is designing a comprehensive psychoeducation plan for a family newly navigating their child's bipolar disorder diagnosis.","question":"What does effective psychoeducation require, according to Bloom's Taxonomy as applied to patient teaching?","options":["Focusing exclusively on the psychomotor domain, since hands-on skills are what families remember longest","Addressing only the affective domain, since attitude change drives all behavior change","Addressing all three domains — cognitive, affective, and psychomotor — not just information transfer","Focusing exclusively on the cognitive domain, since factual knowledge is the foundation of all other learning"],"correct":2,"rationale":"Effective psychoeducation addresses all three domains, not just information transfer (cognitive) — a family can 'know' the facts but still resist behavior change without addressing attitudes (affective) and practiced skill (psychomotor)."},{"topic":"NSSI","vignette":"A 14-year-old reports 6 episodes of self-inflicted cutting over the past year, each done to relieve overwhelming emotional distress, with the expectation of only minor physical harm.","question":"How many days of self-inflicted injury within the past year are required by DSM-5 proposed research criteria to consider a diagnosis of NSSI?","options":["≥ 10 days","≥ 1 day","≥ 5 days","≥ 20 days"],"correct":2,"rationale":"DSM-5 proposed criteria (Conditions for Further Study) for NSSI require intentional self-inflicted injury on ≥5 days in the last year, likely to cause bleeding, bruising, or pain, with the expectation of only minor/moderate harm and no suicidal intent."},{"topic":"NSSI","vignette":"A therapist responds to a teenager's disclosure of self-harm by expressing shock and telling her she needs to 'just stop doing this immediately.'","question":"What is the concern with this response, per recommended clinical approach?","options":["Shame-based responses are effective specifically for adolescent patients","This response is appropriate and should be used consistently to discourage the behavior","Punitive or shaming responses increase secrecy and worsen the therapeutic alliance; a curious, function-focused approach is preferred","This response has no impact on the therapeutic relationship either way"],"correct":2,"rationale":"Punitive or shaming responses to NSSI disclosure increase secrecy and worsen the therapeutic alliance. The recommended approach is curiosity about function ('what does this help you with?') rather than focusing only on stopping the behavior."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A 14-year-old with autism spectrum disorder has eaten only 4 specific foods since early childhood. He depends on an oral nutritional supplement to meet caloric needs and has marked social impairment because he cannot eat at friends' houses or school events.","question":"Which DSM-5 criterion for ARFID is most clearly demonstrated by his dependence on oral nutritional supplements?","options":["Criterion C — the disturbance occurs exclusively during anorexia nervosa","Criterion B — the restriction is due to lack of available food","Criterion D — the restriction is better explained by a concurrent medical condition","A functional/nutritional consequence required under Criterion A (dependence on enteral feeding or oral nutritional supplements)"],"correct":3,"rationale":"ARFID Criterion A requires at least one of four functional consequences: significant weight loss/failure to grow, significant nutritional deficiency, dependence on enteral feeding or oral supplements, or marked psychosocial interference. Dependence on oral supplements satisfies this directly, and comorbid ASD is a recognized common association, not an exclusion."},{"topic":"AN vs BN vs BED vs ARFID vs Pica","vignette":"A clinic is teaching a group of nursing students the fastest way to differentiate bulimia nervosa from binge-eating disorder on a vignette-based exam.","question":"What single feature should the students be taught to check first?","options":["Whether the patient reports guilt after eating","Whether binge episodes occur at least twice weekly","Whether a compensatory behavior (purging, laxatives, fasting, excessive exercise) is present","Whether the patient is underweight"],"correct":2,"rationale":"The fastest differentiator taught for this exam: compensatory behavior present = bulimia nervosa; compensatory behavior absent = binge-eating disorder. Both may show guilt, weekly-or-more frequency, and normal-to-elevated weight, so those features don't reliably distinguish the two."},{"topic":"ARFID s/sx","vignette":"A father reports his 4-year-old has 'always been picky' but now eats fewer than 6 total foods, refuses all fruits/vegetables, and school staff report she seems anxious around unfamiliar snacks at parties.","question":"Which piece of history would most strongly distinguish this from developmentally normal picky eating?","options":["A parent describing the child as a 'picky eater'","Any reported dislike of vegetables","The presence of any food refusal at school events","Failure to meet nutritional requirements, significant psychosocial interference, or lack of expected weight gain"],"correct":3,"rationale":"ARFID requires more than a narrow food preference — it requires demonstrable functional consequence: failure to meet nutritional/energy needs, weight/growth faltering, nutritional deficiency, supplement dependence, or marked psychosocial interference. Ordinary picky eating without these consequences does not meet criteria."},{"topic":"ARFID s/sx","vignette":"A multidisciplinary team is planning outpatient treatment for a 7-year-old recently diagnosed with ARFID, sensory-avoidance subtype.","question":"Which treatment approach is most appropriate?","options":["Fluoxetine as first-line pharmacotherapy","Family-Based Treatment (Maudsley model) identical to anorexia nervosa protocols","A multidisciplinary, family-based behavioral/CBT approach tailored to the specific restrictive driver, with SLP/OT involvement as needed","Lisdexamfetamine as first-line pharmacotherapy"],"correct":2,"rationale":"ARFID treatment is a multidisciplinary, family-involved behavioral approach (graded exposure, positive reinforcement, feeding-team involvement) tailored to the underlying driver — it is not simply the Maudsley FBT model used for AN, and no medication is first-line for ARFID (fluoxetine is the BN-specific evidence-based medication; lisdexamfetamine is FDA-approved for BED, not ARFID)."},{"topic":"Therapies for eating disorders","vignette":"A research team compares Family-Based Treatment to Parent-Focused Treatment (PFT), a modification in which the therapist meets only with the parents rather than the whole family, for adolescent anorexia nervosa.","question":"What did one randomized controlled trial find regarding PFT compared with standard FBT?","options":["PFT and FBT showed identical outcomes in every domain measured","PFT eliminated the need for any parental involvement","PFT was more efficient at achieving weight restoration","PFT was significantly less effective and is not recommended"],"correct":2,"rationale":"In one RCT, Parent-Focused Treatment (meeting with parents only, not the whole family) was found to be more efficient at weight restoration than standard conjoint FBT — a useful modification to know, though FBT remains the most broadly cited gold-standard reference."},{"topic":"Therapies for eating disorders","vignette":"A 19-year-old presents with recurrent binge eating, marked distress, no compensatory behaviors, and a normal-range weight.","question":"Which first-line psychotherapies are indicated for this presentation?","options":["Exposure and response prevention","Family-Based Treatment (Maudsley model)","Dialectical behavior therapy exclusively","CBT and interpersonal psychotherapy"],"correct":3,"rationale":"For binge-eating disorder, CBT and interpersonal psychotherapy are first-line psychotherapies; lisdexamfetamine is FDA-approved pharmacotherapy for BED in adults (limited pediatric data). FBT is specific to adolescent anorexia, not BED."},{"topic":"Enuresis vs Encopresis","vignette":"A clinician is distinguishing the substance involved and minimum diagnostic age for enuresis versus encopresis while teaching a psychoeducation session to nursing students.","question":"Which pairing is correct?","options":["Both disorders involve urine but differ only in age threshold","Enuresis = urine, age ≥ 4; Encopresis = feces, age ≥ 5","Enuresis = urine, age ≥ 5; Encopresis = feces, age ≥ 4","Enuresis = feces, age ≥ 5; Encopresis = urine, age ≥ 4"],"correct":2,"rationale":"Enuresis involves urine (age ≥ 5 years); encopresis involves feces (age ≥ 4 years). This age/substance pairing is one of the most frequently tested exam points for elimination disorders."},{"topic":"Enuresis vs Encopresis","vignette":"A child is diagnosed with enuresis. Her parents ask whether medication caused it, since she takes an anticholinergic for a different condition.","question":"Per DSM-5 Criterion D, what must be ruled out before diagnosing enuresis or encopresis?","options":["That the child has never previously been toilet trained","That there is no family history of elimination disorders","That the child has a comorbid anxiety disorder","That the symptom is not attributable to a substance (e.g., a diuretic or laxative) or another medical condition"],"correct":3,"rationale":"Criterion D for both enuresis and encopresis requires that the symptom is not attributable to a substance's physiological effect (e.g., a diuretic or antipsychotic for enuresis; a laxative for encopresis) or another medical condition (e.g., diabetes, spina bifida, seizure disorder) — except, for encopresis, through a mechanism involving constipation."},{"topic":"Nocturnal enuresis treatment","vignette":"A clinician is counseling a family that psychotherapy might not directly resolve their child's bedwetting.","question":"What is the correct role of psychotherapy in nocturnal enuresis management?","options":["First-line treatment that should be tried before any behavioral intervention","Contraindicated in all cases of enuresis","Rarely useful for enuresis itself, but may help address psychosocial sequelae (shame, social avoidance) or trauma
